/* saves from before these systems existed */
function ensureLife(){
  const p = S.p;
  p.conditions = p.conditions || [];
  p.resume = p.resume || [];
  p.peak = p.peak || {};
  p.sectExp = p.sectExp || {};
  p.starts = p.starts || [];
  p.stakes = p.stakes || [];
  if (p.partnerInc === undefined) p.partnerInc = 0;
  if (p.ci === undefined) p.ci = null;
  if (p.standing === undefined) p.standing = 60;
  if (!(p.tension > 0)) p.tension = 0;   /* old saves could drift below zero */
  if (p.di === undefined) p.di = null;
  if (p.job && !p.resume.length) openResume(jobById(p.job));
  lsState();
  ensurePlans();
}

/* ---------- insurance ----------
   Prices are 2025 Singapore dollars a month, the part paid in cash. */

/* Integrated Shield plan with a rider, on top of MediShield Life. The cash part climbs
   steeply with age. The loading is set on the day you sign and stays with the policy:
   the later you start, the bigger the late-entry loading (insurers price in who waits until
   they need it), and every condition already on your record loads it again. */
function activeConditions(){ return (S.p.conditions || []).filter(c => !c.until || c.until > S.age); }
function lateLoad(age){ return 1 + Math.min(1, Math.max(0, age - 25) * 0.03); }       /* +3% a year after 25, at most double */
function healthLoad(per){ return 1 + activeConditions().length * per + (S.p.hadCritical ? per * 2 : 0); }
function shieldLoadNow(age){ return Math.round(lateLoad(age === undefined ? S.age : age) * healthLoad(0.3) * 100) / 100; }
function shieldPrem(age, load){
  const base = age <= 30 ? 30 : age <= 40 ? 50 : age <= 50 ? 95 : age <= 60 ? 185 : 320;
  return Math.round((base * (load || S.p.shieldLoad || 1) + dependents() * 15) * S.econ.cpi);
}
/* what a hospital plan would cost if signed today */
function shieldQuote(){ return shieldPrem(S.age, shieldLoadNow()); }
function buyShield(){ S.p.insured = true; S.p.shieldLoad = shieldLoadNow(); }
/* critical illness cover to 65: a level premium fixed on the day you buy it. Every year
   you wait prices it about 5.5% higher for the whole life of the policy; each condition on
   record loads it by half (a critical illness already had: declined). */
function ciPremFor(sum, age){
  return Math.round(sum / 100000 * 22 * Math.pow(1.055, Math.max(0, age - 20)) * healthLoad(0.5) * S.econ.cpi);
}
/* disability income: a share of salary, set by the age you buy at, loaded for conditions */
function diRateFor(age){
  const r = age < 35 ? 0.016 : age < 45 ? 0.022 : age < 55 ? 0.030 : 0.040;
  return r * healthLoad(0.5);
}
function ciAvailable(){ return !S.p.ci && !S.p.hadCritical && S.age < 60; }
function diAvailable(){ return !S.p.di && !S.p.disabled && !!S.p.job && S.age < 60; }

function insurancePremiums(){
  const p = S.p;
  let t = 0;
  if (p.insured) t += shieldPrem(S.age);
  if (p.ci) t += p.ci.prem;
  if (p.di) t += Math.round(p.salary * p.di.rate);
  return t;
}
function disabilityPayout(){ return S.p.disabled && S.p.disabled.pay ? S.p.disabled.pay : 0; }
function dropAllInsurance(){ S.p.insured = false; S.p.ci = null; S.p.di = null; }

/* ---------- what each spending level does to you ----------
   Living cheaply is never free. Each dial has its own consequence, shown on the dial. */
const SPEND_FX = {
  /* food: how often you catch things, and what rich food does over decades */
  food:      { ill: [1.45, 1.0, 0.8, 0.72], chronic: [1.1, 1.0, 1.0, 1.25],
               fx: ["You fall ill more often.", "", "You fall ill less often.", "Rarely ill — but rich food raises the risk of a chronic condition."] },
  /* transport: whether you arrive on time, and what your manager thinks of it */
  transport: { late: [16, 4, 1, 0], work: [-14, 0, 4, 6],
               fx: ["Often late. Your manager notices.", "", "Rarely late. It shows at work.", "Always on time, never tired from the commute."] },
  /* utilities: sleep, heat and damp */
  utilities: { ill: [1.35, 1.0, 0.85, 0.8],
               fx: ["Hot nights and poor sleep: you fall ill more often.", "", "You sleep well and fall ill less.", "Never uncomfortable."] },
  /* lifestyle: friends, rest and something to look forward to */
  lifestyle: { mood: [2.2, 1.0, 0.65, 0.5],
               fx: ["Little to look forward to: a much higher risk of depression.", "", "A lower risk of depression.", "The lowest risk of depression."] }
};
const fxOf = (k, key) => SPEND_FX[k][key][S.p.spend[k]];
/* how likely you are to catch a minor illness this year, from what you eat and how you sleep */
function illMul(){ return fxOf("food", "ill") * fxOf("utilities", "ill") * lsIll() * (S.p.conditions.some(c => c.id === "depression") ? 1.3 : 1) * chronicIllMul(); }
/* a body already managing a chronic condition catches everything going round: each one lifts
   the odds by about a third, more if it is left untreated (its risk was raised at diagnosis) */
function chronicIllMul(){
  const m = (S.p.conditions || []).filter(c => !c.until).reduce((a, c) => a * (1.3 + Math.max(0, (c.risk || 1.2) - 1)), 1);
  return Math.min(m, 3);
}

/* standing at work, 0..100: whether you arrive on time, how rested you are, how you are.
   It moves promotion odds, pay reviews and who goes first in a round of cuts. */
function stepStanding(notes){
  const p = S.p;
  if (!p.job || p.job === "own"){ p.standing = 60; return; }
  const was = p.standing === undefined ? 60 : p.standing;
  let target = 62 + fxOf("transport", "work") + lsStanding() + plansStanding() - p.burnout * 3 + (p.wellbeing - 60) / 4;
  if (p.conditions.some(c => c.id === "depression")) target -= 14;
  p.standing = clamp(was + (target - was) * 0.5, 0, 100);
  if (was >= 45 && p.standing < 45) notes.push("Your manager has started to have doubts about you.");
}
function standingWord(){
  const s = S.p.standing === undefined ? 60 : S.p.standing;
  return s >= 72 ? "well regarded" : s >= 55 ? "solid" : s >= 40 ? "on thin ice" : "at risk";
}
const standingMul = () => clamp((S.p.standing === undefined ? 60 : S.p.standing) / 60, 0.4, 1.35);

/* ---------- health ---------- */
const CONDITIONS = [
  { id: "diabetes", n: "Type 2 diabetes",     cost: 110, risk: 1.35 },
  { id: "bp",       n: "High blood pressure", cost: 60,  risk: 1.30 },
  { id: "chol",     n: "High cholesterol",    cost: 55,  risk: 1.20 },
  { id: "back",     n: "A slipped disc",      cost: 90,  risk: 1.05 },
  { id: "asthma",   n: "Adult-onset asthma",  cost: 70,  risk: 1.10 },
  { id: "gout",     n: "Gout",                cost: 50,  risk: 1.10 }
];

/* clinic visits and medicine: little in your twenties, a real bill in your sixties.
   Chronic conditions add their own monthly cost (after MediSave's chronic-disease cover). */
function healthCosts(){
  const p = S.p;
  const base = familySupported() ? 0 : 30 + Math.max(0, S.age - 35) * 4.5;
  const cond = (p.conditions || []).reduce((a, c) => a + c.cost, 0);
  return (base + cond) * S.econ.cpi;
}
/* how the way you live, and what you already have, moves the odds */
function healthRisk(){
  const p = S.p;
  let m = clamp(1 + (55 - p.wellbeing) / 60, 0.75, 1.6);
  for (const c of p.conditions || []) m *= c.risk || 1.2;
  if (p.burnout > 3) m *= 1.2;
  if (p.conditions.some(c => c.id === "depression")) m *= 1.15;
  return m;
}
/* depression: far likelier on a thin life, under strain, or alone after a loss */
function moodRisk(){
  const p = S.p;
  let r = 0.0035 * fxOf("lifestyle", "mood") * lsMood();
  if (p.wellbeing < 45) r *= 1.8;
  if (p.burnout > 3) r *= 1.5;
  if (!p.job && !p.studying && S.age >= 25) r *= 1.6;
  if ((p.tension || 0) >= 4) r *= 1.4;
  return p.conditions.some(c => c.id === "depression") ? 0 : r;
}
function healthOdds(){
  const a = S.age, m = healthRisk(), p = S.p;
  return {
    critical: 0.00055 * Math.exp((a - 25) * 0.07) * m,               // cancer, heart attack, stroke
    disable:  p.disabled ? 0 : 0.0005 * Math.exp((a - 25) * 0.045) * m,
    accident: 0.005 + (p.car && !p.car.family ? 0.003 : 0),
    chronic:  (p.conditions || []).length >= 3 ? 0 : (a < 30 ? 0.003 : 0.003 + (a - 30) * 0.001) * m * fxOf("food", "chronic") * lsChronic(),
    depression: moodRisk()
  };
}
function stepHealth(notes){
  const p = S.p;
  if (p.retired) return null;
  if (p.disabled && S.age >= p.disabled.until){
    p.disabled = null;
    notes.push("You are well enough to work again.");
    tl(S.age, "Recovered enough to work again.");
  }
  /* conditions that end: depression lifts with time and treatment */
  const ended = p.conditions.filter(c => c.until && S.age >= c.until);
  for (const c of ended){ notes.push(c.n + " has lifted."); tl(S.age, "Recovered from " + c.n.toLowerCase() + "."); }
  p.conditions = p.conditions.filter(c => !(c.until && S.age >= c.until));
  stepStanding(notes);
  const o = healthOdds();
  for (const id of ["critical", "disable", "accident", "depression", "chronic"]) if (rnd() < o[id]) return id;
  return null;
}
/* who pays a hospital bill: your Shield plan (or MediShield Life alone), then MediSave, then you.
   plan: what the Integrated Shield plan paid over MediShield Life alone — what the premiums bought.
   without: what you would have paid in cash with MediShield Life only. */
function splitBill(bill, ward){
  const cpi = S.econ.cpi, ins = S.p.insured;
  const cover = on => ward === "private" ? (on ? bill - Math.min(bill * 0.05, 3000 * cpi) : bill * 0.25) : (on ? bill * 0.9 : bill * 0.6);
  const shield = Math.round(cover(ins)), base = Math.round(cover(false));
  const ma = Math.floor(Math.min(S.cpf.ma, (bill - shield) * 0.6));
  const maBase = Math.floor(Math.min(S.cpf.ma, (bill - base) * 0.6));
  return { bill: Math.round(bill), shield, ma, cash: Math.round(bill - shield - ma), plan: ins ? shield - base : 0, without: Math.round(bill - base - maBase) };
}
/* pay lost while you cannot work. Disability income cover pays 75% after a three-month wait. */
function lostPay(months){
  const p = S.p;
  if (!p.job || months <= 0) return 0;
  const takeHome = p.salary - cpfEmployee() - taxMonthly();
  const covered = p.di ? Math.max(0, months - 3) : 0;
  return Math.round(takeHome * (months - covered * 0.75));
}
function payBill(sp){
  S.cpf.ma -= sp.ma;
  S.p.cash -= sp.cash;
  S.stats.spend += sp.cash;
  S.stats.claims += sp.plan || 0;
}
/* the line an outcome ends on when a policy paid */
function planLine(sp){ return sp.plan > 0 ? " My hospital plan paid " + money(sp.plan) + " of it; without it I'd have paid " + money(sp.without) + " instead of " + money(sp.cash) + "." : ""; }

function tensionWord(){ const t = S.p.tension || 0; return t >= 6 ? "strained" : t >= 3 ? "tense" : t >= 1 ? "a little tense" : "calm"; }

/* ---------- a partner ---------- */
const PARTNER_SHORT = { high: "a high earner", steady: "a steady job", study: "still training", home: "keeps the home" };
/* a partner in training stops being one: once it ends, say how it went */
function partnerShort(){
  const p = S.p;
  if (p.partnerType !== "study") return PARTNER_SHORT[p.partnerType] || "together";
  if (p.partnerLater) return S.age < p.partnerLater.at ? "training till " + p.partnerLater.at : "training, on hold";   /* paused while home or out of work */
  return p.partnerDone === "qualified" ? "qualified" : "working";
}
function marryInto(t, income){
  const p = S.p;
  p.partner = true; p.partnerType = t.id; p.partnerInc = income;
  if (t.later) p.partnerLater = { at: S.age + ri(6, 9), inc: Math.round(rf(t.later[0], t.later[1]) * S.econ.cpi) };
  if (t.creep) setSpend("lifestyle", Math.min(3, p.spend.lifestyle + t.creep));
  p.pt = partnerStart();                             /* they arrive with their own savings and CPF */
  p.wellbeing = clamp(p.wellbeing + t.well, 0, 100);
  /* the wedding is asked right away, as the next card this year (d_deck.js "wedding") */
  p.wedDelays = 0; p.wedNext = null;
  if (weddingCan()){ p.wedDue = true; S.queue = [{ kind: "event", id: "wedding", theme: "life", forced: true }].concat(S.queue || []); }
}

/* ---------- career moves ---------- */
function nextRole(){
  const j = S.p.job && jobById(S.p.job);
  return j && j.next ? jobById(j.next) : null;
}
function promoMissing(nx){
  const p = S.p, miss = [];
  if (p.qual < nx.qual) miss.push("a higher qualification");
  const need = nx.exp - (nx.lvl >= 2 ? 0 : 1);          /* manager titles want the full track record */
  if (relExp(nx) < need){ const k = need - relExp(nx); miss.push(k + (k === 1 ? " more year" : " more years") + " in " + SECTOR_NAME[nx.sect]); }
  if (S.age - p.jobSince < (nx.lvl >= 2 ? 3 : 2)) miss.push("more time in your current role");
  if (p.skills.tech < nx.tech - 1) miss.push("stronger technical skills");
  if (p.skills.comms < nx.comms - 1) miss.push("stronger communication");
  return miss;
}
const promoReady = nx => !!nx && !promoMissing(nx).length;
/* "a, b and c" */
function andList(xs){ return xs.length < 2 ? xs.join("") : xs.slice(0, -1).join(", ") + " and " + xs[xs.length - 1]; }
/* fewer seats at each level up: even a ready candidate often waits */
const PROMO_ODDS = [1, 0.65, 0.45, 0.3];
function promoPay(nx){
  return Math.max(Math.round(S.p.salary * rf(1.08, 1.18)), Math.round(nx.pay * S.econ.cpi * rf(0.95, 1.05)));
}
/* this year's openings, fixed for the year so reopening the screen is not a lottery */
function jobMarket(){
  const p = S.p;
  if (!p.openings || p.openings.age !== S.age){
    const cur = p.job ? jobById(p.job) : null;
    const list = openJobs(8).filter(x => x.j.id !== p.job);
    p.openings = { age: S.age, list: list.map(x => {
      let pay = offerPay(x.j);
      if (cur && x.j.lvl >= cur.lvl) pay = Math.max(pay, Math.round(p.salary * rf(1.04, 1.12)));
      return { id: x.j.id, pay };
    }) };
  }
  return p.openings.list.map(o => ({ j: jobById(o.id), pay: o.pay, f: jobFit(jobById(o.id)) }));
}
/* one career move a year — a promotion ask, a course, enrolling to study or starting a
   business. Win or lose, that is the year's move: no retrying until next year.
   Job applications are counted apart: two tries a year, wherever you apply from. Land a new
   job and you stay put for two years (JOB_LOCK) before applying elsewhere; losing that job
   ends the lock. A try is used the moment the dice are rolled — backing out before that costs
   nothing — and saved at once, so reloading mid-roll cannot buy another try. */
const APPS_PER_YEAR = 2, JOB_LOCK = 2;
function careerMoved(){ const m = S.p.moved; return !!m && m.age === S.age; }
function useCareerMove(what){ S.p.moved = { age: S.age, what }; saveAuto(); }
function appsUsed(){ const a = S.p.apps; return a && a.age === S.age ? a.n : 0; }
function jobLocked(){ return !!S.p.job && (S.p.jobLock || 0) > S.age; }
function appsLeft(){ return jobLocked() ? 0 : Math.max(0, APPS_PER_YEAR - appsUsed()); }
function useApp(){ S.p.apps = { age: S.age, n: appsUsed() + 1 }; saveAuto(); }
function landedJob(){ S.p.jobLock = S.age + JOB_LOCK; }
function appsText(){
  return jobLocked() ? "Settling into the new job: you can apply elsewhere from age " + S.p.jobLock + "."
    : appsLeft() ? appsLeft() + " of " + APPS_PER_YEAR + " job applications left this year."
    : "Both job applications used this year. More from age " + (S.age + 1) + ".";
}
function careerBlock(){
  const p = S.p;
  if (p.retired) return "You have retired.";
  if (p.disabled) return "You are not able to work until you recover" + (p.disabled.until < END_AGE ? " (about age " + p.disabled.until + ")." : ".");
  if (p.abroad) return "You are on a posting abroad until " + p.abroad.until + ".";
  return null;
}
function businessCost(){ return Math.round(25000 * S.econ.cpi / 1000) * 1000; }

/* ---------- going back to study (ADULT_EDU in a_core) ---------- */
function studyOptions(){
  const q = S.p.qual;
  return ADULT_EDU.filter(e => e.from.indexOf(q) >= 0).map(e => {
    const i = e.from.indexOf(q);
    return { e, pt: e.pt ? { years: e.pt.years[i], fee: e.pt.fee } : null, ft: e.ft ? { years: e.ft.years[i], fee: e.ft.fee } : null };
  });
}
/* SkillsFuture: $500 credit once; the $4,000 Level-Up credit once, from 40 */
function studyCredit(){ const p = S.p; return Math.round(((p.sfUsed ? 0 : 500) + (S.age >= 40 && !p.levelUpUsed ? 4000 : 0)) * S.econ.cpi); }
/* Level-Up training allowance for full-time study from 40: half your pay, at most $3,000/mo, two years */
function trainAllowFor(){ return S.age >= 40 && S.p.job ? Math.round(Math.min(3000 * S.econ.cpi, S.p.salary * 0.5)) : 0; }
const STUDY_MAX_AGE = 55;
function enrolStudy(o, full){
  const p = S.p, m = full ? o.ft : o.pt;
  const credit = studyCredit(), allow = full ? trainAllowFor() : 0;
  p.sfUsed = true; if (S.age >= 40) p.levelUpUsed = true;
  if (full && p.job) loseJob("Left to study full-time");
  p.studying = { pathId: o.e.id, yearsLeft: m.years, partTime: !full, family: 0, payCash: true, fee: m.fee, credit };
  if (allow) p.trainAllow = { amt: allow, left: Math.min(2, m.years) };
  p.moved = { age: S.age, what: "enrolled for a " + o.e.name.toLowerCase() };
  tl(S.age, "Enrolled " + (full ? "full-time" : "part-time") + " for a " + o.e.name.toLowerCase() + ".");
  return "Enrolled. " + m.years + " years " + (full ? "of full-time study" : "of evenings and weekends") + " for a " + o.e.name.toLowerCase() + "." +
    (credit ? " SkillsFuture credit of " + money(credit) + " goes on the fees first." : "") +
    (allow ? " A training allowance of " + money(allow) + "/mo helps for the first " + Math.min(2, m.years) + " years." : "");
}

/* ---------- a posting abroad ---------- */
function endAbroad(){
  const p = S.p, ab = p.abroad;
  if (!ab) return null;
  p.abroad = null;
  if (p.job) p.salary = Math.round(p.salary / 1.5 * 1.1);
  if (ab.partnerCame && p.partner && !p.partnerOut) p.partnerInc = Math.round(ab.partnerInc * S.econ.cpi / ab.cpi);
  p.intl = true;
  tl(S.age, "Came home from the posting abroad.");
  return "The posting abroad has ended. You are home" + (p.job ? " on " + money(p.salary) + "/mo" : "") +
    (ab.partnerCame && p.partner ? ", and your partner is back at work" : "") + ". It stands out on your resume.";
}

/* ---------- the rare turns of fortune ---------- */
function stepFate(notes){
  const p = S.p, a = S.age;
  for (const st of (p.stakes || []).slice()){
    if (a < st.at) continue;
    p.stakes = p.stakes.filter(x => x !== st);
    const r = rnd();
    const back = r < 0.6 ? 0 : r < 0.9 ? Math.round(st.amt * rf(0.8, 2.5)) : Math.round(st.amt * rf(8, 25));
    p.cash += back; S.stats.invGain += back - st.amt;
    const msg = back === 0 ? "Your friend's start-up has closed. The " + money(st.amt) + " you put in is gone."
      : back > st.amt * 5 ? "Your friend's start-up was bought. Your " + money(st.amt) + " stake paid " + money(back) + "."
      : "Your friend's start-up was sold for a modest price. Your " + money(st.amt) + " came back as " + money(back) + ".";
    notes.push(msg); tl(a, msg);
  }
  if (p.abroad && (a >= p.abroad.until || !p.job)){ const m = endAbroad(); if (m) notes.push(m); }
  if (p.retired) return null;

  const pool = [];
  if (p.partner){
    /* a divorce only ever comes out of an unhappy partner: tension, the grievances that build up
       at home. Running on empty and living apart are grievances too, so they add to it, visibly */
    const away = !!(p.abroad && !p.abroad.partnerCame), low = p.wellbeing < 35;
    if (away){ p.tension = (p.tension || 0) + 1; notes.push("Living apart, the calls with your partner are getting shorter."); }
    if (low){ p.tension = (p.tension || 0) + 0.5; if (rnd() < 0.5) notes.push("You come home with nothing left. Your partner has noticed."); }
    const t = p.tension || 0;
    p.splitWhy = { t, low, away };                 /* remembered so the card can say what wore the marriage down */
    /* calm or a little tense: safe. From "tense" (3) the odds climb with every grievance more */
    if (t >= 3) pool.push(["divorce", Math.min(0.4, (partnerTypeOf().split || 0.008) / 0.008 * 0.03 * (t - 2))]);
  }
  if (p.tension > 0 && rnd() < 0.5) p.tension = Math.max(0, p.tension - 1);   /* grievances fade if nothing new is added */
  if (p.partner && a > 38 && !p.partnerOut) pool.push(["pillness", 0.0006 * Math.exp((a - 25) * 0.06)]);
  pool.push(["windfall", 0.0012]);
  if (a >= 25 && a <= 55 && p.cash > 15000) pool.push(["startup", 0.006]);
  if (p.job && p.job !== "own" && jobById(p.job).lvl >= 1 && a >= 27 && a <= 55 && !p.abroad) pool.push(["abroad", 0.01]);
  if (p.cash > 5000) pool.push(["fraud", 0.004]);
  for (const [id, pr] of pool) if (rnd() < pr) return id;
  return null;
}

/* why it ended, in my words: whatever was there when the odds were rolled */
function splitLede(){
  const w = S.p.splitWhy || {};
  if (w.away) return "Two time zones, one marriage. The video calls got shorter, then fewer, then one day they just said it. Cannot make it already.";
  if (w.low) return "I was running on empty for years. I came home late, tired, half there, and every small thing between us stayed unsaid until it was not small. They said it first.";
  return "It's over. Both of us agree on that, which is the first thing we've agreed on in two years.";
}

const placeById = id => PLACES.find(x => x.id === id);
/* while the family pays (studying, living at home), the trip is theirs to afford: the dearest

   hotel are booked up front, so only a trip your cash covers today can be booked. */
const FAMILY_HOL_MAX = [400, 1100, 3200, Infinity];
const familyHolMax = () => FAMILY_HOL_MAX[S.c && S.c.incomeTier !== undefined ? S.c.incomeTier : 3];
/* a cheap staycation (Ubin, Sentosa) needs no cash up front: it can come out of a month's spare cash flow */
const CHEAP_STAY = 400;
let holGuard = false;                               /* netCashflow() reads the holiday, which can ask here again */
function cheapStayFits(id){
  const pl = placeById(id);
  if (pl.tier !== "stay" || pl.pp > CHEAP_STAY || holGuard) return false;
  holGuard = true;
  try { return holidayCost(id) / 12 <= netCashflow() + holidayMonthly(); } finally { holGuard = false; }
}
const placeOpen = id => familySupported() ? placeById(id).pp <= familyHolMax() : holidayCost(id) <= Math.max(0, S.p.cash) || cheapStayFits(id);
const tierOpen = t => t === "none" || PLACES.some(x => x.tier === t && placeOpen(x.id));
const HOL_FX = { none: { well: -4, mood: 1.25 }, stay: { well: -2, mood: 1.1 }, near: { well: 0, mood: 1 }, far: { well: 2, mood: 0.9 } };

/* ---- one-offs ---- */
/* 2025 Singapore prices, all in (venue, food, photographer, outfits). back: the share the ang baos
   return, rolled on the night. Sources: SingSaver, Aluxe, vows.sg, MoneySmart wedding guides 2025-26:
   ROM + a meal for ~30 runs $5k-12k; a mid-range banquet $30k-50k for 10-15 tables at $1,200-1,800
   a table plus ~19% service and GST, ang baos covering about half to three-quarters; Bali for ~30-40
   guests $30k-50k with guests paying their own way; five-star ballrooms $60k-100k and up. */
const WEDDINGS = [
  { id: "rom",     n: "ROM and a family dinner", cost: 10000,  back: [0.30, 0.50], well: 2, note: "ROM, then dinner for thirty at a restaurant. Nobody's uncle gives a speech." },
  { id: "abroad",  n: "A small wedding abroad",  cost: 35000,  back: [0.15, 0.35], well: 4, note: "Bali, forty guests. They pay their own flights, so their ang baos are smaller." },
  { id: "banquet", n: "Hotel banquet",           cost: 48000,  back: [0.50, 0.80], well: 3, note: "Twenty tables at a four-star hotel, the photographer, the gowns, the bridal car." },
  { id: "lavish",  n: "The full production",     cost: 120000, back: [0.50, 0.75], well: 4, note: "Capella, thirty tables, a live band, a drone. The guests are impressed for one evening." }
];
const WED_DEPOSIT = 0.3;                 /* hotels take a deposit; the balance is settled after the night, often from the ang baos */
const WED_ASKS = 5;                      /* "not yet" this many times and they stop asking */
const wedCost = i => Math.round(WEDDINGS[i].cost * S.econ.cpi);
/* how the partner takes each kind of wedding: a change in tension, from PARTNER_TYPES */
const wedFeel = i => { const t = partnerTypeOf(); return t && t.wed ? t.wed[i] : -1; };
const wedFeelWord = d => d <= -2 ? "thrilled" : d < 0 ? "happy" : d === 0 ? "fine with it" : d >= 2 ? "upset" : "disappointed";
const RENOS = [
  { n: "Leave it as it came", hdb: 0, priv: 0, well: 0 },
  { n: "A light refresh", hdb: 15000, priv: 20000, well: 1, note: "Paint, lights, a sofa that is not from the previous owner." },
  { n: "A full renovation", hdb: 55000, priv: 70000, well: 3, note: "Carpentry, flooring, a kitchen you actually want to cook in." },
  { n: "An ID showpiece", hdb: 90000, priv: 150000, well: 4, note: "An interior designer, a feature wall, and opinions about your cushions." }
];
const RENO_VALUE = 0.3;        /* valuers price the flat, not the carpentry: most of it is for you */
const TREATS = {
  omakase: { n: "Omakase dinner", icon: "🍣", pp: 380, note: "Twenty courses. You will remember three." },
  bag:     { n: "A designer bag", icon: "👜", cost: 6000, note: "It holds exactly as much as the old one." }
};

/* ---- state ---- */
function lsState(){
  const p = S.p;
  if (!p.ls) p.ls = { gym: 0, pet: null, club: null, vol: false, hol: "near", place: null,
                      stamps: [], wed: null, treats: 0, incSeen: 0, tempted: -9 };
  const ls = p.ls;
  if (!ls.place || placeById(ls.place).tier !== ls.hol) ls.place = ls.hol === "none" ? null : nextPlace(ls.hol);
  if (ls.hol !== "none" && !ls.place) ls.hol = "none";
  return ls;
}
/* the next trip in a tier: somewhere you have not been, if there is anywhere left */
function nextPlace(tier){
  const ls = S.p.ls, seen = new Set((ls.stamps || []).map(s => s.id));
  const all = PLACES.filter(x => x.tier === tier && placeOpen(x.id)), fresh = all.filter(x => !seen.has(x.id));
  return all.length ? pick(fresh.length ? fresh : all).id : null;
}
const hhAdults = () => 1 + (S.p.partner ? 1 : 0);
function holidayCost(placeId){
  const pl = placeById(placeId);
  if (!pl) return 0;
  const kids = dependents();
  const n = pl.tier === "stay" ? 1 + (kids ? 0.5 : 0) : hhAdults() + kids * 0.7;
  return Math.round(pl.pp * n * S.econ.cpi);
}
/* a year's trip paid for as you go, like everyone saves for it; family pays while they carry you */
function holidayMonthly(){
  const ls = lsState();
  if (ls.hol === "none" || familySupported()) return 0;
  return holidayCost(ls.place) / 12;
}
const petMonthly = () => { const pt = lsState().pet; return pt ? PETS[pt.kind].mo * S.econ.cpi : 0; };

/* everything in the lifestyle line except going out */
function lsMonthly(){
  const ls = lsState(), cpi = S.econ.cpi;
  return {
    gym: GYMS[ls.gym].mo * cpi,
    pet: petMonthly(),
    club: ls.club ? CLUB.mo * cpi : 0,
    vol: ls.vol ? 15 * cpi : 0,
    hol: holidayMonthly()
  };
}
const lsExtras = () => Object.values(lsMonthly()).reduce((a, b) => a + b, 0);

/* ---- what it does to you ---- */
function renoComfort(){
  const h = S.a.property;
  if (!h || S.p.housingMode !== "own" || !h.reno) return 0;
  return S.age - h.reno.age < 15 ? RENOS[h.reno.tier].well : 0;
}
function lsWell(){
  const ls = lsState();
  let w = GYM_FX.well[ls.gym] + HOL_FX[ls.hol].well + renoComfort();
  if (ls.pet) w += 4;
  if (ls.club) w += 2;
  if (ls.vol) w += 3;
  w += Math.min(2, ls.treats) * 1.5;
  if (ls.wed && S.age - ls.wed.age <= 1) w += 3;
  return w;
}
function lsMood(){
  const ls = lsState();
  return HOL_FX[ls.hol].mood * (ls.pet ? 0.75 : 1) * (ls.vol ? 0.8 : 1);
}
const lsIll = () => GYM_FX.ill[lsState().gym];
const lsChronic = () => GYM_FX.chronic[lsState().gym];
/* the club is where the golf and the introductions happen; volunteering is where the Saturdays go */
const lsStanding = () => (lsState().club ? 3 : 0) - (lsState().vol ? 2 : 0);

/* ---- the year ---- */
function stepLifestyle(notes){
  const ls = lsState(), p = S.p;
  if (ls.hol !== "none" && ls.place && !p.retired){
    const pl = placeById(ls.place);
    const first = !ls.stamps.some(s => s.id === pl.id);
    ls.stamps.push({ id: pl.id, age: S.age });
    if (first) notes.push(pl.flag + " New stamp: " + pl.n + ".");
    if (ls.hol === "far" || (ls.hol === "near" && rnd() < 0.5)) p.burnout = Math.max(0, p.burnout - 1);
    ls.last = { id: pl.id, age: S.age, cost: familySupported() ? 0 : holidayCost(pl.id) };
  }
  /* a holiday is booked one year at a time: next year's starts as none until you choose it
     (the year-end review asks), so last year's trip never repeats by itself */
  ls.hol = "none"; ls.place = null;
  if (ls.pet && S.age - ls.pet.since >= ls.pet.life) ls.pet.old = true;     /* the card deals with it */
  ls.treats = 0;
}

/* ---- the player's moves; each returns what happened, or null if it cannot ---- */
function spendOnce(amt){ S.p.cash -= amt; S.stats.spend += amt; }
function setGym(t){ lsState().gym = clamp(t, 0, 3); return GYMS[t].n + "."; }
function setHoliday(tier, placeId){
  const ls = lsState();
  if (!tierOpen(tier) || (placeId && !placeOpen(placeId))) return null;      /* out of the family's reach */
  ls.hol = tier;
  ls.place = tier === "none" ? null : placeId && placeById(placeId).tier === tier ? placeId : nextPlace(tier);
  return tier === "none" ? "No holiday this year." : "Booked: " + placeById(ls.place).n + ".";
}
function adoptPet(kind){
  const ls = lsState(), pt = PETS[kind], fee = Math.round(pt.adopt * S.econ.cpi);
  if (ls.pet || S.p.cash < fee) return null;
  spendOnce(fee);
  ls.pet = { kind, since: S.age, life: pt.life + ri(-2, 2), name: pick(kind === "cat" ? ["Mochi", "Kopi", "Oreo", "Milo", "Tofu"] : ["Bobo", "Kaya", "Bak Kwa", "Muffin", "Lucky"]) };
  S.p.wellbeing = clamp(S.p.wellbeing + 3, 0, 100);
  tl(S.age, "Adopted " + ls.pet.name + ".");
  return "Meet " + ls.pet.name + ". " + ls.pet.name + " has already chosen my pillow. I now sleep on the edge.";
}
function rehomePet(){
  const ls = lsState();
  if (!ls.pet) return null;
  const nm = ls.pet.name;
  ls.pet = null;
  S.p.wellbeing = clamp(S.p.wellbeing - 6, 0, 100);
  tl(S.age, "Gave " + nm + " up for adoption.");
  return nm + " has a new home. I said I would not ask for photos. I check their Instagram every day.";
}
const clubPrice = () => Math.round(CLUB.join * S.econ.cpi / 1000) * 1000;
function joinClub(){
  const ls = lsState(), price = clubPrice();
  if (ls.club || S.p.cash < price) return null;
  spendOnce(price);
  ls.club = { paid: price, age: S.age };
  tl(S.age, "Joined a country club.");
  return "Member. The dues are " + money(Math.round(CLUB.mo * S.econ.cpi)) + "/mo. I now own a polo shirt with a logo and nowhere else to wear it.";
}
const clubResale = () => Math.round(clubPrice() * CLUB.back / 100) * 100;
function leaveClub(){
  const ls = lsState();
  if (!ls.club) return null;
  const got = clubResale();
  S.p.cash += got; S.stats.spend -= got;
  ls.club = null;
  tl(S.age, "Sold the club membership.");
  return "Sold for " + money(got) + ".";
}
function setVolunteer(on){ lsState().vol = !!on; return on ? "Signed up." : "Stopped volunteering."; }
function weddingCan(){ return !!S.p.partner && !lsState().wed; }
/* frac: the share the ang baos returned (rolled on the night, l_style.js wedNight). The bill is paid
   whether or not the cash is there: the ways to pay come first, and a short night ends in a shortfall. */
function doWedding(i, frac){
  const w = WEDDINGS[i], cost = wedCost(i);
  if (!weddingCan()) return null;
  if (frac === undefined) frac = rf(w.back[0], w.back[1]);
  const back = Math.round(cost * frac);
  spendOnce(cost); S.p.cash += back; S.stats.spend -= back;
  lsState().wed = { tier: w.id, age: S.age, net: cost - back };
  S.p.wellbeing = clamp(S.p.wellbeing + w.well, 0, 100);
  const feel = wedFeel(i);
  S.p.tension = Math.max(0, (S.p.tension || 0) + feel);
  S.p.wedDue = false; S.p.wedNext = null;
  tl(S.age, "Wedding: " + w.n.toLowerCase() + ".");
  const said = feel <= -2 ? "My partner cried at the march-in. The good kind of crying."
    : feel < 0 ? "My partner is happy. Their mother is happy. I am tired, but also happy."
    : feel === 0 ? "My partner says it was nice. 'Nice.' I will take it."
    : feel >= 2 ? "My partner has been very quiet since. Their friends had better. They have mentioned this. Twice."
    : "My partner smiled in every photo. Smiled. Not the same thing as happy.";
  return "Cost " + money(cost) + ", ang baos " + money(back) + " (" + pct(frac, 0) + "). " + said + " " +
    (back >= cost ? "Made money on my own wedding. Huat ah." : "Net " + money(cost - back) + ". The uncle who went on stage to sing was not in the plan, and he did three songs.");
}
/* "not yet": asked again next year, and each time it lands harder at home. Half as hard when
   even the cheapest wedding is out of reach for both of us. */
function wedDelay(){
  const p = S.p, n = (p.wedDelays || 0) + 1;
  p.wedDelays = n;
  const couldPay = p.cash + ptLiquid() >= wedCost(0);
  p.tension = (p.tension || 0) + Math.min(3, 0.5 + 0.5 * n) * (couldPay ? 1 : 0.5);
  p.wedDue = false;
  p.wedNext = n >= WED_ASKS ? null : S.age + 1;
  if (n >= WED_ASKS) tl(S.age, "Partner stopped asking about the wedding.");
  return ["Told both mothers 'later'. Both mothers heard 'soon'. My partner heard 'never'.",
    "Second 'not yet'. CNY visiting was one long interview. Seventh Aunt asked if we are 'living in sin'. We are living in a HDB flat.",
    "Third time. My partner now says 'when we are properly married' in front of guests. Sharp, like a kitchen knife.",
    "Fourth. My mother-in-law greets me with 'still saving, ah?' My partner no longer defends me.",
    "Fifth 'not yet'. My partner has stopped asking. The silence costs nothing and feels very expensive."][Math.min(n, WED_ASKS) - 1] +
    (couldPay ? "" : " At least they know we really cannot afford it now.");
}
/* the four weddings as card choices: the card (d_deck.js) and the planner (l_style.js) share them */
function weddingChoices(getDone, fromCard){
  const cash = S.p.cash;
  return WEDDINGS.map((w, i) => {
    const cost = wedCost(i);
    return { t: w.n, cost: money(cost),
      d: w.note + " Ang baos back: about " + pct(w.back[0], 0) + " to " + pct(w.back[1], 0) + ". My partner would be " + wedFeelWord(wedFeel(i)) + "." +
        (cash < cost ? " I am " + money(cost - cash) + " short: there are ways to pay." : ""),
      go: () => {
        if (typeof weddingFlow !== "function" || typeof document === "undefined") return cash >= cost ? doWedding(i) : "Not enough cash. Nothing booked.";
        weddingFlow(i, getDone(), fromCard); return null;

function renoCost(i){
  const h = S.a.property;
  return h ? Math.round((h.type === "hdb" ? RENOS[i].hdb : RENOS[i].priv) * S.econ.cpi / 500) * 500 : 0;

function renoCan(){
  const h = S.a.property;
  return !!h && S.p.housingMode === "own" && (!h.reno || S.age - h.reno.age >= 10);
}
function doReno(i){
  const h = S.a.property, cost = renoCost(i);

const treatCost = k => Math.round((TREATS[k].pp ? TREATS[k].pp * hhAdults() : TREATS[k].cost) * S.econ.cpi);
function treat(k){
  const cost = treatCost(k);
  if (S.p.cash < cost) return null;

  ls.treats++;
  if (ls.treats <= 2) S.p.wellbeing = clamp(S.p.wellbeing + 1, 0, 100);

}
/* cutting back to the bone: the holiday goes and the gym drops to ActiveSG. The cat stays. */
function lsAusterity(){

}

function lsCreep(){

/* ============================================================
   7c. FAMILY, CPF, BTO, SIDE WORK, THE CARD, THE BUFFER — the rules
   Screens are in o_plans.js. Every figure is 2025 Singapore dollars, indexed
   to prices as the game runs. Each move here gives something and costs something.
   ============================================================ */

/* saves and new games: every field this file owns */
function ensurePlans(){
  const p = S.p, st = S.stats;
  if (!p.kidEdu) p.kidEdu = (p.kidsBorn || []).map(() => 0);
  if (p.care === undefined) p.care = p.partnerType === "home" ? "parent" : "infant";
  if (p.enrich === undefined) p.enrich = 1;
  if (p.uniFund === undefined) p.uniFund = true;
  if (p.parAllow === undefined) p.parAllow = 1;
  if (!p.srs) p.srs = { bal: 0, inv: false, paid: 0 };
  if (p.ptr === undefined) p.ptr = 0;
  if (!p.card) p.card = "debit";
  if (p.buffer === undefined) p.buffer = 6;
  if (!p.sweep) p.sweep = "none";
  if (!p.fromKids) p.fromKids = [];
  if (!p.cpfPlan) p.cpfPlan = "std";
  if (!p.cpfStart) p.cpfStart = 65;
  for (const k of ["prem", "claims", "badInt", "shortfalls", "swept", "gig", "fromKids"]) if (st[k] === undefined) st[k] = 0;
  if (st.firstInv === undefined) st.firstInv = null;
}

/* ---------- children ----------
   What a child costs a month after subsidies, by age: living (food, clothes, milk powder,
   the doctor), care until school, enrichment classes, and their allowance and fees at
   poly or university. The Baby Bonus, the CDA grant and the tax rebate come in at birth. */
const KID_CARE = {
  infant: { n: "Infant care, then childcare", note: "Subsidised centres from two months old. You both keep working.", infant: 750, child: 450 },
  grand:  { n: "The grandparents help", note: "A red packet a month and a lot of opinions. Only while they are young enough.", infant: 250, child: 250 },
  helper: { n: "A live-in helper", note: "Salary, levy (lower with young children), food, insurance. Covers the house too, for as long as you keep her.", house: 1000 },
  parent: { n: "One of us stays home", note: "No childcare bill. One income stops until the youngest starts school, and the career takes a knock." }
};
const KID_ENRICH = [
  { n: "Just school", mo: 0, note: "Free play, library books, whatever the school gives." },
  { n: "Some classes", mo: 300, note: "A tuition centre for the subject that needs it, swimming." },
  { n: "The full timetable", mo: 900, note: "Tuition for everything, Kumon, piano, coding, Saturday Chinese." }
];
const BABY_BONUS = [11000, 11000, 13000];                  /* cash gift: first, second, third and after */
const CDA_GRANT = 5000;                                    /* Child Development Account First Step grant */
const PTR = [5000, 10000, 20000];                          /* Parenthood Tax Rebate, first, second, third+ */
const kidAges = () => (S.p.kidsBorn || []).map(b => S.age - b);
const youngest = () => { const a = kidAges(); return a.length ? Math.min(...a) : 99; };
const grandOk = () => S.age <= 52;

function kidMonthly(i){
  const p = S.p, a = S.age - p.kidsBorn[i], cpi = S.econ.cpi;
  if (a >= 23) return 0;
  const spendy = p.partner && p.partnerType === "high" ? 1.15 : 1;
  let m = (a <= 6 ? 500 : a <= 12 ? 550 : a <= 16 ? 700 : 800) * spendy;
  if (a <= 6){
    const c = KID_CARE[careMode()];
    m += a < 2 ? (c.infant || 0) : (c.child || 0);
  }
  if (a >= 5 && a <= 16) m += KID_ENRICH[p.enrich].mo * spendy;
  if (a >= 17 && p.uniFund) m += 650;                    /* poly or university fees, spread over the year */
  return m * cpi;
}
function careMode(){ const c = S.p.care || "infant"; return c === "grand" && !grandOk() ? "infant" : c; }
/* the whole household's bill for its children, helper included */
function kidsCost(){
  const p = S.p;
  let t = 0;
  for (let i = 0; i < (p.kidsBorn || []).length; i++) t += kidMonthly(i);
  if (careMode() === "helper" && (dependents() || youngest() < 23)) t += KID_CARE.helper.house * S.econ.cpi;
  return t;
}
function haveChild(care){
  const p = S.p, cpi = S.econ.cpi, n = p.kids;
  if (care) setCare(care);
  p.kids++; p.kidsBorn.push(S.age); (p.kidEdu = p.kidEdu || []).push(0);
  const bonus = Math.round(BABY_BONUS[Math.min(n, 2)] * cpi), cda = Math.round(CDA_GRANT * cpi), rebate = Math.round(PTR[Math.min(n, 2)] * cpi);
  p.cash += bonus + cda; S.stats.income += bonus + cda;
  p.ptr = (p.ptr || 0) + rebate;
  p.trying = false; p.ivf = false;
  tl(S.age, "Had a child.");
  return { bonus, cda, rebate };
}
function babyPerks(){
  const n = S.p.kids, cpi = S.econ.cpi;
  return { bonus: Math.round(BABY_BONUS[Math.min(n, 2)] * cpi), cda: Math.round(CDA_GRANT * cpi), rebate: Math.round(PTR[Math.min(n, 2)] * cpi) };
}
/* choosing who looks after them. "One of us stays home" stops a partner's pay until the youngest is 7 */
function setCare(mode){
  const p = S.p;
  if (mode === "parent" && p.partner && p.partnerType !== "home" && !p.ptHome && p.partnerInc > 0){
    p.ptHome = { inc: p.partnerInc, from: S.age, cpi: S.econ.cpi };
    p.partnerInc = 0;
  }
  if (mode !== "parent") endPtHome();
  p.care = mode;
}
function endPtHome(notes){
  const p = S.p, h = p.ptHome;
  if (!h) return;
  /* back to work after years at home: a pay cut for every year away */
  const yrs = S.age - h.from, inc = Math.round(h.inc * S.econ.cpi / (h.cpi || S.econ.cpi) * Math.max(0.6, 1 - yrs * 0.04));
  p.ptHome = null;
  if (p.partner && !p.partnerOut) p.partnerInc = inc;
  if (notes) notes.push("Your partner is back at work after " + yrs + (yrs === 1 ? " year" : " years") + " at home — " + money(inc) + "/mo, less than before.");
}
/* the chance a couple conceives within a year, by age (the player stands in for both) */
function babyOdds(){
  const a = S.age;
  const base = a < 30 ? 0.85 : a < 35 ? 0.75 : a < 38 ? 0.6 : a < 41 ? 0.4 : a <= 45 ? 0.2 : 0;
  return Math.min(0.92, base + (S.p.ivf ? 0.25 : 0));
}
const IVF_COST = 6000;                                   /* a cycle after government co-funding, cash */
function canTry(){ return S.p.partner && S.age <= 45 && S.p.kids < 5; }

/* ---------- your parents ----------
   A monthly allowance once you earn (most Singaporeans give something). Parent Relief of
   $9,000 on your tax for anyone giving at least $2,000 a year to a parent 55 or older. */
const PAR_ALLOW = [
  { n: "Nothing", mo: 0, note: "They manage. The relatives notice. So do you, at CNY." },
  { n: "$200 a month", mo: 200, note: "The usual token. Parent Relief on your tax." },
  { n: "$500 a month", mo: 500, note: "A real help to them. Parent Relief on your tax." },
  { n: "$1,000 a month", mo: 1000, note: "They are properly looked after. Your partner may have views." }
];
function parentsCost(){
  const p = S.p;
  if (p.housingMode === "family" || familySupported() || S.age < 22 || p.retired) return 0;   /* at home, the board you pay is the allowance */
  return PAR_ALLOW[p.parAllow || 0].mo * S.econ.cpi;
}
function givesParents(){ return ((S.p.parAllow || 0) > 0 && parentsCost() > 0) || (S.p.housingMode === "family" && !familySupported()); }

/* ---------- tax: reliefs and rebates (YA2025 rules, the ones a player can pull) ---------- */
const RELIEF_CAP = 80000;
const SRS_CAP = 15300;                                    /* a citizen's SRS contributions a year */
const TOPUP_CAP = 8000;                                    /* cash top-up relief, yourself; the same again for family. IRAS caps are fixed dollars, not indexed to prices */
/* reliefs made this year (CPF top-ups, SRS) — p.relief is tagged with the age they were made at */
function reliefThisYear(){
  const r = S.p.relief;
  return r && r.age === (S.p.settling ? S.age - 1 : S.age) ? r : { self: 0, fam: 0, srs: 0 };
}
function reliefList(){
  const p = S.p, r = reliefThisYear(), out = [];
  out.push(["Earned income relief", 1000]);
  const kids = (p.kidsBorn || []).filter(b => S.age - b < 21).length;
  if (kids) out.push(["Qualifying child relief", 4000 * kids]);
  if (givesParents() && S.age >= 25) out.push(["Parent relief", 9000]);
  if (r.self) out.push(["CPF cash top-up, yourself", Math.min(r.self, TOPUP_CAP)]);
  if (r.fam) out.push(["CPF cash top-up, your parents", Math.min(r.fam, TOPUP_CAP)]);
  if (r.srs) out.push(["SRS contributions", Math.min(r.srs, SRS_CAP)]);
  return out;
}
function reliefTotal(){ return Math.min(RELIEF_CAP, reliefList().reduce((a, x) => a + x[1], 0)); }
function taxOn(annual){
  let t = 0, prev = 0;
  for (const [cap, r] of TAX_BANDS){ if (annual > prev) t += (Math.min(annual, cap) - prev) * r; prev = cap; }
  return t;
}
/* income the tax office counts: salary after CPF, side work, the lodger's rent less 15% deemed expenses */
function assessable(){
  const p = S.p;
  return Math.max(0, (p.salary - cpfEmployee()) * 12) + ((p.sideIncome || 0) + gigIncome()) * 12 + lodgerRent() * 12 * 0.85;
}
function taxYear(){ return taxOn(Math.max(0, assessable() - reliefTotal())); }
/* the rate on your next dollar: what a relief of $1 saves you */
function marginalRate(){
  const a = Math.max(0, assessable() - reliefTotal());
  for (const [cap, r] of TAX_BANDS) if (a < cap) return r;
  return 0.24;
}
/* the Parenthood Tax Rebate comes off tax payable until it is used up */
function rebateUse(t){ return Math.min(S.p.ptr || 0, t); }

/* ---------- CPF: top-ups, age 55, CPF LIFE ----------
   Full Retirement Sum $213,000 in 2025 (Basic half, Enhanced double), indexed to prices here. */
const FRS = 213000;
const retSums = () => ({ brs: Math.round(FRS / 2 * S.econ.cpi), frs: Math.round(FRS * S.econ.cpi), ers: Math.round(FRS * 2 * S.econ.cpi) });
const raKey = () => S.cpf.ra !== undefined ? "ra" : "sa";
function retBal(){ return S.cpf.ra !== undefined ? S.cpf.ra : S.cpf.sa; }
/* cash top-up into your Special (Retirement) Account: up to the Full Retirement Sum */
function topupRoom(){ return Math.max(0, retSums().frs - retBal()); }
function topUpSelf(amt){
  const p = S.p;
  amt = Math.round(Math.min(amt, topupRoom(), p.cash));
  if (amt <= 0) return 0;
  p.cash -= amt; S.cpf[raKey()] += amt;
  relief().self += amt;
  tl(S.age, "Topped up your CPF by " + money(amt) + ".");
  return amt;
}
function topUpParents(amt){
  const p = S.p;
  amt = Math.round(Math.min(amt, p.cash));
  if (amt <= 0) return 0;
  p.cash -= amt; S.stats.spend += amt;
  relief().fam += amt;
  p.parGood = (p.parGood || 0) + amt;
  tl(S.age, "Topped up your parents' CPF by " + money(amt) + ".");
  return amt;
}
function relief(){
  const p = S.p;
  if (!p.relief || p.relief.age !== S.age) p.relief = { age: S.age, self: 0, fam: 0, srs: 0 };
  return p.relief;
}
/* at 55: a Retirement Account is formed from Special, then Ordinary, up to a chosen sum; what is left
   over can be withdrawn (and at least $5,000 always can). opt: stay | take | pledge | ers */
function formRA(opt){
  const c = S.cpf, rs = retSums();
  if (c.ra !== undefined) return 0;
  const target = opt === "pledge" ? rs.brs : opt === "ers" ? rs.ers : rs.frs;
  const fromSA = Math.min(c.sa, target), fromOA = Math.min(c.oa, Math.max(0, target - fromSA));
  c.ra = fromSA + fromOA;
  c.oa += c.sa - fromSA - fromOA;              /* the Special Account closes; what is above the sum goes to Ordinary */
  c.sa = 0;
  let out = 0;
  if (opt === "take" || opt === "pledge"){
    out = Math.max(0, c.oa);
    if (out < 5000 * S.econ.cpi){ const x = Math.min(c.ra, 5000 * S.econ.cpi - out); c.ra -= x; out += x; }
    c.oa -= Math.min(c.oa, out);
    S.p.cash += out;
  }
  S.p.raOpt = opt;
  tl(S.age, "Retirement Account formed: " + money(c.ra) + (out ? "; took out " + money(out) : "") + ".");
  return out;
}
function cpfWithdrawOA(amt){
  if (S.age < 55 || S.cpf.ra === undefined) return 0;
  amt = Math.round(Math.min(amt, S.cpf.oa));
  S.cpf.oa -= amt; S.p.cash += amt;
  return amt;
}
/* CPF LIFE: the Retirement Account at 65 buys a monthly payout for life.
   About $1,760 a month on a Full Retirement Sum (Standard), less on Basic, and Escalating
   starts lower and rises 2% a year. Starting at 70 instead of 65 pays about 40% more. */
const CPF_PLANS = {
  std:   { n: "Standard", rate: 0.0056, grow: 0, note: "Level payouts for life. The usual choice." },
  basic: { n: "Basic",    rate: 0.0049, grow: 0, note: "Lower payouts; more of your savings stays in your account, and goes to your family if you die early." },
  esc:   { n: "Escalating", rate: 0.0044, grow: 0.02, note: "Starts lower, rises 2% a year, so it keeps up with prices." }
};
function cpfLifeAt(plan, start, age){
  const pl = CPF_PLANS[plan || "std"], ra = retBal();
  if (age < start) return 0;
  const first = ra * pl.rate * (start >= 70 ? 1.4 : 1 + (start - 65) * 0.08);
  return Math.round(first * Math.pow(1 + pl.grow, age - start));
}
/* what would go to your family if you died at a given age: the part of the savings not yet paid out */
function cpfBequest(plan, start, age){
  const pl = CPF_PLANS[plan || "std"], ra = retBal();
  let left = ra * (plan === "basic" ? 1.08 : 1) * Math.pow(1.04, Math.max(0, start - 65)), paid = 0;
  for (let a = start; a < age; a++) paid += cpfLifeAt(plan, start, a) * 12;
  return Math.max(0, Math.round(left - paid * (plan === "basic" ? 0.85 : 1)));
}

/* ---------- SRS: tax off now, locked until 62 ---------- */
function srsPut(amt){
  const p = S.p, cap = SRS_CAP - (reliefThisYear().srs || 0);
  amt = Math.round(Math.min(amt, cap, p.cash));
  if (amt <= 0) return 0;
  p.cash -= amt; p.srs.bal += amt; p.srs.paid += amt;
  relief().srs += amt;
  tl(S.age, "Put " + money(amt) + " into SRS.");
  return amt;
}
function srsRoom(){ return Math.max(0, SRS_CAP - (reliefThisYear().srs || 0)); }
/* this year's tax-relief room still unused: your own CPF cash top-up (to the Full Retirement Sum) and SRS.
   Room not used before the next roll is gone. */
function topupReliefLeft(){ return Math.max(0, Math.min(TOPUP_CAP - (reliefThisYear().self || 0), topupRoom())); }
function reliefLeft(){ return topupReliefLeft() + srsRoom(); }
/* taking it out: from 62, half of it is taxed; before that, all of it, plus a 5% penalty */
function srsWithdrawQuote(){
  const bal = S.p.srs.bal, early = S.age < 62;
  const taxable = early ? bal : bal / 2;
  const tax = taxOn(assessable() - reliefTotal() + taxable) - taxOn(Math.max(0, assessable() - reliefTotal()));
  const pen = early ? bal * 0.05 : 0;
  return { bal, tax: Math.round(tax), pen: Math.round(pen), net: Math.round(bal - tax - pen), early };
}
function srsWithdraw(){
  const q = srsWithdrawQuote();
  S.p.cash += q.net; S.p.srs.bal = 0; S.stats.tax += q.tax; S.stats.spend += q.pen;
  tl(S.age, "Took " + money(q.bal) + " out of SRS" + (q.early ? " early" : "") + ".");
  return q;
}

/* ---------- side work ---------- */
const GIGS = [
  { id: "delivery", n: "Food delivery on weekends", inc: [450, 800], stand: 0, need: () => null,
    note: "Any bicycle, any weekend. Rain means surge pricing, and also rain." },
  { id: "phv", n: "Private-hire driving, weekends", inc: [1000, 1500], stand: 0, need: () => S.p.car && !S.p.car.family ? null : "Needs a car of your own.",
    note: "Your car earns its keep. It also wears out faster: about $200/mo more to run." },
  { id: "tuition", n: "Private tuition, two evenings a week", inc: [700, 1300], stand: -1, need: () => S.p.qual >= 2 ? null : "Parents want a diploma or degree.",
    note: "Pays well by the hour. Other people's children, other people's exam stress." },
  { id: "shop", n: "An online shop on Shopee and Carousell", inc: [0, 1400], setup: 2000, stand: -1, need: () => null,
    note: "Some months the parcels fly. Some months you are the only one who has seen the listing." },
  { id: "freelance", n: "Freelance work in your own field", inc: [1200, 2600], stand: -4, need: () => S.p.skills.tech >= 4 || S.p.skills.fin >= 4 || S.p.skills.comms >= 5 ? null : "Needs strong technical, financial or people skills.",
    note: "Real money for what you already do. Your employer would rather you did it for them." }
];
const gigById = id => GIGS.find(g => g.id === id);
function gigIncome(){ return S.p.gig ? S.p.gig.inc : 0; }
function startGig(id){
  const p = S.p, g = gigById(id), cpi = S.econ.cpi;
  if (p.gig || g.need()) return null;
  if (g.setup){ const c = Math.round(g.setup * cpi); if (p.cash < c) return null; p.cash -= c; S.stats.spend += c; }
  p.gig = { id, inc: Math.round(rf(g.inc[0], g.inc[1]) * cpi), since: S.age };
  tl(S.age, "Started side work: " + g.n.toLowerCase() + ".");
  return p.gig.inc;
}
function stopGig(){ const p = S.p; if (!p.gig) return; tl(S.age, "Stopped the side work."); p.gig = null; }

/* ---------- the card ---------- */
const CARD_BACK = 0.015;                                   /* cashback on everyday spending, capped */
const CC_RATE = 0.269;
function cardCashback(){
  if (S.p.card !== "full" || familySupported()) return 0;
  const c = livingCosts();
  return Math.round(Math.min(80 * S.econ.cpi, (c.food + c.transport + c.utilities + c.lifestyle) * (S.p.partner ? 0.6 : 1) * CARD_BACK));
}
/* people who pay by card spend a little more on the things they tap for */
const cardSpendMul = () => S.p.card === "full" ? 1.05 : 1;
/* roll a shortfall onto the card: no approval, 26.9% a year, 3% of the balance a month minimum */
function ccBorrow(amt){
  let l = S.loans.find(x => x.kind === "cc");
  if (!l){ l = { id: "cc-" + Math.round(rnd() * 1e6), kind: "cc", name: "Credit card balance", bal: 0, rate: CC_RATE, monthly: 0, years: 5, variable: false, fixed: true, taken: S.age }; S.loans.push(l); }
  l.bal += amt; S.p.cash += amt;
  l.monthly = Math.max(50, Math.round(l.bal * 0.03));
  S.p.credit = clamp(S.p.credit - 12, 300, 850);
  lg("Put " + money(amt) + " on the credit card at " + pct(CC_RATE) + ".");
  return l;
}
const canCard = () => S.p.credit >= 560 && S.p.missed < 2;

/* ---------- the buffer, and what happens to the rest ---------- */
const SWEEPS = {
  none: { n: "Leave it in the bank", note: "Nothing moves unless you move it." },
  tbill: { n: "Into T-bills", note: "Safe, liquid, pays the short rate." },
  ssb: { n: "Into Savings Bonds", note: "Safe, a little more than T-bills, $200,000 cap." },
  etf: { n: "Into the STI ETF", note: "Grows faster over decades; can fall 30% in a bad year." },
  mix: { n: "Half fund, half bonds", note: "Some growth, some ballast." }
};
function monthlyBurn(){ return totalCosts() * billShare() + loanMonthlyCash(); }
/* the cash kept back: a number of months of spending, or a set amount (p.bufferAmt, held in
   2025 dollars so it keeps its value as prices rise) */
function bufferKeep(){ const p = S.p; return p.bufferAmt ? p.bufferAmt * S.econ.cpi : p.buffer * monthlyBurn() + 2000 * S.econ.cpi; }
function bufferText(){ const p = S.p; return p.bufferAmt ? money(Math.round(p.bufferAmt * S.econ.cpi)) + " buffer" : p.buffer + "-month buffer"; }
/* once a year: anything above the buffer goes where you said */
function sweepCash(notes){
  const p = S.p;
  if (!p.sweep || p.sweep === "none" || p.retired) return 0;
  const keep = bufferKeep();
  const spare = p.cash - keep;
  if (spare < 1000) return 0;
  const split = p.sweep === "mix" ? [["etf", 0.5], ["ssb", 0.5]] : [[p.sweep, 1]];
  let put = 0;
  for (const [k, f] of split){
    let amt = spare * f;
    if (k === "ssb") amt = Math.min(amt, ssbRoom());
    const n = Math.floor(amt / buyPrice(k));
    if (n > 0) put += buyUnits(k, n);
  }
  if (put > 0){ S.stats.swept += put; if (notes) notes.push("Kept a " + bufferText() + "; " + money(put) + " above it went " + (p.sweep === "mix" ? "half into the STI ETF, half into Savings Bonds" : SWEEPS[p.sweep].n.toLowerCase()) + "."); }
  return put;
}

/* ---------- a lodger ---------- */
function bedrooms(h){ return Math.max(1, ((h && h.rooms) || 3) - 1); }
function spareRooms(){
  const h = S.a.property;
  if (!h || !livingInOwnHome()) return 0;
  const kids = (S.p.kidsBorn || []).filter(b => S.age - b < 25).length;
  return bedrooms(h) - 1 - Math.ceil(kids / 2);
}
function lodgerAsking(){
  const h = S.a.property;
  return Math.round((h && h.type === "hdb" ? 950 : 1450) * S.econ.cpi * rf(0.9, 1.1) / 10) * 10;
}
function lodgerRent(){ return S.p.lodger && livingInOwnHome() ? S.p.lodger.rent : 0; }
function takeLodger(){ const p = S.p; if (p.lodger || spareRooms() < 1) return null; p.lodger = { rent: lodgerAsking(), since: S.age }; tl(S.age, "Rented out a room — " + money(p.lodger.rent) + "/mo."); return p.lodger.rent; }
function endLodger(){ if (S.p.lodger){ S.p.lodger = null; tl(S.age, "The lodger moved out."); } }

/* ---------- a car of your own: price with its 10-year COE, the loan the rules allow ---------- */
const CARS = [
  { id: "a", n: "A small new car (Category A)", price: 150000, run: 850, ltv: 0.6, years: 7, coe: 10, note: "A 1.6-litre sedan. Most of the price is the COE." },
  { id: "b", n: "A bigger new car (Category B)", price: 230000, run: 1100, ltv: 0.5, years: 7, coe: 10, note: "Room for the whole family and the grandparents' opinions." },
  { id: "u", n: "A used car, five years of COE left", price: 65000, run: 950, ltv: 0.6, years: 5, coe: 5, note: "Cheaper to buy. More time at the workshop." }
];
function buyCar(id, financed){
  const p = S.p, c = CARS.find(x => x.id === id), cpi = S.econ.cpi;
  const price = Math.round(c.price * cpi / 1000) * 1000;
  const down = financed ? Math.round(price * (1 - c.ltv)) : price;
  if (p.cash < down) return null;
  if (p.car && !p.car.family) sellCar();
  p.cash -= down;
  let q = null;
  if (financed){ q = takeLoan("car", price - down, c.years); p.cash -= price - down; }
  p.car = { value: price, price, monthly: c.run, bought: S.age, coe: c.coe, kind: id };
  tl(S.age, "Bought " + c.n.toLowerCase().replace(/ \(.*\)/, "") + " for " + kmoney(price) + (financed ? " on a loan" : "") + ".");
  return { price, down, q };
}
function carSaleValue(){ const c = S.p.car; return c && !c.family ? Math.round(c.value * 0.9) : 0; }
function sellCar(){
  const p = S.p, v = carSaleValue();
  if (!p.car || p.car.family) return 0;
  p.cash += v;
  for (const l of S.loans.filter(l => l.kind === "car")) repayLoan(l, l.bal);
  p.car = null; if (p.gig && p.gig.id === "phv") stopGig();
  tl(S.age, "Sold the car for " + kmoney(v) + ".");
  return v;
}
const carYearsLeft = () => { const c = S.p.car; return c && !c.family && c.bought !== undefined ? c.bought + (c.coe || 10) - S.age : 99; };

/* what a sum spent today would be by 65 if invested instead: 3% a year after inflation, in today's money */
function oppCost(amt){
  const yrs = Math.max(0, END_AGE - S.age);
  return Math.round(amt / S.econ.cpi * Math.pow(1.03, yrs) / 1000) * 1000;
}
function oppText(amt){
  const v = oppCost(amt);
  return S.age >= END_AGE - 2 || v < 2000 ? "" : "Invested instead, about " + kmoney(v) + " by 65 in today's money.";
}

/* ---------- BTO: a new flat from HDB ----------
   Prices set below resale (Standard, Plus and Prime locations since 2024). Apply, ballot, book,
   wait three to five years, collect the keys. Plus and Prime: 10-year MOP and a clawback of
   6% / 9% of the resale price when sold; Prime flats can never be let out whole. */
const BTO_TIERS = {
  std:   { n: "Standard", prem: 0.85, mop: 5,  claw: 0,    odds: 1,    let: true, towns: ["Tengah", "Punggol", "Woodlands", "Sengkang", "Yishun", "Jurong West"] },
  plus:  { n: "Plus",     prem: 1.1,  mop: 10, claw: 0.06, odds: 0.6,  let: true, towns: ["Bedok", "Tampines", "Kallang", "Bukit Batok", "Toa Payoh"] },
  prime: { n: "Prime",    prem: 1.35, mop: 10, claw: 0.09, odds: 0.35, let: false, towns: ["Queenstown", "Bukit Merah", "Holland", "Bishan", "Kallang Whampoa"] }
};
const BTO_FLATS = [
  { rooms: 2, n: "2-room Flexi", base: { std: 180000, plus: 230000, prime: 300000 }, odds: 0.75, single: true },
  { rooms: 3, n: "3-room",       base: { std: 300000, plus: 420000, prime: 520000 }, odds: 0.7 },
  { rooms: 4, n: "4-room",       base: { std: 420000, plus: 580000, prime: 750000 }, odds: 0.55 },
  { rooms: 5, n: "5-room",       base: { std: 560000, plus: 700000 },               odds: 0.45 }
];
const BTO_CEILING = 14000, BTO_SINGLE_CEILING = 7000;
function btoBlock(){
  const p = S.p, cpi = S.econ.cpi;
  if (p.bto) return p.bto.stage === "applied" ? "You have an application in." : "You have a flat on the way.";
  if (S.a.property || extraProps().length) return "You own property. BTO flats are for people who do not.";
  if (p.hdbGrantUsed && p.subsidisedRooms) return "You have already bought a subsidised flat.";
  if (!p.partner && S.age < 35) return "Singles can apply from 35.";
  if (householdIncome() > (p.partner ? BTO_CEILING : BTO_SINGLE_CEILING) * cpi) return "Household income is over the " + money(Math.round((p.partner ? BTO_CEILING : BTO_SINGLE_CEILING) * cpi)) + " ceiling.";
  if (p.privSoldAge !== undefined && S.age - p.privSoldAge < 3) return "Ex-private owners wait 30 months.";
  if (p.btoBar && S.age < p.btoBar) return "You turned a flat down or gave one up: you cannot apply again until " + p.btoBar + ".";
  return null;
}
/* this year's launches, fixed for the year */
function btoMarket(){
  if (!S.btoMarket || S.btoMarket.age !== S.age){
    const idx = (S.mk.idx.hdb || S.mk.idx.prop) / 100, list = [];
    for (const f of BTO_FLATS) for (const t of Object.keys(f.base)){
      if (t !== "std" && rnd() < 0.35) continue;          /* not every kind launches every year */
      list.push({ rooms: f.rooms, n: f.n, tier: t, town: pick(BTO_TIERS[t].towns), single: !!f.single,
        price: Math.round(f.base[t] * idx * rf(0.93, 1.08) / 1000) * 1000, odds: f.odds * BTO_TIERS[t].odds });
    }
    S.btoMarket = { age: S.age, list };
  }
  const p = S.p;
  return S.btoMarket.list.filter(x => p.partner ? true : x.single);
}
/* first-timers who keep missing get extra ballot chances */
function btoChance(x){
  const tries = S.p.btoTries || 0, base = S.p.partner ? x.odds : x.odds * 0.45;
  return clamp(1 - Math.pow(1 - base, 1 + tries * 0.5), 0.05, 0.95);
}
function btoApply(x){
  const p = S.p;
  if (btoBlock()) return null;
  p.bto = { stage: "applied", rooms: x.rooms, n: x.n, tier: x.tier, town: x.town, price: x.price, odds: x.odds, applied: S.age };
  tl(S.age, "Applied for a " + x.n + " BTO flat in " + x.town + ".");
  return p.bto;
}
/* Three stages: "applied" (in the ballot), "booked" (option fee paid; the lease is signed at the next
   roll), "signed" (Agreement for Lease signed, 5% down paid; waiting for the keys).
   Leaving: an application just lapses; a booked flat loses the option fee; a signed one loses the 5%.
   Either of the last two bars you from applying again for a year. */
const btoOnWay = b => !!b && b.stage !== "applied";
function btoLoss(){ const b = S.p.bto; return !b || b.stage === "applied" ? 0 : (b.paidCash || 0) + (b.paidCpf || 0); }
function btoStageText(b){
  if (!b) return "";
  return b.stage === "applied" ? "in the ballot — the result comes when you roll to age " + (b.applied + 1)
    : b.stage === "booked" ? "booked — sign the lease and pay the 5% down payment at age " + b.aflAt
    : "lease signed — keys at about age " + b.keys;
}
function btoForfeit(why){
  const p = S.p, b = p.bto;
  if (!b) return 0;
  const lost = btoLoss();
  if (b.stage !== "applied"){ p.btoBar = S.age + 1; S.stats.spend += lost; tl(S.age, "Gave up the BTO flat" + (why ? " " + why : "") + "; lost " + money(lost) + "."); }
  else tl(S.age, "BTO application cancelled" + (why ? " " + why : "") + ".");
  p.bto = null;
  return lost;
}
function btoWithdraw(){ return btoForfeit(); }
/* what the new flat is worth on the open market the day the keys arrive */
function btoValue(b){
  const l = HOME_LISTINGS.find(h => h.type === "hdb" && h.rooms === Math.max(2, Math.min(5, b.rooms)));
  const idx = (S.mk.idx.hdb || S.mk.idx.prop) / 100;
  return Math.round(l.base * idx * leaseValue(99) / leaseValue(l.lease) * BTO_TIERS[b.tier].prem / 1000) * 1000;
}
/* the option fee when you book ($500 to $2,000 by size, cash), then the rest of the 5% down payment
   when the Agreement for Lease is signed at the next roll (CPF first, then cash) */
const BTO_OPTION = { 2: 500, 3: 1000, 4: 2000, 5: 2000 };
function btoOptionFee(b){ return Math.round((BTO_OPTION[b.rooms] || 2000) * S.econ.cpi); }
function btoDeposit(b){ return Math.round(b.price * 0.05); }
function btoSignDue(b){ return Math.max(0, btoDeposit(b) - (b.paidCash || 0) - (b.paidCpf || 0)); }
function btoBook(){
  const p = S.p, b = p.bto, fee = btoOptionFee(b);
  if (p.cash < fee) return null;
  p.cash -= fee;
  b.stage = "booked"; b.paidCash = fee; b.paidCpf = 0; b.aflAt = S.age + 1;
  b.keys = S.age + ri(3, 5) + (rnd() < 0.2 ? 1 : 0);
  p.btoTries = 0;
  tl(S.age, "Booked a " + b.n + " flat in " + b.town + " — option fee " + money(fee) + ", keys around age " + b.keys + ".");
  return b;
}
function btoSign(){
  const p = S.p, b = p.bto, due = btoSignDue(b);
  const cpf = Math.min(S.cpf.oa, due), cash = due - cpf;
  if (p.cash < cash) return null;
  S.cpf.oa -= cpf; p.cash -= cash;
  b.paidCpf += cpf; b.paidCash += cash; b.stage = "signed";
  tl(S.age, "Signed the lease for the BTO flat: " + money(due) + " down (" + money(cpf) + " from CPF).");
  return due;
}
/* the keys: the property record every other rule reads */
function btoMakeHome(b, loanKind, fromCpf, fromCash, loan, grant){
  const value = btoValue(b), tr = BTO_TIERS[b.tier];
  S.a.property = { type: "hdb", value, basis: b.price, bought: S.age, left: 99, n: b.n + " BTO flat, " + b.town, rooms: b.rooms,
    rentOut: false, rentIncome: 0, cpfUsed: fromCpf, cpfMonthly: loan > 0, grant, mop: tr.mop, claw: tr.claw, noLet: !tr.let, bto: b.tier,
    paidMe: fromCpf + fromCash, paidPt: 0, ptCpfUsed: 0 };
  S.p.housingMode = "own"; S.p.rent = 0;
  S.p.hdbGrantUsed = true; S.p.subsidisedRooms = b.rooms;
  S.p.bto = null;
  tl(S.age, "Collected the keys to a " + b.n + " flat in " + b.town + ": bought for " + kmoney(b.price) + ", worth about " + kmoney(value) + ".");
  return value;
}
/* a financing the engine can do on its own (the headless tests, and anyone who just wants it done):
   HDB loan for as much as the rules allow, CPF for the rest, cash last */
function btoKeysAuto(){
  const p = S.p, b = p.bto;
  const grant = hdbGrant({ type: "hdb", rooms: b.rooms }).ehg;
  const fees = buyCosts(b.price), term = fullLtvTerm("hdb", "hdb");
  const loan = Math.max(0, Math.min(maxHomeLoan("hdb", b.price, term, "hdb"), Math.round(b.price * 0.75)));
  /* the deposit already paid comes back into the sums, then everything is paid in one go */
  const oa = S.cpf.oa + (b.paidCpf || 0) + grant, cash = p.cash + (b.paidCash || 0);
  const rest = b.price + fees - loan, fromCpf = Math.min(oa, rest), fromCash = rest - fromCpf;
  if (fromCash > cash) return null;
  S.cpf.oa = oa - fromCpf; p.cash = cash - fromCash; S.stats.spend += fees;
  if (loan > 0){ takeLoan("hdb", loan, term); p.cash -= loan; }
  btoMakeHome(b, "hdb", fromCpf, fromCash, loan, grant);
  return "Keys collected. " + (loan ? "HDB loan of " + money(loan) + " over " + term + " years, " : "") + money(fromCpf) + " from CPF and " + money(fromCash) + " in cash." + (grant ? " Enhanced grant: " + money(grant) + "." : "") + " My flat, my nails, my wall. Finally.";
}

/* subsidy clawback on a Plus or Prime flat, taken at sale */
function clawbackFor(h, price){ return h && h.claw ? Math.round(price * h.claw) : 0; }

/* ---------- the year: everything above that moves on its own ----------
   Returns ids of cards the year forces (the BTO ballot, the keys, a COE running out,
   CPF at 55, a grown child's first pay). */
function stepPlans(notes){
  ensurePlans();
  const p = S.p, forced = [], cpi = S.econ.cpi;

  /* still no wedding: the question comes back each year until they stop asking (d_style.js wedDelay) */
  if (weddingCan() && p.wedNext && S.age >= p.wedNext){ p.wedNext = null; p.wedDue = true; forced.push("wedding"); }

  /* trying for a baby */
  if (p.trying && canTry()){
    if (p.ivf){ const c = Math.round(IVF_COST * cpi); p.cash -= c; S.stats.spend += c; }
    if (rnd() < babyOdds()){ const k = haveChild(); notes.push("A baby! Baby Bonus " + money(k.bonus) + " and a " + money(k.cda) + " CDA grant; a " + money(k.rebate) + " tax rebate to use against your tax."); }
    else notes.push("Still trying for a baby." + (S.age >= 38 ? " The odds fall a little each year from here." : ""));
  } else if (p.trying) p.trying = false;

  /* the children grow: enrichment adds up; the one who turns 23 starts work */
  for (let i = 0; i < (p.kidsBorn || []).length; i++){
    const a = S.age - p.kidsBorn[i];
    if (a >= 5 && a <= 16) p.kidEdu[i] = (p.kidEdu[i] || 0) + p.enrich;
    if (a === 23 && !forced.includes("kidpay")) forced.push("kidpay");
  }
  if (p.ptHome && (youngest() >= 7 || !p.partner)) endPtHome(notes);

  /* a stay-at-home partner, side work, a lodger: the wear and tear */
  if (p.gig){
    const g = gigById(p.gig.id);
    p.burnout += 2;
    if (g.id === "shop") p.gig.inc = Math.round(rf(g.inc[0], g.inc[1]) * cpi);
    else p.gig.inc = Math.round(p.gig.inc * (1 + S.econ.infl));
    if (g.id === "phv" && (!p.car || p.car.family)) { notes.push("No car, no private-hire driving."); p.gig = null; }
    if (p.partner) p.tension = (p.tension || 0) + 0.3;
  }
  if (p.lodger){
    if (!livingInOwnHome() || spareRooms() < 0){ notes.push("The lodger has moved out — you need the room."); endLodger(); }
    else { p.lodger.rent = Math.round(p.lodger.rent * (1 + S.econ.infl * 0.8)); if (p.partner) p.tension = (p.tension || 0) + (dependents() ? 0.5 : 0.3); }
  }
  /* married and still at your parents': it grates, less so with keys on the way */
  if (p.partner && p.housingMode === "family") p.tension = (p.tension || 0) + (btoOnWay(p.bto) ? 0.3 : 0.7);
  /* generous to your parents on a tight household budget */
  if (p.partner && p.parAllow === 3 && parentsCost() > myTakeHome() * 0.12) p.tension = (p.tension || 0) + 0.4;
  /* babies without help */
  if (youngest() < 3 && careMode() === "infant") p.burnout++;

  /* BTO */
  const b = p.bto;
  if (b && b.stage === "applied" && b.applied < S.age){
    if (!p.partner && b.rooms > 2){ p.bto = null; }
    else if (rnd() < btoChance(b)) forced.push("btowin");
    else { p.btoTries = (p.btoTries || 0) + 1; b.applied = S.age; forced.push("btolose"); }
  }
  if (b && b.stage === "booked" && S.age >= b.aflAt) forced.push("btoafl");
  if (b && b.stage === "signed" && S.age >= b.keys) forced.push("btokeys");
  else if (b && b.stage === "signed" && rnd() < 0.08 && b.keys - S.age <= 2){ b.keys++; notes.push("Construction delay: the BTO keys now come at " + b.keys + "."); }

  /* a car whose COE is up */
  if (p.car && !p.car.family && p.car.bought !== undefined && carYearsLeft() <= 0) forced.push("coe");

  /* CPF at 55 */
  if (S.age >= 55 && S.cpf.ra === undefined){ if (S.age === 55) forced.push("cpf55"); else formRA("stay"); }

  p.burnout = Math.min(6, p.burnout);
  /* money from grown children, indexed */
  for (const f of p.fromKids) f.amt = Math.round(f.amt * (1 + S.econ.infl * 0.8));
  return forced;
}
function kidsGiving(){ return (S.p.fromKids || []).reduce((a, f) => a + f.amt, 0); }

/* how the family, the side work and the rest feel */
function plansWell(){
  const p = S.p;
  let w = 0;
  const kids = dependents();
  if (kids) w += Math.min(6, kids * 3);
  if (youngest() < 3 && careMode() === "infant") w -= 3;
  if (careMode() === "helper" && p.kids) w += 2;
  if (!familySupported() && S.age >= 30) w += [-2, 0, 1, 2][p.parAllow || 0];
  if (p.lodger && livingInOwnHome()) w -= 3;
  if (p.gig) w -= 3;
  if (p.car && !p.car.family) w += 2 + (kids ? 2 : 0);
  if (p.partner && p.housingMode === "family") w -= 4;
  return w;
}
/* at work: a car gets you in on time; a second job shows */
function plansStanding(){
  const p = S.p;
  return (p.car && !p.car.family ? Math.max(0, 4 - fxOf("transport", "work")) : 0) + (p.gig ? gigById(p.gig.id).stand : 0);
}

/* what the job asks of you, besides the skills */
const SECTOR_TRAITS = {
  retail: { hours: "shifts, weekends", stress: 1 }, logistics: { hours: "early starts, shifts", stress: 1 },
  office: { hours: "office hours, mostly", stress: 1 }, care: { hours: "shifts, some nights", stress: 2 },
  industry: { hours: "site hours, call-outs", stress: 1 }, sales: { hours: "targets and evenings", stress: 2 },
  tech: { hours: "long, sometimes on call", stress: 2 }, health: { hours: "shifts and nights", stress: 2 },
  education: { hours: "long terms, marking at home", stress: 2 }, finance: { hours: "long at quarter-end", stress: 2 },
  self: { hours: "all of them", stress: 3 }
};
function jobTraits(j){
  const t = SECTOR_TRAITS[j.sect] || { hours: "", stress: 1 };
  const stress = Math.min(3, t.stress + (j.lvl >= 2 ? 1 : 0));

    growth: j.growth >= 0.04 ? "fast" : j.growth >= 0.028 ? "steady" : "slow" };
}
