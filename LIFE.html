/* ============================================================
   22. MARKETS — prices, graphs, and what the long run has looked like
   ============================================================ */

/* an inline SVG line, drawn from an index series */
function lineChart(series, colour, w, h, opts){
  opts = opts || {};
  const n = series.length;
  if (n < 2) return '<div class="hint">Not enough history yet.</div>';
  const lo = Math.min.apply(null, series), hi = Math.max.apply(null, series);
  const pad = 3;
  const x = i => pad + (i / (n - 1)) * (w - pad * 2);
  const y = v => h - pad - (hi === lo ? 0.5 : (v - lo) / (hi - lo)) * (h - pad * 2);
  const d = series.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(" ");
  const area = d + " L" + x(n - 1).toFixed(1) + " " + (h - pad) + " L" + x(0).toFixed(1) + " " + (h - pad) + " Z";
  const id = "g" + Math.round(Math.random() * 1e6);
  return '<svg class="chart" viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="none" role="img">' +
    '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="' + colour + '" stop-opacity="0.22"/>' +
      '<stop offset="100%" stop-color="' + colour + '" stop-opacity="0"/></linearGradient></defs>' +
    '<path d="' + area + '" fill="url(#' + id + ')"/>' +
    '<path d="' + d + '" fill="none" stroke="' + colour + '" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>' +
    (opts.dot !== false ? '<circle cx="' + x(n - 1).toFixed(1) + '" cy="' + y(series[n - 1]).toFixed(1) + '" r="2.6" fill="' + colour + '"/>' : "") +
    "</svg>";
}

/* everything on one pair of axes, each rebased to 100 at the left edge */
const CHART_KEYS = ["etf", "reit", "gold", "bond", "sgs", "tbill", "hdb", "prop", "cpi"];
/* every market chart uses these (the combined chart needs colours that tell nine lines apart at a glance, so it has its own
   set (Tableau 10) rather than the assets' family colours, which cluster in reds and greens) */
const CHART_COLOURS = { etf: "#d62728", reit: "#ff7f0e", gold: "#bcbd22", bond: "#1f77b4", sgs: "#17becf", tbill: "#2ca02c", hdb: "#9467bd", prop: "#e377c2", cpi: "#7f7f7f", ssb: "#8c564b" };
function chartColour(k){ return CHART_COLOURS[k] || ASSET_META[k].colour; }
const chartOff = {};                 /* lines switched off with the legend's check boxes */
function chartName(k){ return k === "hdb" ? "HDB" : k === "prop" ? "Private property" : ASSET_META[k].short; }
function combinedChart(w, h){
  const keys = CHART_KEYS.filter(k => S.mk.hist[k] && !chartOff[k]);
  const n = S.mk.hist.etf.length;
  if (n < 3) return "";
  if (!keys.length) return '<div class="hint" style="height:' + h + 'px;display:flex;align-items:center;justify-content:center">Tick a line below to show it.</div>';
  const series = {};
  let lo = Infinity, hi = -Infinity;
  for (const k of keys){
    const h0 = S.mk.hist[k].slice(-n);
    const base = h0[0] || 100;
    series[k] = h0.map(v => (v / base) * 100);
    lo = Math.min(lo, Math.min.apply(null, series[k]));
    hi = Math.max(hi, Math.max.apply(null, series[k]));
  }
  const pad = 4;
  const x = i => pad + (i / (n - 1)) * (w - pad * 2);
  const y = v => h - pad - (hi === lo ? 0.5 : (v - lo) / (hi - lo)) * (h - pad * 2);
  const paths = keys.map(k => {
    const d = series[k].map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(" ");
    return '<path d="' + d + '" fill="none" stroke="' + chartColour(k) + '" stroke-width="' + (k === "cpi" ? 1.5 : 2) +
      '"' + (k === "cpi" ? ' stroke-dasharray="3 3"' : "") + ' stroke-linejoin="round"/>';
  }).join("");
  return '<svg class="chart tall" viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="none" role="img">' + paths + "</svg>";
}

function assetHolding(k){
  if (k === "cash") return S.p.cash;
  if (k === "prop") return (S.a.property ? S.a.property.value : 0) + extraValue();
  return hv(k);
}
const CHEAP_CLS = { 2: "pos", 1: "pos", 0: "", "-1": "neg", "-2": "neg" };

function openMarkets(fromTile, back){
  const yrs = yearsOfHistory();
  const span = Math.min(10, Math.max(1, yrs));
  const inc = investIncome();

  const row = k => {
    const m = INSTR[k], hold = units(k) > 0;
    const nom = avgReturn(k, 10), real = realAvgReturn(k, 10);
    const ph = S.mk.pxHist[k], lastPx = ph.length > 1 ? ph[ph.length - 1] / ph[ph.length - 2] - 1 : null;
    const ch = cheapness(k), pl = holdingPL(k);
    return '<div class="mrow">' +
      '<div class="mrow-h"><div><b>' + m.name + "</b>" +
        '<div class="hint">' + m.about + "</div>" +
        '<div class="hint">' + m.risk + " risk · " + m.liq + " · " + yieldText(k) + "</div></div>" +
        '<div class="mrow-n"><div class="num big">' + fmtPrice(k) + '</div><div class="hint">' + m.unit + "</div>" +
        (ch ? '<div class="cheap ' + CHEAP_CLS[ch.score] + '" title="' + esc(ch.why) + '">' + ch.word + "</div>" : '<div class="hint">price does not move</div>') +
        "</div></div>" +
      (hold ? '<div class="mhold">You hold <b>' + fmtUnits(k, units(k)) + "</b> worth <b>" + money(hv(k)) + "</b>" +
        (pl ? ' · <span class="' + (pl.amt < 0 ? "neg" : "pos") + '">' + plText(k) + "</span> on what you paid" : "") +
        (inc[k] ? ' · pays you <b class="pos">' + money(inc[k]) + "/mo</b>" : "") + "</div>" : "") +
      '<div class="mrow-b">' +
        '<div class="mchart">' + lineChart(ph.slice(-16), chartColour(k), 220, 46) + "</div>" +
        '<div class="mstats">' +
          '<div><span class="k">price, last year</span><span class="v num ' + (lastPx !== null && lastPx < 0 ? "neg" : "") + '">' + (lastPx === null ? "—" : pctS(lastPx)) + "</span></div>" +
          '<div><span class="k">' + span + 'y return, with payouts</span><span class="v num">' + (nom === null ? "—" : pctS(nom)) + "</span></div>" +
          '<div><span class="k">after inflation</span><span class="v num ' + (real !== null && real < 0 ? "neg" : "") + '">' + (real === null ? "—" : pctS(real)) + "</span></div>" +
        "</div>" +
        '<div class="mbtns"><button class="btn sm" data-buy="' + k + '"' + (k === "ssb" && !ssbRoom() ? " disabled" : "") + ">Buy</button>" +
          '<button class="btn sm" data-sell="' + k + '"' + (hold ? "" : " disabled") + ">Sell</button></div>" +
      "</div></div>";
  };
  /* property: watched here, bought and sold under Where you live */
  const propRow = () => {
    const realH = S.mk.idx.hdb / 100 / S.econ.cpi - 1, realP = S.mk.idx.prop / 100 / S.econ.cpi - 1;
    return '<div class="mrow"><div class="mrow-h"><div><b>Property</b><div class="hint">After inflation, against 2025: HDB resale ' +
      pctS(realH, 0) + ", private " + pctS(realP, 0) + "." + (S.mk.cool > 0 ? " Cooling measures in force." : "") + " Bought and sold under Where you live.</div></div>" +
      '<div class="mrow-n"><div class="num big">' + (assetHolding("prop") ? kmoneyT(assetHolding("prop")) : "—") + "</div></div></div>" +
      '<div class="mrow-b"><div class="mchart">' + lineChart(S.mk.hist.hdb.slice(-16), chartColour("hdb"), 220, 46) + "</div>" +
      '<div class="mstats"><div><span class="k">HDB, last year</span><span class="v num">' + pctS(S.mk.hdbRet || 0) + "</span></div>" +
      '<div><span class="k">private, last year</span><span class="v num">' + pctS(S.mk.propRet || 0) + "</span></div></div></div></div>";
  };

  openModal('<div class="gcard"><div class="gcard-h"><span class="ic">📈</span><div><div class="kind">Markets · age ' + S.age + '</div><h2>Where your money can sit</h2></div></div>' +
    '<div class="gcard-b" id="mktbody">' +
    '<div class="facts mb">' + fact("Cash", money(S.p.cash)) + fact("Invested", money(invTotal())) +
      fact("Paid for it", money(invBasis())) + fact("Profit / loss", totalPLText()) +
      fact("Paying you", money(inc.paid) + "/mo") + fact("Cash in the bank earns", pct(depositRate())) +
      fact("Inflation last year", pct(S.econ.infl)) + fact("Policy rate", pct(S.econ.rate, 2)) + "</div>" +
    '<p class="hint mb">Prices move every year. When something is <b class="pos">cheaper than usual</b>, the same money buys more of it — and more of what it pays. Nothing says it cannot get cheaper still.</p>' +

    (yrs >= 3 ? '<div class="panel mb"><div class="panel-h"><h3>Since you were eighteen</h3>' +
      '<span class="hint">what $100 left in each became, payouts reinvested</span></div><div class="panel-b">' +
      '<div id="combo">' + combinedChart(560, 130) + "</div>" +
      '<div class="legend mt-s">' + CHART_KEYS.map(k =>
        '<label class="lgchk"><input type="checkbox" data-ck="' + k + '"' + (chartOff[k] ? "" : " checked") + '>' +
        '<i style="width:14px;height:3px;border-radius:2px;background:' + (k === "cpi" ? "repeating-linear-gradient(90deg," + chartColour(k) + " 0 3px,transparent 3px 6px)" : chartColour(k)) + '"></i>' +
        (k === "cpi" ? "prices (inflation)" : chartName(k)) + "</label>").join("") + "</div>" +
      '<div class="hint mt-s">Anything below the dotted line has lost purchasing power, whatever its number says.</div>' +
      "</div></div>" : "") +

    INV_KEYS.map(row).join("") + propRow() +

    '<div class="hint mt">Averages look backwards. They are what has happened, not what will.</div>' +
    '<div class="btn-row mt"><button class="btn primary big grow" id="mclose">Done</button></div>' +
    "</div></div>");

  document.querySelectorAll("#mktbody [data-ck]").forEach(c => {
    c.onchange = () => { chartOff[c.dataset.ck] = !c.checked; el("combo").innerHTML = combinedChart(560, 130); };
  });
  document.querySelectorAll("#mktbody [data-buy]").forEach(b => {
    b.onclick = () => tradePanel(b.dataset.buy, "buy", () => openMarkets(fromTile, back));
  });
  document.querySelectorAll("#mktbody [data-sell]").forEach(b => {
    b.onclick = () => tradePanel(b.dataset.sell, "sell", () => openMarkets(fromTile, back));
  });
  el("mclose").onclick = () => { closeModal(); saveAuto(); screenBoard(); if (back) back(); };
}

function totalPLText(){
  const v = invTotal(), b = invBasis();
  return b > 0 ? moneyS(Math.round(v - b)) + " (" + pctS(v / b - 1) + ")" : "—";
}

/* buy or sell whole units of one thing. You type dollars; it shows the units that buys. */
function tradePanel(k, dir, back){
  const m = INSTR[k], buying = dir === "buy";
  const px = buying ? buyPrice(k) : sellPrice(k);
  const maxUnits = buying ? Math.floor(Math.max(0, Math.min(S.p.cash, k === "ssb" ? ssbRoom() : Infinity)) / px) : units(k);
  const ch = cheapness(k);
  const nom = avgReturn(k, 10), real = realAvgReturn(k, 10);

  openModal('<div class="gcard"><div class="gcard-h"><span class="ic">' + (buying ? "➕" : "➖") + '</span><div><div class="kind">' +
      (buying ? "Buying" : "Selling") + " · age " + S.age + "</div><h2>" + m.name + "</h2></div></div>" +
    '<div class="gcard-b" id="tradebody">' +
    (buying && k === "ssb" ? ruleBadges([[ssbRoom() > 0 ? "amber" : "red", ssbRoom() > 0 ? "⏳" : "⛔", "Savings Bonds: " + money(ssbRoom()) + " of room left under the $200,000 cap"]]) : "") +
    '<div class="facts mb">' + fact("Price", fmtPrice(k) + " " + m.unit) +
      fact(buying ? "You pay, with costs" : "You get, after costs", fmtPrice(k, px)) +
      fact("Cheap or dear?", ch ? ch.word : "price does not move") +
      fact("What it pays", yieldText(k)) +
      fact(buying ? "Cash available" : "You hold", buying ? money(S.p.cash) : fmtUnits(k, units(k)) + " · " + money(hv(k))) +
      (buying ? "" : fact("You paid", money(basisOf(k))) + fact("Profit / loss", plText(k))) +
      fact("10y return", nom === null ? "—" : pctS(nom)) + fact("After inflation", real === null ? "—" : pctS(real)) + "</div>" +
    (ch ? '<div class="hint mb">' + ch.why.replace(/^./, c => c.toUpperCase()) + ".</div>" : "") +
    '<div class="mchart mb">' + lineChart(S.mk.pxHist[k].slice(-16), chartColour(k), 480, 80) + "</div>" +
    '<div class="flexrow mb"><input id="tamt" class="btn" style="width:150px;font-family:var(--mono)" placeholder="$ amount" inputmode="numeric">' +
      '<button class="btn" data-frac="0.25">25%</button><button class="btn" data-frac="0.5">50%</button>' +
      '<button class="btn" data-frac="1">All</button></div>' +
    '<div class="hint mb num" id="tprev">&nbsp;</div>' +
    '<div class="hint mb" id="tnote">' + (buying
      ? (k === "ssb" ? "You can hold up to $200,000 of Savings Bonds; room left: " + money(ssbRoom()) + ". " : "") +
        "Bought in whole " + unitWord(k) + "s. Money moved here leaves your cash today and is worth whatever this is worth when you need it."
      : "Selling turns whatever it is worth today into cash. If it is down, the loss stops being on paper.") + "</div>" +
    '<div class="btn-row"><button class="btn primary big grow" id="tgo">' + (buying ? "Buy" : "Sell") + "</button>" +
      '<button class="btn" id="tback">Back</button></div>' +
    "</div></div>");

  const unitsFor = amt => {
    const n = buying ? Math.floor(amt / px + 1e-9) : Math.min(units(k), Math.ceil(amt / px - 1e-9));
    return Math.max(0, Math.min(n, maxUnits));
  };
  const preview = () => {
    const amt = parseFloat(el("tamt").value) || 0, n = unitsFor(amt);
    el("tprev").textContent = n > 0 ? (buying ? "Buys " : "Sells ") + fmtUnits(k, n) + " at " + fmtPrice(k, px) + " = " + money(n * px)
      : amt ? "Not enough for one " + unitWord(k) + "." : " ";
  };
  const run = () => {
    const n = unitsFor(parseFloat(el("tamt").value) || 0);
    if (!n){ el("tnote").textContent = "Enter an amount that covers at least one " + unitWord(k) + "."; return; }
    let msg;
    if (buying){
      const c = buyUnits(k, n);
      msg = "Bought " + fmtUnits(k, n) + " of " + m.short + " at " + fmtPrice(k, px) + " — " + money(c) + (ch && ch.score > 0 ? ", " + ch.word.toLowerCase() : "") + ".";
    } else {
      const r = sellUnits(k, n);
      msg = "Sold " + fmtUnits(k, n) + " of " + m.short + " for " + money(r.got) + " — " + (r.got >= r.paid ? "a gain of " : "a loss of ") +
        money(Math.abs(r.got - r.paid)) + " (" + pctS(r.paid > 0 ? r.got / r.paid - 1 : 0) + ") on what it cost.";
    }
    lg(msg);
    saveAuto();
    back();
  };
  el("tamt").oninput = preview;
  document.querySelectorAll("#tradebody [data-frac]").forEach(b => {
    b.onclick = () => {
      const f = parseFloat(b.dataset.frac), n = buying || f < 1 ? Math.floor(maxUnits * f) : maxUnits;
      el("tamt").value = n > 0 ? (Math.ceil(n * px * 100) / 100).toFixed(2) : 0;
      preview();
    };
  });
  el("tgo").onclick = run;
  el("tback").onclick = back;
}

/* ============================================================
   23. WHERE YOU LIVE — the screens (rules are in c_home.js)
   ============================================================ */
function openHome(done){
  const back = () => openHome(done);
  const close = () => { closeModal(); saveAuto(); screenBoard(); if (done) done(); return null; };
  const p = S.a.property;
  const facts = [["Where you live", homeWhere()], ["Housing cost", money(livingCosts().housing) + "/mo"],
                 ["Your cash", money(S.p.cash)], ["CPF Ordinary", money(S.cpf.oa)]];
  if (p){
    const sp = saleSplit(p.value);
    facts.push([p.rentOut ? "Your property (let out)" : "Your property", kmoneyT(p.value)]);
    facts.push(["Lease", leaseText(leaseLeft(p))]);
    facts.push(["Loan left", money(mortgageBal())]);
    facts.push(["If sold today", money(sp.cash) + " cash" + (sp.cpf ? " + " + kmoney(sp.cpf) + " to CPF" : "")]);
    facts.push([HOME_TYPES[homeType()].name + ", held", yearsOwned() + (yearsOwned() === 1 ? " year" : " years")]);
    const ssd = ssdFor(homeType(), yearsOwned(), p.value);
    facts.push(["Can sell", mopLeft() ? "in " + mopLeft() + (mopLeft() === 1 ? " year" : " years") : ssd ? "now, with " + kmoney(ssd) + " Seller's Stamp Duty" : "now"]);
  }
  const ex = extraProps();
  if (ex.length){
    facts.push(["Other property", ex.length + " · " + kmoney(extraValue())]);
    facts.push(["Rent from them", money(extraRent()) + "/mo"]);
  }
  const lockNote = () => (homeType() === "ec" ? "An executive condominium" : "An HDB flat") + " must be lived in for " + ((p && p.mop) || 5) + " years first — " + mopLeft() + " to go.";

  const choices = [];
  choices.push({ t: "Rent somewhere", d: livingInOwnHome()
      ? "You would have to let your home out, or sell it, first."
      : "See what is available this year.",
    can: () => !livingInOwnHome(), go: () => { openRentList(back, close); return null; } });

  if (!p || S.p.bto)
    choices.push({ t: S.p.bto ? "Your BTO flat" : "Apply for a new BTO flat", d: S.p.bto ? (S.p.bto.stage === "applied" ? "Application in; the ballot is drawn each year." : "Keys at about " + S.p.bto.keys + ".")
        : (btoBlock() || "Far cheaper than resale, and grants on top. A ballot, then three to five years of waiting."),
      go: () => { openBTO(back, close); return null; } });
  if (livingInOwnHome()){
    const sr = spareRooms();
    if (S.p.lodger) choices.push({ t: "Stop renting out the room", d: "The " + money(S.p.lodger.rent) + "/mo stops. Your home is yours again.",
      go: () => { endLodger(); return "The lodger has gone. The toilet seat is always down now. Paradise."; } });
    else choices.push({ t: "Rent out a spare room", d: sr > 0 ? "About " + money(lodgerAsking()) + "/mo, taxed as income. A stranger in the kitchen: less privacy, and your household will feel it."
        : "No spare bedroom: you need every one of them.",
      can: () => sr > 0, go: () => { const r = takeLodger(); return "Room let at " + money(r) + "/mo. The lodger seems nice. They all seem nice at the viewing."; } });
  }

  if (S.p.housingMode === "rent" && !p && !dependents())
    choices.push({ t: "Move back in with your family", d: "Rent stops. You give your parents a monthly allowance instead." + (S.p.partner ? " Your partner will not love it." : ""),
      go: () => { S.p.housingMode = "family"; S.p.rent = 0; tl(S.age, "Moved back in with family."); return "You moved back home."; } });

  if (!p)
    choices.push({ t: "Buy a condo to rent out", d: "HDB flats cannot be bought to let. You keep living where you are; a tenant pays part of the loan." + (S.p.bto ? " " + btoBuyNote() : ""),
      go: () => { openBuyList(back, close, null, true); return null; } });
  else {
    const blk = extraBlock(), owned = propCount();
    choices.push({ t: "Buy another property to rent out", d: blk || "Private only. Additional Buyer's Stamp Duty " + Math.round(absdRate(owned) * 100) + "% of the price, a loan of at most " +
        Math.round(ltvFor(housingLoanCount()) * 100) + "%, the rest in cash.",
      can: () => !blk, go: () => { openBuyList(back, close, null, true); return null; } });
  }
  for (const x of ex){
    const ssd = ssdFor("private", extraHeld(x), x.value), owe = extraLoanBal(x), net = Math.round(x.value * (1 - SELL_COST) - ssd - owe);
    choices.push({ t: "Sell " + x.n.toLowerCase(), cost: kmoney(x.value),
      d: "Let at " + money(x.rentIncome) + "/mo. " + money(net) + " in cash after its loan and the agent" +
        (ssd ? ", and " + money(ssd) + " Seller's Stamp Duty for selling within four years" : "") + ". Bought for " + kmoney(x.basis) + ".",
      go: () => { const got = sellExtra(x, x.value); return "Sold. " + money(got) + " came back in cash."; } });
  }

  choices.push({ t: p ? "Sell and buy somewhere else" : "Buy a home",
    d: p && !canSellNow() ? lockNote() : "See what is on the market this year." + (S.p.bto ? " " + btoBuyNote() : ""),
    can: () => !p || canSellNow(), go: () => { openBuyList(back, close); return null; } });

  if (p){
    const sp = saleSplit(p.value);
    choices.push({ t: livingInOwnHome() ? "Sell and move out" : "Sell the property",
      d: canSellNow() ? money(sp.cash) + " in cash after the loan and agent" + (ssdFor(homeType(), yearsOwned(), p.value) ? " and Seller's Stamp Duty" : "") +
        (sp.cpf ? ", and " + money(sp.cpf) + " back into your CPF." : ".") : lockNote(),
      can: canSellNow, go: () => { const got = sellHome(p.value); return "Sold. " + money(got) + " came back in cash; the loan is cleared." + (S.p.housingMode === "rent" ? " You are renting at " + money(S.p.rent) + "/mo." : ""); } });
    if (livingInOwnHome())
      choices.push({ t: "Let it out and rent elsewhere", d: canLetNow() ? "About " + money(rentFor(homeType(), p.value)) + "/mo from a tenant. You pay rent somewhere else."
          : p.noLet ? "A Prime flat can never be let out whole." : (homeType() === "ec" ? "An executive condominium" : "An HDB flat") + " cannot be let out whole until its " + (p.mop || 5) + " years are up.",
        can: canLetNow, go: () => { openRentList(back, close, true); return null; } });
    if (p.rentOut)
      choices.push({ t: "Move back into your property", d: "The tenant leaves. Your rent stops, and so does theirs.",
        go: () => { p.rentOut = false; p.rentIncome = 0; S.p.housingMode = "own"; S.p.rent = 0; tl(S.age, "Moved back into your own property."); return "You moved back in."; } });
  }
  choices.push({ t: "Stay as you are", d: "", esc: true, go: close });

  renderCard({ icon: "🏠", kind: "Where you live · age " + S.age, title: "Your home",
    lede: "Where you live is the biggest line in most budgets. You can move whenever you like, but an HDB flat or executive condominium must be lived in for five years before it can be sold or let out, and private property sold within four years pays Seller's Stamp Duty.",
    facts, choices,
    badges: [p && mopLeft() ? ["amber", "🔒", "Cannot sell" + (homeType() === "private" ? "" : " or let out") + " until age " + (S.age + mopLeft()) + " — the minimum holding period"] : null,
      p && !mopLeft() && ssdFor(homeType(), yearsOwned(), p.value) ? ["amber", "⚠️", "Sell now and pay " + money(ssdFor(homeType(), yearsOwned(), p.value)) + " Seller's Stamp Duty"] : null,
      S.p.btoBar && S.age < S.p.btoBar ? ["red", "⛔", "No new BTO application until age " + S.p.btoBar] : null]
  }, () => { if (done) done(); });
}

function openRentList(back, close, letOut){
  const list = rentMarket();
  const choices = list.map(o => ({
    t: o.n, cost: money(o.rent) + "/mo", d: "One month's deposit and one month in advance: " + money(o.rent * 2) + ".",
    can: () => S.p.cash >= o.rent * 2 && (S.p.housingMode !== "rent" || o.rent !== S.p.rent),
    go: () => {
      S.p.cash -= o.rent * 2;
      if (letOut){ const pr = S.a.property; pr.rentOut = true; pr.rentIncome = rentFor(pr.type, pr.value); tl(S.age, "Let your home out."); }
      S.p.housingMode = "rent"; S.p.rent = o.rent;
      tl(S.age, "Moved — rent " + money(o.rent) + "/mo.");
      return "Moved in. Rent " + money(o.rent) + "/mo, rising with prices." + (letOut ? " Your tenant pays " + money(S.a.property.rentIncome) + "/mo." : "");
    }
  }));
  if (back) choices.push({ t: "Back", d: "", esc: true, go: () => { back(); return null; } });
  renderCard({ icon: "🔑", kind: "Renting · age " + S.age, title: letOut ? "Let your home out and move" : "Places to rent",
    lede: "Rents rise with prices every year. Most singles here rent a room rather than a whole flat — a whole flat costs about three times as much.",
    facts: [["Your cash", money(S.p.cash)], ["Spare each month", moneyS(netCashflow())], ["Rent now", S.p.housingMode === "rent" ? money(S.p.rent) + "/mo" : "—"]],
    choices }, () => close());
}

/* the market this year. extra: an additional choice (e.g. "keep renting" in Chapter One).
   invest: buying to let — as your first property, or as another one on top of your home */
function openBuyList(back, close, extra, invest){
  const had = invest ? null : S.a.property;
  const addOn = invest && !!S.a.property;                 /* a further property: ABSD, lower LTV, cash */
  const sale = had ? saleSplit(had.value) : { cash: 0, cpf: 0 };
  const rates = mortgageRates();
  const owned = addOn ? propCount() : extraProps().length; /* what you will still own when this one is bought */
  const aRate = absdRate(owned);
  const list = homeMarket().filter(l => !invest || l.type === "private");
  const choices = list.map(l => {
    const hdb = l.type === "hdb", ec = l.type === "ec";
    const g = hdbGrant(l);
    const absd = Math.round(l.price * aRate);
    const levy = ec ? resaleLevy() : 0;
    const fees = buyCosts(l.price) + absd + levy;
    const pt = S.p.partner ? ptState() : null;
    const ptCash = pt ? ptLiquid() + (sale.ptCash || 0) : 0, ptOa = pt ? pt.oa + (sale.ptCpf || 0) : 0;
    const funds = addOn ? S.p.cash + ptCash : S.p.cash + sale.cash + S.cpf.oa + sale.cpf + g.total + ptCash + ptOa;
    /* the full-LTV loan if it works, otherwise the longer loan at the lower LTV */
    const plans = buyPlans(l, addOn).map(pl => {
      const upfront = Math.round(l.price * (1 - pl.ltv)) + fees;
      const cashNeed = addOn ? upfront : Math.round(l.price * pl.cashShare) + absd + levy;
      const cashOk = S.p.cash + sale.cash + ptCash >= cashNeed, loanOk = pl.limit + funds >= l.price + fees;
      return { ...pl, upfront, cashNeed, cashOk, loanOk, ok: funds >= upfront && cashOk && loanOk };
    });
    const best = plans.find(x => x.ok) || plans[0];
    const wait = hdb ? hdbWaitOut(l, !!had && had.type === "private") : 0;
    const silver = hdb && had ? silverBonus(l, had.value) : 0;
    const block = hdb ? (extraProps().length ? "You own private property: an HDB flat cannot be bought until it is sold. "
        : !hdbEligible() ? "Singles can buy HDB only from 35. "
        : wait ? (had && had.type === "private" ? "Private owners must sell and wait 15 months before buying an HDB resale flat (from 55, a 4-room flat or smaller is exempt). Sell first, then buy from age " + (S.age + wait) + ". "
                 : "You sold private property recently: the 15-month wait ends at age " + (S.age + wait) + ". ") : "")
      : ec ? (!S.p.partner ? "Only couples and families can buy an executive condominium. "
        : householdIncome() > EC_CEILING * S.econ.cpi ? "Household income is over the " + money(Math.round(EC_CEILING * S.econ.cpi)) + " ceiling for an executive condominium. "
        : extraProps().length || (had && had.type === "private") ? "Private property owners must sell and wait 30 months before buying an executive condominium. "
        : had && had.type === "ec" ? "A new executive condominium can be bought only once. " : "")
      : "";
    return {
      t: l.n, cost: money(l.price),
      d: (todayMoney(l.price) ? todayMoney(l.price).replace("≈", "About") + ". " : "") + leaseText(l.left).replace(/^./, c => c.toUpperCase()) + (l.left < 999 && S.age < 65 ? " (" + Math.max(0, l.left - (65 - S.age)) + " by the time you are 65" + (l.left - (65 - S.age) < 40 ? " — old leases lose value fast" : "") + ")" : "") + ". " +
         (block ? block : "") + (block ? "" : (hdb ? "Five years before you can sell. " : ec ? "Five years before you can sell or let it; a bank loan, and the 30% limit on income. " : "Seller's Stamp Duty if sold within four years. ") +
         (absd ? "Additional Buyer's Stamp Duty " + money(absd) + " (" + Math.round(aRate * 100) + "%). " : "") +
         (levy ? "Resale levy " + money(levy) + ", in cash, as a second-timer. " : "") +
         "Deposit and stamp duty: " + money(best.upfront) + (addOn ? " — all of it in cash" : best.cashNeed ? " (at least " + money(best.cashNeed) + " in cash)" : " (all payable from CPF)") + "." +
         (best.long && best.ok ? " Only on a " + best.term + "-year loan, which runs past 65" + (best.term > 30 ? " or over 30 years" : "") + ": banks lend at most " + Math.round(best.ltv * 100) + "%." : "") +
         (addOn ? " Let out at about " + money(rentFor(l.type, l.price)) + "/mo." : "") +
         (g.total && !invest ? " First-timer grants: " + money(g.total) + " into your CPF." : "") +
         (silver && !block ? " Silver Housing Bonus: put " + money(silver * 2) + " of the sale into CPF and get " + money(silver) + " in cash." : "") +
         (hdb && !block && hdbLoanBarred(!!had && had.type === "private") ? " No HDB loan within 30 months of owning private property: a bank loan only." : "") +
         (!best.loanOk ? " Your income will not support the loan." : "")),
      can: () => best.ok && !block,
      go: function buyIt(){
        /* a BTO in play: say what buying this costs first, then carry straight on */
        if (S.p.bto){ btoGuard("a " + l.n.replace(/^./, c => c.toLowerCase()), () => buyIt(), () => openBuyList(back, close, extra, invest)); return null; }
        if (invest){
          chooseHomeFinancing({ l, letOut: true, addOn, absd, onCancel: () => openBuyList(back, close, extra, invest),
            onDone: res => outcomeCard("🏠", "An investment property", res.summary, () => { if (close) close(); }) });
          return null;
        }
        chooseHomeFinancing({ l, cashIn: sale.cash, cpfIn: sale.cpf, ptCashIn: sale.ptCash || 0, ptCpfIn: sale.ptCpf || 0, grant: g, absd, levy, silver, noHdbLoan: hdb && hdbLoanBarred(!!had && had.type === "private"),
          pre: had ? () => sellHome(had.value, "Sold the old place") : null,
          onCancel: () => openBuyList(back, close, extra),
          onDone: res => outcomeCard("🏠", "A new home", res.summary, () => { if (close) close(); }) });
        return null;
      }
    };
  });
  if (extra) choices.push(extra);
  if (back) choices.push({ t: "Back", d: "", esc: true, go: () => { back(); return null; } });
  renderCard({ icon: "🏘️", kind: "Buying · age " + S.age, title: addOn ? "Another property to let" : "On the market this year",
    lede: addOn ? "A second home is an investment, and taxed as one: Additional Buyer's Stamp Duty of " + Math.round(aRate * 100) + "% of the price, a loan of at most " +
        Math.round(ltvFor(housingLoanCount()) * 100) + "%, and the rest in cash. The rent comes in; so do maintenance, property tax at the higher rate, and empty months."
      : "Loans cover at most 75% of the price. The other 25%, and the stamp duty, can come from your CPF Ordinary Account — a bank loan needs 5% in cash. How much anyone will lend depends on your income. A loan that runs past 65, or longer than 30 years, gets at most 55%." +
        (owned ? " You own other property, so this purchase pays Additional Buyer's Stamp Duty and a smaller loan." : ""),
    facts: [["Your cash", money(S.p.cash)], ["CPF Ordinary", money(S.cpf.oa)],
            ...(S.p.partner ? [["Partner's cash + CPF OA", money(ptState().cash) + " + " + kmoney(ptState().oa)]] : []),
            had ? ["From selling yours", money(sale.cash) + " + " + kmoney(sale.cpf) + " CPF"] : ["Household income", money(householdIncome()) + "/mo"],
            ["HDB loan", pct(rates.hdb, 2) + " fixed"], ["Bank loan now", pct(rates.bankNow, 2)], ["Bank, 10-yr average", pct(rates.bankAvg, 2)],
            ["HDB", hdbEligible() ? "eligible" : "not yet"], ...priceFacts()],
    choices }, () => close());
}

/* ---------- how you pay for a home ---------- */
function chooseHomeFinancing(o){
  const l = o.l, price = l.price, hdbFlat = l.type === "hdb";
  const cashFees = (o.absd || 0) + (o.levy || 0);           /* stamp duty on further homes and the resale levy: cash only */
  const fees = buyCosts(price) + cashFees;
  const grant = o.letOut ? 0 : (o.grant ? o.grant.total : 0);
  /* the least you can put down follows how many other housing loans you would still have, and how long this one runs */
  const others = o.addOn ? housingLoanCount() : housingLoanCount() - (S.loans.some(isMortgage) ? 1 : 0);
  let kind = hdbFlat && !o.noHdbLoan ? "hdb" : "home", term, down, fixed = false, cpfDown = !o.addOn, cpfMonthly = !o.addOn;
  /* married: the partner's share of the down payment and of each repayment, starting at their fair share */
  const pt = S.p.partner ? ptState() : null;
  const fairNow = pt ? Math.round(fairPt() * 20) / 20 : 0;
  let ptD = fairNow, ptL = fairNow, ptAuto = !!pt;   /* until the player picks, fall back to what the partner can actually pay */
  const shareOpts = () => [...new Set([0, 0.25, 0.5, 0.75, 1, fairNow])].sort((a, b) => a - b);
  const long = () => longLoan(term, l.type);
  const minDownNow = () => Math.round((1 - ltvFor(others, long())) * 100) / 100;
  const downsNow = () => { const m = minDownNow(); return [m].concat([0.25, 0.3, 0.4, 0.45, 0.5, 0.6, 0.75, 1].filter(d => d > m)); };
  /* start at the smallest down payment your income will actually support: on the full-LTV loan
     if it can, otherwise on the longest loan at the lower LTV */
  const fits = () => { const lim = maxHomeLoan(o.addOn ? "extra" : kind, price, term, l.type); return downsNow().find(d => price * (1 - d) <= lim); };
  term = fullLtvTerm(kind, l.type); down = fits();
  if (down === undefined){
    const lt = maxTerm("home", l.type);
    if (longLoan(lt, l.type)){ const was = [kind, term]; kind = "home"; term = lt; down = fits(); if (down === undefined) [kind, term] = was; }
  }
  if (down === undefined) down = 1;

  const render = () => {
    term = Math.min(term, maxTerm(kind, l.type));
    const minDown = minDownNow(), downs = downsNow();
    if (down < minDown) down = minDown;
    const full = fullLtvTerm(kind, l.type);
    const terms = [10, 15, 20, 25, 30, 35].filter(t => t <= maxTerm(kind, l.type));
    for (const t of [term, full, maxTerm(kind, l.type)]) if (!terms.includes(t)) terms.push(t);
    const loan = Math.round(price * (1 - down));
    const q = quoteLoan(kind, loan, term, fixed);
    const limit = maxHomeLoan(o.addOn ? "extra" : kind, price, term, l.type);
    const upfront = Math.round(price * down) + fees;
    const cashShare = minCashShare(others, long());
    const cashMin = o.addOn ? upfront : (kind === "home" && down < 1 ? Math.round(price * cashShare) : 0) + cashFees;
    const oaAvail = S.cpf.oa + (o.cpfIn || 0) + grant;
    /* each pays their part of the up-front money: CPF first where allowed, the rest in cash */
    const ptPart = pt ? Math.round(upfront * ptD) : 0, myPart = upfront - ptPart;
    const ptCashMin = Math.round(cashMin * ptD), myCashMin = cashMin - ptCashMin;
    const ptOaAvail = pt ? pt.oa + (o.ptCpfIn || 0) : 0, ptCashAvail = pt ? ptLiquid() + (o.ptCashIn || 0) : 0;
    const ptFromCpf = pt && cpfDown ? Math.max(0, Math.min(ptOaAvail, ptPart - ptCashMin)) : 0;
    const ptFromCash = ptPart - ptFromCpf;
    const fromCpf = Math.max(0, Math.min(cpfDown ? oaAvail : grant, myPart - myCashMin));
    const fromCash = myPart - fromCpf;
    const cash = S.p.cash + (o.cashIn || 0);
    if (ptAuto && ptFromCash > ptCashAvail && ptD > 0){ ptD = shareOpts().filter(v => v < ptD).pop() || 0; return render(); }
    const cashOk = cash >= fromCash && ptFromCash <= ptCashAvail, loanOk = loan <= limit;
    const myMonthly = Math.round(q.monthly * (1 - ptL)), ptMonthly = q.monthly - myMonthly;
    const oaInflow = Math.round(cpfWage() * cpfRates(S.age).oa);
    const oaLeft = oaAvail - fromCpf;
    const cpfCovers = !loan || !cpfMonthly ? 0 : oaLeft >= myMonthly * 12 ? myMonthly : Math.min(myMonthly, oaInflow);
    const rates = mortgageRates();
    const pill = (label, on, attr, val) => '<button class="opt' + (on ? " on" : "") + '" data-' + attr + '="' + val + '"><span class="opt-n">' + label + "</span></button>";
    const row = (k, v, cls) => '<div class="row"><div class="l">' + k + '</div><div class="v ' + (cls || "") + '">' + v + "</div></div>";

    openModal('<div class="gcard"><div class="gcard-h"><span class="ic">🏦</span><div><div class="kind">How you will pay for it</div><h2>' + esc(l.n) + "</h2></div></div>" +
      '<div class="gcard-b" id="finbody">' +
      '<div class="facts mb">' + fact("Price", moneyT(price)) + fact("Stamp duty and legal", money(fees)) +
        fact("Your cash", money(cash)) + fact("CPF Ordinary", money(oaAvail) + (grant ? " incl. grants" : "")) +
        fact("Household income", money(householdIncome()) + "/mo") + fact("Most they will lend", money(limit)) + "</div>" +

      '<div class="dial"><div class="dial-h"><span class="dial-n">Down payment</span><span class="dial-v num">' + money(Math.round(price * down)) + " · " + Math.round(down * 100) + "%</span></div>" +
        '<div class="dial-opts">' + downs.map(d => pill(d === 1 ? "100% — no loan" : Math.round(d * 100) + "%", d === down, "down", d)).join("") + "</div>" +
        '<div class="hint">' + Math.round(minDown * 100) + "% is the least you can put down" + (others ? ", because you would have " + (others === 1 ? "another housing loan" : others + " other housing loans") : "") + (long() ? (others ? ", and" : ",") + " because the loan runs past 65 or over " + (l.type === "hdb" ? 25 : 30) + " years" : "") +
        ". More down means a smaller loan and far less interest, and less left for anything else.</div></div>" +

      (down < 1 ?
      (hdbFlat && !o.noHdbLoan ? '<div class="dial"><div class="dial-h"><span class="dial-n">Which loan</span><span class="dial-v num">' + pct(q.rate, 2) + "</span></div>" +
        '<div class="dial-opts">' + pill("HDB loan · " + pct(rates.hdb, 2) + " fixed", kind === "hdb", "kind", "hdb") +
          pill("Bank loan · " + pct(rates.bankNow, 2) + " now", kind === "home", "kind", "home") + "</div>" +
        '<div class="hint">The HDB rate does not move with the market. A bank loan is cheaper when rates are low and dearer when they rise — over the last ten years it has averaged ' + pct(rates.bankAvg, 2) + ".</div></div>" : "") +

      (kind === "home" ? '<div class="dial"><div class="dial-h"><span class="dial-n">Bank rate</span><span class="dial-v num">' + pct(q.rate, 2) + "</span></div>" +
        '<div class="dial-opts">' + pill("Floating · " + pct(rates.bankNow, 2), !fixed, "fixed", "0") + pill("Fixed · " + pct(rates.bankNow + 0.006, 2), fixed, "fixed", "1") + "</div>" +
        '<div class="hint">Today ' + pct(rates.bankNow, 2) + ", ten-year average " + pct(rates.bankAvg, 2) + ". Floating follows SORA; fixed costs more now and does not move.</div></div>" : "") +

      '<div class="dial"><div class="dial-h"><span class="dial-n">Loan length</span><span class="dial-v num">' + term + " years</span></div>" +
        '<div class="dial-opts">' + terms.sort((a, b) => a - b).map(t => pill(t + " years", t === term, "term", t)).join("") + "</div>" +
        '<div class="hint">Longer means a smaller monthly payment and more interest in total. ' + (kind === "hdb" ? "HDB lends for at most 25 years, ending by 65." : "Up to " + full + " years keeps the full loan. Longer, or past 65, and banks lend 20 points less of the price and want " + Math.round(minCashShare(others, true) * 100) + "% in cash; they want it repaid by 75.") + "</div></div>" : "") +

      (pt ? '<div class="dial"><div class="dial-h"><span class="dial-n">Your partner pays</span><span class="dial-v num">fair by income: ' + pct(fairPt(), 0) + "</span></div>" +
        '<div class="hint mb-s">Of the down payment: ' + money(ptPart) + " (" + (ptFromCpf ? kmoney(ptFromCpf) + " CPF + " : "") + money(ptFromCash) + " cash). They have " + money(ptCashAvail) + " cash and " + kmoney(ptOaAvail) + " in CPF.</div>" +
        '<div class="dial-opts">' + shareOpts().map(v => pill(pct(v, 0) + (v === fairNow ? " · fair" : ""), v === ptD, "ptd", v)).join("") + "</div>" +
        (down < 1 ? '<div class="hint mb-s">Of each monthly repayment: ' + money(ptMonthly) + "</div>" +
          '<div class="dial-opts">' + shareOpts().map(v => pill(pct(v, 0) + (v === fairNow ? " · fair" : ""), v === ptL, "ptl", v)).join("") + "</div>" : "") +
        '<div class="hint">What each puts in is what each gets back if it is sold. Fair is each paying in line with their share of the household\'s income. ' +
          (Math.max(ptD, ptL) - fairPt() > 0.15 ? "<b>Your partner would be carrying well over their share. They will resent it, every year the loan runs.</b>"
            : Math.min(ptD, ptL) - fairPt() < -0.25 ? "<b>You would be carrying far more than your share. It will wear on you.</b>" : "This is about even.") + "</div></div>" : "") +
      (o.addOn ? '<div class="hint mb">A further property is paid in cash here; your CPF stays for your home and retirement.</div>' :
      '<div class="dial"><div class="dial-h"><span class="dial-n">Use your CPF</span></div>' +
        '<div class="dial-opts">' + pill("CPF for the down payment", cpfDown, "cpfd", cpfDown ? "0" : "1") +
          (down < 1 ? pill("CPF for the monthly payments", cpfMonthly, "cpfm", cpfMonthly ? "0" : "1") : "") + "</div>" +
        '<div class="hint">CPF spent on a home comes back to your Ordinary Account, with the interest it would have earned, when you sell — out of the sale money, before you see any cash.</div></div>') +

      '<div class="rows mb">' +
        row("Paid up front", money(upfront)) +
        row((pt ? "— your CPF" : "— from CPF") + (grant ? " (incl. " + money(grant) + " grants)" : ""), money(fromCpf)) +
        row(pt ? "— your cash" : "— from cash", money(fromCash), cash >= fromCash ? "" : "neg") +
        (pt ? row("— partner's CPF", money(ptFromCpf)) + row("— partner's cash", money(ptFromCash), ptFromCash <= ptCashAvail ? "" : "neg") : "") +
        (down < 1 ? row("Loan", money(loan), loanOk ? "" : "neg") +
          row("Monthly repayment", money(q.monthly)) +
          (pt ? row("— your part", money(myMonthly)) + row("— partner's part", money(ptMonthly)) : "") +
          row((pt ? "— your part " : "— of which ") + "CPF pays", money(cpfCovers)) +
          row((pt ? "— your part " : "— of which ") + "cash pays", money(myMonthly - cpfCovers)) +
          row("Interest over the loan", money(q.total - loan), "neg") : "") +
        '<div class="row tot"><div class="l">Cash left afterwards</div><div class="v ' + (cashOk ? "" : "neg") + '">' + money(cash - fromCash) + "</div></div>" +
      "</div>" +
      (!loanOk ? '<p class="neg">On your income they will lend at most ' + money(limit) + ". Put more down, or take a longer loan.</p>" : "") +
      (pt && ptFromCash > ptCashAvail ? '<p class="neg">Your partner does not have ' + money(ptFromCash) + " in cash. Ask them for less, or use more CPF.</p>" : "") +
      (cash < fromCash ? '<p class="neg">You do not have ' + money(fromCash) + " in cash." + (cashMin ? " This loan needs at least " + Math.round(cashShare * 100) + "% of the price in cash" + (cashFees ? ", plus the stamp duty and levy that must be paid in cash." : ".") : "") + "</p>" : "") +
      '<div class="btn-row"><button class="btn primary big grow" id="fgo"' + (cashOk && loanOk ? "" : " disabled") + ">Buy it</button>" +
      '<button class="btn" id="fcancel">Back</button></div></div></div>');

    document.querySelectorAll("#finbody .opt").forEach(b => {
      b.onclick = () => {
        const d = b.dataset;
        if (d.down !== undefined) down = parseFloat(d.down);
        if (d.kind !== undefined){ kind = d.kind; fixed = false; }
        if (d.term !== undefined) term = parseInt(d.term, 10);
        if (d.fixed !== undefined) fixed = d.fixed === "1";
        if (d.cpfd !== undefined) cpfDown = d.cpfd === "1";
        if (d.cpfm !== undefined) cpfMonthly = d.cpfm === "1";
        if (d.ptd !== undefined){ ptD = parseFloat(d.ptd); ptAuto = false; }
        if (d.ptl !== undefined) ptL = parseFloat(d.ptl);
        const keep = scrollBox().scrollTop; render(); scrollBox().scrollTop = keep;
      };
    });
    el("fcancel").onclick = () => { if (o.onCancel) o.onCancel(); else closeModal(); };
    el("fgo").onclick = () => {
      if (o.pre) o.pre();                                   /* the old home is sold first; its CPF is back in the OA */
      S.cpf.oa += grant - fromCpf;
      S.p.cash -= fromCash;
      if (pt){ ptTake(ptFromCash); pt.oa -= ptFromCpf; fairnessAtPurchase(Math.max(ptD, ptL)); }
      S.stats.spend += fees;
      const pid = o.addOn ? "prop-" + S.age + "-" + Math.round(rnd() * 1e6) : null;
      if (loan > 0){ takeLoan(kind, loan, term, kind === "home" && fixed); S.p.cash -= loan; const nl = S.loans[S.loans.length - 1];
        if (pid) nl.propId = pid; if (pt){ nl.pt = ptL; nl.shared = true; } }   /* the loan pays the seller */
      if (grant){ S.p.hdbGrantUsed = true; if (hdbFlat) S.p.subsidisedRooms = l.rooms; }
      if (o.absd) tl(S.age, "Paid " + kmoney(o.absd) + " in Additional Buyer's Stamp Duty.");
      if (o.levy) tl(S.age, "Paid a " + kmoney(o.levy) + " resale levy.");
      if (o.silver){ const put = Math.min(o.silver * 2, Math.max(0, S.p.cash)); S.p.cash -= put; S.cpf[raKey()] += put; S.p.cash += Math.round(put / 2);
        tl(S.age, "Right-sized: " + kmoney(put) + " into CPF and a " + kmoney(Math.round(put / 2)) + " Silver Housing Bonus."); }
      if (o.addOn) extraProps().push({ id: pid, n: l.n, type: l.type, tier: l.tier, value: price, basis: price, bought: S.age, left: l.left, rentIncome: rentFor(l.type, price) });
      else S.a.property = { type: l.type, tier: l.tier, value: price, basis: price, bought: S.age, left: l.left, n: l.n,
        rentOut: !!o.letOut, rentIncome: o.letOut ? rentFor(l.type, price) : 0,
        cpfUsed: fromCpf, cpfMonthly: loan > 0 && cpfMonthly, grant, rooms: l.rooms,
        paidMe: fromCpf + fromCash, paidPt: ptFromCpf + ptFromCash, ptCpfUsed: ptFromCpf };
      if (!o.letOut){ S.p.housingMode = "own"; S.p.rent = 0; }
      tl(S.age, "Bought " + l.n.replace(/^./, c => c.toLowerCase()) + " for " + kmoney(price) + (grant ? ", with " + kmoney(grant) + " in grants" : "") + ".");
      const summary = (pt ? "Your partner put in " + money(ptFromCpf + ptFromCash) + " and pays " + pct(ptL, 0) + " of each repayment. You: " : "") +
        "Paid " + money(fromCpf) + " from CPF and " + money(fromCash) + " in cash up front" +
        (loan > 0 ? ", and borrowed " + money(loan) + " at " + pct(q.rate, 2) + " over " + term + " years — " + money(q.monthly) + " a month" +
          (cpfCovers ? ", about " + money(cpfCovers) + " of it from CPF." : ", all of it from cash.") : ". No loan.") +
        (o.letOut ? " Let out at " + money(rentFor(l.type, price)) + "/mo." : "") + (o.absd ? " Additional Buyer's Stamp Duty: " + money(o.absd) + "." : "");
      o.onDone({ summary });
    };
  };
  render();
}

/* the buy-to-let card and the "place on the market" card open these from inside a year */
function buyFromCard(done, letOut){
  const close = () => { closeModal(); saveAuto(); screenBoard(); done(); return null; };
  if (S.p.bto){ btoGuard(letOut ? "a condo to rent out" : "a home", () => buyFromCard(done, letOut), close); return; }
  if (!letOut){ openBuyList(null, close, { t: "Walk away", d: "Nothing says this is the right year.", go: close }); return; }
  const l = homeMarket().find(x => x.type === "private" && x.rooms === 2);
  chooseHomeFinancing({ l, letOut: true, onCancel: close,
    onDone: res => outcomeCard("🏠", "An investment property", res.summary, close) });
}

/* the line under a "buy" option while a BTO is in play */
function btoBuyNote(){
  const b = S.p.bto;
  return b.stage === "applied" ? "Buying cancels your BTO application." : "Buying means giving up your BTO flat and the " + money(btoLoss()) + " paid on it.";
}

/* where prices stand, after inflation, against the year you turned 18 — and whether the
   government is leaning on them */
function priceFacts(){
  const real = k => (S.mk.idx[k] || S.mk.idx.prop) / 100 / S.econ.cpi - 1;
  const w = x => x > 0.12 ? "well above" : x > 0.04 ? "above" : x < -0.12 ? "well below" : x < -0.04 ? "below" : "about";
  const f = [["HDB vs 2025, real", pctS(real("hdb"), 0) + " · " + w(real("hdb"))],
             ["Condos vs 2025, real", pctS(real("prop"), 0) + " · " + w(real("prop"))]];
  if (S.mk.cool > 0) f.push(["Cooling measures", S.mk.cool + (S.mk.cool === 1 ? " more year" : " more years")]);
  return f;
}

/* ============================================================
   24. YOUR CAREER, YOUR COVER — screens open at any time from the board
   (rules live in c_engine.js and d_life.js)
   ============================================================ */

/* where you live, as rows of Your life: the home itself, other property, a BTO on the way */
function homeRows(row){
  const h = S.a.property, b = S.p.bto;
  let rows = row("Living", homeWhere());
  if (h){
    rows += row("Home", kmoneyT(h.value) + " · bought " + kmoney(h.basis) + " at " + h.bought + " · " + leaseText(leaseLeft(h))) + row("Home loan left", money(mortgageBal()));
    if (S.p.partner && (h.paidPt || 0) > 0) rows += row("Partner's share", pct(ptOwnShare(h), 0));
    rows += row("Can sell", mopLeft() ? "in " + mopLeft() + (mopLeft() === 1 ? " year" : " years") : "now");
  }
  if (extraProps().length) rows += row("Other property", extraProps().length + " · " + kmoney(extraValue()) + " · " + money(extraRent()) + "/mo rent");

      d: tenure < 2 ? "Too soon — you need two years in the role first."

        if (passed){ p.salary = Math.round(p.salary * rf(1.05, 1.09)); tl(S.age, "Negotiated a raise — " + money(p.salary) + "/mo."); return "Not a new title, but a raise: " + money(p.salary) + "/mo."; }
        p.passedOver = S.age; p.wellbeing = clamp(p.wellbeing - 3, 0, 100);

      } });
  }
  const courseCost = Math.round(2400 * S.econ.cpi / 100) * 100 - (p.sfUsed ? 0 : 500);
  choices.push({ t: "Take a course", d: p.courseAt === S.age ? "You are already on one this year."
      : "Evenings for a year. One skill goes up; so does your tiredness." + (p.sfUsed ? "" : " Your $500 SkillsFuture credit covers part of it."),
    cost: money(courseCost), can: () => free() && p.courseAt !== S.age && p.cash >= courseCost && !p.disabled,

      } });
  }
  choices.push({ t: p.gig ? "Side work: " + gigById(p.gig.id).n.toLowerCase() : "Take on side work", d: p.gig ? money(p.gig.inc) + "/mo on top. Tiredness builds while it runs." : "Delivery, driving, tuition, a shop, freelance. More money, fewer weekends. Not a career move: you can do it any year.",
    can: () => !p.disabled && !p.abroad, go: () => { openGigs(back, close); return null; } });
  if (cur) choices.push({ t: cur.id === "own" ? "Close the business" : "Resign", d: "Income stops today. Time to rest, study or look properly." + (S.age >= 55 ? " From 55 your CPF Ordinary Account can come out; from 65, CPF LIFE pays." : ""),
    can: () => !p.abroad,
    go: () => { loseJob(cur.id === "own" ? "Closed the business" : "Resigned"); p.burnout = 0; p.wellbeing = clamp(p.wellbeing + 4, 0, 100); return "You have left. No income until you find the next thing."; } });
  choices.push({ t: "Done", d: "", esc: true, go: close });

  renderCard({
    icon: "💼", kind: "Career · age " + S.age, title: "Your career",
    lede: cur ? "Stay and climb, or move and start again somewhere that pays more. Each has a price." : "You can apply for anything below at any time this year.",
    facts, html, choices,
    jobList: block || ftStudy ? [] : jobMarket(), appBadgeShown: true
  }, back);
}
function askMod(nx){
  const p = S.p;
  let m = (p.wellbeing - 60) / 20 + ((p.standing === undefined ? 60 : p.standing) - 60) / 15 + (S.age - p.jobSince >= 4 ? 0.5 : 0);
  if (nx) m += (promoReady(nx) ? 1 : -2) + clamp(relExp(nx) - nx.exp, -3, 3) * 0.4;
  return Math.round(m * 10) / 10;
}
function businessMod(){
  const p = S.p;
  return Math.round((p.skills.comms * 0.4 + p.skills.fin * 0.5 + Math.min(p.exp, 10) * 0.15 - 2) * 10) / 10;
}
function openCourse(back, close, cost){
  const p = S.p;
  const take = (k, name) => ({ t: name, d: "", cost: money(cost),
    go: () => { p.cash -= cost; S.stats.spend += cost; p.skills[k]++; p.burnout++; p.courseAt = S.age; p.sfUsed = true;
      p.moved = { age: S.age, what: "took a course" };
      tl(S.age, "Took a course in " + name.toLowerCase() + "."); return name + " skill is now " + p.skills[k] + "."; } });
  renderCard({ icon: "📘", kind: "Career · age " + S.age, title: "Which course?",
    lede: "Part-time, in the evenings. Employers read skills off your record the same way they read qualifications.",
    facts: [["Technical", p.skills.tech], ["Communication", p.skills.comms], ["Financial sense", p.skills.fin], ["Cost", money(cost)]],
    choices: [take("tech", "Technical"), take("comms", "Communication"), take("fin", "Financial sense"),

}

/* ---------- insurance ---------- */
function openInsurance(done){
  const back = () => openInsurance(done);
  const close = () => { closeModal(); saveAuto(); screenBoard(); if (done) done(); return null; };
  const p = S.p, cpi = S.econ.cpi;
  const conds = activeConditions().length, hasCond = conds > 0 || !!p.hadCritical;
  const shieldNow = shieldQuote(), loadNow = shieldLoadNow();
  const loadTxt = l => l > 1 ? "+" + Math.round((l - 1) * 100) + "%" : "none";
  const facts = [["Hospital plan", p.insured ? money(shieldPrem(S.age)) + "/mo" + (p.shieldLoad > 1 ? " (" + loadTxt(p.shieldLoad) + " loading)" : "") : "MediShield Life only"],
                 ["Critical illness", p.ci ? kmoney(p.ci.sum) + " · " + money(p.ci.prem) + "/mo" : "none"],
                 ["Disability income", p.di ? money(Math.round(p.salary * p.di.rate)) + "/mo" : "none"],
                 ["All premiums", money(insurancePremiums()) + "/mo"], ["MediSave", money(S.cpf.ma)], ["Your age", S.age]];
  /* what waiting costs: the same plan signed now or later, at the health you have today */

  const nextLoad = shieldLoadNow(S.age + 1);
  const html = ruleBadges([
      !p.insured ? ["amber", "⏳", "Hospital plan loading if you sign today: " + loadTxt(loadNow) + " — " + loadTxt(nextLoad) + " next year, locked in for life"] : null,
      p.hadCritical ? ["red", "⛔", "Critical illness cover: declined after a critical illness"] : conds && !p.ci ? ["amber", "⚠️", "Critical illness cover loaded " + conds * 50 + "% for your health record"] : null,
      S.age >= 60 && !p.ci ? ["red", "⛔", "Critical illness and disability cover are not sold past 60"] : null]) +
    '<div class="hint mb" style="text-transform:uppercase;letter-spacing:1.2px">Hospital plan: what you pay if you sign at… (today\'s money)</div>' +
    '<div class="facts mb">' + waits.map(w => { const a = S.age + w, l = shieldLoadNow(a);
      return fact((w ? "Age " + a : "Now, " + a), money(shieldPrem(a, l)) + "/mo · " + loadTxt(l)); }).join("") + "</div>" +
    '<p class="hint mb">The loading is fixed on the day you sign and stays for life: +3% for every year past 25 that you waited' +
      (hasCond ? ", plus " + (p.hadCritical ? "a heavy loading for your critical illness" : "30% for each condition on your record (" + conds + ")") : ", and 30% more for each condition you pick up before you sign") +
      ". Critical illness premiums are fixed at the age you buy and loaded for conditions too.</p>";

  const choices = [];
  if (p.insured) choices.push({ t: "Cancel the hospital plan", d: "MediShield Life still pays part of a big bill — in a subsidised ward. Buying again later means a new loading: " + loadTxt(loadNow) + " today, more each year.",
    go: () => { p.insured = false; tl(S.age, "Cancelled the hospital plan."); return "Cancelled. " + money(shieldPrem(S.age)) + "/mo saved."; } });
  else choices.push({ t: "Buy an Integrated Shield plan", d: "Tops up MediShield Life: a private-hospital bill is almost entirely covered. Loading locked in today: " + loadTxt(loadNow) + (hasCond ? ", including your health record." : "."),
    cost: money(shieldNow) + "/mo",
    go: () => { buyShield(); tl(S.age, "Took out a hospital plan."); return "Covered from today: " + money(shieldPrem(S.age)) + "/mo."; } });

  if (p.ci) choices.push({ t: "Cancel critical illness cover", d: "Your premium was fixed at the age you bought it. Buy again later and it is priced at that age, and loaded for any condition by then.",
    go: () => { p.ci = null; tl(S.age, "Cancelled critical illness cover."); return "Cancelled."; } });
  else for (const sum of [100000, 250000]){
    const prem = ciPremFor(sum, S.age);
    choices.push({ t: "Critical illness cover, " + kmoney(sum), d: ciAvailable() ? "Pays " + money(sum) + " in one lump on a diagnosis of cancer, a heart attack or a stroke, up to 65. Premium fixed for life at today's rate" + (conds ? ", loaded " + Math.round(conds * 50) + "% for your health record" : "") + ". Each year you wait adds about 5.5%."
        : p.hadCritical ? "Declined: insurers will not cover someone who has had a critical illness." : "Not offered past 60.",
      cost: money(prem) + "/mo", can: ciAvailable,
      go: () => { p.ci = { sum, prem, from: S.age }; tl(S.age, "Bought " + kmoney(sum) + " of critical illness cover."); return "Covered: " + money(sum) + " on a diagnosis, for " + money(prem) + "/mo until 65."; } });
  }
  if (p.di) choices.push({ t: "Cancel disability income cover", d: "",
    go: () => { p.di = null; tl(S.age, "Cancelled disability income cover."); return "Cancelled."; } });
  else {
    const r = diRateFor(S.age);
    choices.push({ t: "Disability income cover", d: diAvailable() ? "Pays 75% of your salary if illness or injury stops you working, after a three-month wait, until 65. Costs " + pct(r) + " of your salary." + (hasCond ? " Loaded for your health record." : "")
        : !p.job ? "Only for people in work." : p.disabled ? "Not while you are unable to work." : "Not offered past 60.",
      cost: p.job ? money(Math.round(p.salary * r)) + "/mo" : "—", can: diAvailable,
      go: () => { p.di = { rate: r, from: S.age }; tl(S.age, "Bought disability income cover."); return "Covered: " + money(Math.round(p.salary * 0.75)) + "/mo if you cannot work."; } });
  }
  choices.push({ t: "Done", d: "", esc: true, go: close });

  renderCard({ icon: "🛡️", kind: "Insurance · age " + S.age, title: "Your cover",
    lede: "Every policy is money spent in the years nothing happens. The question is only which bad year you could not pay for yourself.",
    facts, html, choices }, back);
}

      return optBtn(h.id === ls.hol, h.n, h.id === "none" ? "$0" : money(Math.round(lo * cpi)) + "–" + kmoney(Math.round(hi * cpi)), 'data-hol="' + h.id + '"', !tierOpen(h.id));
    }).join(""),

    { none: " <b>Wellbeing suffers and depression is likelier.</b>", stay: " <b>Better than nothing, just.</b>", near: "", far: " <b>Happier; you come back rested.</b>" }[ls.hol] +
    (ls.hol === "none" ? "" : '<div class="places mt-s">' + PLACES.filter(x => x.tier === ls.hol).map(x => {
      const been = ls.stamps.some(s => s.id === x.id);

    }).join("") + "</div>") +
    (familyPays && familyHolMax() < Infinity ? '<div class="hint mt-s">Your family pays while you study at home, so only what they can stretch to: up to about ' + money(Math.round(familyHolMax() * cpi)) + " a head. <b>Once you earn, you pay, and anywhere is open.</b></div>"
      : familyPays ? "" : '<div class="hint mt-s">Flights and hotel are paid up front: only a trip your cash covers (' + money(Math.max(0, p.cash)) + ") can be booked; a cheap staycation only needs the month's spare cash flow.</div>"));

  const seen = [];
  for (const s of ls.stamps) if (!seen.some(x => x.id === s.id)) seen.push(s);
  const passport = '<div class="dial"><div class="dial-h"><span class="dial-n">🛂 Passport</span><span class="dial-v">' +
    seen.length + " of " + PLACES.length + " places</span></div>" +
    (seen.length ? '<div class="stamps">' + seen.map(s => { const x = placeById(s.id), n = ls.stamps.filter(y => y.id === s.id).length;
        return '<span class="stamp s-' + x.tier + '" title="first at ' + s.age + '">' + x.flag + " " + esc(x.n) + (n > 1 ? " ×" + n : "") + "<small>" + s.age + "</small></span>"; }).join("") + "</div>"
      : '<div class="hint">Empty. The photo in it is from when you were eighteen and it shows.</div>') + "</div>";

  /* one-offs */
  const once = [];
  if (weddingCan()) once.push(block("💍 The wedding", (p.wedDelays ? "put off " + p.wedDelays + "×" : "once"), WEDDINGS.map((w, i) => optBtn(false, w.n, money(wedCost(i)),
      'data-wed="' + i + '"', false)).join(""),
    "Ang baos come back on the night, by a roll of the dice: a banquet gets back about half to three-quarters, a wedding abroad much less. Short of cash? Your partner, your parents or a loan can help. " +
    esc(oppText(wedCost(WEDDINGS.length - 1))).replace("Invested instead", "The grandest one, invested instead") +
    (partnerTypeOf() && partnerTypeOf().wedSay ? " <b>What your partner would like: " + esc(partnerTypeOf().wedSay) + "</b>" : "")));
  else if (ls.wed) once.push('<div class="hint mb">Married with a ' + esc(WEDDINGS.find(w => w.id === ls.wed.tier).n.toLowerCase()) + " at " + ls.wed.age + ", net " + money(ls.wed.net) + ".</div>");
  if (S.a.property && p.housingMode === "own"){
    const h = S.a.property;
    once.push(block("🔨 The home", h.reno ? esc(RENOS[h.reno.tier].n) + ", age " + h.reno.age : "as it came",
      renoCan() ? RENOS.slice(1).map((r, j) => optBtn(false, r.n, money(renoCost(j + 1)), 'data-reno="' + (j + 1) + '"', p.cash < renoCost(j + 1))).join("") : "",
      renoCan() ? "The valuer adds back about " + pct(RENO_VALUE, 0) + " of it. The rest is for living in. <b>Happier at home for fifteen years.</b> " + esc(oppText(renoCost(2)))
        : "Renovated " + (S.age - h.reno.age) + " years ago. Wait until it is ten years old."));
  }
  once.push(block("🎁 Treats", ls.treats ? ls.treats + " this year" : "", Object.keys(TREATS).map(k =>
    optBtn(false, TREATS[k].icon + " " + TREATS[k].n, money(treatCost(k)), 'data-treat="' + k + '"', p.cash < treatCost(k))).join(""),
    "A lift for the year. The first two count; after that it is just shopping."));

  const net = netCashflow();
  openModal('<div class="gcard"><div class="gcard-h"><span class="ic">🎟️</span><div><div class="kind">Lifestyle · age ' + S.age + '</div><h2>What you do with the rest</h2></div></div>' +
    '<div class="gcard-b" id="lsbody">' +
    '<p class="lede">None of this is necessary, which is the point. A thin life saves money and costs you elsewhere: depression, burnout, a worse interview. A thick one leaves nothing to invest. Your pay going up does not change these by itself — but people will try.</p>' +
    '<div class="hint mb" id="lsnote" style="min-height:1em;font-weight:700"></div>' +
    '<h3 class="mt-s mb-s">Every month</h3>' + goingOut + gym + pet + club + vol +
    '<h3 class="mt mb-s">Once a year</h3>' + hol + passport +
    '<h3 class="mt mb-s">Once</h3>' + once.join("") +
    '<h3 class="mt mb-s">Getting around</h3>' + carBlock() +
    '<div class="rows mt">' +
      '<div class="row"><div class="l">Lifestyle, all in</div><div class="v">' + money(livingCosts().lifestyle) + "/mo</div></div>" +
      '<div class="row"><div class="l">Cash</div><div class="v">' + money(p.cash) + "</div></div>" +
      '<div class="row tot"><div class="l">Left over each month</div><div class="v ' + (net < 0 ? "neg" : "pos") + '">' + moneyS(net) + "</div></div>" +
    "</div>" +
    '<div class="hint mt-s">Right now you are <b>' + wellbeingWord() + "</b>.</div>" +
    '<div class="btn-row mt"><button class="btn primary big grow" id="lsdone">Done</button></div>' +
    "</div></div>");

  const on = (sel, fn) => document.querySelectorAll("#lsbody " + sel).forEach(b => { b.onclick = () => fn(b); });
  on("[data-out]", b => { setSpend("lifestyle", +b.dataset.out); redo(); });
  on("[data-gym]", b => { setGym(+b.dataset.gym); redo(); });
  on("[data-pet]", b => act(adoptPet(b.dataset.pet)));
  on("[data-hol]", b => { setHoliday(b.dataset.hol); redo(); });
  on("[data-place]", b => act(setHoliday(ls.hol, b.dataset.place)));
  on("[data-wed]", b => { saveAuto(); weddingFlow(+b.dataset.wed, () => S.p.cash < 0 ? forcedShortfall(() => openLifestyle(done)) : openLifestyle(done)); });
  on("[data-reno]", b => act(doReno(+b.dataset.reno)));
  on("[data-treat]", b => act(treat(b.dataset.treat)));
  if (el("rehome")) el("rehome").onclick = () => act(rehomePet());
  if (el("clubjoin")) el("clubjoin").onclick = () => act(joinClub());
  if (el("clubsell")) el("clubsell").onclick = () => act(leaveClub());
  el("voltog").onclick = () => act(setVolunteer(!ls.vol));
  bindCarBlock(r => act(r));
  el("lsdone").onclick = () => { closeModal(); screenBoard(); if (done) done(); };
}

/* ---------- the passport: every trip as a stamp, in the order you went ----------
   Opened from the top bar. Places not yet visited show as faded outlines, to collect. */
const PASSPORT_RANKS = [
  [0,  "Never left the estate", "Passport so new the photo still looks like you."],
  [1,  "JB weekend warrior", "One stamp. Must show everybody, of course."],
  [3,  "Budget airline regular", "You know the Scoot seat pitch by heart."],
  [6,  "Seasoned traveller", "Can pack for a week in one cabin bag. Steady lah."],
  [11, "Frequent flyer", "Changi staff recognise you already."],
  [17, "Globetrotter", "Colleagues ask you where to go. You got opinions."],
  [PLACES.length, "Passport full, wah!", "Every place in the book. Time to renew, and show off."]
];
function passportRank(n){ let r = PASSPORT_RANKS[0]; for (const x of PASSPORT_RANKS) if (n >= x[0]) r = x; return r; }
function openPassport(){
  const st = (S.p.ls && S.p.ls.stamps) || [];
  const first = {};
  st.forEach((s, i) => { if (!(s.id in first)) first[s.id] = i; });
  const seen = Object.keys(first);
  const countries = new Set(seen.map(id => placeById(id)).filter(x => x.tier !== "stay").map(x => x.flag));
  const rank = passportRank(seen.length), next = PASSPORT_RANKS.find(x => x[0] > seen.length);
  const tierN = t => seen.filter(id => placeById(id).tier === t).length + " of " + PLACES.filter(x => x.tier === t).length;

  const stamp = (s, i) => {
    const x = placeById(s.id), isNew = first[s.id] === i;
    return '<span class="stamp s-' + x.tier + (isNew ? " first" : "") + '" title="' + (isNew ? "first visit" : "been before") + '">' +
      '<i class="pp-no">#' + (i + 1) + "</i>" + x.flag + " " + esc(x.n) + "<small>age " + s.age + (isNew ? " · NEW" : "") + "</small></span>";
  };
  const todo = PLACES.filter(x => !(x.id in first));

  openModal('<div class="gcard"><div class="gcard-h"><span class="ic">🛂</span><div><div class="kind">Passport · age ' + S.age + "</div><h2>" + esc(rank[1]) + "</h2></div></div>" +
    '<div class="gcard-b" id="ppbody"><p class="lede">' + esc(rank[2]) + "</p>" +
    '<div class="facts mb">' + fact("Places", seen.length + " of " + PLACES.length) + fact("Countries", countries.size) +
      fact("Trips taken", st.length) + fact("First trip", st.length ? "age " + st[0].age : "—") +
      fact("Staycations", tierN("stay")) + fact("In the region", tierN("near")) + fact("Far away", tierN("far")) +
      fact("Next title", next ? next[1] + " · " + next[0] + " places" : "you have them all") + "</div>" +
    '<div class="pp-page"><div class="pp-h">Stamps, in the order you went</div>' +
      (st.length ? '<div class="stamps">' + st.map(stamp).join("") + "</div>"
        : '<div class="hint">No stamps yet. Pick a holiday under Lifestyle and the first one lands here.</div>') + "</div>" +
    (todo.length ? '<div class="pp-page mt"><div class="pp-h">Still to collect · ' + todo.length + "</div>" +
      '<div class="stamps">' + todo.map(x => '<span class="stamp s-' + x.tier + ' todo">' + x.flag + " " + esc(x.n) + "<small>" + money(holidayCost(x.id)) + "</small></span>").join("") + "</div></div>" : "") +
    '<div class="btn-row mt"><button class="btn primary big grow" id="ppdone">Done</button></div></div></div>');
  el("ppdone").onclick = () => { closeModal(); screenBoard(); };
}

/* ---------- the wedding: choose, find the money, then count the ang baos ----------
   Rules and prices: d_style.js (WEDDINGS, doWedding, wedDelay). fromCard: opened from the wedding
   card, where "not yet" is still an answer; from Lifestyle, "back" just returns there. */
let wedWas = null;                      /* the before-snapshot for the choice log (d_story.js) */
function openWeddingChooser(done, fromCard){
  const t = partnerTypeOf();
  renderCard({ icon: "💒", art: "wedding", kind: "The wedding · age " + S.age, title: "What kind of wedding?",
    lede: "Four ways to do it. The ang baos come back on the night, and how many is up to the guests.",
    facts: [["My cash", money(S.p.cash)], ["Partner's savings", money(ptLiquid())], ["What they'd like", (t && t.wedSay) || "—"]],
    choices: weddingChoices(() => done, fromCard).concat(fromCard
      ? [{ t: "Not yet", d: "Asked again next year, and it lands harder each time.", go: () => { const r = wedDelay(); outcomeCard("💒", "The wedding can wait", r, done); return null; } }]
      : [{ t: "Back", d: "", esc: true, go: () => { if (done) done(); return null; } }])
  }, done);
}
function weddingFlow(i, done, fromCard){
  if (!weddingCan()){ if (done) done(); return; }
  if (!wedWas) wedWas = choiceSnap();
  if (S.p.cash >= wedCost(i)) wedNight(i, done); else wedPay(i, done, fromCard);
}
function wedPay(i, done, fromCard){
  const p = S.p, w = WEDDINGS[i], cost = wedCost(i), gap = cost - p.cash, cpi = S.econ.cpi;
  const again = () => { weddingFlow(i, done, fromCard); return null; };
  const choices = [];
  const ptc = p.partner && p.pt ? Math.floor(ptLiquid()) : 0;
  if (ptc >= 100){
    const amt = Math.min(gap, ptc), fair = Math.round(cost * fairPt()), over = amt > fair;
    choices.push({ t: "My partner chips in", cost: money(amt),
      d: "From their own savings (" + money(ptc) + "). Their fair share, by what they earn, is about " + money(fair) + "." + (over ? " This is more than that, and they will remember." : ""),
      go: () => { p.cash += ptTake(amt); if (over) p.tension = (p.tension || 0) + 1; tl(S.age, "Partner put " + money(amt) + " toward the wedding."); return again(); } });
  }
  const famLeft = Math.max(0, Math.round((S.c.familyPot || 0) * cpi - (S.c.familyLent || 0)));
  if (famLeft >= 500){
    const amt = Math.min(famLeft, Math.ceil(gap / 100) * 100);
    choices.push({ t: "Ask my parents", cost: money(amt),
      d: "From their savings. Interest-free, but they want it back" + (p.job ? ": repayments start now." : " once I am earning."),
      go: () => { S.c.familyLent = (S.c.familyLent || 0) + amt; p.cash += amt; addDeferred("family", amt, "Your parents lent you " + money(amt) + " for the wedding.");
        startDeferred(); tl(S.age, "Parents lent " + money(amt) + " for the wedding."); return again(); } });
  }
  const lamt = Math.ceil(gap / 100) * 100, lmax = borrowMax("pers"), q = quoteLoan("pers", lamt, 5);
  choices.push({ t: "Take a personal loan", cost: money(lamt),
    d: lmax >= lamt ? pct(q.rate, 2) + " a year, " + money(q.monthly) + "/mo for 5 years. Still paying for one night at " + (S.age + 5) + "." : "On my cash flow the bank will lend at most " + money(lmax) + ".",
    can: () => lmax >= lamt, go: () => { takeLoan("pers", lamt, 5); tl(S.age, "Borrowed " + money(lamt) + " for the wedding."); return again(); } });
  if (i >= 2){
    const dep = Math.round(cost * WED_DEPOSIT);
    choices.push({ t: "Pay the deposit, settle the rest from the ang baos", cost: money(dep) + " now",
      d: "Hotels take " + pct(WED_DEPOSIT, 0) + " up front and the balance after the dinner. If the ang baos fall short, I am short." + (p.cash < dep ? " Need " + money(dep) + " for the deposit." : ""),
      can: () => p.cash >= dep, go: () => { wedNight(i, done, true); return null; } });
  }
  choices.push({ t: "Choose a different wedding", d: "", go: () => { openWeddingChooser(done, fromCard); return null; } });
  renderCard({ icon: "💳", art: "wedding", kind: "The wedding · age " + S.age, title: "Paying for it",
    lede: w.n + " costs " + money(cost) + " and I have " + money(Math.max(0, p.cash)) + ". The hotel does not accept 'got feeling' as payment.",
    facts: [["It costs", money(cost)], ["My cash", money(p.cash)], ["Short by", money(gap)]], choices }, done);
}
function wedNight(i, done, settle){
  const w = WEDDINGS[i], cost = wedCost(i), lo = Math.round(cost * w.back[0]), hi = Math.round(cost * w.back[1]);
  openModal('<div class="gcard" data-art="wedding"><div class="gcard-h"><span class="ic">🧧</span><div><div class="kind">The wedding · age ' + S.age + "</div><h2>" + esc(w.n) + "</h2></div></div>" +
    '<div class="gcard-b center"><p class="lede">' + (settle ? "Deposit paid, the rest due after the dinner. " : "") +
      "The yam seng is done, the uncle has finished singing, the guests have gone home. Now the part everybody secretly waits for: opening the ang bao box.</p>" +
    '<div class="facts">' + fact("It costs", money(cost)) + fact("Ang baos could be", money(lo) + " to " + money(hi)) + fact("My cash", money(S.p.cash)) + "</div>" +
    '<div class="dice-bay mt" id="wbay">' + dieHTML(1) + dieHTML(1) + "</div>" +
    '<div class="check-line mt" id="wline">roll 2d6: the higher the roll, the more generous the guests</div>' +
    '<div class="btn-row mt" style="justify-content:center"><button class="btn primary big" id="wroll">Open the ang baos</button></div></div></div>');
  el("wroll").onclick = () => {
    el("wroll").disabled = true;
    rollDice(el("wbay"), 2, vals => {
      const sum = vals[0] + vals[1], frac = w.back[0] + (sum - 2) / 10 * (w.back[1] - w.back[0]);
      S.rolls.push({ age: S.age, kind: "Ang baos", v: sum });
      const text = doWedding(i, frac);
      if (wedWas){ logChoice("The wedding", w.n, wedWas, choiceSnap()); wedWas = null; }
      el("wline").innerHTML = vals[0] + " + " + vals[1] + " = <b>" + sum + "</b> · " + money(Math.round(cost * frac)) + " in ang baos";
      saveAuto();
      setTimeout(() => outcomeCard("💒", w.n, text || "", done), 1100);
    });
  };
}

/* how the partner invests: their style, what they hold, and whether a crash has scared them off shares */
function ptInvestHTML(pt, t, row){
  const st = t.inv; if (!st) return "";
  const inv = pt.inv || {}, ks = INV_KEYS.filter(k => inv[k] > 1), tot = ptInvTotal();
  const scared = pt.panicAt !== undefined && S.age - pt.panicAt < 3;
  return '<h3 class="mt mb-s" style="font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-soft)">How they invest</h3>' +
    '<div class="hint mb">' + esc(st.how) + " They keep about " + st.buf + " months of their bills in cash and invest the rest each year." +
    (scared ? " <b>Since the crash at " + pt.panicAt + " they are out of shares, in T-bills and SSB, until " + (pt.panicAt + 3) + ".</b>" : "") + "</div>" +
    (ks.length ? '<div class="rows mb">' + ks.map(k => row(INSTR[k].short, money(Math.round(inv[k])) + " · " + pct(inv[k] / tot, 0))).join("") + row("<b>Total</b>", "<b>" + money(Math.round(tot)) + "</b>") + "</div>"
      : '<div class="hint mb">Nothing invested yet: their savings are still under the buffer.</div>');
}
function openPartner(){
  const p = S.p;
  if (!p.partner){
    openModal('<div class="gcard"><div class="gcard-h"><span class="ic">💞</span><div><div class="kind">Partner · age ' + S.age + '</div><h2>Nobody, for now</h2></div></div>' +
      '<div class="gcard-b"><p class="lede">Single. My money is my money, my bills are my bills, and the remote control answers to nobody. ' +
      (p.kidsEx && p.kidsEx.length ? "There was somebody. Now there is maintenance." : "The aunties will ask. The aunties always ask.") + "</p>" +
      '<div class="facts">' + fact("Cash", money(p.cash)) + fact("CPF", money(cpfTotal())) + fact("Cash flow", moneyS(netCashflow()) + "/mo") + "</div></div></div>");
    return;
  }
  const pt = ptState(), t = partnerTypeOf(), share = billShare(), fair = fairPt();
  const h = S.a.property, l = S.loans.find(x => isMortgage(x));
  const pill = (label, on, val) => '<button class="opt' + (on ? " on" : "") + '" data-lpt="' + val + '"><span class="opt-n">' + label + "</span></button>";
  const row = (k, v, cls) => '<div class="row"><div class="l">' + k + '</div><div class="v ' + (cls || "") + '">' + v + "</div></div>";
  const fairR = Math.round(fair * 20) / 20;
  const opts = [...new Set([0, 0.25, 0.5, 0.75, 1, fairR])].sort((a, b) => a - b);
  const own = h ? ptOwnShare(h) : 0;
  const lp = l ? loanPt(l) : 0;
  const mood = lp - fair > 0.15 ? "<b>They are paying well over their share of the home loan. It comes up. It will keep coming up.</b>"
    : lp - fair < -0.25 ? "<b>You carry far more of the home loan than your share of the income. It is wearing you down.</b>" : "About even. Nobody is keeping score. Everybody is keeping score.";

  openModal('<div class="gcard"><div class="gcard-h"><span class="ic">💞</span><div><div class="kind">Partner · age ' + S.age + '</div><h2>' + esc(t.n) + "</h2></div></div>" +
    '<div class="gcard-b" id="ptbody">' +
    '<p class="lede">' + esc(t.d) + "</p>" +
    '<div class="facts">' + fact("Their take-home", money(ptInc()) + "/mo") + fact("Their cash", money(pt.cash)) + fact("Their investments", money(ptInvTotal())) +
      fact("Their CPF", "OA " + kmoney(pt.oa) + " · SA " + kmoney(pt.sa) + " · MA " + kmoney(pt.ma)) +
      fact("They save", moneyS(Math.round(ptNetMonthly())) + "/mo") + fact("At home", tensionWord()) +
      (p.partnerOut ? fact("Work", "out of work until " + p.partnerOut.until) : "") + "</div>" +

    '<h3 class="mt mb-s" style="font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-soft)">Who pays the bills</h3>' +
    '<div class="rows mb">' + row("Household bills", money(totalCosts()) + "/mo") +
      row("You pay (" + pct(share, 0) + ")", money(Math.round(totalCosts() * share)) + "/mo") +
      row("They pay (" + pct(1 - share, 0) + ")", money(Math.round(totalCosts() * (1 - share))) + "/mo") + "</div>" +
    '<div class="hint mb">Split by take-home pay, automatically. When one of you earns less — or nothing — the other covers more. That part nobody resents.</div>' +

    ptInvestHTML(pt, t, row) +

    (h ? '<h3 class="mt mb-s" style="font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-soft)">The home</h3>' +
      '<div class="rows mb">' + row("Put in so far — you", money(Math.round(h.paidMe || 0))) + row("Put in so far — them", money(Math.round(h.paidPt || 0))) +
        row("If sold, their share of the cash", pct(own, 0)) + (h.ptCpfUsed ? row("Their CPF in it (refunded first)", money(Math.round(h.ptCpfUsed))) : "") + "</div>" : "") +
    (l ? '<div class="dial"><div class="dial-h"><span class="dial-n">They pay of each home-loan repayment</span><span class="dial-v num">' + money(Math.round(l.monthly * lp)) + " of " + money(l.monthly) + "</span></div>" +
        '<div class="dial-opts">' + opts.map(v => pill(pct(v, 0) + (v === fairR ? " · fair" : ""), Math.abs(v - lp) < 0.001, v)).join("") + "</div>" +
        '<div class="hint">Fair by income: ' + pct(fair, 0) + ". What each pays in is what each gets back on a sale. " + mood + "</div></div>"
      : '<div class="hint">No home loan between you. When you buy, you choose how much each of you puts in and pays each month, on the Home tab.</div>') +
    "</div></div>");

  document.querySelectorAll("#ptbody [data-lpt]").forEach(b => {
    b.onclick = () => { l.pt = parseFloat(b.dataset.lpt); l.shared = true; saveAuto(); const k = scrollBox().scrollTop; openPartner(); scrollBox().scrollTop = k; };
  });
}
