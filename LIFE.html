   27. FAMILY, SAVINGS & CPF, BTO, SIDE WORK, A CAR — the screens (rules in d_plans.js)
   ============================================================ */
const pillBtn = (on, n, c, attrs, dis) => '<button class="opt' + (on ? " on" : "") + '"' + (dis ? " disabled" : "") + " " + attrs + ">" +
  '<span class="opt-n">' + esc(n) + "</span>" + (c !== undefined && c !== "" ? '<span class="opt-c num">' + c + "</span>" : "") + "</button>";
const dialBlock = (title, val, opts, hint) => '<div class="dial"><div class="dial-h"><span class="dial-n">' + title + '</span><span class="dial-v num">' + val + "</span></div>" +
  (opts ? '<div class="dial-opts">' + opts + "</div>" : "") + (hint ? '<div class="hint">' + hint + "</div>" : "") + "</div>";
/* redraw a screen in place, keeping the scroll and showing what just happened */
function redrawKeep(fn, said){
  saveAuto();
  const keep = scrollBox().scrollTop;
  fn();
  scrollBox().scrollTop = keep;
  if (said && el("plnote")) el("plnote").textContent = said;
}
const screenShell = (icon, kind, title, lede, body, id) =>
  '<div class="gcard"><div class="gcard-h"><span class="ic">' + icon + '</span><div><div class="kind">' + kind + " · age " + S.age + "</div><h2>" + title + "</h2></div></div>" +
  '<div class="gcard-b" id="' + id + '"><p class="lede">' + lede + '</p><div class="hint mb" id="plnote" style="min-height:1em;font-weight:700"></div>' + body +
  '<div class="rows mt"><div class="row"><div class="l">Cash</div><div class="v">' + money(S.p.cash) + "</div></div>" +
  '<div class="row tot"><div class="l">Left over each month</div><div class="v ' + (netCashflow() < 0 ? "neg" : "pos") + '">' + moneyS(netCashflow()) + "</div></div></div>" +
  '<div class="btn-row mt"><button class="btn primary big grow" id="pldone">Done</button></div></div></div>';

/* ---------- family: children and parents ---------- */
function openFamily(done){
  ensurePlans();
  const p = S.p, cpi = S.econ.cpi, again = said => redrawKeep(() => openFamily(done), said);
  const kids = (p.kidsBorn || []).map((b, i) => ({ i, age: S.age - b }));
  const perks = babyPerks();
  let body = "";

  /* the children */
  const kidRows = kids.length ? '<div class="rows mb">' + kids.map(k => '<div class="row"><div class="l">Child ' + (k.i + 1) + ", age " + k.age +
      '<div class="hint">' + (k.age <= 6 ? "pre-school" : k.age <= 12 ? "primary school" : k.age <= 16 ? "secondary school" : k.age <= 22 ? "poly or university" : "working") + "</div></div>" +
      '<div class="v">' + (k.age < 23 ? money(Math.round(kidMonthly(k.i))) + "/mo" : "grown up") + "</div></div>").join("") + "</div>" : "";
  const tryBits = !p.partner ? "Children come with a partner in this game."
    : p.trying ? "Trying. Odds this year at your age: <b>" + pct(babyOdds(), 0) + "</b>." + (p.ivf ? " With IVF (" + money(Math.round(IVF_COST * cpi)) + " a year after co-funding)." : "")
    : S.age > 45 ? "Past the age this game lets you try." : "Odds of a baby within a year at your age: <b>" + pct(babyOdds(), 0) + "</b>.";
  body += dialBlock("👶 Children", kids.length ? kids.length + (kids.length === 1 ? " child" : " children") : "none", "",
    kidRows + tryBits +
    '<div class="hint mt-s">A new baby brings a ' + money(perks.bonus) + " Baby Bonus, a " + money(perks.cda) + " CDA grant, a " + money(perks.rebate) + " tax rebate and " + money(4000) +
    " of tax relief a year. Then about " + money(Math.round(1100 * cpi)) + "/mo, for 23 years. <b>Happier, busier, poorer for a while</b> — and most grown children here give their parents something every month.</div>" +
    '<div class="btn-row mt-s">' +
      (p.partner && S.age <= 45 ? '<button class="btn sm" id="fy">' + (p.trying ? "Stop trying" : "Try for a baby") + "</button>" : "") +
      (p.trying && S.age >= 35 ? '<button class="btn sm" id="fivf">' + (p.ivf ? "Stop IVF" : "Add IVF — " + money(Math.round(IVF_COST * cpi)) + "/yr, +25% odds") + "</button>" : "") +
    "</div>");

  if (kids.some(k => k.age < 23) || p.trying){
    const cm = careMode();
    body += dialBlock("🧸 Who looks after them", KID_CARE[cm].n,
      Object.keys(KID_CARE).map(k => pillBtn(k === cm, KID_CARE[k].n,
        k === "infant" ? money(Math.round(750 * cpi)) + "→" + money(Math.round(450 * cpi)) : k === "grand" ? money(Math.round(250 * cpi)) + " each" : k === "helper" ? money(Math.round(1000 * cpi)) + " a home" : "one income",
        'data-care="' + k + '"', k === "grand" && !grandOk())).join(""),
      esc(KID_CARE[cm].note) + (cm === "infant" && youngest() < 3 ? " <b>With a baby and both of you working, tiredness builds.</b>" : "") +
      (cm === "helper" ? " <b>Less tired, happier at home.</b>" : "") + (cm === "parent" && p.ptHome ? " <b>Your partner is at home; their pay stopped at " + money(p.ptHome.inc) + "/mo.</b>" : "") +
      (cm === "parent" && p.partnerType !== "home" && !p.ptHome ? " <b>Choosing this stops your partner's " + money(p.partnerInc) + "/mo until the youngest is 7, and they come back on less.</b>" : ""));
    body += dialBlock("📚 After school", KID_ENRICH[p.enrich].n,
      KID_ENRICH.map((e, i) => pillBtn(i === p.enrich, e.n, e.mo ? money(Math.round(e.mo * cpi)) + " each" : "$0", 'data-enr="' + i + '"')).join(""),
      esc(KID_ENRICH[p.enrich].note) + " From 5 to 16. <b>The more they get, the better their start at work — and the more they can give back later.</b>");
    body += dialBlock("🎓 Poly or university fees", p.uniFund ? "you pay" : "they borrow",
      pillBtn(p.uniFund, "We pay the fees", money(Math.round(650 * cpi)) + "/mo each", 'data-uni="1"') + pillBtn(!p.uniFund, "They take a tuition loan", "$0", 'data-uni="0"'),
      "From 17 to 22. Paying means they start work debt-free and can give more back; a loan costs you nothing now.");
  }
  if (kidsGiving()) body += '<div class="hint mb">Your grown children give you <b>' + money(kidsGiving()) + "/mo</b>.</div>";

  /* parents */
  const atHome = p.housingMode === "family";
  body += dialBlock("👵 Your parents", atHome ? "you pay board at home" : money(Math.round(parentsCost())) + "/mo",
    atHome ? "" : PAR_ALLOW.map((a, i) => pillBtn(i === (p.parAllow || 0), a.n, "", 'data-par="' + i + '"')).join(""),
    atHome ? "Living at home, the monthly board you pay is their allowance. Parent Relief on your tax."
      : esc(PAR_ALLOW[p.parAllow || 0].note) + ((p.parAllow || 0) ? " <b>Parent Relief takes " + money(9000) + " off your taxable income.</b>" : " <b>Wellbeing suffers a little, and relatives ask you for money more often.</b>") +
        (p.parAllow === 3 && p.partner ? " <b>Your partner notices when it is a big share of what you take home.</b>" : "") +
        " You can also top up their CPF, on the Savings screen.");

  openModal(screenShell("👨‍👩‍👧", "Family", "Family",
    "Children cost a lot for a long time, and give a lot back — not all of it in money. Parents gave you a start; most people here give some of it back every month.", body, "fambody"));
  const on = (sel, fn) => document.querySelectorAll("#fambody " + sel).forEach(b => { b.onclick = () => fn(b); });
  on("[data-care]", b => { setCare(b.dataset.care); again(KID_CARE[b.dataset.care].n + "."); });
  on("[data-enr]", b => { p.enrich = +b.dataset.enr; again(); });
  on("[data-uni]", b => { p.uniFund = b.dataset.uni === "1"; again(); });
  on("[data-par]", b => { p.parAllow = +b.dataset.par; again(); });
  if (el("fy")) el("fy").onclick = () => { p.trying = !p.trying; if (!p.trying) p.ivf = false; again(p.trying ? "Trying from this year. It happens when the year is rolled." : "Stopped trying."); };
  if (el("fivf")) el("fivf").onclick = () => { p.ivf = !p.ivf; again(p.ivf ? "IVF added." : "IVF stopped."); };
  el("pldone").onclick = () => { closeModal(); saveAuto(); screenBoard(); if (done) done(); };
}

/* ---------- savings: the buffer, the card, CPF top-ups, SRS, CPF at 55 ---------- */
function openSavings(done){
  ensurePlans();
  const p = S.p, cpi = S.econ.cpi, again = said => redrawKeep(() => openSavings(done), said);
  const mr = marginalRate(), r = reliefThisYear(), rl = reliefLeft(), emNow = emergencyMonths();
  let body = ruleBadges([
    mr > 0 && rl > 0 ? ["amber", "⏳", money(rl) + " of tax relief room left this year — gone at the next roll"] : null,
    topupRoom() < 100 ? ["info", "✅", "You have reached the Full Retirement Sum: no more cash top-ups"] : null,
    emNow < 1 ? ["red", "⚠️", "Your buffer is under a month: one bad year and you sell or borrow"] : null,
    ["info", "🔒", "CPF top-ups locked until 55 · SRS until 62, 5% penalty before"]]);

  const burn = monthlyBurn(), bufCustom = p.bufferAmt ? Math.round(p.bufferAmt * cpi) : 0;
  const ownAmt = (id, label, val, dis) => '<div class="flexrow mb-s"><input id="' + id + '" class="btn" style="width:150px;font-family:var(--mono)" placeholder="$ amount" inputmode="numeric"' +
    (val ? ' value="' + val + '"' : "") + (dis ? " disabled" : "") + '><button class="btn sm" id="' + id + 'go"' + (dis ? " disabled" : "") + ">" + label + '</button><span class="hint num" id="' + id + 'prev"></span></div>';
  body += dialBlock("🛟 Emergency buffer", bufCustom ? money(bufCustom) + " (your amount) · " + (burn > 0 ? (bufCustom / burn).toFixed(1) : "—") + " months" : p.buffer + " months · " + money(Math.round(p.buffer * burn)),
    [3, 6, 12].map(m => pillBtn(!bufCustom && m === p.buffer, m + " months", money(Math.round(m * burn)), 'data-buf="' + m + '"')).join(""),
    ownAmt("bufamt", "Keep this amount", bufCustom) +
    "Cash kept for a bad year: a retrenchment, a hospital stay. Right now you hold " + emergencyMonths().toFixed(1) + " months. <b>Too little and a bad year means selling or borrowing; too much sits losing to prices.</b>");
  body += dialBlock("🧺 Every year, the cash above it goes", SWEEPS[p.sweep].n,
    Object.keys(SWEEPS).map(k => pillBtn(k === p.sweep, SWEEPS[k].n, "", 'data-swp="' + k + '"')).join(""),
    esc(SWEEPS[p.sweep].note) + " Swept so far: " + money(S.stats.swept || 0) + ".");
  body += dialBlock("💳 How you pay day to day", p.card === "full" ? "cashback card, paid in full" : "debit card",
    pillBtn(p.card === "debit", "Debit card", "", 'data-card="debit"') + pillBtn(p.card === "full", "Cashback card, paid in full", "up to " + money(Math.round(80 * cpi)) + "/mo", 'data-card="full"'),
    p.card === "full" ? "1.5% back on everyday spending. <b>People who tap a card spend about 5% more on food and fun.</b>" : "What is in the account is what you can spend." +
      (S.loans.some(l => l.kind === "cc") ? " <b>You carry a card balance at " + pct(CC_RATE) + ".</b>" : ""));

  /* CPF top-ups */
  const room = topupRoom(), cap = TOPUP_CAP;
  const selfLeft = Math.max(0, cap - (r.self || 0)), famLeft = Math.max(0, cap - (r.fam || 0));
  const amts = [2000, 4000, 8000];
  body += dialBlock("🏦 Top up your own CPF", S.cpf.ra !== undefined ? "Retirement Account" : "Special Account",
    amts.map(a => pillBtn(false, "Add " + money(a), "saves " + money(Math.round(Math.min(a, selfLeft) * mr)) + " tax", 'data-top="' + a + '"', p.cash < a || room < 100)).join(""),
    ownAmt("topamt", "Top up", 0, room < 100) +
    "Room left before the Full Retirement Sum: " + money(room) + ". Above the relief limit you can still top up; it just saves no tax. Earns 4%, guaranteed, and more on the first $60,000. Tax relief up to " + money(cap) + " a year (" + money(r.self || 0) + " used this year); your tax rate is " + pct(mr, 0) + ". <b>Locked until 55, and most of it pays you only from 65, as CPF LIFE.</b>" +
    (room < 100 ? " You have reached the Full Retirement Sum." : ""));
  body += dialBlock("👵 Top up your parents' CPF", "",
    amts.map(a => pillBtn(false, "Give " + money(a), "saves " + money(Math.round(Math.min(a, famLeft) * mr)) + " tax", 'data-ptop="' + a + '"', p.cash < a || famLeft < 100)).join(""),
    "It is theirs, not yours: a gift that pays them monthly in old age. Relief up to " + money(cap) + " a year.");

  /* SRS */
  const sq = srsWithdrawQuote(), sroom = srsRoom();
  body += dialBlock("🔒 SRS — Supplementary Retirement Scheme", money(Math.round(srsBal())),
    [5000, 10000, 15300].map(a => pillBtn(false, "Put in " + money(a), "saves " + money(Math.round(Math.min(a, sroom) * mr)) + " tax", 'data-srs="' + a + '"', p.cash < a || sroom < 100)).join("") +
      pillBtn(p.srs.inv, p.srs.inv ? "Invested in the STI ETF" : "Sitting in cash, 0.05%", "", 'data-srsinv="1"'),
    "Every dollar in comes off your taxable income this year (up to " + money(SRS_CAP) + "). <b>Locked until 62: from then half of what you take out is taxed; before that all of it, plus a 5% penalty.</b> Worth most on a high tax rate; at " + pct(mr, 0) + " it saves you " + money(Math.round(1000 * mr)) + " per $1,000." +
    (srsBal() > 0 ? '<div class="btn-row mt-s"><button class="btn sm' + (sq.early ? " danger" : "") + '" id="srsout">Take it all out: ' + money(sq.net) + (sq.early ? " after tax and the penalty" : " after tax") + "</button></div>" : ""));

  /* CPF after 55 */
  if (S.cpf.ra !== undefined){
    body += dialBlock("🎂 CPF after 55", "Retirement Account " + kmoney(S.cpf.ra),
      S.cpf.oa > 100 ? [5000, 20000].map(a => Math.round(a * cpi)).map(a => pillBtn(false, "Take " + money(Math.min(a, S.cpf.oa)) + " out", "", 'data-oaout="' + a + '"')).join("") +
        pillBtn(false, "Take it all: " + money(S.cpf.oa), "", 'data-oaout="' + Math.ceil(S.cpf.oa) + '"') : "",
      "Your Ordinary Account (" + money(S.cpf.oa) + ") can come out any time now. <b>In CPF it earns 2.5% or more, guaranteed; in the bank, much less.</b> CPF LIFE from 65 is about " + money(cpfLifeAt("std", 65, 65)) + "/mo on the Standard plan today.");
  } else {
    body += '<div class="hint mb">At 55 CPF sets up a Retirement Account; you choose how much goes in, and can take out the rest. From 65 it pays CPF LIFE — about ' +
      money(Math.round(retBal() * Math.pow(1.04, Math.max(0, 65 - S.age)) * CPF_PLANS.std.rate)) + "/mo if your Special Account just keeps growing.</div>";
  }

  body += '<div class="hint">Tax this year: ' + money(taxYear()) + (p.ptr ? " before your " + money(p.ptr) + " Parenthood Tax Rebate" : "") + ". Reliefs: " + reliefList().map(x => esc(x[0]) + " " + money(x[1])).join(" · ") + ".</div>";

  openModal(screenShell("🏦", "Savings & CPF", "Savings, CPF and tax",
    "Money you can reach, money that grows, money that is locked away for later and pays you for waiting. Every lock is a trade: tax off or interest now, access later.", body, "savbody"));
  const on = (sel, fn) => document.querySelectorAll("#savbody " + sel).forEach(b => { b.onclick = () => fn(b); });
  on("[data-buf]", b => { p.buffer = +b.dataset.buf; p.bufferAmt = 0; again(); });
  const dollars = id => { const v = parseFloat(String(el(id).value).replace(/[$,\s]/g, "")); return isFinite(v) ? Math.round(v) : NaN; };
  el("bufamtgo").onclick = () => {
    const v = dollars("bufamt");
    if (!(v >= 0)){ el("plnote").textContent = "Enter an amount in dollars."; return; }
    p.bufferAmt = v / cpi;
    again(v ? "Keeping " + money(v) + " as your buffer. It rises with prices." : "No buffer kept: all cash is swept.");
  };
  el("bufamt").oninput = () => { const v = dollars("bufamt"); el("bufamtprev").textContent = v > 0 && burn > 0 ? (v / burn).toFixed(1) + " months of spending" : ""; };
  el("topamt").oninput = () => {
    const v = dollars("topamt");
    el("topamtprev").textContent = v > 0 ? "saves about " + money(Math.round(Math.min(v, selfLeft) * mr)) + " tax" + (v > room ? " · only " + money(room) + " fits" : "") + (v > p.cash ? " · you have " + money(p.cash) : "") : "";
  };
  el("topamtgo").onclick = () => {
    const v = dollars("topamt");
    if (!(v > 0)){ el("plnote").textContent = "Enter an amount in dollars."; return; }
    const x = topUpSelf(v);
    again(x ? "Added " + money(x) + " to your CPF" + (x < v ? " — all that fitted, capped by your cash or the Full Retirement Sum" : "") + "." : "Nothing added.");
  };
  on("[data-swp]", b => { p.sweep = b.dataset.swp; again(p.sweep === "none" ? "Nothing will move by itself." : "From the next year, cash above the buffer goes " + SWEEPS[p.sweep].n.toLowerCase() + "."); });
  on("[data-card]", b => { p.card = b.dataset.card; again(); });
  on("[data-top]", b => { const x = topUpSelf(+b.dataset.top); again(x ? "Added " + money(x) + " to your CPF." : "Nothing added."); });
  on("[data-ptop]", b => { const x = topUpParents(+b.dataset.ptop); again(x ? "Gave " + money(x) + " to your parents' CPF." : ""); });
  on("[data-srs]", b => { const x = srsPut(+b.dataset.srs); again(x ? "Put " + money(x) + " into SRS." : "Nothing put in."); });
  on("[data-srsinv]", () => { p.srs.inv = !p.srs.inv; again(p.srs.inv ? "SRS money now rides the STI ETF." : "SRS money back in cash."); });
  on("[data-oaout]", b => { const x = cpfWithdrawOA(+b.dataset.oaout); again("Took " + money(x) + " out of CPF."); });
  if (el("srsout")) el("srsout").onclick = () => { const q = srsWithdraw(); again("Took out " + money(q.bal) + ": " + money(q.tax) + " tax" + (q.pen ? " and " + money(q.pen) + " penalty" : "") + ", " + money(q.net) + " to you."); };
  el("pldone").onclick = () => { closeModal(); saveAuto(); screenBoard(); if (done) done(); };
}

/* ---------- BTO ---------- */
function openBTO(back, close){
  const p = S.p, blk = btoBlock(), b = p.bto;
  const choices = [];
  if (b){
    choices.push({ t: b.stage === "applied" ? "Withdraw the application" : "Give the flat up", d: b.stage === "applied" ? "Nothing lost." : "You would lose " + money(btoLoss()) + " and could not apply again for a year. You will be asked to confirm.",
      go: () => { if (b.stage === "applied"){ btoForfeit(); return "Withdrawn. Nothing lost."; } btoGuard(null, () => { outcomeCard("🏗️", "BTO given up", "Gave the flat up. " + money(S.stats.lastBtoLoss || 0) + " gone, and no new BTO until " + (S.age + 1) + ". The flat will make some other couple very happy, and very tired.", close); }, () => openBTO(back, close)); return null; } });
  } else for (const x of btoMarket()){
    const tr = BTO_TIERS[x.tier], g = hdbGrant({ type: "hdb", rooms: x.rooms }).ehg;
    choices.push({ t: x.n + " · " + tr.n + " · " + x.town, cost: money(x.price),
      d: "Worth about " + kmoney(btoValue(x)) + " on the resale market today. Ballot odds about " + pct(btoChance(x), 0) + ". Keys in 3–5 years. " + tr.mop + "-year MOP" +
        (tr.claw ? "; HDB takes back " + pct(tr.claw, 0) + " of the price when you sell" : "") + (tr.let ? "" : "; can never be let out whole") + "." +
        (g ? " Enhanced grant about " + money(g) + " into CPF at the keys." : "") + " 5% deposit when you book.",
      can: () => !blk, go: () => { btoApply(x); return "Applied for a " + x.n + " in " + x.town + ". The ballot is drawn when you roll the year. Now we refresh the HDB app like it owes us money."; } });
  }
  if (back) choices.push({ t: "Back", d: "", esc: true, go: () => { back(); return null; } });
  renderCard({ icon: "🏗️", kind: "BTO · age " + S.age, title: b ? "Your BTO flat" : "New flats from HDB",
    lede: b ? "A " + b.n + " in " + b.town + " (" + BTO_TIERS[b.tier].n + "), " + money(b.price) + ": " + btoStageText(b) + "." +
        (b.stage === "applied" ? " A failed ballot keeps you in for the next launch unless you withdraw." : " Paid so far: " + money(btoLoss()) + ". Until the keys, you live where you live, and you cannot buy another home without giving this one up.")
      : "Priced well below resale, because HDB wants first homes within reach. The catch: a ballot, three to five years of waiting, and no choice of block or floor. Plus and Prime flats in better places come with a 10-year MOP and a clawback when sold." +
        (blk ? " " + blk : ""),
    facts: [["Household income", money(householdIncome()) + "/mo"], ["Ceiling", money(Math.round((p.partner ? BTO_CEILING : BTO_SINGLE_CEILING) * S.econ.cpi))], ["CPF Ordinary", money(S.cpf.oa)], ["Cash", money(p.cash)],
            ["Past unsuccessful tries", p.btoTries || 0]],
    badges: [blk && !b ? ["red", "⛔", blk] : null,
      b && b.stage !== "applied" ? ["red", "⚠️", "Give it up now and you lose " + money(btoLoss()) + ", and no new BTO for a year"] : null,
      b ? ["amber", "🔒", "Until the keys you cannot buy another home without giving this one up"] : null],
    choices }, () => close());
}
/* Before buying anything else while a BTO is in play: say exactly what it costs, and let the player
   back out. what: the purchase (null when simply giving the flat up). proceed runs after the BTO is ended. */
function btoGuard(what, proceed, back){
  const b = S.p.bto;
  if (!b){ proceed(); return; }
  const applied = b.stage === "applied", lost = btoLoss();
  const why = b.stage === "booked" ? "the option fee" : "the 5% down payment";
  renderCard({ icon: "⚠️", kind: "BTO · age " + S.age, title: applied ? "This cancels your BTO application" : "This costs you your BTO flat",
    lede: applied
      ? (what ? "Buying " + what + " means you own property, and your BTO application for a " + b.n + " in " + b.town + " is cancelled. Nothing is lost except your place in the ballot." : "")
      : (what ? "To buy " + what + " you must first give up your BTO flat, a " + b.n + " in " + b.town + ". " : "Giving up your " + b.n + " in " + b.town + ". ") +
        "You lose " + why + " you have paid — " + money(lost) + " — and you cannot apply for another BTO until age " + (S.age + 1) + ".",
    facts: [["Your BTO", b.n + ", " + b.town], ["Stage", btoStageText(b)], ["You would lose", money(lost)], ["No new BTO until", applied ? "no ban" : "age " + (S.age + 1)]],
    badges: applied ? [] : [["red", "⚠️", "You lose " + money(lost) + " and cannot apply for a BTO until age " + (S.age + 1)]],
    choices: [
      { t: applied ? "Cancel my BTO and continue" : what ? "Give up my BTO and continue" : "Give it up", d: applied ? "" : money(lost) + " forfeited.", cost: lost ? money(lost) : "",
        go: () => { S.stats.lastBtoLoss = btoForfeit(what ? "to buy " + what : ""); saveAuto(); proceed(); return null; } },
      { t: "Keep my BTO", d: "", go: () => { back(); return null; } }
    ] }, () => back());
}

/* the keys: the ordinary financing screen, with the deposit already paid counted back in */
function collectBTO(done){
  const b = S.p.bto;
  const l = { type: "hdb", rooms: b.rooms, n: b.n + " BTO flat, " + b.town, price: b.price, left: 99 };

/* ---------- one loan: pay it down early, or move it somewhere cheaper ---------- */
const loanUI = { amt: null, mode: "term", src: "cash", sure: -1 };

  if (back !== openLoan.back){ loanUI.sure = -1; openLoan.back = back; }
  if (!l){ back(); return; }
  const p = S.p, housing = isHousing(l), again = said => redrawKeep(() => openLoan(S.loans.indexOf(l) >= 0 ? S.loans.indexOf(l) : -1, back), said);
  const cpi = S.econ.cpi, n = monthsLeft(l);
  const amts = [...new Set([5000, 20000, 50000].map(a => Math.round(a * cpi / 1000) * 1000).filter(a => a < l.bal * 0.9).concat([Math.round(l.bal / 2), Math.ceil(l.bal)]))];

    fact("Lock-in", inLockIn(l) ? "until age " + lockUntil(l) : "none") + "</div>";

  body += dialBlock("💸 Pay some off early", money(q.amt),

    '<div class="rows mb">' +

      (loanUI.src === "cash" ? row("Buffer afterwards", Math.max(0, (p.cash - cashNeed) / Math.max(1, monthlyBurn())).toFixed(1) + " months", (p.cash - cashNeed) / Math.max(1, monthlyBurn()) < 3 ? "neg" : "") : "") +

  openModal('<div class="gcard"><div class="gcard-h"><span class="ic">🏦</span><div><div class="kind">Borrowing · age ' + S.age + "</div><h2>" + esc(l.name) + "</h2></div></div>" +

/* ============================================================
   28. GUIDES ON THE PAGE — what needs a look, what a choice would do
   - nextHints(): up to three short prompts under the Roll button
   - warnDot(panel): a small dot on a panel header when something there needs a decision
   - nwSpark(): a tiny net-worth line inside the top bar's Net worth box
   - previewChoices(): before/after figures on every choice of a dice card, worked out on a
     copy of the game so nothing real changes and the game's own dice are never touched
   - the top bar folds down to three boxes on a phone
   ============================================================ */

/* everything worth a look, most urgent first. level: "warn" or "info"; panel: where the dot goes */
function attention(){
  const p = S.p, out = [], cf = netCashflow(), em = emergencyMonths(), burn = monthlyBurn();
  const add = (level, panel, text) => out.push({ level, panel, text });
  if (cf < 0 && !familySupported()) add("warn", "cash", "Spending " + money(-cf) + "/mo more than you bring in");
  const cc = S.loans.find(l => l.kind === "cc");
  if (cc && cc.promoUntil === undefined) add("warn", "own", "Card balance " + kmoney(cc.bal) + " at " + pct(CC_RATE) + " — clear it first" + (p.credit >= 600 ? ", or move it to a 0% balance transfer" : ""));
  const mort = S.loans.find(l => isHousing(l) && refiWorth(l));
  if (mort){ const o = refiWorth(mort); add("info", "own", "Home loan at " + pct(mort.rate, 2) + ": another bank offers " + pct(o.rate, 2) + " — worth a look in Borrowing"); }
  if (em < 1 && p.job && !familySupported()) add("warn", "own", "Buffer under a month: one bad year and you borrow");
  const idle = p.cash - 12 * burn;
  if (S.age >= 25 && idle > 20000 * S.econ.cpi && invTotal() < p.cash * 0.3 && p.sweep === "none")
    add("info", "own", kmoney(idle) + " idle in the bank beyond a year's buffer");
  if (p.bto && p.bto.stage === "applied") add("info", "home", "BTO ballot result when you roll to " + (p.bto.applied + 1));
  else if (p.bto && p.bto.stage === "booked") add("info", "home", "BTO lease signing next roll: " + money(btoSignDue(p.bto)) + " due, CPF first");
  else if (p.bto && p.bto.keys - S.age <= 1) add("info", "home", "BTO keys " + (p.bto.keys <= S.age ? "this year" : "next year") + ": cash and CPF ready?");
  if (p.partner && p.housingMode === "family") add("warn", "home", "Married and still at your parents': it grates every year");
  if (p.housingMode === "rent" && livingCosts().housing > Math.max(1, myTakeHome()) * 0.4) add("warn", "home", "Rent is over 40% of your take-home");
  if (p.car && !p.car.family && carYearsLeft() <= 1) add("info", "style", "Car's COE ends " + (carYearsLeft() <= 0 ? "this year" : "next year"));
  if (!p.insured && S.age >= 30) add("warn", "life", "No hospital plan: a private-hospital bill lands on you");
  if (p.burnout >= 4) add("warn", "life", "Running on empty: tiredness is high");
  if (tensionWord() === "strained") add("warn", "life", "Things are strained at home");
  if (p.job && p.job !== "own" && (p.standing === undefined ? 60 : p.standing) < 40) add("warn", "life", "Your manager has doubts: you are at risk in a round of cuts");
  if (S.age === 54) add("info", "life", "CPF opens up at 55, next year");
  if (p.trying) add("info", "life", "Trying for a baby: " + pct(babyOdds(), 0) + " this year");
  if (marginalRate() >= 0.115 && srsRoom() > 1000 && S.age < 62) add("info", "life", "At your " + pct(marginalRate(), 1) + " tax rate, SRS saves " + money(Math.round(srsRoom() * marginalRate())) + " this year");
  return out;
}
function nextHints(){
  if (!S || S.phase !== "board" || inChapterOne()) return "";
  const a = attention().sort((x, y) => (x.level === "warn" ? 0 : 1) - (y.level === "warn" ? 0 : 1)).slice(0, 3);
  return a.length ? '<div class="nexthints">' + a.map(x => '<span class="nh ' + x.level + '">' + esc(x.text) + "</span>").join("") + "</div>" : "";
}
function warnDot(panel){
  const a = attention().filter(x => x.panel === panel);
  if (!a.length) return "";
  const lvl = a.some(x => x.level === "warn") ? "warn" : "info";
  return '<span class="wdot ' + lvl + '" title="' + esc(a.map(x => x.text).join(" · ")) + '"></span>';
}

/* a tiny line of net worth over the years, for the top bar */
function nwSpark(){
  const h = (S.hist || []).slice(-30);
  if (h.length < 3) return "";
  const W = 64, H = 16, lo = Math.min(0, ...h.map(r => r.nw)), hi = Math.max(...h.map(r => r.nw), 1);
  const pts = h.map((r, i) => (i / (h.length - 1) * W).toFixed(1) + "," + (H - 1 - (r.nw - lo) / (hi - lo || 1) * (H - 2)).toFixed(1)).join(" ");
  const up = h[h.length - 1].nw >= h[0].nw;
  return '<svg class="nwspark" viewBox="0 0 ' + W + " " + H + '" width="' + W + '" height="' + H + '" aria-hidden="true"><polyline points="' + pts + '" fill="none" stroke="' + (up ? "#3f7d4e" : "#a8402f") + '" stroke-width="1.6" stroke-linejoin="round"/></svg>';
}

/* ---------- before/after on a dice card's choices ----------
   The card was built once for real, with its dice draws recorded. For each choice the whole game is
   copied, the card is built again on the copy with the same draws, the choice is played, and the
   copy is measured. The real game, its dice and the screen are left exactly as they were. */
var PREVIEW = false;          /* var: the boot code near the top of the bundle reads it before this line runs */
function recordBuild(c){
  const orig = RNG, draws = [];
  RNG = () => { const v = orig(); draws.push(v); return v; };
  let data;
  try { data = c.build(); } finally { RNG = orig; }
  return { data, draws };
}
function measure(){ return { cf: netCashflow(), nw: netWorth(), cash: S.p.cash, debt: debtTotal() }; }
function previewChoices(c, draws, n){
  const real = S, realRNG = RNG, snap = JSON.stringify(S), out = [];
  PREVIEW = true;
  try {
    for (let i = 0; i < n; i++){
      let res = null;
      try {
        S = JSON.parse(snap);
        let k = 0; const spare = mulberry32(777 + i);
        RNG = () => k < draws.length ? draws[k++] : spare();
        const d = c.build(), ch = d.choices && d.choices[i];
        if (ch && (!ch.can || ch.can())){
          const before = measure();
          if (ch.before) ch.before();
          const r = ch.go(true);
          if (r !== null){ const after = measure(); res = { cf: after.cf - before.cf, nw: after.nw - before.nw, cash: after.cash - before.cash, debt: after.debt - before.debt, dice: !!ch.check }; }
        }
      } catch (e){ res = null; }
      out.push(res);
    }
  } finally { S = real; RNG = realRNG; PREVIEW = false; }
  return out;
}
function deltaLine(d){
  if (!d) return "";
  const parts = [], big = x => Math.abs(x) >= 50;
  if (big(d.cf)) parts.push('<b class="' + (d.cf < 0 ? "neg" : "pos") + '">' + moneyS(Math.round(d.cf)) + "/mo</b> cash flow");
  if (big(d.cash)) parts.push('<b class="' + (d.cash < 0 ? "neg" : "pos") + '">' + (d.cash < 0 ? "-" : "+") + kmoney(Math.abs(d.cash)) + "</b> cash");
  if (big(d.debt)) parts.push('<b class="' + (d.debt > 0 ? "neg" : "pos") + '">' + (d.debt > 0 ? "+" : "-") + kmoney(Math.abs(d.debt)) + "</b> debt");
  if (big(d.nw)) parts.push('<b class="' + (d.nw < 0 ? "neg" : "pos") + '">' + (d.nw < 0 ? "-" : "+") + kmoney(Math.abs(d.nw)) + "</b> net worth");
  if (!parts.length) return '<div class="cdelta">No change to your money today.</div>';
  return '<div class="cdelta">' + (d.dice ? "If the roll goes your way: " : "") + parts.join(" · ") + "</div>";
}

var topbarOpen = false;

/* ---------- rule badges: limits, locks and money at risk, loud on purpose ----------
   Each is [level, icon, text]: red = blocked, nothing left, or you lose money;
   amber = limited or locked for now; info = worth knowing. Shown at the top of a screen. */
function ruleBadges(list){
  list = (list || []).filter(Boolean);
  return list.length ? '<div class="rbs">' + list.map(b => '<span class="rb ' + b[0] + '">' + b[1] + " " + esc(b[2]) + "</span>").join("") + "</div>" : "";
}
/* the career limits for this year: job tries, the lock after a move, the one career move */
function careerBadges(){
  const p = S.p, out = [];
  if (careerBlock()) return [["red", "⛔", careerBlock()]];
  if (p.studying && !p.studying.partTime) out.push(["red", "⛔", "Studying full-time: you cannot take a job"]);
  else if (jobLocked()) out.push(["amber", "🔒", "Job applications locked until age " + p.jobLock + " — you just started this job"]);
  else { const n = appsLeft(); out.push([n ? "amber" : "red", n ? "⏳" : "⛔", n + " of " + APPS_PER_YEAR + " job applications left this year" + (n ? "" : " — more at age " + (S.age + 1))]); }
  out.push(careerMoved() ? ["red", "⛔", "Career move used this year — next at age " + (S.age + 1)] : ["amber", "⏳", "1 career move left this year: promotion ask, course, study or business"]);
  if (p.job && p.job !== "own" && S.age - p.jobSince < 2) out.push(["info", "🔒", "Promotion ask from age " + (p.jobSince + 2) + " (two years in the role)"]);
  return out;
}

/* ============================================================
   28. THE YEAR-END REVIEW — one screen after every year's cards, before the next roll.
   Things that quietly repeat or quietly expire, each with its cost and a way to change it.
   The holiday is not carried over (stepLifestyle resets it), so the review asks every year.
   Tools opened from here come back here; Done hands the turn back to the player.
   ============================================================ */
const reviewDue = () => !!(S && S.review && S.review.age === S.age && !S.review.done && S.age < PLAY_END);

/* holiday offers are drawn once a year, so redrawing the screen does not reshuffle them */
function holidayOffers(){
  const r = S.review;
  if (!r.offers) r.offers = { stay: nextPlace("stay"), near: nextPlace("near"), far: nextPlace("far") };
  return r.offers;
}

function openYearReview(done){
  const p = S.p, cpi = S.econ.cpi, r = S.review, ls = lsState();
  const back = () => openYearReview(done);
  const blocks = [];
  const block = (title, val, body, hot) => blocks.push('<div class="rv' + (hot ? " hot" : "") + '"><div class="rv-h"><b>' + title + '</b><span class="num">' + (val || "") + "</span></div>" + body + "</div>");
  const btns = list => '<div class="btn-row">' + list.map(b => '<button class="btn sm" data-rv="' + b[0] + '">' + esc(b[1]) + "</button>").join("") + "</div>";
  const acts = {};
  const act = (id, label, fn) => { acts[id] = fn; return [id, label]; };
  const take = Math.max(1, myTakeHome());

  /* 1. the holiday: chosen fresh every year */
  const offers = holidayOffers(), fam = familySupported();
  const holNow = ls.hol === "none" ? null : placeById(ls.place);
  const last = ls.last && ls.last.age >= S.age - 1 ? ls.last : null;
  block("✈️ This year's holiday", holNow ? holNow.flag + " " + esc(holNow.n) + " · " + (fam ? "family pays" : money(holidayCost(holNow.id))) : "none booked",
    '<div class="dial-opts">' +
      pillBtn(!holNow, "No holiday", "$0", 'data-hol="none"') +
      ["stay", "near", "far"].filter(t => offers[t] && placeOpen(offers[t])).map(t => { const x = placeById(offers[t]);
        return pillBtn(!!holNow && ls.hol === t && ls.place === x.id, x.flag + " " + x.n, fam ? "family pays" : money(holidayCost(x.id)), 'data-hol="' + t + '"'); }).join("") +
    "</div>" +
    '<div class="hint">' + (last ? "Last year: " + esc(placeById(last.id).n) + (last.cost ? ", " + money(last.cost) : "") + ". " : "") +
      (fam && familyHolMax() < Infinity ? "Your family pays, so only what they can stretch to: up to about " + money(Math.round(familyHolMax() * S.econ.cpi)) + " a head. " : fam ? "" : "Only trips your cash covers can be booked, or a cheap staycation your cash flow covers. ") +
      "Trips are booked one year at a time — nothing repeats by itself. <b>No holiday: wellbeing suffers and depression is likelier.</b></div>" +
    btns([act("lsh", "Pick another place", () => openLifestyle(back))]), !holNow);

  /* 2. the lifestyle that runs every month */
  const mo = lsMonthly(), outCost = livingCosts().lifestyle - lsExtras();
  const extras = [["going out: " + SPEND_TIERS.lifestyle.levels[p.spend.lifestyle].n.toLowerCase(), outCost]];
  if (mo.gym) extras.push([GYMS[ls.gym].n, mo.gym]);
  if (mo.club) extras.push(["club dues", mo.club]);
  if (mo.pet) extras.push([PETS[ls.pet.kind].n.toLowerCase(), mo.pet]);
  const yr = Math.round((outCost + mo.gym + mo.club + mo.pet + mo.vol) * 12);
  block("🌴 Lifestyle, every month", money(Math.round(yr / 12)) + "/mo · " + money(yr) + "/yr",
    '<div class="hint">' + extras.map(e => esc(e[0]) + " " + money(Math.round(e[1]))).join(" · ") + ". That is <b>" + pct(yr / 12 / take, 0) + " of your take-home</b>.</div>" +
    btns([act("ls", "Change lifestyle", () => openLifestyle(back))]));

  /* 3. tax reliefs that expire with the year */
  const mr = marginalRate(), rl = reliefLeft();
  if (mr > 0 && rl > 1000)
    block("🧾 Tax reliefs this year", money(rl) + " room",
      ruleBadges([["amber", "⏳", money(rl) + " of relief room — gone at the next roll"]]) +
      '<div class="hint">CPF cash top-up ' + money(topupReliefLeft()) + " · SRS " + money(srsRoom()) + ". At your " + pct(mr, 0) + " tax rate, using all of it saves about <b>" + money(Math.round(rl * mr)) + "</b> in tax.</div>" +
      btns([act("sav", "Savings & CPF", () => openSavings(back))]), true);

  /* 4. idle cash */
  const idle = p.cash - bufferKeep();
  if (idle > 5000 * cpi && (!p.sweep || p.sweep === "none"))
    block("💤 Cash doing nothing", money(Math.round(idle)) + " above your buffer",
      '<div class="hint">In the bank it earns ' + pct(depositRate()) + "; prices rose " + pct(S.econ.infl) + " last year, so it lost about <b>" + money(Math.round(idle * Math.max(0, S.econ.infl - depositRate()))) + "</b> in buying power.</div>" +
      btns([act("mk", "Markets", () => openMarkets(false, back)), act("swp", "Sweep it automatically", () => openSavings(back))]));

  /* only when something changed */
  if (p.insured && [31, 41, 51, 61].includes(S.age)){
    const before = shieldPrem(S.age - 1), now = shieldPrem(S.age);
    if (now > before) block("🛡️ Your hospital plan went up", money(before) + " → " + money(now) + "/mo",
      '<div class="hint">A new age band. It rises again at ' + (S.age + 10 <= 61 ? S.age + 10 : "65") + ".</div>" + btns([act("ins", "Insurance", () => openInsurance(back))]));
  }
  S.loans.forEach((l, i) => {
    if (l.floatedAt === S.age) block("🏦 Your fixed rate has ended", "now " + pct(l.rate, 2) + " · " + money(l.monthly) + "/mo",
      '<div class="hint">The loan floats with the market now. Another bank may offer a new fixed package.</div>' + btns([act("ln" + i, "Look at refinancing", () => openLoan(i, back))]));
  });
  if (p.job && r.raise >= 0.03)
    block("📈 You got a pay rise", pctS(r.raise) + " · " + money(p.salary) + "/mo",
      '<div class="hint">Save the difference before it quietly becomes lifestyle.</div>' + btns([act("rsw", "Sweep savings", () => openSavings(back)), act("rmk", "Markets", () => openMarkets(false, back))]));
  const kids = (p.kidsBorn || []).map(b => S.age - b);
  if (kids.includes(5) || kids.includes(17))
    block("🧒 A child milestone", kids.includes(5) ? "a child turns 5" : "a child turns 17",
      '<div class="hint">' + (kids.includes(5) ? "After-school classes start from 5 — the more they get, the better their start. " : "") +
        (kids.includes(17) ? "Poly or university fees start at 17: you pay, or they take a loan." : "") + "</div>" + btns([act("fam", "Family", () => openFamily(back))]));
  if (netCashflow() < 0)
    block("🔻 You spend more than you bring in", moneyS(netCashflow()) + "/mo",
      '<div class="hint">The gap comes out of savings every month.</div>' + btns([act("sp", "Everyday spending", () => openSpending(back)), act("ls2", "Lifestyle", () => openLifestyle(back))]), true);
  const cc = S.loans.find(l => l.kind === "cc");
  if (cc && cc.bal > 0)
    block("💳 Card balance", money(cc.bal) + " at " + pct(cc.rate),
      '<div class="hint">The dearest money there is. Clear it before anything else.</div>' + btns([act("cc", "Pay it down", () => openLoan(S.loans.indexOf(cc), back))]), true);
  if (p.gig && p.burnout >= 4)
    block("😮‍💨 Side work is wearing you down", gigById(p.gig.id).n + " · " + money(p.gig.inc) + "/mo",
      '<div class="hint">Tiredness is high: you fall ill and get passed over more.</div>' + btns([act("gig", "Career", () => openCareer(back))]));
  if ((p.parAllow || 0) > 0 && p.housingMode !== "family"){
    if (!p.parSeen) p.parSeen = take;
    if (Math.abs(take / p.parSeen - 1) > 0.3){
      block("👵 Your parents' allowance", money(Math.round(parentsCost())) + "/mo",
        '<div class="hint">Your take-home has ' + (take > p.parSeen ? "grown" : "fallen") + " a lot since you set it.</div>" + btns([act("par", "Family", () => openFamily(back))]));
      p.parSeen = take;
    }
  }

  /* the loud limits for the coming year */
  const badges = careerBadges().concat(jobLocked() && p.jobLock === S.age + 1 ? [["info", "🔓", "You can apply for other jobs again from next year"]] : []);

  const fin = () => { r.done = true; saveAuto(); closeModal(); screenBoard(); if (done) done(); };
  openModal('<div class="gcard"><div class="gcard-h"><span class="ic">🗓️</span><div><div class="kind">Year-end review · age ' + S.age + '</div><h2>Before you roll again</h2></div></div>' +
    '<div class="gcard-b" id="rvbody"><p class="lede">What runs by itself, what runs out, and what is worth a second look. Change anything, or carry on.</p>' +
    (badges.length ? ruleBadges(badges) : "") + blocks.join("") +
    '<div class="btn-row mt"><button class="btn primary big grow" id="rvdone">Done — ready to roll</button></div></div></div>');
  document.querySelectorAll("#rvbody [data-hol]").forEach(b => b.onclick = () => {
    const t = b.dataset.hol;
    setHoliday(t, t === "none" ? null : offers[t]);
    saveAuto(); const keep = scrollBox().scrollTop; back(); scrollBox().scrollTop = keep;
  });
  document.querySelectorAll("#rvbody [data-rv]").forEach(b => b.onclick = () => { const f = acts[b.dataset.rv]; if (f) f(); });
  el("rvdone").onclick = fin;
}

let tourAt = 0, tourDone = null;
function startTour(then){

  box.innerHTML = '<div class="tour-hole" id="tourhole"></div><div class="tour-tip" id="tourtip" role="dialog" aria-live="polite"></div>';

function tourKey(e){

  tourAt += d;

  const s = TOUR[tourAt];

  if (!t){ return tourAt < TOUR.length - 1 ? tourNext(1) : tourEnd(); }
  if (!matchMedia("(max-width:760px)").matches || !t.closest(".rail")) t.scrollIntoView({ block: "center", behavior: "instant" });

function tourPlace(){
  const s = TOUR[tourAt], hole = el("tourhole"), tip = el("tourtip");
  if (!s || !hole) return;
  const t = s.q(); if (!t) return;
  const r = t.getBoundingClientRect(), pad = 6, vw = innerWidth, vh = innerHeight;
  const x = Math.max(4, r.left - pad), y = Math.max(4, r.top - pad);
  const w = Math.min(vw - 8, r.right + pad) - x, h = Math.min(vh - 8, r.bottom + pad) - y;
  Object.assign(hole.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px" });
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  let tx, ty;
  if (r.right + 16 + tw < vw - 12 && h > vh * 0.5){ tx = r.right + 16; ty = Math.min(vh - th - 12, Math.max(12, r.top)); }  /* tall target: beside it */
  else if (y + h + 12 + th < vh - 12){ ty = y + h + 12; tx = r.left; }                                                  /* below */
  else if (y - 12 - th > 12){ ty = y - 12 - th; tx = r.left; }                                                          /* above */
  else { ty = vh - th - 12; tx = r.left; }
  tip.style.left = Math.max(12, Math.min(vw - tw - 12, tx)) + "px";
  tip.style.top = Math.max(12, ty) + "px";
}
function tourEnd(){
  tutSet(TOUR_KEY, true);

  removeEventListener("resize", tourPlace);

  if (then) then();
}

function sparkCard(key, name, colour){
  const h = S.mk.hist[key], ages = S.mk.ages || [];
  if (!h || h.length < 2) return "";
  const n = h.length, W = 200, H = 40, P = 4;
  const lo = Math.min(...h), hi = Math.max(...h);
  const x = i => P + i / (n - 1) * (W - 2 * P), y = v => H - P - (hi === lo ? 0.5 : (v - lo) / (hi - lo)) * (H - 2 * P);
  const d = h.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(" ");
  const last = h[n - 1] / h[n - 2] - 1, since = Math.pow(h[n - 1] / h[0], 1 / (n - 1)) - 1;
  const age0 = S.age - (n - 1);
  const hits = h.map((v, i) => {
    const tip = "<b>" + name + " · age " + (ages[i] !== undefined ? ages[i] : age0 + i) + "</b><div class=\"tr\">Index<span>" + v.toFixed(0) + "</span></div>" +
      (i ? '<div class="tr">That year<span>' + pctS(v / h[i - 1] - 1) + "</span></div>" : "");
    return '<g class="hx"' + tipAttr(tip) + '><line x1="' + x(i) + '" x2="' + x(i) + '" y1="0" y2="' + H + '" stroke="' + INK_FAINT + '" stroke-width="1"/><rect x="' + (x(i) - (W - 2 * P) / (n - 1) / 2) + '" y="0" width="' + ((W - 2 * P) / (n - 1)) + '" height="' + H + '" fill="transparent"/></g>';
  }).join("");
  return '<div class="mspark"><div class="mspark-h"><span>' + esc(name) + '</span><span class="num ' + (last >= 0 ? "pos" : "neg") + '">' + pctS(last) + "</span></div>" +
    '<svg viewBox="0 0 ' + W + " " + H + '" class="mspark-svg" role="img" aria-label="' + esc(name) + ' since age 18">' +
      '<path d="' + d + " L" + x(n - 1) + " " + H + " L" + x(0) + " " + H + ' Z" fill="' + colour + '" fill-opacity="0.1"/>' +
      '<path d="' + d + '" fill="none" stroke="' + colour + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<circle cx="' + x(n - 1) + '" cy="' + y(h[n - 1]) + '" r="4" fill="' + colour + '" stroke="#fbf7ef" stroke-width="2"/>' + hits + "</svg>" +
    '<div class="mspark-f">since 18: ' + pctS(since) + "/yr</div></div>";
}

    start: { inc: c.incomeTier, sup: c.supportTier, sav: c.savingsTier || savingsTierOf(c.savings), savings: Math.round(c.savings), hh: Math.round(c.hhIncome) },
    buffer: Math.round(Math.min(emergencyMonths(), 99) * 10) / 10, debt: Math.round(debtTotal()), inv: Math.round(invTotal()),
    cf: Math.round(netCashflow()), ls: Math.round(livingCosts().lifestyle / take * 100), insured: !!S.p.insured,
    short: S.stats.shortfalls || 0, tough: S.cls.tough || 0,
    job: S.p.job ? jobById(S.p.job).t : S.p.studying ? "Studying" : S.p.retired ? "Retired" : "Not working",
    hist
  };
}
function savingsTierOf(v){ return v >= 22000 ? 3 : v >= 6000 ? 2 : v >= 1500 ? 1 : 0; }

/* d_story.js logChoice calls this, so every choice the player makes reaches the teacher */
function classChoice(row){
  if (!S || !S.cls) return;
  S.cls.out.push({ seq: ++S.cls.seq, age: row.age, card: row.card, t: row.t, money: row.money, life: row.life });
  if (S.cls.out.length > 300) S.cls.out.splice(0, S.cls.out.length - 300);
}
/* f_turn.js nextInQueue: the hard knocks, counted so a ranking can show what each life went through */
function classCard(id){ if (S && S.cls && TOUGH.has(id)) S.cls.tough = (S.cls.tough || 0) + 1; }

/* one exchange with the class: send what changed, hear back pause, crash and ranking */
async function classTick(){
  if (clsBusyNet || !S || !S.cls || S.cls.done || PREVIEW) return;
  clsBusyNet = true;
  try {
    let stats = null;
    try { stats = classStats(); } catch (e){ console.error(e); }
    const js = stats ? JSON.stringify(stats) : "";
    const out = S.cls.out.slice(0, 60);
    const r = await rpc("report", { p_player: S.cls.pid, p_key: S.cls.key, p_stats: js && js !== clsSent ? stats : null, p_choices: out });
    if (js) clsSent = js;
    const sent = new Set(out.map(o => o.seq));
    S.cls.out = S.cls.out.filter(o => !sent.has(o.seq));
    S.cls.net = true;
    if (S.over && !S.cls.out.length) S.cls.done = true;              /* the final life is in: stop calling */
    classControl(r);
  } catch (e){
    S.cls.net = false;
    if (e.message === "NOT_IN_CLASS"){ S.cls = null; boardMsg = CLASS_ERR.NOT_IN_CLASS; if (S.phase === "board" && !busy) screenBoard(CLASS_ERR.NOT_IN_CLASS); }
  } finally { clsBusyNet = false; }
}
function classControl(r){
  if (!r || !S.cls) return;
  const was = S.cls.pause;
  S.cls.pause = r.pause_age;
  S.cls.rank = r.rank_mode;
  if (r.crash_id > (S.cls.crashSeen || 0)){ S.cls.crashSeen = r.crash_id; S.cls.crashDue = true; saveAuto(); }
  if (was !== S.cls.pause) classRollState();
  classCrash();
}
function classStart(){
  if (clsTimer || PREVIEW) return;
  clsTimer = setInterval(classTick, CLASS_POLL_MS);
  setTimeout(classTick, 400);
}

/* ---------- the teacher's pause: stop at an age until the teacher lets go ---------- */
function classHeld(){ return !!(S && S.cls && S.cls.pause !== null && S.cls.pause !== undefined && S.age >= S.cls.pause && !S.over); }
/* called after the board is drawn and whenever the roll is handed back */
function classRollState(){
  const rb = el("roll"), note = el("rollnote");
  if (!rb || !S || !S.cls || S.phase !== "board") return;
  if (classHeld()){
    rb.disabled = true; rb.classList.add("cls-held");
    if (note) note.innerHTML = '<span class="cls-pause">⏸ Your teacher has paused the class at age ' + S.cls.pause + ". Wait here — you can still look around.</span>";
  } else if (rb.classList.contains("cls-held")){
    rb.classList.remove("cls-held");
    rb.disabled = busy;
    if (note) note.textContent = rollHint();
  }
}

/* ---------- the teacher's crash: the same market fall lands in every game ---------- */
function classCrash(){
  if (!S || !S.cls || !S.cls.crashDue || S.over || S.phase !== "board" || busy || el("tour")) return;
  const card = EVENTS.find(e => e.id === "crash");
  if (!card) return;
  S.cls.crashDue = false;
  S.cls.tough = (S.cls.tough || 0) + 1;
  busy = true;
  const rb = el("roll"); if (rb) rb.disabled = true;
  if (docking) screenBoard();
  presentCard(card, "From your teacher · the whole class", busyOff);
}

    '<div class="cls-scroll"><table class="t cls-rank"><thead><tr><th>#</th><th>Name</th><th>Start</th><th>Age</th><th class="n">' + m.n + "</th>" +

    rows.map((p, i) => {

        (teacher ? "<td class='n'>" + (s.wb === undefined ? "—" : s.wb) + "</td><td class='n'>" + (s.tough || 0) + "</td>" : "") +

    }).join("") + "</tbody></table></div>" +

function teachStop(){ if (T && T.timer) clearInterval(T.timer); T = null; }
async function teachCall(fn, args, after){

  }
}

/* the habits behind the numbers */
function habitsHTML(ps){
  if (!ps.length) return '<p class="hint">Nobody has started yet.</p>';

function sparkHTML(h){
  if (h.length < 2) return "";
  const W = 520, H = 90, xs = h.map(r => r[0]), ys = h.map(r => r[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), lo = Math.min(0, ...ys), hi = Math.max(1, ...ys);
  const X = a => 6 + (a - x0) / Math.max(1, x1 - x0) * (W - 12), Y = v => H - 14 - (v - lo) / (hi - lo) * (H - 24);
  return '<svg class="cls-spark" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Net worth over the years">' +
    (lo < 0 ? '<line x1="0" x2="' + W + '" y1="' + Y(0) + '" y2="' + Y(0) + '" stroke="#d9cbb2"/>' : "") +
    '<polyline fill="none" stroke="#8a5a32" stroke-width="2" points="' + h.map(r => X(r[0]) + "," + Y(r[1])).join(" ") + '"/>' +
    '<text x="6" y="' + (H - 2) + '" font-size="10" fill="#8b7f6e">' + x0 + '</text><text x="' + (W - 6) + '" y="' + (H - 2) + '" font-size="10" fill="#8b7f6e" text-anchor="end">' + x1 + "</text>" +
    '<text x="' + (W - 6) + '" y="10" font-size="10" fill="#8b7f6e" text-anchor="end">net worth ' + kmoney(ys[ys.length - 1] * 1000) + "</text></svg>";
}

   ============================================================ */
function retire(){
  S.over = true;
  S.p.retired = true;
  S.age = END_AGE;
  /* work income stops — yours and a partner's. What is left is what you built. */
  S.p.job = null;
  S.p.salary = 0;
  S.p.sideIncome = 0;
  S.p.partnerInc = 0;
  S.p.allowance = 0;
  S.p.gig = null;
  if (S.cpf.ra === undefined) formRA("stay");
  /* CPF LIFE: the Retirement Account becomes a monthly payout for life (plan chosen on the next screen) */
  S.p.cpfLife = cpfLifeAt(S.p.cpfPlan, S.p.cpfStart, END_AGE);
  tl(END_AGE, "Reached 65." + (S.p.cpfLife ? " CPF LIFE pays " + money(S.p.cpfLife) + " a month." : ""));
  saveResult();
  screenRetire();
}

/* what can be drawn at 65: savings, investments, the CPF Ordinary Account and SRS (half of it taxed) */
function investableAt65(){ return S.p.cash + invTotal() + S.cpf.oa + srsBal() * 0.95; }
function retirementIncome(){
  /* what the position can actually pay out: 4% of investable + rent + CPF LIFE - costs - debt */
  const investable = investableAt65();
  const life = cpfLifeAt(S.p.cpfPlan, S.p.cpfStart, END_AGE);
  const draw = investable * 0.04 / 12 + life;
  const rent = (S.a.property && S.a.property.rentOut ? S.a.property.rentIncome : 0) + extraRent() + lodgerRent();
  const coupons = investIncome().paid;
  return Math.round(Math.max(draw, coupons + life) + rent + kidsGiving() - totalCosts() - loanMonthly());
}

/* ---------- how the net worth grew: stacked holdings, net worth after debts as a line ---------- */
const NW_SERIES = [
  { k: "cash", n: "Cash",        c: "#3a78c2" },
  { k: "inv",  n: "Investments", c: "#b8452f" },
  { k: "home", n: "Home equity", c: "#d09a1e" },
  { k: "cpf",  n: "CPF",         c: "#2f8f5a" },
  { k: "pt",   n: "Partner's",   c: "#9656b4" }
];
const GRID_LN = "#e6dccb";
function niceTicks(max, n){
  if (max <= 0) return [0];
  const raw = max / (n || 3), mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => s >= raw);
  const out = [];
  for (let v = 0; v <= max + step * 0.001; v += step) out.push(v);
  if (out[out.length - 1] < max) out.push(out[out.length - 1] + step);
  return out;
}
function netWorthChart(){
  const rows = (S.hist || []).slice(), W = 760, H = 230, L = 56, R = 12, T = 10, B = 24;
  if (rows.length < 2) return '<div class="hint">Not enough years to draw.</div>';
  const tot = r => NW_SERIES.reduce((a, s) => a + (r[s.k] || 0), 0);
  const max = Math.max(...rows.map(r => Math.max(tot(r), r.nw)));
  const ticks = niceTicks(max, 4), top = ticks[ticks.length - 1];
  const a0 = rows[0].age, a1 = rows[rows.length - 1].age;
  const x = age => L + (a1 === a0 ? 0 : (age - a0) / (a1 - a0)) * (W - L - R);
  const y = v => T + (1 - Math.max(0, v) / top) * (H - T - B);
  let base = rows.map(() => 0), svg = "";
  for (const v of ticks) svg += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="' + GRID_LN + '" stroke-width="1"/>' +
    '<text x="' + (L - 6) + '" y="' + (y(v) + 3.5) + '" text-anchor="end" class="ax">' + (v ? kmoney(v) : "0") + "</text>";
  for (let a = Math.ceil(a0 / 5) * 5; a <= a1; a += 5) svg += '<text x="' + x(a) + '" y="' + (H - 8) + '" text-anchor="middle" class="ax">' + a + "</text>";
  for (const s of NW_SERIES){
    const upper = rows.map((r, i) => base[i] + (r[s.k] || 0));
    if (upper.every((v, i) => v === base[i])) continue;
    const topPath = rows.map((r, i) => (i ? "L" : "M") + x(r.age).toFixed(1) + " " + y(upper[i]).toFixed(1)).join(" ");
    const bottom = rows.slice().reverse().map((r, j) => "L" + x(r.age).toFixed(1) + " " + y(base[rows.length - 1 - j]).toFixed(1)).join(" ");
    svg += '<path d="' + topPath + " " + bottom + ' Z" fill="' + s.c + '" fill-opacity="0.16"/>' +
           '<path d="' + topPath + '" fill="none" stroke="' + s.c + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    base = upper;
  }
  svg += '<path d="' + rows.map((r, i) => (i ? "L" : "M") + x(r.age).toFixed(1) + " " + y(r.nw).toFixed(1)).join(" ") + '" fill="none" stroke="' + INK + '" stroke-width="2" stroke-linejoin="round"/>';
  const last = rows[rows.length - 1];
  svg += '<circle cx="' + x(last.age) + '" cy="' + y(last.nw) + '" r="4" fill="' + INK + '" stroke="#fbf7ef" stroke-width="2"/>';
  const colW = (W - L - R) / Math.max(1, rows.length - 1);
  svg += rows.map(r => {
    const tip = "<b>Age " + r.age + "</b>" + NW_SERIES.filter(s => r[s.k]).map(s => '<div class="tr"><i style="background:' + s.c + '"></i>' + s.n + "<span>" + kmoney(r[s.k]) + "</span></div>").join("") +
      '<div class="tr tot">Net worth<span>' + kmoney(r.nw) + "</span></div>" + (r.cpi > 1.05 ? '<div class="tq">≈ ' + kmoney(r.nw / r.cpi) + " in today's money</div>" : "");
    return '<g class="hx"' + tipAttr(tip) + '><line x1="' + x(r.age) + '" x2="' + x(r.age) + '" y1="' + T + '" y2="' + (H - B) + '" stroke="' + INK_FAINT + '" stroke-width="1"/>' +
      '<rect x="' + (x(r.age) - colW / 2) + '" y="' + T + '" width="' + colW + '" height="' + (H - T - B) + '" fill="transparent"/></g>';
  }).join("");
  const legend = '<div class="legend">' + NW_SERIES.filter(s => rows.some(r => r[s.k])).map(s => '<span><i style="background:' + s.c + '"></i>' + s.n + "</span>").join("") +
    '<span><i class="ln" style="background:' + INK + '"></i>Net worth, after debts</span></div>';
  return legend + '<svg class="ov-chart" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Net worth by age">' + svg + "</svg>";
}
/* net worth at each decade, in today's money */
function nwMilestones(){
  const at = a => (S.hist || []).find(r => r.age === a);
  return [25, 35, 45, 55, 65].map(a => { const r = at(a); return r ? [a, r.nw / (r.cpi || 1)] : null; }).filter(Boolean);
}

          '<div class="row tot"><div class="l">Net worth</div><div class="v">' + money(nw) + "</div></div>" +
        "</div></div></div>" +
        '<div class="panel mb"><div class="panel-h"><h3>What a month now costs you</h3></div><div class="panel-b"><div class="rows">' +
          Object.entries(livingCosts()).filter(r => r[1] > 0)
            .map(r => '<div class="row"><div class="l" style="text-transform:capitalize">' + r[0] + '</div><div class="v neg">-' + money(r[1]) + "</div></div>").join("") +
          (loanMonthly() ? '<div class="row"><div class="l">Debt repayments</div><div class="v neg">-' + money(loanMonthly()) + "</div></div>" : "") +
          '<div class="row"><div class="l">CPF LIFE payout' + (start > 65 ? " (from " + start + ")" : "") + '</div><div class="v pos">' + money(life65) + "</div></div>" +
          '<div class="row"><div class="l">Drawn from savings, investments, CPF Ordinary and SRS (4% a year)</div><div class="v pos">' + money(Math.round(investable * 0.04 / 12)) + "</div></div>" +
          (S.a.property && S.a.property.rentOut ? '<div class="row"><div class="l">Rent received</div><div class="v pos">' + money(S.a.property.rentIncome) + "</div></div>" : "") +
          (kidsGiving() ? '<div class="row"><div class="l">From your children</div><div class="v pos">' + money(kidsGiving()) + "</div></div>" : "") +
          '<div class="row tot"><div class="l">Left over each month</div><div class="v ' + (ri_ < 0 ? "neg" : "pos") + '">' + moneyS(ri_) + "</div></div>" +
        "</div>" +
        (frugalRi - ri_ > 50
          ? '<div class="hint mt-s">Living at the cheapest level in every category, the same position would leave you <b class="' +
            (frugalRi < 0 ? "neg" : "pos") + '">' + moneyS(frugalRi) + '</b> a month.</div>'
          : '<div class="hint mt-s">You are already living at the cheapest level in every category.</div>') +
        "</div></div>" +
        '<div class="panel mb"><div class="panel-h"><h3>The world you lived through</h3></div><div class="panel-b">' +
          '<div class="rows"><div class="row"><div class="l">Prices vs age 18</div><div class="v">' + Math.round(S.econ.cpi * 100) + "</div></div>" +
          '<div class="row"><div class="l">' + money(10000) + ' in cash at 18 now buys</div><div class="v">' + money(10000 / S.econ.cpi) + "</div></div>" +
          '<div class="row"><div class="l">Years employed</div><div class="v">' + S.stats.yearsWorked + "</div></div>" +
          '<div class="row"><div class="l">Peak net worth</div><div class="v">' + kmoney(S.stats.peakNW) + "</div></div>" +
          '<div class="row"><div class="l">Lowest net worth</div><div class="v">' + kmoney(S.stats.lowNW) + "</div></div>" +
          '<div class="row"><div class="l">Credit standing</div><div class="v">' + S.p.credit + "</div></div></div>" +
        "</div></div>" +
        '<div class="panel"><div class="panel-b center">' +
          '<p class="hint mb" style="font-size:14px;font-family:var(--serif);font-style:italic">Your life has ended.<br>What would you do differently?</p>' +
          '<div class="btn-row" style="justify-content:center"><button class="btn primary big" id="again">Play again</button>' +
          '<button class="btn" id="lb">Past lives</button>' + (S.cls ? '<button class="btn" id="seecls">🏫 See your class</button>' : "") + "</div>" +
          '<div class="hint mt-s">Seed ' + S.seed + "</div>" +
        "</div></div>" +
      "</div>" +
    "</div></div>");

  el("again").onclick = () => { clearAuto(); screenTitle(); };
  el("lb").onclick = () => screenLeaderboard();
  if (el("seecls")) el("seecls").onclick = () => openClass();
  document.querySelectorAll("#cpflife [data-plan]").forEach(b => { b.onclick = () => { S.p.cpfPlan = b.dataset.plan; S.p.cpfLife = cpfLifeAt(S.p.cpfPlan, S.p.cpfStart, END_AGE); const y = scrollY; screenRetire(); scrollTo(0, y); }; });
  document.querySelectorAll("#cpflife [data-start]").forEach(b => { b.onclick = () => { S.p.cpfStart = +b.dataset.start; S.p.cpfLife = cpfLifeAt(S.p.cpfPlan, S.p.cpfStart, END_AGE); const y = scrollY; screenRetire(); scrollTo(0, y); }; });
  bindTips();
}

/* ============================================================
   17. LEADERBOARD  (context, never one number)
   ============================================================ */
const LB_KEY = "life_fin_board_v1";
const SAVE_KEY = "life_fin_save_v1";

function saveResult(){
  let board = [];
  try { board = JSON.parse(localStorage.getItem(LB_KEY) || "[]"); } catch (e){ board = []; }
  board.push({
    seed: S.seed, when: Date.now(),
    start: S.stats.startWealth, end: Math.round(netWorth()),
    income: Math.round(S.stats.income), spend: Math.round(S.stats.spend),
    inv: Math.round(S.stats.invGain), interest: Math.round(S.stats.interest),
    cf: retirementIncome(), path: (S.p.quals[0] || "No further study"),
    hh: S.c.hhIncome, support: S.c.eduSupport
  });
  board = board.slice(-40);
  try { localStorage.setItem(LB_KEY, JSON.stringify(board)); } catch (e){}
}
function screenLeaderboard(){
  let board = [];
  try { board = JSON.parse(localStorage.getItem(LB_KEY) || "[]"); } catch (e){ board = []; }
  board = board.slice().reverse();
  const rows = board.length ? board.map((b, i) => {
    const ch = b.end - b.start;
    return "<tr><td>#" + (board.length - i) + '<div class="hint">seed ' + b.seed + "</div></td>" +
      "<td>" + esc(b.path) + '<div class="hint">household ' + money(b.hh) + "/mo · fees covered " + Math.round(b.support * 100) + "%</div></td>" +
      '<td class="n">' + money(b.start) + "</td>" +
      '<td class="n">' + kmoney(b.end) + "</td>" +
      '<td class="n ' + (ch < 0 ? "neg" : "pos") + '">' + moneyS(ch) + "</td>" +
      '<td class="n">' + kmoney(b.income) + "</td>" +
      '<td class="n ' + (b.inv < 0 ? "neg" : "") + '">' + kmoney(b.inv) + "</td>" +
      '<td class="n neg">' + kmoney(b.interest) + "</td>" +
      '<td class="n ' + (b.cf < 0 ? "neg" : "pos") + '">' + moneyS(b.cf) + "</td></tr>";
  }).join("") : '<tr><td colspan="9" class="hint" style="padding:22px">No finished lives on this device yet.</td></tr>';

  show('<div class="wrap">' +
    '<div class="ret-head"><div class="k">On this device</div><h1>PAST LIVES</h1>' +
    '<div class="sub">Where somebody started is part of the result, not a footnote to it.</div></div>' +
    '<div class="panel"><div class="panel-b" style="overflow:auto">' +
    "<table class='t'><thead><tr><th>Run</th><th>Path</th><th style='text-align:right'>Starting wealth</th>" +
    "<th style='text-align:right'>Final net worth</th><th style='text-align:right'>Change</th><th style='text-align:right'>Earned</th>" +
    "<th style='text-align:right'>Investment gains</th><th style='text-align:right'>Interest paid</th><th style='text-align:right'>Monthly at 65</th></tr></thead>" +
    "<tbody>" + rows + "</tbody></table></div></div>" +
    '<div class="btn-row mt" style="justify-content:center"><button class="btn primary big" id="back">New life</button>' +
    (board.length ? '<button class="btn danger" id="clr">Clear</button>' : "") + "</div></div>");
  el("back").onclick = () => screenTitle();
  if (el("clr")) el("clr").onclick = () => { localStorage.removeItem(LB_KEY); screenLeaderboard(); };
}

/* ============================================================
   18. SAVE / RESUME
   ============================================================ */
function saveAuto(){
  if (PREVIEW) return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ s: S, seed: S.seed, tile: S.tile })); } catch (e){}
}
/* the autosave lands straight after a year is simulated, so a reload can arrive before that
   year's cards, shortfall or guided step were dealt with — finish them before the next roll */
function resumeTurn(){
  if (S.age >= PLAY_END){ retire(); return; }
  const step = dueChapterStep();
  if (S.p.cash < 0 || (S.queue && S.queue.length) || step || reviewDue()){
    busy = true;
    const r = el("roll"); if (r) r.disabled = true;
    afterYear(step);
  }
}
function clearAuto(){ try { localStorage.removeItem(SAVE_KEY); } catch (e){} }
function loadAuto(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d || !d.s || d.s.over) return false;
    S = d.s;
    S.cpf = S.cpf || { oa: 0, sa: 0, ma: 0 };                 /* saves from before CPF */
    S.econ.rateHist = S.econ.rateHist || [S.econ.rate];
    ensureLife();
    if (!S.mk.px) initInvest();                               /* saves from before prices and units */
    invState();
    RNG = mulberry32(S.seed + S.tile * 7919 + Math.floor(S.p.cash));
    return true;
  } catch (e){ return false; }
}

/* ============================================================
   19. BOOT
   ============================================================ */
(function boot(){
  /* Escape presses the screen's own way out, so whatever it was going to do next still happens.
     A card, a roll or a year card has no way out on purpose: wiping it would leave the turn
     waiting for a choice that can no longer be made, and the board locked. */
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape" || el("tour") || el("tutnext")) return;        /* the tutorial and tour have their own */
    const box = el("veil").classList.contains("on") ? el("modal") : docking ? el("drawerBody") : null;
    if (!box) return;
    const exit = box.querySelector(ESC_EXITS);
    if (exit){ if (!exit.disabled) exit.click(); }
    else if (box !== el("modal") && !busy && !diceInAir) screenBoard();             /* a tool pop-up opened from the board */
  });
  el("veil").addEventListener("click", e => { if (e.target === el("veil")) { /* cards are modal on purpose */ } });

  if (classBoot()) return;                         /* a teacher or join link (t_class.js) */
  if (loadAuto()){
    if (S.cls) classStart();
    /* offer to resume */
    show('<div class="title-stage"><div class="title-card">' +
      "<h1>LIFE</h1><div class='sub'>Your Financial Journey</div>" +
      "<p class='creed'>A life is already in progress.<br>Age <b>" + S.age + "</b> · net worth <b>" + kmoney(netWorth()) + "</b></p>" +
      '<div class="btn-row" style="justify-content:center"><button class="btn primary big" id="res">Resume</button>' +
      '<button class="btn big" id="fresh">Start a new life</button></div></div></div>');
    el("res").onclick = () => { S.phase = "board"; screenBoard(); resumeTurn(); };
    el("fresh").onclick = () => { clearAuto(); screenTitle(); };
  } else {
    screenTitle();
  }
})();

</script>
