  home:  { name: "Bank home loan",  spread: 0.008, term: 25, secured: true },
  car:   { name: "Car loan",        spread: 0.030, term: 7,  secured: true },
  pers:  { name: "Personal loan",   spread: 0.062, term: 5,  secured: false },
  cc:    { name: "Credit card balance", spread: 0,  term: 5,  secured: false }
};
function creditAdj(){
  const cr = S.p.credit;
  if (cr >= 780) return -0.008;
  if (cr >= 720) return -0.004;
  if (cr >= 660) return 0;
  if (cr >= 600) return 0.012;
  if (cr >= 540) return 0.030;
  return 0.055;
}
function quoteLoan(kind, amount, years, fixed){
  const k = LOAN_KINDS[kind];
  const term = years || k.term;
  /* fixing the rate costs a little more today and buys certainty later */
  /* parents charge nothing; the HDB loan is pegged at 0.1% over the CPF rate, not the market */
  const rate = kind === "family" ? 0 : kind === "hdb" ? 0.026 : kind === "cc" ? CC_RATE
    : Math.max(0.012, S.econ.rate + k.spread + (kind === "pers" || kind === "car" ? creditAdj() : 0) + (fixed ? 0.006 : 0));   /* home and tuition loans are not priced on your credit file */
  const n = term * 12, r = rate / 12;
  const monthly = r === 0 ? amount / n : amount * r / (1 - Math.pow(1 + r, -n));
  return { kind, name: k.name, amount, rate, years: term, fixed: !!fixed, monthly: Math.round(monthly), total: Math.round(monthly * n) };
}
/* will anyone lend to this person at all? */
function willLend(){
  const inc = grossIncome();
  if (S.p.credit < 520) return false;
  if (inc <= 0) return false;
  if (loanMonthly() > inc * 0.50) return false;          // already over-committed
  if (S.p.missed >= 2) return false;
  return true;
}
function borrowMax(kind){
  if (!willLend()) return 0;
  const cap = Math.max(0, (grossIncome() - totalCosts() - loanMonthly()) * 0.62);
  if (cap <= 0) return 0;
  const q = quoteLoan(kind, 100000);
  return Math.floor(100000 * cap / q.monthly / 1000) * 1000;
}
function takeLoan(kind, amount, years, fixed){
  const q = quoteLoan(kind, amount, years, fixed);
  S.loans.push({
    id: kind + "-" + Math.round(rnd() * 1e6), kind, name: q.name, bal: amount,
    rate: q.rate, monthly: q.monthly, years: q.years,
    variable: !fixed && (kind === "home" || kind === "pers"), fixed: !!fixed, taken: S.age,
    /* bank home loans: a lock-in (2 years, 3 on a fixed package); fixed packages float after 3 years (d_loans.js) */
    lockUntil: kind === "home" ? S.age + (fixed ? 3 : 2) : -1, fixedUntil: kind === "home" && fixed ? S.age + 3 : undefined
  });
  S.p.cash += amount;
  lg("Borrowed " + money(amount) + " — " + q.name + " at " + pct(q.rate, 2) +
     (fixed ? " fixed" : "") + ", " + money(q.monthly) + "/mo for " + q.years + "y.");
  return q;
}
/* Tuition loans and money from parents: the balance builds while you study and
   nothing is paid, and no interest runs, until you are through (and, for your
   parents, until you are earning). */
function addDeferred(kind, amount, why){
  amount = Math.round(amount);
  if (!(amount > 0)) return;
  let l = S.loans.find(x => x.kind === kind && x.deferred);
  if (!l){
    l = { id: kind + "-" + Math.round(rnd() * 1e6), kind, name: LOAN_KINDS[kind].name, bal: 0, rate: 0, monthly: 0,
          years: LOAN_KINDS[kind].term, variable: false, fixed: true, taken: S.age, deferred: true };
    S.loans.push(l);
  }
  l.bal += amount;
  if (why) lg(why);
}
function startDeferred(){
  const notes = [];
  for (const l of S.loans){
    if (!l.deferred) continue;
    if (S.p.studying){ l.doneAt = undefined; continue; }
    if (l.doneAt === undefined) l.doneAt = S.age;
    /* parents wait until you earn; the tuition loan waits until you earn, or two years */
    const due = l.kind === "family" ? !!S.p.job : !!S.p.job || S.age >= l.doneAt + 2;
    if (!due) continue;
    const q = quoteLoan(l.kind, l.bal, l.years, true);
    l.deferred = false; l.rate = q.rate; l.monthly = q.monthly; l.taken = S.age;
    const msg = (l.kind === "family" ? "Repaying your parents: " : "Tuition loan repayments begin: ") +
      money(l.monthly) + "/mo for " + l.years + " years" + (q.rate ? " at " + pct(q.rate, 2) : ", interest-free") + ".";
    notes.push(msg); tl(S.age, msg); lg(msg);
  }
  return notes;
}
function repayLoan(loan, amount){
  const pay = Math.min(amount, loan.bal, S.p.cash);
  loan.bal -= pay; S.p.cash -= pay;
  if (loan.bal <= 10){
    S.loans = S.loans.filter(l => l !== loan);
    lg(loan.name + " fully repaid.");
    tl(S.age, loan.name + " cleared.");
    S.p.credit = clamp(S.p.credit + 18, 300, 850);
  } else if (loan.kind === "cc"){
    loan.monthly = Math.max(50, Math.round(loan.bal * 0.03));
    lg("Paid " + money(pay) + " off the credit card.");
  } else if (!loan.deferred){
    const r = loan.rate / 12, n = loan.years * 12;
    loan.monthly = Math.round(r ? loan.bal * r / (1 - Math.pow(1 + r, -Math.max(12, n))) : loan.bal / Math.max(12, n));
    lg("Paid " + money(pay) + " off the " + loan.name.toLowerCase() + ".");
  }
  return pay;
}

/* ============================================================
   3b. A COUPLE'S MONEY — own and shared
   Married, each person keeps their own cash and their own CPF (S.p.pt holds the partner's).
   Household bills are split by take-home pay, automatically. A loan can be shared: `l.pt`
   is the part of each repayment the partner pays. A home records what each person has put
   into it (down payment, repayments) and, when sold, each gets that share of the cash left.
   Fair, here, means paying in line with your share of the household's income; paying well
   above it breeds resentment (the partner) or wears you down (you).
   ============================================================ */

/* what a partner brings: savings and CPF from the years they have worked */
function partnerStart(){
  const p = S.p, t = partnerTypeOf(), yrs = Math.max(0, S.age - 23), cpi = S.econ.cpi;
  const inc = p.partnerInc || 0, gross = Math.min(inc / 0.8, CPF_CEILING * cpi);
  const worked = t.id === "study" ? yrs * 0.3 : t.id === "home" ? yrs * 0.5 : yrs;
  return {
    cash: Math.round(inc * 12 * worked * 0.14 * rf(0.5, 1.5) + 3000 * cpi),
    oa: Math.round(gross * 0.23 * 12 * worked * 0.8),
    sa: Math.round(gross * 0.06 * 12 * worked),
    ma: Math.round(gross * 0.08 * 12 * worked * 0.9)
  };
}
function ptState(){
  const p = S.p;
  if (!p.partner) return null;
  if (!p.pt) p.pt = partnerStart();
  return p.pt;
}
const ptInc = () => S.p.partner ? (S.p.partnerInc || 0) : 0;
/* their take-home is about 80% of what they earn; CPF on the rest, up to the ceiling */
const ptCpfWage = () => Math.min(ptInc() / 0.8, CPF_CEILING * S.econ.cpi);
function myTakeHome(){ return grossIncome() - ptInc() - taxMonthly() - cpfEmployee(); }
/* the part of the household's bills that is yours: your share of the take-home pay */
function billShare(){
  if (!S.p.partner) return 1;
  const me = Math.max(0, myTakeHome()), pt = Math.max(0, ptInc());
  return me + pt > 0 ? me / (me + pt) : 1;
}
/* the partner's fair share of anything shared */
const fairPt = () => 1 - billShare();
const loanPt = l => S.p.partner ? (l.pt || 0) : 0;
function ptLoanMonthly(){ return S.loans.reduce((a, l) => a + (l.deferred ? 0 : l.monthly * loanPt(l)), 0); }
/* the partner's Ordinary Account pays their part of the home loan, if the home was bought that way */
function ptCpfMortgage(){
  const pr = S.a.property, pt = ptState();
  if (!pt || !pr || !pr.cpfMonthly) return 0;
  const m = S.loans.filter(isMortgage).reduce((a, l) => a + l.monthly * loanPt(l), 0);
  if (!m) return 0;
  const inflow = ptCpfWage() * cpfRates(S.age).oa;
  return pt.oa >= m * 12 ? m : Math.round(Math.min(m, inflow + pt.oa / 12));
}
/* what the partner has left over each month after their share of everything */
function ptNetMonthly(){
  return ptInc() - totalCosts() * (1 - billShare()) - (ptLoanMonthly() - ptCpfMortgage());
}
const ptTotal = () => { const pt = S.p.partner && S.p.pt; return pt ? pt.cash + pt.oa + pt.sa + pt.ma + ptInvTotal() : 0; };
const ptCpf = () => { const pt = S.p.partner && S.p.pt; return pt ? pt.oa + pt.sa + pt.ma : 0; };

/* ---- the partner invests their own savings, in their own way (PARTNER_TYPES[].inv) ----
   pt.inv holds dollars per asset. Each year it earns exactly what that asset paid in the
   market (S.mk.rets, price move plus income, reinvested). Above a cash buffer of a few
   months of their bills, savings go in. The savvy rebalance and sit through crashes;
   the nervous may sell their shares after a crash and stay in T-bills for three years. */
const ptInvTotal = () => { const pt = S.p.partner && S.p.pt; return pt && pt.inv ? Object.values(pt.inv).reduce((a, v) => a + v, 0) : 0; };
const ptLiquid = () => { const pt = S.p.partner && S.p.pt; return pt ? Math.max(0, pt.cash) + ptInvTotal() : 0; };
const PT_SAFE_FIRST = ["tbill", "ssb", "sgs", "bond", "gold", "reit", "etf"];
/* raise amt for the partner: their cash first, then their investments, safest first */
function ptTake(amt){
  const pt = ptState(); if (!pt || amt <= 0) return 0;
  const fromCash = Math.min(Math.max(0, pt.cash), amt); pt.cash -= fromCash;
  return fromCash + ptSell(amt - fromCash);
}
/* sell their holdings for this much cash; returns what came in */
function ptSell(amt){
  const pt = ptState(), inv = pt && pt.inv; let got = 0;
  if (!inv || amt <= 0) return 0;
  for (const k of PT_SAFE_FIRST){
    if (got >= amt) break;
    const keep = 1 - INSTR[k].fee, v = inv[k] || 0, sell = Math.min(v, (amt - got) / keep);
    inv[k] = v - sell; got += sell * keep;
    if (inv[k] < 1) delete inv[k];
  }
  return got;
}
function ptInvest(notes){
  const pt = ptState(), st = partnerTypeOf().inv;
  if (!pt || !st || !S.mk.rets) return;
  const inv = pt.inv = pt.inv || {}, r = S.mk.rets, cpi = S.econ.cpi;
  if (pt.invAge === S.age) return;               /* once a year */
  pt.invAge = S.age;
  for (const k of Object.keys(inv)) inv[k] *= 1 + (r[k] || 0);
  const shares = (inv.etf || 0) + (inv.reit || 0);
  if ((S.mk.etfRet || 0) < -0.2 && shares > 1000 * cpi && rnd() < st.panic){
    for (const k of ["etf", "reit"]) if (inv[k]){ inv.tbill = (inv.tbill || 0) + inv[k] * (1 - INSTR[k].fee); delete inv[k]; }
    pt.panicAt = S.age;
    if (notes) notes.push("Stocks fell " + pctS(S.mk.etfRet) + ". Your partner sold all their shares in a panic and is sitting in T-bills.");
    tl(S.age, "Partner sold their shares in the crash.");
  }
  const scared = pt.panicAt !== undefined && S.age - pt.panicAt < 3;
  const mix = scared ? { tbill: 0.6, ssb: 0.4 } : st.mix;
  const buf = Math.max(3000 * cpi, totalCosts() * (1 - billShare()) * st.buf);
  const add = pt.cash - buf > 500 * cpi ? pt.cash - buf : 0;
  pt.cash -= add;
  if (st.rebal && !scared){
    let tot = add;
    for (const k of Object.keys(inv)) tot += inv[k];
    for (const k of Object.keys(inv)) delete inv[k];
    for (const k of Object.keys(mix)) inv[k] = tot * mix[k] * (1 - INSTR[k].fee * 0.2);   /* rebalancing trades only the difference */
  } else for (const k of Object.keys(mix)) inv[k] = (inv[k] || 0) + add * mix[k] * (1 - INSTR[k].fee);
  /* the Singapore Savings Bond cap is per person */
  if ((inv.ssb || 0) > SSB_CAP){ inv.tbill = (inv.tbill || 0) + inv.ssb - SSB_CAP; inv.ssb = SSB_CAP; }
}

/* a year of the partner's money: called from stepCash with what they actually repaid */
function stepCouple(ptDebt, ptMort, notes){
  const pt = ptState();
  if (!pt) return;
  const cr = cpfRates(S.age), w = ptCpfWage();
  const inOA = w * cr.oa * 12;
  const cpfPay = S.a.property && S.a.property.cpfMonthly ? Math.min(pt.oa + inOA, ptMort) : 0;
  pt.oa += inOA - cpfPay; pt.sa += w * cr.sa * 12; pt.ma += w * cr.ma * 12;
  if (cpfPay) S.a.property.ptCpfUsed = (S.a.property.ptCpfUsed || 0) + cpfPay;
  pt.oa *= 1.025; pt.sa *= 1.04; pt.ma *= 1.04;
  pt.cash += ptInc() * 12 - totalCosts() * (1 - billShare()) * 12 - (ptDebt - cpfPay);
  if (pt.cash > 0) pt.cash *= 1 + depositRate();
  /* short of cash: they sell investments first; only then do you cover them */
  if (pt.cash < 0) pt.cash += ptSell(-pt.cash);
  if (pt.cash < 0){
    S.p.cash += pt.cash;
    if (notes) notes.push("Your partner ran short; you covered " + money(-pt.cash) + " of their share.");
    pt.cash = 0;
  }
  ptInvest(notes);
  stepFairness(notes);
}

/* who is carrying the home: resentment if the partner pays well above their share of the
   income, and a little wear on you if you pay well above yours */
function stepFairness(notes){
  const p = S.p;
  const l = S.loans.find(x => isMortgage(x) && x.shared);
  if (!p.partner || !l) return;
  const over = loanPt(l) - fairPt();
  if (over > 0.15){
    p.tension = (p.tension || 0) + Math.min(1.5, (over - 0.1) * 5);
    if (notes && rnd() < 0.5) notes.push("Your partner pays " + pct(loanPt(l), 0) + " of the home loan on " + pct(fairPt(), 0) + " of the income. It has been mentioned.");
  } else if (over < -0.25 && rnd() < -over){
    p.burnout++;
    if (notes) notes.push("You carry " + pct(1 - loanPt(l), 0) + " of the home loan on " + pct(billShare(), 0) + " of the income. It is wearing you down.");
  }
}
/* the one-off at the moment of buying: whoever put in far more remembers it */
function fairnessAtPurchase(ptDown){
  const over = ptDown - fairPt();
  if (over > 0.2) S.p.tension = (S.p.tension || 0) + Math.round(over * 4 * 10) / 10;
  else if (over < -0.3) S.p.burnout++;
}
/* the partner's ownership share of a home, from what each has put in */
function ptOwnShare(h){
  const me = h.paidMe || 0, pt = h.paidPt || 0;
  return me + pt > 0 ? pt / (me + pt) : 0;
}

/* ============================================================
   5. YEARLY SIMULATION  (economy -> markets -> work -> cash -> debt)
   ============================================================ */

function stepEconomy(){
  const e = S.econ;
  e.prevRegime = e.regime;
  e.regime = pickW(REGIME_NEXT[e.regime]);
  const rg = REGIMES[e.regime];

  e.prevRate = e.rate;
  /* inflation and policy rate drift toward regime targets rather than jumping */
  const targetI = rf(rg.infl[0], rg.infl[1]);
  const targetR = rf(rg.rate[0], rg.rate[1]);
  e.infl = clamp(e.infl * 0.42 + targetI * 0.58 + gauss() * 0.006, -0.012, 0.135);
  e.rate = clamp(e.rate * 0.5 + targetR * 0.5 + gauss() * 0.005, 0.004, 0.115);
  e.cpi *= (1 + e.infl);
  (e.rateHist = e.rateHist || []).push(e.rate);
  if (e.rateHist.length > 60) e.rateHist.shift();

  const uTarget = e.regime === "recession" ? 0.085 : e.regime === "inflation" ? 0.052 : e.regime === "expansion" ? 0.027 : 0.041;
  e.unemp = clamp(e.unemp * 0.55 + uTarget * 0.45 + gauss() * 0.006, 0.015, 0.14);

  /* headlines: clues, in random order, never the regime name */
  const hl = [];
  const pool = HEADLINES[e.regime].slice();
  const n = ri(2, 3);
  for (let i = 0; i < n && pool.length; i++) hl.push(pool.splice(Math.floor(rnd() * pool.length), 1)[0]);
  const dr = e.rate - e.prevRate;
  hl.push(pick(RATE_NEWS[dr > 0.004 ? "up" : dr < -0.004 ? "down" : "flat"]));
  if (e.infl > 0.05) hl.push("Cost of living rose " + pct(e.infl) + " over the year.");
  e.headlines = hl;
  return e;
}

function stepMarkets(){
  const rg = REGIMES[S.econ.regime], mk = S.mk;
  /* equity: regime mean + fat-ish tail noise, penalised when rates jump */
  const rateShock = (S.econ.rate - S.econ.prevRate) * -2.4;
  let eq = rg.equity[0] + gauss() * rg.equity[1] + rateShock;
  /* cheap markets tend to do a little better from there, dear ones a little worse:
     the pull of the dividend yield against its usual ~4% */
  if (!mk.px) initInvest();
  eq += 0.02 * Math.log(mk.dpu.etf / mk.px.etf / 0.04);
  let shock = null;
  if (rnd() < 0.05){ eq += rf(-0.28, -0.10); shock = "crash"; }   // occasional crash independent of regime
  if (rnd() < 0.04){ eq += rf(0.12, 0.26); shock = shock ? null : "rally"; }   // occasional melt-up
  eq = clamp(eq, -0.46, 0.58);   // a bad year can be brutal, but not beyond what markets have actually done

  /* property: two markets, each pulled back toward a fair price.
     HDB resale prices are kept within reach of incomes, so their fair level grows only
     0.3% a year faster than prices (and each flat still loses value as its lease runs down).
     Private property is pulled toward 1.5% a year above inflation (cooling measures bring the
     realised figure to about 1.2%) and swings much harder; freehold
     condos and landed houses add their own premium on top (TIER_TILT in c_home.js). Last year's move carries on — booms
     and slumps run for a few years — until the gap to fair value, or the government,
     stops them. */
  const infl = S.econ.infl, dRate = S.econ.rate - S.econ.prevRate, yrs = S.age - START_AGE;
  if (mk.hdb === undefined){ mk.hdb = mk.prop; mk.hdbReal = 0; mk.privReal = 0; mk.cool = 0; mk.coolAt = -99; mk.realHist = []; }
  const gapH = Math.log(mk.hdb / (100 * S.econ.cpi * Math.pow(1.003, yrs)));
  const gapP = Math.log(mk.prop / (100 * S.econ.cpi * Math.pow(1.015, yrs)));
  const cooling = mk.cool > 0 ? 1 : 0;
  let hr = infl + rg.hdb + mk.hdbReal * 0.45 - gapH * 0.17 + gauss() * 0.034 + dRate * -0.8 - cooling * 0.03;
  let pr = infl + rg.priv + mk.privReal * 0.5 - gapP * 0.14 + gauss() * 0.05 + dRate * -1.6 - cooling * 0.045;
  if (rnd() < 0.035){ const hit = rf(-0.20, -0.08); pr += hit; hr += hit * 0.4; if (!shock) shock = "propdrop"; }
  hr = clamp(hr, -0.15, 0.20);
  pr = clamp(pr, -0.30, 0.30);
  mk.hdbReal = (1 + hr) / (1 + infl) - 1; mk.privReal = (1 + pr) / (1 + infl) - 1;
  if (mk.cool > 0) mk.cool--;
  /* three hot years in a row and the government steps in: stamp duty up, loans tighter */
  mk.realHist.push([mk.hdb / S.econ.cpi * (1 + mk.hdbReal), mk.prop / S.econ.cpi * (1 + mk.privReal)]);
  if (mk.realHist.length > 4) mk.realHist.shift();
  const h0 = mk.realHist[0], h1 = mk.realHist[mk.realHist.length - 1];
  let cooled = false;
  if (!mk.cool && S.age - mk.coolAt >= 5 && mk.realHist.length === 4 && (h1[0] / h0[0] > 1.15 || h1[1] / h0[1] > 1.20)){
    mk.cool = 3; mk.coolAt = S.age; cooled = true;
  }

  /* everything bought in units — bonds, funds, gold — moves in b_invest.js */
  const oldCorp = mk.px.bond;
  const inv = stepInvest(eq, pr, shock);
  const bd = mk.px.bond / oldCorp - 1;

  mk.etfRet = eq; mk.propRet = pr; mk.hdbRet = hr; mk.bondRet = bd;
  /* a big move always comes with a reason, however silly */
  if (shock) S.econ.headlines.unshift(pick(SHOCK_NEWS[shock]) + " " +
    (shock === "propdrop" ? "Condo prices " + pctS(pr) + ", HDB resale " + pctS(hr) + "." : "Stocks " + pctS(eq) + " this year."));
  if (cooled) S.econ.headlines.unshift(pick(SHOCK_NEWS.cool) + " Prices had risen " + pctS(Math.max(h1[0] / h0[0], h1[1] / h0[1]) - 1) + " in three years, after inflation.");
  mk.etf *= (1 + eq); mk.prop *= (1 + pr); mk.hdb *= (1 + hr); mk.bondIdx *= (1 + bd);
  mk.etfHist.push(mk.etf); mk.propHist.push(mk.prop);

  /* total-return indices: what a dollar left in each thing would have become.
     Bonds and securities earn their yield on top of any price move. */
  const rets = Object.assign({
    cash:  depositRate(),
    prop:  pr,
    hdb:   hr,
    cpi:   S.econ.infl
  }, inv);
  if (!mk.idx.hdb){ mk.idx.hdb = mk.idx.prop; mk.hist.hdb = mk.hist.prop.slice(); }
  for (const k of Object.keys(rets)){
    mk.idx[k] *= (1 + rets[k]);
    mk.hist[k].push(mk.idx[k]);
  }
  mk.ages.push(S.age);
  mk.rets = rets;

  /* apply to holdings */

  /* a home moves with its market, and loses a little more each year its lease runs down */
  if (S.a.property){
    const h = S.a.property;
    h.value = Math.max(1000, h.value * (1 + (h.type === "hdb" ? hr : pr)) * (1 + tierTilt(h)) * leaseDecay(h));
    if (h.rentOut) h.rentIncome = Math.round(h.rentIncome * (1 + S.econ.infl * 0.8));
  }
  for (const x of S.a.extra || []){
    x.value = Math.max(1000, x.value * (1 + pr * rf(0.85, 1.15)) * (1 + tierTilt(x)) * leaseDecay(x));
    x.rentIncome = Math.round(x.rentIncome * (1 + S.econ.infl * 0.8));
    x.vacant = false;
  }
  /* a car's value runs down with its 10-year COE, not with the market */
  if (S.p.car && !S.p.car.family) S.p.car.value = Math.max(0, S.p.car.value - (S.p.car.price || S.p.car.value * 1.2) / (S.p.car.coe || 10));
  if (S.p.housingMode === "rent") S.p.rent = Math.round(S.p.rent * (1 + S.econ.infl * rf(0.7, 1.45)));
  return { eq, pr, bd };
}

function stepWork(){
  const p = S.p, out = { notes: [] };
  if (p.retired) return out;

  /* study progress */
  /* SkillsFuture Level-Up training allowance: full-time study at 40+, for up to two years */
  if (p.trainAllow){
    if (p.trainAllow.left > 0 && p.studying && !p.job) p.trainAllow.left--;
    else { p.trainAllow = null; out.notes.push("Your SkillsFuture training allowance has ended."); }
  }
  if (p.studying){
    p.studying.yearsLeft--;
    const path = eduPath(p.studying.pathId);
    /* This year's fees. The family pays its share from its own savings (and may
       want some of it back later); the rest goes on a tuition fee loan that asks
       for nothing until you finish — unless you chose to pay as you go. */
    const st = p.studying;
    const fee = Math.round((st.fee || path.tuition) * S.econ.cpi);
    const famShare = st.family !== undefined ? st.family : S.c.eduSupport;
    const fam = Math.round(fee * famShare);
    let own = fee - fam;
    if (st.credit > 0 && own > 0){                 /* SkillsFuture credit goes on the fees first */
      const c = Math.min(st.credit, own); own -= c; st.credit -= c;
      out.notes.push("SkillsFuture credit paid " + money(c) + " of this year's fees.");
    }
    if (fam > 0){
      const back = Math.round(fam * (st.family !== undefined ? 0 : (S.c.parentsExpect || 0)));
      if (back) addDeferred("family", back);
      out.notes.push("Your family paid " + money(fam) + " of this year's fees" + (back ? " — they expect " + money(back) + " of it back once you earn." : "."));
    }
    if (own > 0){
      if (st.payCash){ p.cash -= own; S.stats.spend += own; out.notes.push("Fees of " + money(own) + " paid from your own money."); }
      else { addDeferred("edu", own); out.notes.push(money(own) + " added to your tuition loan. Nothing to pay until you finish."); }
    }
    if (p.studying.yearsLeft <= 0){
      p.qual = Math.max(p.qual, path.qual);
      p.quals.push(path.name);
      let tech = path.tech, comms = path.comms, fin = path.fin;
      if (path.strain){ tech = Math.max(0, tech - 1); comms = Math.max(0, comms - 1); }
      const gradeBonus = S.c.grades > 80 ? 1 : S.c.grades < 55 ? -1 : 0;
      p.skills.tech += Math.max(0, tech + (gradeBonus > 0 ? 1 : 0));
      p.skills.comms += comms;
      p.skills.fin += fin;
      if (path.workIncome) p.sideIncome = 0;         /* the student job ends; a side business does not */
      p.gradAge = S.age; p.gradPartTime = !!p.studying.partTime;
      p.studying = null;
      out.graduated = path.name;
      tl(S.age, "Completed " + path.name.toLowerCase() + ".");
      lg("Graduated: " + path.name + ".");
    }
  }

  /* employed: pay rises, promotion chance, retrenchment risk */
  if (p.job){
    const j = jobById(p.job);
    S.stats.yearsWorked++;
    p.exp++;
    p.sectExp = p.sectExp || {};
    p.sectExp[j.sect] = (p.sectExp[j.sect] || 0) + 1;
    /* the job teaches you what it uses most, up to a little past what it demands */
    if (rnd() < 0.35){
      const k = j.tech >= j.comms ? "tech" : "comms";
      if (p.skills[k] < j[k] + 2){
        p.skills[k]++;
        out.notes.push("A year of " + (k === "tech" ? "hands-on work" : "dealing with people") + " sharpened your " + (k === "tech" ? "technical" : "communication") + " skills.");
      }
    }
    const rg = REGIMES[S.econ.regime];
    let raise = j.growth * rf(0.3, 1.5) + S.econ.infl * rf(0.25, 0.9) + (rg.wage - 0.026) * 0.6;
    if (S.econ.regime === "recession") raise = Math.min(raise, rf(-0.01, 0.018));
    raise += ((p.standing === undefined ? 60 : p.standing) - 60) / 2000;   /* how your manager sees you shows in the review */
    p.salary = Math.round(p.salary * (1 + raise));
    out.raise = raise;

    /* retrenchment probability rises with unemployment and sector volatility */
    let pFire = 0.018 + (S.econ.unemp - 0.035) * 1.5 * j.vol;
    if (S.econ.regime === "recession") pFire += 0.09 * j.vol;
    if (p.burnout > 2) pFire += 0.03;
    /* demanding jobs wear on you: more stress, more often tired */
    if (rnd() < jobTraits(j).stress * 0.12) p.burnout++;
    /* last in, first out: the newest hire goes first; long service is harder to cut */
    const tenure = S.age - p.jobSince;
    if (tenure <= 1) pFire *= 1.4; else if (tenure >= 8) pFire *= 0.8;
    if (p.standing < 50) pFire += (50 - p.standing) * 0.002;           /* the one who is always late goes first */
    pFire = clamp(pFire, 0.004, 0.34);
    out.pFire = pFire;
  } else if (!p.studying && S.age > START_AGE && !p.disabled){
    p.unemployedYears++;
  }

  /* burnout from studying + working */
  if (p.studying && p.studying.partTime) p.burnout = Math.min(6, p.burnout + 1);
  else p.burnout = Math.max(0, p.burnout - 1);

  for (const n of startDeferred()) out.notes.push(n);

  /* allowance stops once you are earning or past 25 */
  if (p.allowance && (p.job || S.age >= 25)){ p.allowance = 0; out.notes.push("Family allowance has stopped."); }

  /* many stay with their parents until they marry and get a flat. A single person past 35
     moves out; a married couple decides for itself — and hears about it (d_plans.js) */
  if (p.housingMode === "family" && !p.studying && !p.partner && S.age >= 35){
    p.housingMode = "rent";
    p.rent = rentAsking();
    out.notes.push("You moved out of the family home — rent " + money(p.rent) + "/mo.");
    tl(S.age, "Moved out of the family home.");
  }
  /* side and partner income keep pace with prices, as wages broadly do.
     p.obligation is NOT indexed here — livingCosts() already applies CPI to it. */
  if (p.sideIncome) p.sideIncome = Math.round(p.sideIncome * (1 + S.econ.infl * rf(0.5, 1.2)));

  const ended = expireObligations();
  if (ended) for (const o of ended)
    out.notes.push("Your " + o.why + " commitment of " + money(Math.round(o.amt * S.econ.cpi)) + "/mo has ended.");

  stepPartner(out);
  return out;
}

function stepCash(){
  const p = S.p;
  p.settling = true;                               /* reliefs made last year count for this tax bill */
  const gross = grossIncome(), costs = totalCosts(), tax = taxMonthly(), share = billShare();
  const tYear = taxYear();
  p.ptr = Math.max(0, (p.ptr || 0) - rebateUse(tYear));
  let debtPaid = 0, interestPaid = 0, mortPaid = 0, ptDebt = 0, ptMort = 0;

  /* amortise 12 months of every loan */
  for (const l of S.loans.slice()){
    if (l.deferred) continue;                      /* still studying: nothing due, no interest */
    if (l.variable){
      const dr = S.econ.rate - S.econ.prevRate;
      if (Math.abs(dr) > 0.0005){
        l.rate = Math.max(0.010, l.rate + dr);
        const n = Math.max(12, l.years * 12 - (S.age - l.taken) * 12), r = l.rate / 12;
        l.monthly = Math.round(l.bal * r / (1 - Math.pow(1 + r, -n)));
      }
    }
    for (let m = 0; m < 12 && l.bal > 0; m++){
      const int = l.bal * l.rate / 12;
      const prin = Math.max(0, l.monthly - int);
      l.bal = Math.max(0, l.bal - prin);
      const pay = Math.min(l.monthly, int + prin), lp = loanPt(l);
      interestPaid += int; debtPaid += pay * (1 - lp); ptDebt += pay * lp;
      if (l.kind === "pers" || l.kind === "cc") S.stats.badInt += int;
      if (isMortgage(l)){
        mortPaid += pay * (1 - lp); ptMort += pay * lp;
        const h = S.a.property;
        if (h && l.shared){ h.paidMe = (h.paidMe || 0) + pay * (1 - lp); h.paidPt = (h.paidPt || 0) + pay * lp; }
      }
    }
    if (l.bal <= 10){                              /* rounding leaves a few dollars; call it paid */
      S.loans = S.loans.filter(x => x !== l);
      lg(l.name + " finished.");
      tl(S.age, l.name + " paid off.");
      S.p.credit = clamp(S.p.credit + 14, 300, 850);
    }
  }

  for (const l of S.loans) if (l.kind === "cc") l.monthly = Math.max(50, Math.round(l.bal * 0.03));
  const yearIncome = (gross - ptInc()) * 12;
  S.stats.prem += insurancePremiums() * 12;
  S.stats.claims += disabilityPayout() * 12;
  S.stats.gig += gigIncome() * 12;
  S.stats.fromKids += kidsGiving() * 12;
  const yearSpend = costs * share * 12 + tax * 12;
  S.stats.income += yearIncome;
  S.stats.spend += yearSpend;
  S.stats.interest += interestPaid;
  S.stats.tax += tax * 12;

  /* CPF: your 20% leaves the payslip, your employer adds 17%, all of it into your
     accounts. The Ordinary Account pays the mortgage first if you chose that. */
  const cr = cpfRates(S.age), w = cpfWage(), cpf = S.cpf;
  const inOA = w * cr.oa * 12, emp = w * cr.emp * 12;
  let oaPay = 0;
  if (S.a.property && S.a.property.cpfMonthly && mortPaid > 0) oaPay = Math.min(cpf.oa + inOA, mortPaid);
  cpf.oa += inOA - oaPay;
  /* from 55 the Special Account is closed: its share goes to the Retirement Account */
  const rk = raKey();
  /* after 55, the Retirement Account takes new money only up to the current retirement sum; the rest goes to Ordinary */
  const toRet = x => { if (rk !== "ra"){ cpf.sa += x; return; } const cap = S.p.raOpt === "ers" ? retSums().ers : retSums().frs, room = Math.max(0, cap - cpf.ra); cpf.ra += Math.min(room, x); cpf.oa += Math.max(0, x - room); };
  toRet(w * cr.sa * 12);
  cpf.ma += w * cr.ma * 12;
  if (oaPay) S.a.property.cpfUsed = (S.a.property.cpfUsed || 0) + oaPay;
  /* extra interest on the first $60,000 of combined balances (no more than $20,000 of it from the OA):
     1% before 55; from 55, 2% on the first $30,000 and 1% on the next $30,000 */
  const base = Math.min(cpf.oa, 20000 * S.econ.cpi) + cpf[rk] + cpf.ma, k30 = 30000 * S.econ.cpi;
  const cpfX = S.age >= 55 ? 0.02 * Math.min(k30, base) + 0.01 * clamp(base - k30, 0, k30) : 0.01 * Math.min(2 * k30, base);
  cpf.oa *= 1.025; cpf[rk] *= 1.04; cpf.ma *= 1.04;
  if (rk === "ra") cpf.sa = 0;
  toRet(cpfX);
  const bhs = 75500 * S.econ.cpi;                 /* MediSave above its cap spills into Special (Retirement from 55) */
  if (cpf.ma > bhs){ toRet(cpf.ma - bhs); cpf.ma = bhs; }
  /* SRS money sits at almost nothing unless you invested it; invested, it rides the fund */
  if (p.srs && p.srs.bal > 0) p.srs.bal *= 1 + (p.srs.inv && S.mk.rets ? S.mk.rets.etf : 0.0005);
  /* CPF used on a home accrues the interest it would have earned; it goes back to the OA on sale */
  if (S.a.property && S.a.property.cpfUsed) S.a.property.cpfUsed *= 1.025;

  const net = yearIncome - yearSpend - debtPaid + oaPay - emp;
  p.cash += net;
  stepCouple(ptDebt, ptMort, null);                 /* the partner's side of the same year */

  /* cash earns a deposit rate below inflation */
  const dep = depositRate();
  if (p.cash > 0){ const g = p.cash * dep; p.cash += g; S.stats.income += g; }

  /* credit drifts up while everything is paid */
  if (net >= 0 && S.loans.length) p.credit = clamp(p.credit + 9, 300, 850);
  else if (net >= 0) p.credit = clamp(p.credit + 3, 300, 850);

  p.settling = false;
  const nw = netWorth();
  S.stats.peakNW = Math.max(S.stats.peakNW, nw);
  S.stats.lowNW = Math.min(S.stats.lowNW, nw);

  return { gross, costs, tax, net, interestPaid, debtPaid };
}

/* How the life is actually going. Spending nothing for forty years is not free:
   it shows up here, and from here it reaches your job prospects and your health. */
function stepWellbeing(){
  const p = S.p;
  let target = 26 + spendLevel() * 17;               // 26 at the bottom, 77 at the top
  if (p.partner) target += partnerTypeOf().wellYr - (p.tension || 0) * 1.5;
  if (p.partner && p.abroad && !p.abroad.partnerCame) target -= 10;   /* a marriage across time zones */
  target -= (p.conditions || []).length * 3;           /* living with a condition */
  if (p.disabled) target -= 12;
  if (p.spend.food === 0) target -= 5;               // living on the cheapest food wears on you
  target -= p.burnout * 4;
  target += lsWell();                                /* the gym, the cat, the holiday, the club */
  target += plansWell();                             /* children, parents, a lodger, side work, a car (d_plans) */
  if (!p.job && !p.studying && S.age >= 25) target -= 12;
  if (dependents() && spendLevel() < 1) target -= 6;
  if (familySupported()) target += 8;                // somebody else is carrying the load
  /* money worries: a thin buffer weighs on you; being ahead of your peers eases it a little */
  const em = emergencyMonths();
  target += (sgWealthPct() - 0.4) * 8 + (em < 1 ? -3 : em >= 6 ? 3 : em >= 3 ? 1 : 0);
  target = clamp(target, 5, 92);
  p.wellbeing = clamp(p.wellbeing + (target - p.wellbeing) * 0.45, 0, 100);
  return p.wellbeing;
}

/* Shortfall: never a game over. Produces a forced-choice card. */
function checkShortfall(){
  if (S.p.cash >= 0) return null;
  const gap = -S.p.cash;
  return { gap };
}

/* a partner's working life runs alongside yours, with its own luck */
function stepPartner(out){
  const p = S.p;
  if (!p.partner) return;
  const pt = partnerTypeOf();
  if (p.ptHome) return;                            /* at home with the children */
  if (p.partnerOut){                               /* out of work: back after a year or two */
    if (S.age >= p.partnerOut.until){
      p.partnerInc = Math.round(p.partnerOut.inc * (1 + S.econ.infl));
      out.notes.push("Your partner is working again — " + money(p.partnerInc) + "/mo.");
      p.partnerOut = null;
    }
    return;
  }
  if (p.abroad && p.abroad.partnerCame) return;    /* they gave up their job to come with you */
  /* their pay keeps pace with prices, and grows the way their kind of work grows */
  if (p.partnerInc) p.partnerInc = Math.round(p.partnerInc * (1 + S.econ.infl * rf(0.5, 1.1) + (pt.growth - 0.025) * rf(0.4, 1.4)));
  /* they can lose their job too, more often in a downturn */
  const risk = (pt.jobRisk || 0.03) * (S.econ.regime === "recession" ? 2.5 : 1);
  if (p.partnerInc > 500 && rnd() < risk){
    p.partnerOut = { until: S.age + ri(1, 2), inc: p.partnerInc };
    out.notes.push("Your partner lost their job. Household income is down " + money(p.partnerInc) + "/mo until they find another.");
    tl(S.age, "Partner lost their job.");
    p.partnerInc = 0;
    return;
  }
  /* a partner who was still training finishes, or finds it did not lead where they hoped */
  if (p.partnerLater && S.age >= p.partnerLater.at){
    const ok = rnd() < (pt.laterOdds || 0.7);
    const bump = ok ? p.partnerLater.inc : Math.round(p.partnerLater.inc * 0.35);
    p.partnerInc = (p.partnerInc || 0) + bump;
    out.notes.push(ok ? "Your partner finished training — household income up " + money(bump) + "/mo."
                      : "Your partner's training did not lead to the job they wanted. They took other work: +" + money(bump) + "/mo.");
    tl(S.age, ok ? "Partner qualified; household income rose." : "Partner's training did not pay off as hoped.");
    p.partnerLater = null; p.partnerDone = ok ? "qualified" : "other";
  }
}

/* run one year of the world; returns a digest for the recap */
function simulateYear(){
  S.age++;
  const e = stepEconomy();
  const m = stepMarkets();
  const w = stepWork();
  const plans = stepPlans(w.notes);
  stepLoanTerms(w.notes);
  const cf = stepCash();
  sweepCash(w.notes);
  stepWellbeing();
  const digest = { age: S.age, e, m, w, cf, plans, notes: w.notes || [] };
  stepLifestyle(digest.notes);
  /* health and the rare turns of fortune are rolled every year, not only when a die speaks */
  digest.health = stepHealth(digest.notes);
  digest.fate = digest.health ? null : stepFate(digest.notes);

  /* retrenchment fires here so the player meets it as an Event card */
  if (w.pFire !== undefined && rnd() < w.pFire){ digest.fired = true; }
  recordYear();
  return digest;
}
/* one row a year for the overview charts: what the household holds, and what you saved */
function recordYear(){
  S.hist = S.hist || [];
  const housing = S.loans.filter(isHousingLoan).reduce((a, l) => a + l.bal, 0);
  const homes = (S.a.property ? S.a.property.value : 0) + extraValue();
  noteFirstInvest();
  const c = livingCosts(), share = billShare(), take = Math.max(0, myTakeHome());
  const row = { age: S.age, cash: Math.round(Math.max(0, S.p.cash)), inv: Math.round(invTotal() + srsBal()), home: Math.round(Math.max(0, homes - housing)),
    cpf: Math.round(cpfTotal()), pt: Math.round(ptTotal()), nw: Math.round(netWorth()), saved: Math.round(netCashflow() * 12), cpi: S.econ.cpi,
    take: Math.round(take * 12), ls: Math.round(c.lifestyle * share * 12), housing: Math.round((c.housing * share + S.loans.filter(isMortgage).reduce((a, l) => a + l.monthly * (1 - loanPt(l)), 0)) * 12),
    burn: Math.round(monthlyBurn()), em: Math.round(Math.min(99, emergencyMonths()) * 10) / 10, wb: Math.round(S.p.wellbeing) };
  /* how the year was lived, for the money-and-life review at 65 (d_story.js) */
  const ls = lsState(), p = S.p, liquid = Math.max(0, p.cash) + invTotal() + srsBal();
  Object.assign(row, { hol: ls.last && ls.last.age === S.age ? placeById(ls.last.id).tier : "none", out: p.spend.lifestyle, food: p.spend.food,
    gym: ls.gym, pet: !!ls.pet, club: !!ls.club, vol: !!ls.vol, bo: p.burnout, ten: Math.round((p.tension || 0) * 10) / 10,
    cond: activeConditions().length, dep: activeConditions().some(c => c.id === "depression"), job: !!p.job, study: !!p.studying,
    partner: !!p.partner, kids: dependents(), fam: familySupported(),
    fi: row.burn > 0 ? Math.round(liquid / (row.burn * 12 * 25) * 100) / 100 : 0 });
  S.hist = S.hist.filter(r => r.age !== S.age);
  S.hist.push(row);
}

/* ============================================================
   6. HIRING — visible 2d6 skill check
   ============================================================ */
function jobFit(j){
  const p = S.p;
  const miss = [];
  if (p.qual < j.qual) miss.push("qualification");
  if (p.skills.tech < j.tech) miss.push("technical skill");
  if (p.skills.comms < j.comms) miss.push("communication");
  const rx = relExp(j);
  if (rx < j.exp) miss.push("experience");

  /* modifier: surplus helps, each shortfall hurts */
  let mod = 0;
  mod += clamp(p.qual - j.qual, -3, 2) * 1.6;
  mod += clamp(p.skills.tech - j.tech, -4, 3) * 0.75;
  mod += clamp(p.skills.comms - j.comms, -4, 3) * 0.75;
  mod += clamp(rx - j.exp, -6, 6) * 0.42;
  /* the resume: having done the level below in this field is what makes a senior hire safe */
  if (j.lvl){
    const pk = (p.peak || {})[j.sect];
    mod += (pk === undefined ? -1 : clamp(pk - j.lvl + 1, -1, 2)) * 0.8;
  }
  /* three new jobs in five years reads as someone who will leave again */
  if ((p.starts || []).filter(a => S.age - a < 5).length >= 3) mod -= 1.2;
  if (p.intl) mod += 0.6;                    /* a stint abroad stands out */
  if (p.disabled) mod -= 2.5;
  mod += (REGIMES[S.econ.regime].jobs - 1) * 2.4;
  if (S.p.unemployedYears >= 2) mod -= 1.2;
  if (S.p.burnout > 3) mod -= 0.8;
  mod += (S.p.wellbeing - 60) / 22;          // you interview the way you are living
  mod = Math.round(mod * 10) / 10;

  const dc = 7 + Math.round(((j.band || j.pay) - 2400) / 900);
  return { mod, dc, miss, chance: chance2d6(dc - mod) };
}
function chance2d6(need){
  /* P(2d6 >= need) */
  let c = 0;
  for (let a = 1; a <= 6; a++) for (let b = 1; b <= 6; b++) if (a + b >= need) c++;
  return c / 36;
}
function openJobs(n){
  const list = [];
  for (const j of JOBS){
    if (j.id === "own") continue;
    if (j.qual > S.p.qual) continue;               /* employers screen on the paper first */
    if (!seniorEligible(j)) continue;              /* ...and on the resume for anything senior */
    const f = jobFit(j);
    if (f.chance < 0.03) continue;
    /* vacancies depend on the cycle */
    const avail = rnd() < clamp(0.34 * REGIMES[S.econ.regime].jobs + (f.chance * 0.5), 0.08, 0.95);
    if (avail || f.chance > 0.7) list.push({ j, f });
  }
  list.sort((a, b) => b.j.pay - a.j.pay);
  return list.slice(0, n || 6);
}
/* a senior role needs years close to what it asks; a manager's role needs the level below
   already held in that field (or the same level held anywhere) */
function seniorEligible(j){
  if (!j.lvl) return true;
  const p = S.p, peak = p.peak || {};
  if (relExp(j) < j.exp - 2) return false;
  if (j.lvl >= 2){
    const here = peak[j.sect];
    if ((here === undefined || here < j.lvl - 1) && !Object.keys(peak).some(k => peak[k] >= j.lvl)) return false;
  }
  return true;
}
/* years that count for a role: all of them in its field, half of them elsewhere */
function relExp(j){
  const p = S.p, se = (p.sectExp || {})[j.sect] || 0;
  return Math.floor(se + (p.exp - se) * 0.5);
}
/* what an employer would offer you for a role this year */
function offerPay(j){
  const rg = REGIMES[S.econ.regime];
  return Math.round(j.pay * S.econ.cpi * rf(0.93, 1.08) * (rg.jobs > 1 ? 1.03 : rg.jobs < 0.7 ? 0.94 : 1));
}
function hireInto(j, pay){
  const p = S.p;
  /* the month you start earning is the month the bills become yours */
  if (familySupported()) p.spendPrompt = true;
  const was = p.job ? jobById(p.job) : null;
  let sal = pay || offerPay(j);
  /* for a like-for-like move, a new employer pays a little over what you had to get you */
  if (was && !pay && j.lvl >= was.lvl) sal = Math.max(sal, Math.round(p.salary * rf(1.04, 1.12)));
  closeResume(was ? (j.lvl > was.lvl ? "moved up" : "moved on") : null);
  p.job = j.id;
  p.salary = sal;
  p.jobSince = S.age;
  p.unemployedYears = 0;
  (p.starts = p.starts || []).push(S.age);
  openResume(j);
  tl(S.age, (was ? "Changed job to " : "Started work as ") + j.t + " — " + money(p.salary) + "/mo.");
  lg((was ? "Moved to " : "Hired: ") + j.t + " at " + money(p.salary) + "/mo.");
  startDeferred();
}
/* the same employer moves you up: a new title, and the clock on the role restarts */
function promoteTo(j, pay){
  const p = S.p;
  closeResume("promoted");
  p.job = j.id; p.salary = pay; p.jobSince = S.age;
  openResume(j);
  tl(S.age, "Promoted to " + j.t + " — " + money(pay) + "/mo.");
}
function openResume(j){
  const p = S.p;
  (p.resume = p.resume || []).push({ id: j.id, t: j.t, from: S.age, to: null, end: null });
  p.peak = p.peak || {};
  if (p.peak[j.sect] === undefined || p.peak[j.sect] < j.lvl) p.peak[j.sect] = j.lvl;
}
function closeResume(why){
  const r = S.p.resume && S.p.resume[S.p.resume.length - 1];
  if (r && r.to === null){ r.to = S.age; r.end = why || "left"; }
}
function loseJob(reason){
  if (!S.p.job) return;
  const t = jobById(S.p.job).t;
  closeResume((reason || "left").toLowerCase());
  S.p.job = null; S.p.salary = 0;
  tl(S.age, (reason || "Lost job") + " — " + t + ".");
  lg("No longer employed as " + t + ".");
}

/* ============================================================
   22. HOUSING RULES — Singapore, 2025, simplified
   - HDB flat: 5-year minimum occupation period (MOP). Cannot be sold, or let out
     whole, before it ends. Couples may buy from 21, singles from 35.
     HDB loan at 2.6% (0.1% over the CPF Ordinary rate), up to 25 years.
   - Private property can be sold at any time, but Seller's Stamp Duty takes
     16% / 12% / 8% / 4% of the price in the first four years (from July 2025).
     Bank loan priced off SORA, up to 35 years (30 on an HDB flat), repaid by 75.
   - Loans cover at most 75% of the price if they end by 65 and run no longer than
     30 years (25 on an HDB flat); otherwise at most 55%. At least 5% must be cash
     on a bank loan (10% on the 55% loan); the rest of the deposit can come from
     your CPF Ordinary Account.
   - Executive condominiums: private condos sold by developers to couples and
     families under HDB rules — household income up to $16,000, the 30% MSR, a
     bank loan, a five-year MOP and a CPF grant of up to $30,000 for first-timers.
     A second-timer whose first flat was subsidised pays a resale levy in cash.
   - Loan size is capped by income: repayments on an HDB flat may not exceed 30%
     of gross monthly income (MSR), and all debt repayments 55% (TDSR), tested at
     3% for HDB loans and at least 4% for bank loans.
   - Buyer's stamp duty on the price, plus legal fees. Agent fees on sale.
   - First-timer HDB buyers get CPF housing grants, paid into the Ordinary Account.
   - CPF used on a home, plus the interest it would have earned, goes back into
     your Ordinary Account when you sell.
   - One HDB flat at a time. An HDB owner may buy private property only after the
     MOP; nobody may buy an HDB flat while owning private property.
   - Further properties (always private, always let out here) pay Additional Buyer's
     Stamp Duty: 20% on the second, 30% on the third and after (citizens, 2023).
     A second housing loan covers at most 45% of the price (25% if long), a third
     35% (15%), and at least 25% must be cash. They are paid in cash in this game, not CPF.
   ============================================================ */
const HOME_TYPES = {
  hdb:     { name: "HDB flat",              mop: 5 },
  ec:      { name: "Executive condominium", mop: 5 },
  private: { name: "Private property",      mop: 0 }
};
/* resale prices, 2025, for a home with `lease` years left on it — scaled by its market's
   index as the game moves (HDB flats by the HDB resale index, the rest by private
   property) and by the lease actually left on this year's unit. 999 = freehold. */
const HOME_LISTINGS = [
  { type: "hdb",     rooms: 2, n: "2-room HDB resale flat, older estate", base: 340000,  lease: 50, spread: 6 },
  { type: "hdb",     rooms: 3, n: "3-room HDB resale flat, older estate", base: 440000,  lease: 52, spread: 6 },
  { type: "hdb",     rooms: 4, n: "4-room HDB resale flat",               base: 630000,  lease: 72, spread: 10 },
  { type: "hdb",     rooms: 5, n: "5-room HDB resale flat",               base: 750000,  lease: 76, spread: 10 },
  { type: "ec",      rooms: 4, n: "Executive condominium, three bedrooms", base: 1500000, lease: 97, spread: 2 },
  { type: "private", rooms: 2, n: "Private condo, one bedroom",           base: 1100000, lease: 94, spread: 4 },
  { type: "private", rooms: 3, n: "Older resale condo, two bedrooms",     base: 1350000, lease: 70, spread: 6 },
  { type: "private", rooms: 4, n: "Private condo, three bedrooms",        base: 1900000, lease: 95, spread: 3 },
  { type: "private", rooms: 4, n: "Freehold condo, three bedrooms",       base: 2300000, lease: 999, spread: 0, tier: "free" },
  { type: "private", rooms: 5, n: "Landed terrace house",                 base: 3400000, lease: 999, spread: 0, tier: "landed" }
];
/* what each kind of home adds a year on top of its market. Long-run real growth comes out
   at about: HDB +0.3% (less its lease running down), leasehold condo +1.2%, freehold condo
   +1.8%, landed +2.5% — land is what appreciates, and freehold and landed homes are mostly land. */
const TIER_TILT = { free: 0.006, landed: 0.013 };
const tierTilt = h => TIER_TILT[h.tier] || 0;
/* what a lease is worth as a share of the same home held freehold — after the
   Singapore Land Authority's leasehold table (Bala's curve): value holds up for
   decades, then falls away faster and faster until it reaches nothing at the end */
const LEASE_CURVE = [[0, 0], [5, 0.09], [10, 0.18], [20, 0.36], [30, 0.52], [40, 0.65], [50, 0.75],
                     [60, 0.83], [70, 0.89], [80, 0.935], [90, 0.97], [99, 1], [999, 1.04]];
function leaseValue(left){
  left = Math.max(0, left);
  for (let i = 1; i < LEASE_CURVE.length; i++){
    const [a, va] = LEASE_CURVE[i - 1], [b, vb] = LEASE_CURVE[i];
    if (left <= b) return va + (vb - va) * (left - a) / (b - a);
  }
  return LEASE_CURVE[LEASE_CURVE.length - 1][1];
}
function leaseLeft(h){
  if (h.left === undefined) h.left = h.type === "hdb" ? 70 : h.type === "ec" ? 95 : 90;   /* homes bought before leases were tracked */
  return h.left;
}
/* one more year off the lease: the factor its value shrinks by (freehold never shrinks) */
function leaseDecay(h){
  const left = leaseLeft(h);
  if (left >= 999) return 1;
  h.left = Math.max(0, left - 1);
  return left > 0 ? leaseValue(h.left) / leaseValue(left) : 1;
}
function leaseText(left){ return left >= 999 ? "freehold" : Math.round(left) + " years left on the lease"; }
function mktIndex(type){ return type === "hdb" ? (S.mk.idx.hdb || S.mk.idx.prop) : S.mk.idx.prop; }
const SELL_COST = 0.02;
const HDB_RATE = 0.026;
/* monthly rent as a share of value: a whole HDB flat lets for ~6.5% a year, a condo ~4% */
const RENT_YIELD = { hdb: 0.0055, ec: 0.00285, private: 0.00285 };   /* a month: HDB ~6.6% gross, condos ~3.4% */
/* Seller's Stamp Duty on private property, by whole years held (from 4 July 2025) */
const SSD_RATES = [0.16, 0.12, 0.08, 0.04];
function ssdFor(type, held, price){ return type === "private" && held < SSD_RATES.length ? Math.round(price * SSD_RATES[Math.max(0, held)]) : 0; }
/* the resale levy a second-timer pays on a second subsidised purchase, by the first flat's size */
function resaleLevy(){ return S.p.hdbGrantUsed ? Math.round(({ 3: 30000, 4: 40000, 5: 45000 }[S.p.subsidisedRooms || 4] || 40000) * S.econ.cpi) : 0; }
const EC_CEILING = 16000;

function homeType(){ return S.a.property ? (S.a.property.type || "private") : null; }
function yearsOwned(){ return S.a.property ? S.age - S.a.property.bought : 0; }
/* a BTO flat on a Plus or Prime site has a 10-year MOP; everything else follows its type */
function mopLeft(){ return S.a.property ? Math.max(0, (S.a.property.mop || HOME_TYPES[homeType()].mop) - yearsOwned()) : 0; }
function hdbEligible(){ return S.p.partner ? S.age >= 21 : S.age >= 35; }
/* Former private-property owners: a 15-month wait before buying an HDB resale flat (in whole
   years here, so two), waived from 55 for a 4-room flat or smaller; and no HDB loan within
   30 months of owning private property. */
const ownsPrivateHome = () => !!S.a.property && S.a.property.type === "private";
function hdbWaitOut(l, selling){
  if (S.age >= 55 && l.rooms <= 4) return 0;
  if (selling) return 2;
  return S.p.privSoldAge !== undefined ? Math.max(0, S.p.privSoldAge + 2 - S.age) : 0;
}
function hdbLoanBarred(selling){ return selling || (S.p.privSoldAge !== undefined && S.age - S.p.privSoldAge < 3); }
/* Silver Housing Bonus: from 55, sell and right-size to a 3-room flat or smaller for less,
   put up to $60,000 of the proceeds into CPF, get $1 for every $2 put in, up to $30,000 */
function silverBonus(l, soldFor){
  if (S.age < 55 || l.type !== "hdb" || l.rooms > 3 || !soldFor || l.price >= soldFor) return 0;
  if (householdIncome() > 14000 * S.econ.cpi) return 0;
  return Math.round(30000 * S.econ.cpi);
}
function livingInOwnHome(){ return S.p.housingMode === "own" && !!S.a.property; }
function canSellNow(){ return !!S.a.property && mopLeft() === 0; }
/* HDB flats and ECs cannot be let out whole during the MOP; private property can be let at any time */
function canLetNow(){ return !!S.a.property && mopLeft() === 0 && !S.a.property.noLet; }
function rentFor(type, value){ return Math.round(value * RENT_YIELD[type || "private"] / 10) * 10; }

/* buyer's stamp duty (residential, from Feb 2023) plus about $3,000 of legal fees */
function buyCosts(price){
  const tiers = [[180000, 0.01], [180000, 0.02], [640000, 0.03], [500000, 0.04], [1500000, 0.05], [1e12, 0.06]];
  let left = price, bsd = 0;
  for (const [w, r] of tiers){ const x = Math.min(left, w); bsd += x * r; left -= x; if (left <= 0) break; }
  return Math.round(bsd + 3000 * S.econ.cpi);
}

/* gross monthly household income, as HDB and the banks count it */
function householdIncome(){ return S.p.salary + S.p.sideIncome + gigIncome() + (S.p.partnerInc || 0); }

/* CPF housing grants: first-timers buying an HDB resale flat, or a couple's first EC */
function hdbGrant(l){
  if (l.type === "ec"){
    if (S.p.hdbGrantUsed || !S.p.partner) return { family: 0, ehg: 0, total: 0 };
    const inc = householdIncome() / S.econ.cpi;
    const g = Math.round((inc <= 10000 ? 30000 : inc <= 11000 ? 20000 : inc <= 12000 ? 10000 : 0) * S.econ.cpi);
    return { family: g, ehg: 0, total: g };
  }
  if (l.type !== "hdb" || S.p.hdbGrantUsed || !hdbEligible()) return { family: 0, ehg: 0, total: 0 };
  const cpi = S.econ.cpi, inc = householdIncome();
  if (inc > 14000 * cpi) return { family: 0, ehg: 0, total: 0 };
  const half = S.p.partner ? 1 : 0.5;
  const family = (l.rooms <= 4 ? 80000 : 50000) * half * cpi;
  const ehgFull = clamp(120000 * (9000 * cpi - inc) / (7500 * cpi), 0, 120000);
  const ehg = Math.round(ehgFull * half / 5000) * 5000 * cpi;
  return { family: Math.round(family), ehg: Math.round(ehg), total: Math.round(family + ehg) };
}

/* the most a lender will lend, given income, other debts and the 75% cap */
function maxHomeLoan(kind, price, term, type){
  const inc = householdIncome();
  if (inc <= 0) return 0;
  /* TDSR counts every other debt, including the loans on any other property you keep */
  const otherDebt = S.loans.filter(l => !isMortgage(l) && !l.deferred).reduce((a, l) => a + l.monthly, 0) +
    (kind === "extra" ? S.loans.filter(isMortgage).reduce((a, l) => a + l.monthly, 0) : 0);
  const ltv = ltvFor(kind === "extra" ? housingLoanCount() : housingLoanCount() - (S.loans.some(isMortgage) ? 1 : 0), longLoan(term, type));
  if (kind === "extra") kind = "home";
  let cap = inc * 0.55 - otherDebt;                        // TDSR
  if (type === "hdb" || type === "ec") cap = Math.min(cap, inc * 0.30);      // MSR
  if (kind === "hdb" && inc > 14000 * S.econ.cpi) return 0; // HDB loans have an income ceiling
  if (cap <= 0) return 0;
  const r = (kind === "hdb" ? 0.03 : Math.max(0.04, quoteLoan("home", 100000, term).rate)) / 12, n = term * 12;
  const pv = cap * (1 - Math.pow(1 + r, -n)) / r;
  return Math.max(0, Math.min(Math.floor(pv / 1000) * 1000, Math.round(price * ltv)));
}
/* loan-to-value by how many other housing loans you would still have. A long loan —
   past 65, or over 30 years (25 on an HDB flat) — gets 20 points less. */
function ltvFor(otherLoans, long){ return (otherLoans <= 0 ? 0.75 : otherLoans === 1 ? 0.45 : 0.35) - (long ? 0.20 : 0); }
function longLoan(term, type){ return term > (type === "hdb" ? 25 : 30) || S.age + term > 65; }
/* the least of the price a bank loan wants in cash */
function minCashShare(otherLoans, long){ return otherLoans > 0 ? 0.25 : long ? 0.10 : 0.05; }
function housingLoanCount(){ return new Set(S.loans.filter(isHousingLoan).map(l => l.propId || "main")).size; }
/* HDB lends for 25 years at most and to 65. Banks lend for up to 30 years on an HDB flat
   and 35 on anything else, and want it repaid by 75. */
function maxTerm(kind, type){
  if (kind === "hdb") return Math.max(5, Math.min(25, 65 - S.age));
  return Math.max(5, Math.min(type === "hdb" ? 30 : 35, 75 - S.age));
}
/* the longest term that still gets the full loan-to-value */
function fullLtvTerm(kind, type){ return Math.max(5, Math.min(maxTerm(kind, type), type === "hdb" ? 25 : 30, 65 - S.age)); }
/* the ways a listing could be paid for: the full-LTV loan, and the longest loan at the lower LTV */
function buyPlans(l, addOn){
  const t = l.type, others = addOn ? housingLoanCount() : housingLoanCount() - (S.loans.some(isMortgage) ? 1 : 0);
  const k = t === "hdb" && !hdbLoanBarred(ownsPrivateHome()) ? "hdb" : "home";
  const plans = [{ kind: k, term: fullLtvTerm(k, t) }];
  const longT = maxTerm("home", t);
  if (longLoan(longT, t)) plans.push({ kind: "home", term: longT });
  return plans.map(pl => {
    const long = longLoan(pl.term, t);
    return { ...pl, long, ltv: ltvFor(others, long), cashShare: pl.kind === "hdb" ? 0 : minCashShare(others, long),
      limit: maxHomeLoan(addOn ? "extra" : pl.kind, l.price, pl.term, t) };
  });
}

/* mortgage rates, as the player sees them: today, and over the last ten years */
function mortgageRates(){
  const sp = LOAN_KINDS.home.spread;
  return { bankNow: Math.max(0.012, S.econ.rate + sp), bankAvg: Math.max(0.012, rateAvg(10) + sp), hdb: HDB_RATE };
}

/* what selling would do today: cash in hand, and CPF going back to your OA */
function saleSplit(price){
  const p = S.a.property;
  const afterMortgage = Math.round(price * (1 - SELL_COST) - (p ? ssdFor(homeType(), yearsOwned(), price) + clawbackFor(p, price) : 0) - mortgageBal());
  const toCpf = Math.round(clamp(afterMortgage, 0, p && p.cpfUsed ? p.cpfUsed : 0));
  /* a partner who paid in gets their CPF back, then their share of the cash left */
  const hasPt = p && S.p.partner && S.p.pt;
  const ptCpf = hasPt ? Math.round(clamp(afterMortgage - toCpf, 0, p.ptCpfUsed || 0)) : 0;
  const rest = afterMortgage - toCpf - ptCpf;
  const ptCash = hasPt ? Math.round(Math.max(0, rest) * ptOwnShare(p)) : 0;
  return { cash: rest - ptCash, cpf: toCpf, ptCpf, ptCash };
}
function saleNet(price){ return saleSplit(price).cash; }

/* sell at a price: fees, mortgage, CPF refund; if you lived there, you now rent */
function sellHome(price, how){
  const p = S.a.property;
  const fees = Math.round(price * SELL_COST) + ssdFor(homeType(), yearsOwned(), price) + clawbackFor(p, price);
  const split = saleSplit(price);
  S.p.cash += price - fees;
  for (const l of S.loans.filter(isMortgage)) repayLoan(l, l.bal);
  S.p.cash -= split.cpf;
  S.cpf.oa += split.cpf;
  if (split.ptCpf || split.ptCash){ const pt = ptState(); S.p.cash -= split.ptCpf + split.ptCash; pt.oa += split.ptCpf; pt.cash += split.ptCash; }
  S.stats.invGain += price - fees - p.basis;
  S.stats.spend += fees;
  if (S.p.housingMode === "own"){ S.p.housingMode = "rent"; S.p.rent = rentAsking(); }
  if (p.type === "private") S.p.privSoldAge = S.age;
  S.a.property = null;
  if (S.p.lodger) S.p.lodger = null;
  tl(S.age, (how || "Sold the property") + " for " + kmoney(price) + (split.cpf ? "; " + money(split.cpf) + " went back to your CPF" : "") + ".");
  return split.cash;
}

/* this year's listings, fixed for the year so reopening the screen is not a lottery */
function homeMarket(){
  if (!S.homeMarket || S.homeMarket.age !== S.age){
    S.homeMarket = { age: S.age, list: HOME_LISTINGS.map(l => {
      const left = l.lease >= 999 ? 999 : l.lease + Math.round((rnd() - 0.5) * 2 * l.spread);
      return { ...l, left,
        price: Math.round(l.base * mktIndex(l.type) / 100 * Math.pow(1 + tierTilt(l), S.age - START_AGE) * leaseValue(left) / leaseValue(l.lease) * (0.92 + rnd() * 0.16) / 1000) * 1000 };
    }) };
  }
  return S.homeMarket.list;
}
function rentMarket(){
  const cpi = S.econ.cpi;
  if (!S.rentMarket || S.rentMarket.age !== S.age){
    const r = base => Math.round(base * cpi * (0.9 + rnd() * 0.2) / 10) * 10;
    S.rentMarket = { age: S.age, list: [
      { n: "A common room in someone's HDB flat", rent: r(1000) },
      { n: "A whole 3-room HDB flat",             rent: r(2900) },
      { n: "A studio in a condo",                 rent: r(3200) },
      { n: "A whole 4-room HDB flat",             rent: r(3600) }
    ] };
  }
  return S.rentMarket.list;
}

/* ---------- more than one property ---------- */
function extraProps(){ return S.a.extra || (S.a.extra = []); }
function extraValue(){ return (S.a.extra || []).reduce((a, x) => a + x.value, 0); }
function extraRent(){ return (S.a.extra || []).reduce((a, x) => a + (x.vacant ? 0 : x.rentIncome), 0); }
/* condo maintenance, upkeep and property tax at the non-owner-occupied rates */
function extraUpkeep(){
  return Math.round((S.a.extra || []).reduce((a, x) => a + 380 * S.econ.cpi + x.value * 0.002 / 12 + x.rentIncome * 0.15, 0));
}
function propCount(){ return (S.a.property ? 1 : 0) + (S.a.extra || []).length; }
/* Additional Buyer's Stamp Duty for a citizen, by how many homes you already own */
function absdRate(owned){ return owned <= 0 ? 0 : owned === 1 ? 0.20 : 0.30; }
function extraLoanBal(x){ return S.loans.filter(l => l.propId === x.id).reduce((a, l) => a + l.bal, 0); }
const extraHeld = x => S.age - x.bought;
/* may you buy another property, and if not, why not */
function extraBlock(){
  if (!S.a.property) return "You do not own a home yet.";
  if (mopLeft()) return "An " + (homeType() === "ec" ? "EC" : "HDB") + " owner may buy private property only after the five-year MOP — " + mopLeft() + " to go.";
  return null;
}
function sellExtra(x, price, how){
  const owe = extraLoanBal(x);
  const fees = Math.round(price * SELL_COST) + ssdFor("private", extraHeld(x), price);
  S.p.cash += price - fees;
  for (const l of S.loans.filter(l => l.propId === x.id)) repayLoan(l, l.bal);
  S.stats.invGain += price - fees - x.basis;
  S.stats.spend += fees;
  S.a.extra = S.a.extra.filter(y => y !== x);
  S.p.privSoldAge = S.age;
  tl(S.age, (how || "Sold an investment property") + " for " + kmoney(price) + ".");
  return price - fees - owe;
}

function homeWhere(){
  if (livingInOwnHome()) return "In your own " + HOME_TYPES[homeType()].name;
  if (S.p.housingMode === "rent") return "Renting at " + money(S.p.rent) + "/mo";
  return "In the family home";
}

/* liquidation helper: cash-like first, equities last */
function sellDown(amount){
  let need = amount;
  const order = ["tbill", "ssb", "sgs", "bond", "gold", "reit", "etf"];
  for (const k of order){
    if (need <= 0) break;
    need -= cutHolding(k, need);
  }
  S.p.cash += (amount - need);
  return amount - need;
}

   7b. HEALTH, INSURANCE, CAREER MOVES AND THE RARE TURNS OF FORTUNE
   Health and fortune are rolled every year by the engine (stepHealth,
