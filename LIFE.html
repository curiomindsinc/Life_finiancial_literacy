/* ---------- the review at 65: how the cash was used ----------
   Each line: a grade (2 good, 1 fair, 0 weak), a figure and one plain sentence. */
function cashReport(){
  const H = (S.hist || []).filter(r => r.take !== undefined && r.age > START_AGE);
  const work = H.filter(r => r.take > 0);
  const sum = (a, k) => a.reduce((t, r) => t + (r[k] || 0), 0);
  const today = (v, r) => v / (r.cpi || 1);
  const items = [];

  const take = sum(work, "take"), saved = sum(work, "saved"), rate = take > 0 ? saved / take : 0;
  items.push({ k: "Saving", g: rate >= 0.25 ? 2 : rate >= 0.12 ? 1 : 0, v: pct(Math.max(-1, rate), 0) + " of take-home kept",
    line: rate >= 0.25 ? "You kept a quarter or more of what you took home. That habit did most of the work."
      : rate >= 0.12 ? "You saved, but modestly: most pay rises went into living." : "Very little of your pay stayed with you. Everything else here follows from that." });

  const later = H.filter(r => r.age >= 25);
  const idle = later.map(r => today(Math.max(0, r.cash - 6 * r.burn), r));
  const avgIdle = idle.length ? idle.reduce((a, b) => a + b, 0) / idle.length : 0;
  const avgBurn = later.length ? later.reduce((a, r) => a + today(r.burn, r), 0) / later.length : 1;
  const n = Math.max(1, S.mk.hist.etf.length - 1);
  const spread = Math.max(0, (avgReturn("etf", n) || 0) - (avgReturn("cash", n) || 0));
  const lost = Math.round(avgIdle * spread * later.length / 1000) * 1000;
  items.push({ k: "Idle cash", g: avgIdle < 3 * avgBurn ? 2 : avgIdle < 12 * avgBurn ? 1 : 0, v: kmoney(avgIdle) + " above a 6-month buffer, on average",
    line: avgIdle < 3 * avgBurn ? "Little money sat idle beyond a sensible buffer." : "Cash above the buffer earned bank interest while prices rose. Invested at the market's pace, it could have made roughly " + kmoney(lost) + " more (today's money)." });

  const thin = H.filter(r => r.age >= 23 && r.em < 1).length, sf = S.stats.shortfalls || 0;
  items.push({ k: "Buffer", g: sf === 0 && thin <= 2 ? 2 : sf <= 2 ? 1 : 0, v: sf + (sf === 1 ? " shortfall" : " shortfalls") + ", " + thin + " thin years",
    line: sf === 0 ? "You never ran out. A buffer is what lets bad years stay just bad years." : "You ran short " + sf + (sf === 1 ? " time" : " times") + ". Each one was paid for by selling at a bad moment, borrowing, or cutting back hard." });

  const bad = S.stats.badInt || 0;
  items.push({ k: "Costly debt", g: bad < 2000 ? 2 : bad < 10000 ? 1 : 0, v: money(bad) + " interest on personal loans and cards",
    line: bad < 2000 ? "You stayed clear of expensive borrowing." : "That interest bought nothing. Card and personal-loan rates are the most expensive money there is." });

  const liq = S.p.cash + invTotal() + srsBal(), invShare = liq > 0 ? (invTotal() + srsBal()) / liq : 0, first = S.stats.firstInv;
  items.push({ k: "Investing", g: first !== null && first <= 30 && invShare >= 0.5 ? 2 : (first !== null && first <= 40) || invShare >= 0.3 ? 1 : 0,
    v: first === null ? "never invested" : "from age " + first + " · " + pct(invShare, 0) + " of savings invested at 65",
    line: first === null ? "Everything stayed in cash and CPF. Safe from crashes; not safe from prices." : first <= 30 ? "You started early, and time did the heavy lifting." : "You got there, later than you could have. The early years compound the most." });

  const hs = take > 0 ? sum(work, "housing") / take : 0;
  items.push({ k: "Housing", g: hs < 0.25 ? 2 : hs < 0.4 ? 1 : 0, v: pct(hs, 0) + " of take-home on the roof",
    line: hs < 0.25 ? "The roof took a sensible share." : hs < 0.4 ? "Housing took a big bite, as it does for most people here." : "The roof took too much. Every other goal had to fit in what was left." });

  const ls = take > 0 ? sum(work, "ls") / take : 0, wb = H.length ? H.reduce((a, r) => a + (r.wb || 50), 0) / H.length : 50;
  const lsG = ls > 0.3 && rate < 0.12 ? 0 : wb < 40 && rate > 0.3 ? 1 : 2;
  items.push({ k: "Living", g: lsG, v: pct(ls, 0) + " on lifestyle · wellbeing " + Math.round(wb),
    line: lsG === 0 ? "Lifestyle ate the savings." : lsG === 1 ? "You saved hard and lived thin. Money in the bank; not much in the diary." : "Spending and enjoying were in balance." });

  const prem = S.stats.prem || 0, claims = S.stats.claims || 0;
  items.push({ k: "Insurance", g: prem === 0 ? 1 : claims >= prem * 0.5 ? 2 : 1, v: money(prem) + " in premiums · " + money(claims) + " paid back",
    line: prem === 0 ? "No cover of your own. The years it would have paid for either came, or did not." : claims >= prem ? "The bad years came, and the cover paid more than it cost." : "Most of it paid for years when nothing happened. That is what it is for." });

  const score = items.reduce((a, x) => a + x.g, 0) / items.length;
  const grade = score >= 1.6 ? "A" : score >= 1.25 ? "B" : score >= 0.85 ? "C" : "D";
  return { items, grade, score };
}

/* ============================================================
   7d. PAYING LOANS EARLY, REFINANCING — the rules (screen in o_plans.js, openLoan)
   Singapore practice, simplified:
   - Bank home loans: a 2-year lock-in (3 on a fixed package); paying early or leaving inside it costs
     1.5% of the amount. Fixed packages last 3 years, then revert to floating at a higher spread —
     which is why people refinance. Switching banks costs ~$2,500 in legal fees, often waived on
     loans over $250,000. CPF Ordinary savings can pay a housing loan down.
   - HDB loan: 2.6%, no penalty. It can be refinanced to a bank loan, but never back.
   - Car loans: paying early costs 20% of the interest you would save (a Rule of 78 rebate).
   - Personal loans: a $250 early-settlement fee. Card balances: a 12-month 0% balance transfer
     for a 4% fee, then back to 26.9%.
   ============================================================ */
const PREPAY_PEN = 0.015, LEGAL_FEE = 2500, LEGAL_WAIVE = 250000, BT_FEE = 0.04, FIX_YEARS = 3, REVERT_SPREAD = 0.004;

function monthsLeft(l){ return Math.max(12, Math.round(l.years * 12 - (S.age - l.taken) * 12)); }
function amort(bal, rate, n){ const r = rate / 12; return r ? bal * r / (1 - Math.pow(1 + r, -n)) : bal / n; }
/* the interest still to pay if nothing changes */
function interestLeft(bal, rate, monthly){
  const r = rate / 12;
  if (!r || monthly <= 0) return 0;
  let b = bal, t = 0, m = 0;
  while (b > 1 && m < 600){ const i = b * r; t += i; b = b + i - monthly; m++; if (monthly <= i) return Infinity; }
  return t;
}
/* months to clear a balance at a set monthly payment */
function monthsToClear(bal, rate, monthly){
  const r = rate / 12;
  if (!r) return Math.ceil(bal / monthly);
  const x = 1 - r * bal / monthly;
  return x <= 0 ? 600 : Math.ceil(-Math.log(x) / Math.log(1 + r));
}
function lockUntil(l){ return l.lockUntil !== undefined ? l.lockUntil : l.kind === "home" ? l.taken + 2 : -1; }
const inLockIn = l => l.kind === "home" && S.age < lockUntil(l);
const isHousing = l => l.kind === "home" || l.kind === "hdb";

/* what paying `amt` off early would do. mode: "term" (same monthly, done sooner) or "monthly" (same end date, less a month) */
function prepayQuote(l, amt, mode){
  amt = Math.max(0, Math.min(amt, l.bal));
  /* a loan still waiting (tuition while you study): paying now just means less to repay later */
  if (l.deferred) return { amt, rest: l.bal - amt, monthly: 0, months: monthsLeft(l), saved: 0, pen: 0, penWhy: "", net: 0 };
  const n = monthsLeft(l), rest = l.bal - amt;
  const before = interestLeft(l.bal, l.rate, l.monthly);
  let monthly = l.monthly, months = n;
  if (rest <= 10){ monthly = 0; months = 0; }
  else if (mode === "term" && l.kind !== "cc"){ months = monthsToClear(rest, l.rate, l.monthly); }
  else monthly = l.kind === "cc" ? Math.max(50, Math.round(rest * 0.03)) : Math.round(amort(rest, l.rate, n));
  const after = rest <= 10 ? 0 : interestLeft(rest, l.rate, monthly);
  const saved = Math.max(0, (isFinite(before) ? before : 0) - (isFinite(after) ? after : 0));
  let pen = 0, penWhy = "";
  if (inLockIn(l)){ pen = Math.round(amt * PREPAY_PEN); penWhy = "1.5% for paying inside the lock-in (until age " + lockUntil(l) + ")"; }
  else if (l.kind === "car"){ pen = Math.round(saved * 0.2); penWhy = "20% of the interest saved, as car loans charge"; }
  else if (l.kind === "pers" && amt > 0){ pen = Math.round(250 * S.econ.cpi); penWhy = "early settlement fee"; }
  return { amt, rest, monthly: Math.round(monthly), months, saved: Math.round(saved), pen, penWhy, net: Math.round(saved - pen) };
}
/* src: "cash" or "cpf" (housing loans only; CPF used on the home comes back to your OA, with interest, on sale) */
function prepay(l, amt, mode, src){
  const q = prepayQuote(l, amt, mode), p = S.p;
  const fromCpf = src === "cpf" && isHousing(l) ? Math.min(q.amt, S.cpf.oa) : 0;
  const fromCash = q.amt - fromCpf;
  if (p.cash < fromCash + q.pen) return null;
  S.cpf.oa -= fromCpf; p.cash -= fromCash + q.pen; S.stats.spend += q.pen;
  if (fromCpf && !l.propId && S.a.property) S.a.property.cpfUsed = (S.a.property.cpfUsed || 0) + fromCpf;
  l.bal -= q.amt;
  if (l.bal <= 10){
    S.loans = S.loans.filter(x => x !== l);
    S.p.credit = clamp(S.p.credit + 18, 300, 850);
    tl(S.age, l.name + " paid off early" + (q.pen ? " (" + money(q.pen) + " penalty)" : "") + ".");
  } else if (!l.deferred){
    l.monthly = q.monthly;
    if (mode === "term" && l.kind !== "cc") l.years = (S.age - l.taken) + q.months / 12;
    lg("Paid " + money(q.amt) + " off the " + l.name.toLowerCase() + (fromCpf ? " (" + money(fromCpf) + " from CPF)" : "") + ".");
  }
  return q;
}

/* ---- refinancing: what is on offer for this loan today ---- */
function refiOffers(l){
  const cpi = S.econ.cpi, e = S.econ, out = [], n = monthsLeft(l);
  const legal = l.bal > LEGAL_WAIVE * cpi ? 0 : Math.round(LEGAL_FEE * cpi);
  const pen = inLockIn(l) ? Math.round(l.bal * PREPAY_PEN) : 0;
  const offer = (id, n_, rate, fee, extra) => {
    const monthly = Math.round(amort(l.bal, rate, n));
    const now = interestLeft(l.bal, l.rate, l.monthly), then = interestLeft(l.bal, rate, monthly);
    out.push(Object.assign({ id, n: n_, rate, fee, monthly, saved: Math.round((isFinite(now) ? now : 0) - then - fee) }, extra || {}));
  };
  if (l.kind === "home" || l.kind === "hdb"){
    const spread = LOAN_KINDS.home.spread;
    offer("float", "Another bank, floating (SORA + " + pct(spread, 1) + ")", Math.max(0.012, e.rate + spread), legal + pen, { variable: true, oneWay: l.kind === "hdb" });
    offer("fixed", "Another bank, fixed for " + FIX_YEARS + " years", Math.max(0.012, e.rate + spread + 0.006), legal + pen, { fixedYrs: FIX_YEARS, oneWay: l.kind === "hdb" });
  }
  if (l.kind === "pers"){
    const q = quoteLoan("pers", l.bal, Math.max(1, Math.round(n / 12)));
    if (q.rate < l.rate - 0.005) offer("pers", "A new personal loan at today's rate", q.rate, Math.round(250 * cpi + l.bal * 0.01));
  }
  if (l.kind === "cc" && S.p.credit >= 600 && !l.promoUntil)
    offer("bt", "Balance transfer: 0% for 12 months", 0, Math.round(l.bal * BT_FEE), { promo: 1 });
  return out;
}
function refiNote(l){
  if (l.kind === "car") return "Car loans here are fixed for their whole term. Paying early is the only way out.";
  if (l.kind === "edu") return "Tuition fee loans are already cheap. Nobody will beat this rate.";
  if (l.kind === "family") return "Your parents charge nothing. There is nothing cheaper.";
  if (l.kind === "cc" && l.promoUntil) return "Already on a balance transfer until age " + l.promoUntil + ".";
  if (l.kind === "cc") return "Balance transfers need a credit standing of 600 or more.";
  if (l.kind === "pers") return "No lender beats your current rate by enough to be worth the fees.";
  return "";
}
function refinance(l, o){
  const p = S.p;
  if (p.cash < o.fee) return null;
  p.cash -= o.fee; S.stats.spend += o.fee;
  const n = monthsLeft(l), from = l.kind;
  if (from === "hdb"){ l.kind = "home"; l.name = LOAN_KINDS.home.name; l.fromHdb = true; }
  if (o.id === "bt"){ l.bal += 0; l.rate = 0; l.promoUntil = S.age + 1; l.monthly = Math.max(50, Math.round(l.bal * 0.03)); }
  else {
    l.rate = o.rate; l.taken = S.age; l.years = n / 12; l.monthly = o.monthly;
    l.variable = !!o.variable; l.fixed = !!o.fixedYrs;
    l.fixedUntil = o.fixedYrs ? S.age + o.fixedYrs : undefined;
    l.lockUntil = l.kind === "home" ? S.age + (o.fixedYrs ? FIX_YEARS : 2) : -1;
  }
  tl(S.age, "Refinanced the " + (from === "hdb" ? "HDB loan to a bank" : l.name.toLowerCase()) + " at " + pct(l.rate, 2) + (o.fee ? " (" + money(o.fee) + " in fees)" : "") + ".");
  return l;
}

/* once a year, before the repayments: fixed packages end, balance transfers end */
function stepLoanTerms(notes){
  for (const l of S.loans){
    if (l.fixedUntil !== undefined && S.age >= l.fixedUntil){
      l.fixedUntil = undefined; l.fixed = false; l.variable = true; l.floatedAt = S.age;
      l.rate = Math.max(0.012, S.econ.rate + LOAN_KINDS.home.spread + REVERT_SPREAD);
      l.monthly = Math.round(amort(l.bal, l.rate, monthsLeft(l)));
      if (notes) notes.push("Your fixed home-loan rate has ended: now floating at " + pct(l.rate, 2) + ", " + money(l.monthly) + "/mo. Other banks may offer less.");
    }
    if (l.promoUntil !== undefined && S.age >= l.promoUntil){
      l.promoUntil = undefined; l.rate = CC_RATE;
      if (notes && l.bal > 10) notes.push("The 0% balance transfer has ended: the " + money(l.bal) + " left is back at " + pct(CC_RATE) + ".");
    }
  }
}
/* the best a bank would offer on this home loan today, and whether it is worth a look */
function refiWorth(l){
  if (!isHousing(l) || l.fixedUntil !== undefined || inLockIn(l)) return null;
  const best = refiOffers(l).filter(o => !o.oneWay).sort((a, b) => b.saved - a.saved)[0];
  return best && best.saved > 3000 * S.econ.cpi && l.rate - best.rate > 0.003 ? best : null;
}

/* ============================================================
   7e. MONEY AND LIFE — the record of how you lived, read back at 65.
   Money is for choices. Below "enough" saving is wise; above it, unspent money buys nothing
   you will use. Two readings, in words only:
     wealth — what you can draw at 65 against "enough": your lifestyle funded to 90 after CPF LIFE
     life   — wellbeing, holidays, going out, the regulars, people, health (hidden score, 0–1)
   The yearly rows come from recordYear (c_engine.js); every choice made on a card is logged
   by renderCard (f_turn.js) with what it did to money and to life.
   ============================================================ */

/* a choice on a card: money = net worth now plus five years of cash flow; life = how you feel */
function logChoice(card, t, before, after){
  if ((typeof PREVIEW !== "undefined" && PREVIEW) || !S) return;
  const money = (after.nw - before.nw) + (after.cf - before.cf) * 60;
  const life = (after.wb - before.wb) - 2 * (after.ten - before.ten) - 2 * (after.bo - before.bo) + Math.sign(Math.round(after.ls - before.ls));
  if (Math.abs(money) < 500 && Math.abs(life) < 1) return;
  const row = { age: S.age, card, t, money: Math.round(money), life: Math.round(life * 10) / 10 };
  (S.choices = S.choices || []).push(row);
  if (S.cls && typeof classChoice === "function") classChoice(row);    /* class mode: the teacher sees it (t_class.js) */
  if (S.choices.length > 400) S.choices.shift();
}
function choiceSnap(){
  return { nw: netWorth(), cf: netCashflow(), wb: S.p.wellbeing, ten: S.p.tension || 0, bo: S.p.burnout, ls: livingCosts().lifestyle };
}

/* what you can draw at 65, what you need to live like this to 90, and whether it lasts */
function enoughAt65(){
  const have = Math.max(0, S.p.cash) + invTotal() + srsBal() * 0.95 + S.cpf.oa + Math.max(0, extraValue() - extraProps().reduce((a, x) => a + extraLoanBal(x), 0));
  const inflow = cpfLifeAt(S.p.cpfPlan, S.p.cpfStart, END_AGE) + (S.a.property && S.a.property.rentOut ? S.a.property.rentIncome : 0) + extraRent() + lodgerRent() + kidsGiving();
  const gap = Math.max(0, totalCosts() + loanMonthly() - inflow);
  const need = gap * 12 * 25;
  return { have, need, gap, ratio: need > 0 ? have / need : 99, runsOut: gap > 0 ? Math.floor(END_AGE + have / (gap * 12)) : null };
}

/* the hidden life reading, 0–1: mostly how you felt, then what you did and who was there */
function lifeReading(rows){
  const R = rows.filter(r => r.age >= 23 && r.wb !== undefined);
  if (!R.length) return 0.5;
  const frac = f => R.filter(f).length / R.length;
  const wb = clamp((R.reduce((a, r) => a + r.wb, 0) / R.length - 30) / 45, 0, 1);
  const hol = Math.min(1, frac(r => r.hol && r.hol !== "none") / 0.7);
  const out = Math.min(1, frac(r => r.out >= 1) / 0.8);
  const regulars = Math.min(1, frac(r => r.pet || r.gym >= 1 || r.club || r.vol) / 0.5);
  const people = Math.min(1, frac(r => r.partner) + (R.some(r => r.kids > 0) ? 0.3 : 0));
  const worn = frac(r => r.dep || r.bo >= 4);
  return clamp(0.45 * wb + 0.2 * hol + 0.1 * out + 0.1 * regulars + 0.15 * people - 0.2 * worn, 0, 1);
}

/* financial independence: the age from which your savings alone (25 years of spending at the
   4% rule) carried you, and kept carrying you every year after. FIRE if you also stopped work by 60. */
function fireRecord(rows){
  const R = rows.filter(r => r.fi !== undefined && r.age < END_AGE);
  if (!R.length || R[R.length - 1].fi < 1) return null;
  let i = R.length - 1;
  while (i > 0 && R[i - 1].fi >= 1 && !R[i - 1].fam) i--;
  if (R[i].fam) return null;
  let stop = null;
  for (let k = R.length - 1; k >= 0 && !R[k].job && !R[k].study; k--) stop = R[k].age;
  return { fiAge: R[i].age, stopAge: stop !== null && stop >= R[i].age && stop <= 60 ? stop : null };
}

const ENDINGS = {
  huat:  { t: "Huat and happy", icon: "🧧",
    line: "Enough money, and a life you actually used it on. You worked, you saved, you went places, you ate the good chicken rice. This is the whole point, lah." },
  urn:   { t: "Richest in the columbarium", icon: "🏺",
    line: "Big number in the bank, small number of good days. Your CPF statement very proud of you. Nobody else got to see you. The money was supposed to buy the life, not replace it." },
  yolo:  { t: "YOLO, then sian", icon: "🎢",
    line: "What a ride. Holidays, makan, good times — but the money runs out before you do. The life was real; the retirement will be economy rice every day." },
  tahan: { t: "Tahan all the way", icon: "🥲",
    line: "Not enough money, not much fun either. Tahan-ed every year and still came up short. Usually one big thing went wrong early — see below — and everything else followed it." }
};

/* the read-back: an ending, a FIRE badge if earned, and the lines that explain it */
function lifeStory(){
  const H = (S.hist || []).filter(r => r.age > START_AGE);
  const en = enoughAt65(), life = lifeReading(H), fire = fireRecord(H);
  const rich = en.ratio >= 1, full = life >= 0.55;
  const ending = rich ? (full ? "huat" : "urn") : (full ? "yolo" : "tahan");
  const lines = [];
  const adult = H.filter(r => r.age >= 23 && r.hol !== undefined && !r.fam);
  const cpi = S.econ.cpi;

  /* 1. money left over beyond enough */
  const surplus = en.have - en.need;
  if (en.ratio >= 1.5 && surplus > 0){
    const trip = Math.max(holidayCost("tokyo"), 1), n = Math.round(surplus / trip);
    const trips = n >= 300 ? "a Japan trip every single month from now to 90, and still change left over" : "about " + n + " Japan holidays you never took";
    lines.push(full
      ? "You end with " + kmoneyT(surplus) + " more than your life to 90 needs. Spare money for the kids, or for surprises. Steady."
      : "You end with " + kmoneyT(surplus) + " more than your life to 90 needs — " + trips + ". The money waited for a life that never came.");
  }
  /* 2. rich years with no holiday */
  const noHol = adult.filter(r => r.hol === "none" && r.em >= 12);
  if (noHol.length >= 4){
    const worst = noHol.reduce((a, r) => r.em > a.em ? r : a, noHol[0]);
    lines.push(noHol.length + " years with a year's cash in the bank and no holiday. At " + worst.age + " you had " + Math.round(worst.em) + " months of buffer and stayed home. One trip would have cost a few percent of it.");
  }
  /* 3. living thin while saving hard */
  const thin = adult.filter(r => r.out === 0 && r.food === 0 && r.take > 0 && r.saved / r.take > 0.35);
  if (thin.length >= 5)
    lines.push(thin.length + " years on the cheapest food and no going out, while saving more than a third of your pay. Economic rice every day is a choice, not a law of nature.");
  /* 4. free, but kept grinding */
  if (fire && !fire.stopAge){
    const grind = H.filter(r => r.age >= fire.fiAge && r.job && r.wb < 45).length;
    if (grind >= 5) lines.push("From " + fire.fiAge + " your savings could pay for your life. You worked " + (END_AGE - fire.fiAge) + " more years anyway, " + grind + " of them worn down. Could have chosen easier work, or none.");
  }
  /* 5. not enough: when it runs out, and the biggest reason */
  if (!rich){
    if (en.runsOut !== null) lines.push("At this pace your savings run out around " + en.runsOut + ". After that it is CPF LIFE only" + (en.gap ? ", and it pays " + money(en.gap) + " a month less than your life costs" : "") + ".");
    const earn = H.filter(r => r.take > 0);
    const lsShare = earn.length ? earn.reduce((a, r) => a + r.ls, 0) / Math.max(1, earn.reduce((a, r) => a + r.take, 0)) : 0;
    const hShare = earn.length ? earn.reduce((a, r) => a + r.housing, 0) / Math.max(1, earn.reduce((a, r) => a + r.take, 0)) : 0;
    if (lsShare > 0.3) lines.push("Lifestyle took " + pct(lsShare, 0) + " of your take-home, year after year. Fun, but that is where retirement went.");
    else if (hShare > 0.4) lines.push("The roof took " + pct(hShare, 0) + " of your take-home. Everything else had to fit in what was left.");
    else if ((S.stats.shortfalls || 0) >= 3) lines.push("You ran short " + S.stats.shortfalls + " times. Each time something got sold cheap or borrowed dear.");
  }
  /* 6. what was well spent */
  const places = new Set((S.p.ls && S.p.ls.stamps || []).map(s => s.id)).size;
  const petYrs = H.filter(r => r.pet).length;
  const good = [];
  if (places >= 6) good.push(places + " places in the passport");
  if (petYrs >= 5) good.push(petYrs + " years with a pet");
  if (H.some(r => r.kids > 0)) good.push("children raised");
  if (H.filter(r => r.out >= 2).length >= 10) good.push("a lot of good dinners");
  if (good.length) lines.push("Money well spent: " + good.join(", ") + ".");
  /* 7. the choices that mattered most */
  const ch = S.choices || [];
  if (ch.length){
    const bestLife = ch.filter(c => c.life > 0).sort((a, b) => b.life - a.life || b.money - a.money)[0];
    const costLife = ch.filter(c => c.life < 0 && c.money >= 0).sort((a, b) => a.life - b.life)[0];
    const costMoney = ch.filter(c => c.money < 0 && c.life <= 0).sort((a, b) => a.money - b.money)[0];
    if (bestLife) lines.push("Best life move: \"" + bestLife.t + "\" at " + bestLife.age + " (" + bestLife.card + ").");
    if (costLife && !full) lines.push("The saving that cost you: \"" + costLife.t + "\" at " + costLife.age + ". Kept the money, lost the joy.");
    if (costMoney && costMoney.money < -10000 * cpi) lines.push("The one that hurt the wallet: \"" + costMoney.t + "\" at " + costMoney.age + " — about " + kmoney(-costMoney.money) + ", and nothing to show for it.");
  }

  return { ending, e: ENDINGS[ending], rich, full, fire, en, lines: lines.slice(0, 7) };
}

/* ============================================================
   8. DICE RENDERING
   ============================================================ */
const PIPS = {
  1: ["p3"], 2: ["p1", "p5"], 3: ["p1", "p3", "p5"],
  4: ["p1", "p2", "p4", "p5"], 5: ["p1", "p2", "p3", "p4", "p5"], 6: ["p1", "p2", "p4", "p5", "p6", "p7"]
};
function dieHTML(n, small, rolling){
  return '<div class="die' + (small ? " sm" : "") + (rolling ? " rolling" : "") + '">' +
    PIPS[n].map(c => '<b class="' + c + '"></b>').join("") + "</div>";
}
/* the year roll: four themed dice tumbling together */
function rollFourDice(container, done){
  const vals = [1, 2, 3, 4].map(() => d6());
  const draw = (nums, rolling) => DICE.map((d, i) =>
    '<div class="ydie ' + d.cls + '"><div class="ydie-l">' + d.icon + "</div>" +
    dieHTML(nums[i], false, rolling) + "</div>").join("");
  container.innerHTML = draw(vals, true);
  const spin = setInterval(() => { container.innerHTML = draw([d6(), d6(), d6(), d6()], true); }, 90);
  setTimeout(() => {
    clearInterval(spin);
    container.innerHTML = draw(vals, false);
    done(vals);
  }, 900);
}

/* animate dice into a container, then call done(values). While dice are in the air nothing
   else may open: a tool drawn over a check would leave its result nowhere to land */
let diceInAir = 0;
function rollDice(container, count, done, faceMap){
  diceInAir++;
  const vals = [];
  for (let i = 0; i < count; i++) vals.push(d6());
  const shown = vals.map(v => faceMap ? faceMap(v) : v);
  container.innerHTML = shown.map(v => dieHTML(v, false, true)).join("");
  let t = 0;
  const spin = setInterval(() => {
    container.innerHTML = shown.map(() => dieHTML(d6(), false, true)).join("");
    t++;
  }, 90);
  setTimeout(() => {
    clearInterval(spin);
    container.innerHTML = shown.map(v => dieHTML(v, false, false)).join("");
    diceInAir = Math.max(0, diceInAir - 1);
    done(vals, shown);
  }, 880);
}

/* ============================================================
   ART: a drawn SVG scene across the top of every card and pop-up
   ============================================================
   Scenes live in ART (r_art_ev1.js, r_art_ev2.js, r_art_pop.js), keyed by event id or by a
   screen key. withArt() is called by openModal() and show(): it finds the gcard, works out which
   scene fits (data-art on the card, else the title, else the icon) and inserts the picture above
   the header. Colours are CSS variables (--a-*) set in LIFE.html. Every scene is drawn on a
   600 x 220 canvas; keep what matters between y 14 and 206, since wide cards crop a little. */
const ART = {};
const ART_TITLE = {};   /* exact card title -> scene key (filled by r_art_pop.js) */
const ART_ICON = {};    /* header icon -> scene key, for titles that change */

function artSVG(key){
  const f = ART[key]; if (!f) return "";
  let body = "";
  try { body = f(); } catch (e){ console.error("art " + key, e); return ""; }
  return '<div class="artwrap"><svg class="art" viewBox="0 0 600 220" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">' + body + "</svg></div>";
}
const unesc = s => String(s || "").replace(/<[^>]*>/g, "").replace(/&quot;/g, '"').replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&#39;/g, "'").replace(/&amp;/g, "&").trim();
function artKeyFor(html){
  const d = html.match(/<div class="gcard" data-art="([a-z_0-9]+)">/);
  if (d && ART[d[1]]) return d[1];
  const t = unesc((html.match(/<h2>([\s\S]*?)<\/h2>/) || [])[1]);
  if (ART_TITLE[t]) return ART_TITLE[t];
  const ic = ((html.match(/<span class="ic">([^<]*)<\/span>/) || [])[1] || "").trim();
  return ART_ICON[ic] || null;
}
function withArt(html){
  if (typeof html !== "string" || html.indexOf('class="artwrap"') >= 0) return html;
  const m = html.match(/<div class="gcard"(?: data-art="[a-z_0-9]+")?>/);
  if (!m) return html;
  const key = artKeyFor(html.slice(m.index)), art = key ? artSVG(key) : "";
  if (!art) return html;
  const at = m.index + m[0].length;
  return html.slice(0, at) + art + html.slice(at);
}

/* ---------- shared parts ---------- */
const A = {
  /* rectangles of windows in a grid */
  win(x, y, cols, rows, w, h, gx, gy, cls){
    let s = "";
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
      s += '<rect class="' + (cls || "c-win") + '" x="' + (x + c * gx) + '" y="' + (y + r * gy) + '" width="' + w + '" height="' + h + '" rx="1.5"/>';
    return s;
  },
  star(x, y, s, cls){ return '<path class="' + (cls || "c-acc2") + '" d="M' + x + "," + (y - s) + "Q" + x + "," + y + " " + (x + s) + "," + y + "Q" + x + "," + y + " " + x + "," + (y + s) + "Q" + x + "," + y + " " + (x - s) + "," + y + "Q" + x + "," + y + " " + x + "," + (y - s) + 'Z"/>'; },
  coin(x, y, r){ r = r || 9; return '<circle class="c-acc2 rim" cx="' + x + '" cy="' + y + '" r="' + r + '"/><circle class="lnk" style="stroke-width:1.2" cx="' + x + '" cy="' + y + '" r="' + (r * 0.55) + '"/>'; },
  flag(x, y, h){ h = h || 70; return '<rect class="c-ink" x="' + x + '" y="' + y + '" width="3.5" height="' + h + '"/><path class="c-acc" d="M' + (x + 3) + "," + y + "L" + (x + 36) + "," + (y + 11) + "L" + (x + 3) + "," + (y + 23) + 'Z"/>'; },
  /* text; o: size, w (weight), a (anchor), c (colour var name), m (mono), f (serif) */
  t(x, y, str, o){
    o = o || {};
    return '<text x="' + x + '" y="' + y + '"' + (o.m ? ' class="m"' : o.f ? ' class="f"' : "") + ' font-size="' + (o.s || 10) + '" font-weight="' + (o.w || 700) + '"' +
      (o.a ? ' text-anchor="' + o.a + '"' : "") + (o.c ? ' style="fill:var(--a-' + o.c + ')"' : "") + (o.ls ? ' letter-spacing="' + o.ls + '"' : "") + ">" + esc(str) + "</text>";
  },
  /* speech bubble with a tail pointing down-left (dir -1) or down-right (dir 1) */
  bubble(x, y, w, h, lines, dir, fs){
    const tx = dir > 0 ? x + w - 34 : x + 28, tail = dir > 0 ? "L" + (tx + 16) + "," + (y + h + 14) + "L" + (tx + 12) + "," + (y + h) : "L" + (tx - 14) + "," + (y + h + 14) + "L" + (tx + 12) + "," + (y + h);
    let s = '<path class="c-paper rim" d="M' + (x + 8) + "," + y + "H" + (x + w - 8) + "Q" + (x + w) + "," + y + " " + (x + w) + "," + (y + 8) + "V" + (y + h - 8) + "Q" + (x + w) + "," + (y + h) + " " + (x + w - 8) + "," + (y + h) +
      "H" + (tx + (dir > 0 ? 12 : 12)) + tail + "H" + (x + 8) + "Q" + x + "," + (y + h) + " " + x + "," + (y + h - 8) + "V" + (y + 8) + "Q" + x + "," + y + " " + (x + 8) + "," + y + 'Z"/>';
    fs = fs || 10;
    const lh = fs * 1.35, top = y + h / 2 - (lines.length - 1) * lh / 2 + fs * 0.35;
    lines.forEach((l, i) => { s += A.t(x + w / 2, top + i * lh, l, { s: fs, a: "middle" }); });
    return s;
  },
  /* a phone; content drawn by caller inside (x+7..x+w-7, y+12..y+h-12) */
  phone(x, y, w, h, inner){ return '<rect class="c-ink" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + Math.min(18, w / 6) + '"/><rect class="c-paper" x="' + (x + 6) + '" y="' + (y + 12) + '" width="' + (w - 12) + '" height="' + (h - 24) + '" rx="4"/>' + (inner || ""); },
  /* a sheet of paper with grey lines */
  paper(x, y, w, h, n, title){
    let s = '<rect class="c-paper rim" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="2"/>';
    if (title) s += A.t(x + 8, y + 16, title, { s: 9, w: 800 });
    const top = y + (title ? 26 : 12);
    for (let i = 0; i < (n || 5); i++) s += '<rect class="c-hdb2" x="' + (x + 8) + '" y="' + (top + i * 9) + '" width="' + (w - 16 - (i * 13) % 22) + '" height="3"/>';
    return s;
  },
  envelope(x, y, w, h, cls){ return '<rect class="' + (cls || "c-paper") + ' rim" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="2"/><path class="lnk" d="M' + x + "," + y + "L" + (x + w / 2) + "," + (y + h * 0.55) + "L" + (x + w) + "," + y + '"/>'; },
  /* an HDB block: body, coloured top band, windows */
  hdb(x, y, w, h, band){
    const cols = Math.max(2, Math.floor((w - 12) / 24)), rows = Math.max(2, Math.floor((h - 20) / 17));
    const gx = (w - 16) / cols;
    return '<rect class="c-hdb rim" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '"/><rect class="' + (band || "c-shirt2") + '" x="' + (x - 4) + '" y="' + (y - 7) + '" width="' + (w + 8) + '" height="9" rx="2"/>' +
      A.win(x + 10, y + 12, cols, rows, gx - 8, 10, gx, 17);
  },
  /* a low city skyline across the back */
  skyline(y, cls){ return '<path class="' + (cls || "c-hdb2") + '" d="M0,' + y + "V" + (y - 40) + "H40V" + (y - 62) + "H78V" + (y - 30) + "H104V" + (y - 80) + "H138V" + (y - 44) + "H170V" + (y - 58) + "H210V" + (y - 26) + "H250V" + (y - 70) + "H280V" + (y - 38) + "H330V" + (y - 90) + "H362V" + (y - 50) + "H400V" + (y - 64) + "H436V" + (y - 34) + "H470V" + (y - 76) + "H506V" + (y - 44) + "H540V" + (y - 60) + "H600V" + y + 'Z"/>'; },
  tree(x, y, r){ r = r || 20; return '<rect class="c-wood" x="' + (x - 3) + '" y="' + (y - r * 0.9) + '" width="6" height="' + (r * 0.9) + '"/><circle class="c-grn" cx="' + x + '" cy="' + (y - r * 1.3) + '" r="' + r + '"/>'; },
  sun(x, y, r){ return '<circle class="c-acc2" opacity=".5" cx="' + x + '" cy="' + y + '" r="' + (r || 30) + '"/>'; },
  cloud(x, y, s, cls){ s = s || 1; return '<g transform="translate(' + x + "," + y + ") scale(" + s + ')"><path class="' + (cls || "c-paper") + '" d="M-30,10Q-34,-6 -18,-8Q-14,-24 4,-20Q18,-30 28,-14Q42,-12 38,4Q40,12 30,12H-24Q-32,12 -30,10Z"/></g>'; },
  table(x, y, w, cls){ return '<rect class="' + (cls || "c-wood") + '" x="' + x + '" y="' + y + '" width="' + w + '" height="10" rx="2"/><rect class="' + (cls || "c-wood") + '" x="' + (x + 10) + '" y="' + (y + 10) + '" width="7" height="' + (206 - y) + '"/><rect class="' + (cls || "c-wood") + '" x="' + (x + w - 17) + '" y="' + (y + 10) + '" width="7" height="' + (206 - y) + '"/>'; },
  /* a round kopitiam table seen from the side */
  kopitable(x, y){ return '<ellipse class="c-paper rim" cx="' + x + '" cy="' + y + '" rx="60" ry="8"/><rect class="c-ink" x="' + (x - 3) + '" y="' + (y + 6) + '" width="6" height="' + (200 - y) + '"/><rect class="c-ink" x="' + (x - 22) + '" y="198" width="44" height="5" rx="2"/>'; },
  kopi(x, y){ return '<path class="c-paper rim" d="M' + (x - 8) + "," + (y - 16) + "H" + (x + 8) + "L" + (x + 6) + "," + y + "H" + (x - 6) + 'Z"/><path class="lnk" d="M' + (x + 8) + "," + (y - 12) + "Q" + (x + 14) + "," + (y - 9) + " " + (x + 7) + "," + (y - 4) + '"/><rect class="c-wood" x="' + (x - 7) + '" y="' + (y - 14) + '" width="14" height="4"/>'; },
  laptop(x, y, w, inner){ w = w || 70; const h = w * 0.62; return '<rect class="c-ink" x="' + x + '" y="' + (y - h) + '" width="' + w + '" height="' + h + '" rx="4"/><rect class="c-sky2" x="' + (x + 4) + '" y="' + (y - h + 4) + '" width="' + (w - 8) + '" height="' + (h - 8) + '" rx="2"/>' + (inner || "") + '<rect class="c-hdb2 rim" x="' + (x - 8) + '" y="' + y + '" width="' + (w + 16) + '" height="5" rx="2"/>'; },
  /* a bed with a sleeper; face: eye/mouth set */
  heart(x, y, s, cls){ s = s || 1; return '<path class="' + (cls || "c-acc") + '" transform="translate(' + x + "," + y + ") scale(" + s + ')" d="M0,12C-18,0 -14,-14 -6,-14C-2,-14 0,-10 0,-8C0,-10 2,-14 6,-14C14,-14 18,0 0,12Z"/>'; },
  car(x, y, cls, s){ s = s || 1; return '<g transform="translate(' + x + "," + y + ") scale(" + s + ')"><path class="' + (cls || "c-acc") + ' rim" d="M-62,0V-18Q-60,-24 -50,-26L-34,-28L-20,-44Q-14,-50 -4,-50H26Q36,-50 42,-42L52,-28Q64,-26 64,-16V0Z"/><path class="c-sky2" d="M-28,-30L-16,-44H4V-30ZM10,-44H26Q32,-44 36,-38L42,-30H10Z"/><circle class="c-ink" cx="-36" cy="0" r="12"/><circle class="c-hdb2" cx="-36" cy="0" r="5"/><circle class="c-ink" cx="38" cy="0" r="12"/><circle class="c-hdb2" cx="38" cy="0" r="5"/></g>'; },
  die(x, y, s, n, rot){
    s = s || 34; const p = { 1: [[.5, .5]], 2: [[.28, .28], [.72, .72]], 3: [[.25, .25], [.5, .5], [.75, .75]], 4: [[.28, .28], [.72, .28], [.28, .72], [.72, .72]], 5: [[.26, .26], [.74, .26], [.5, .5], [.26, .74], [.74, .74]], 6: [[.28, .24], [.72, .24], [.28, .5], [.72, .5], [.28, .76], [.72, .76]] }[n || 5];
    return '<g transform="rotate(' + (rot || 0) + " " + (x + s / 2) + " " + (y + s / 2) + ')"><rect class="c-paper rim" x="' + x + '" y="' + y + '" width="' + s + '" height="' + s + '" rx="' + (s * 0.18) + '"/>' +
      p.map(q => '<circle class="c-ink" cx="' + (x + q[0] * s) + '" cy="' + (y + q[1] * s) + '" r="' + (s * 0.08) + '"/>').join("") + "</g>";
  },
  /* a banknote */
  note(x, y, rot, cls){ return '<g transform="rotate(' + (rot || 0) + " " + (x + 22) + " " + (y + 11) + ')"><rect class="' + (cls || "c-grn") + ' rim" x="' + x + '" y="' + y + '" width="44" height="22" rx="2"/><circle class="c-paper" cx="' + (x + 22) + '" cy="' + (y + 11) + '" r="6"/></g>'; },
  /* a pet: kind "cat" or "dog", sitting, facing left; o.sleep closes the eyes */
  pet(x, y, kind, o){
    o = o || {};
    const eyes = o.sleep ? '<path class="lnk" d="M-10,-40Q-7,-37 -4,-40M3,-40Q6,-37 9,-40"/>' : '<circle class="c-ink" cx="-7" cy="-40" r="2"/><circle class="c-ink" cx="6" cy="-40" r="2"/>';
    const ears = kind === "dog" ? '<path class="c-wood" d="M-16,-50Q-24,-38 -18,-30L-12,-46ZM16,-50Q24,-38 18,-30L12,-46Z"/>' : '<path class="c-cat" d="M-15,-46L-14,-62L-4,-52ZM15,-46L14,-62L4,-52Z"/>';
    return '<g transform="translate(' + x + "," + y + ") scale(" + (o.s || 1) + ')"><path class="lnc" d="M16,-6Q36,-4 34,-24"/><ellipse class="c-cat" cx="0" cy="-14" rx="20" ry="16"/>' + ears +
      '<circle class="c-cat" cx="0" cy="-40" r="15"/>' + eyes + '<path class="c-ink" d="M-2,-35H2L0,-33Z"/>' + (kind === "dog" ? '<ellipse class="c-paper" cx="0" cy="-33" rx="6" ry="4"/><path class="c-ink" d="M-2,-35H2L0,-33Z"/>' : "") + "</g>";
  },
  /* floor/wall helpers */
  room(wall, floorY, floor){ return '<rect class="' + (wall || "c-wall") + '" width="600" height="220"/><rect class="' + (floor || "c-ground") + '" y="' + floorY + '" width="600" height="' + (220 - floorY) + '"/>'; },
  sky(ground, gcls){ return '<rect class="c-sky" width="600" height="220"/>' + (ground ? '<rect class="' + (gcls || "c-grn") + '" y="' + ground + '" width="600" height="' + (220 - ground) + '"/>' : ""); },
  window(x, y, w, h, inner){ return '<rect class="c-sky rim" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="2"/>' + (inner || "") + '<path class="lnp" d="M' + (x + w / 2) + "," + y + "V" + (y + h) + "M" + x + "," + (y + h / 2) + "H" + (x + w) + '"/><rect class="c-wood" x="' + (x - 6) + '" y="' + (y + h) + '" width="' + (w + 12) + '" height="6" rx="2"/>'; },
  clock(x, y, r){ r = r || 20; return '<circle class="c-paper rim" cx="' + x + '" cy="' + y + '" r="' + r + '"/><path class="lnk" d="M' + x + "," + y + "V" + (y - r * 0.65) + "M" + x + "," + y + "L" + (x + r * 0.45) + "," + (y + r * 0.3) + '"/>'; },
  calendar(x, y, top, big, w){ w = w || 80; return '<rect class="c-paper rim" x="' + x + '" y="' + y + '" width="' + w + '" height="' + w + '" rx="6"/><rect class="c-acc" x="' + x + '" y="' + y + '" width="' + w + '" height="' + (w * 0.26) + '" rx="6"/><rect class="c-acc" x="' + (x + 1) + '" y="' + (y + w * 0.14) + '" width="' + (w - 2) + '" height="' + (w * 0.12) + '"/>' +
    A.t(x + w / 2, y + w * 0.19, top, { s: w * 0.11, w: 800, a: "middle", c: "paper", ls: 1 }) + A.t(x + w / 2, y + w * 0.8, big, { s: w * 0.42, w: 800, a: "middle", f: 1 }); },
  bag(x, y, cls){ return '<path class="' + (cls || "c-box") + ' rim" d="M' + (x - 16) + "," + (y - 34) + "H" + (x + 16) + "L" + (x + 19) + "," + y + "H" + (x - 19) + 'Z"/><path class="lnk" d="M' + (x - 8) + "," + (y - 34) + "Q" + (x - 8) + "," + (y - 46) + " " + x + "," + (y - 46) + "Q" + (x + 8) + "," + (y - 46) + " " + (x + 8) + "," + (y - 34) + '"/>'; },
  ang(x, y, rot){ return '<g transform="rotate(' + (rot || 0) + " " + x + " " + y + ')"><rect class="c-acc rim" x="' + (x - 11) + '" y="' + (y - 17) + '" width="22" height="34" rx="2"/><rect class="c-acc2" x="' + (x - 6) + '" y="' + (y - 9) + '" width="12" height="12" rx="1"/></g>'; },
  sweat(x, y){ return '<path class="c-win" d="M' + x + "," + y + "Q" + (x + 5) + "," + (y + 8) + " " + x + "," + (y + 10) + "Q" + (x - 5) + "," + (y + 8) + " " + x + "," + y + 'Z"/>'; },
  arrow(x1, y1, x2, y2, cls){ const a = Math.atan2(y2 - y1, x2 - x1), h = 12; return '<path class="' + (cls || "lnk") + '" d="M' + x1 + "," + y1 + "L" + x2 + "," + y2 + "M" + (x2 - h * Math.cos(a - 0.5)) + "," + (y2 - h * Math.sin(a - 0.5)) + "L" + x2 + "," + y2 + "L" + (x2 - h * Math.cos(a + 0.5)) + "," + (y2 - h * Math.sin(a + 0.5)) + '"/>'; },
  bed(x, y, w){ return '<rect class="c-paper rim" x="' + x + '" y="' + (y - 48) + '" width="12" height="' + 60 + '" rx="3"/><rect class="c-paper rim" x="' + x + '" y="' + y + '" width="' + w + '" height="20" rx="4"/><rect class="c-ink" x="' + (x + w - 10) + '" y="' + (y + 20) + '" width="7" height="' + (200 - y - 20) + '"/><ellipse class="c-paper rim" cx="' + (x + 40) + '" cy="' + (y - 8) + '" rx="26" ry="9"/>'; },
  /* someone lying in bed: head at hx,hy; blanket to x2 */
  sleeper(hx, hy, x2, o){
    o = o || {};
    return '<g transform="translate(' + hx + "," + (hy + 111) + ')"><circle class="c-skin" cx="0" cy="-111" r="15"/>' + (o.long ? HAIR.long : HAIR.short) + (EYES[o.eyes || "shut"]) + (FACES[o.face || "flat"]) + "</g>" +

  }
};

/* a person, feet at (x,y), about 130 tall at scale 1.
   o: s, rot, flip, shirt (palette name), pants, hair (HAIR key), eyes, face, arms, hat, hold, front, legs:false, skirt */
function guy(x, y, o){
  o = o || {};
  const s = o.s || 1, style = o.shirt ? ' style="--shirt:var(--a-' + o.shirt + ')"' : "";
  const arms = ARMS[o.arms || "down"].map((a, i) => {
    if (typeof a === "string"){ const e = a.match(/(-?[\d.]+),(-?[\d.]+)$/); return '<path class="ln" d="' + a + '"/><circle class="c-skin" cx="' + e[1] + '" cy="' + e[2] + '" r="5.5"/>'; }
    const sx = i ? 17 : -17;
    return '<path class="ln" d="M' + sx + ",-90L" + a[0] + "," + a[1] + '"/><circle class="c-skin" cx="' + a[0] + '" cy="' + a[1] + '" r="5.5"/>';
  }).join("");
  const legs = o.legs === false ? "" : o.skirt
    ? '<rect class="c-skin" x="-11" y="-30" width="8" height="30" rx="3"/><rect class="c-skin" x="3" y="-30" width="8" height="30" rx="3"/><path class="' + (o.pants || "c-ink") + '" d="M-22,-50H22L26,-24H-26Z"/>'
    : '<rect class="' + (o.pants || "c-ink") + '" x="-14" y="-50" width="11" height="50" rx="3"/><rect class="' + (o.pants || "c-ink") + '" x="3" y="-50" width="11" height="50" rx="3"/>';
  return '<g transform="translate(' + x + "," + y + ") rotate(" + (o.rot || 0) + ") scale(" + (o.flip ? -s : s) + "," + s + ')"' + style + ">" + (o.back || "") + legs +
    '<path class="c-shirt" d="M-22,-46L-20,-86Q-20,-97 -9,-97L9,-97Q20,-97 20,-86L22,-46Z"/>' + (o.tie ? '<path class="c-acc" d="M-3,-96H3L4,-66L0,-60L-4,-66Z"/>' : "") +
    '<circle class="c-skin" cx="0" cy="-111" r="15"/>' + HAIR[o.hair || "short"] + EYES[o.eyes || "dot"] + FACES[o.face || "smile"] + (o.hat || "") +
    (o.hold || "") + arms + (o.front || "") + "</g>";
}
/* just a head, centred at (x,y), radius r */
function head(x, y, r, o){
  o = o || {};
  return '<g transform="translate(' + x + "," + (y + 111 * r / 15) + ") scale(" + r / 15 + ')"><circle class="c-skin" cx="0" cy="-111" r="15"/>' + HAIR[o.hair || "short"] + EYES[o.eyes || "dot"] + FACES[o.face || "smile"] + (o.hat || "") + "</g>";
}

/* ============================================================
   14. TURN LOOP
   ============================================================ */
let busy = false;

/* ============================================================
   THE FOUR DICE
   One roll a year. Each die watches one part of your life and only
   speaks up when its number comes in — so quiet years stay quiet.
   ============================================================ */
const DICE = [
  { id: "career", name: "Career", icon: "💼", cls: "d-career" },
  { id: "market", name: "Money",  icon: "📈", cls: "d-market" },
  { id: "life",   name: "Life",   icon: "🏡", cls: "d-life"   },
  { id: "world",  name: "World",  icon: "🌐", cls: "d-world"  }
];

/* which deck each card belongs to */
const CARD_THEME = {
  firstjob: "career", betterjob: "career", study2: "career", downshift: "career",
  disrupt: "career", retrench: "career", promo: "career", offer: "career",
  side: "career", windfallwork: "career",

  invest: "market", topup: "market", crash: "market", rally: "market",
  rateshock: "market", bonus: "market", scam: "market", inherit: "market",

  car: "life", moveout: "life", buyhome: "life", sellhome: "life", holiday: "life",
  lifestyle: "life", insure: "life", marry: "life", kid: "life", help: "life",
  renovate: "life", medical: "life", repair: "life", tenant: "life",
  parentcare: "life", propdown: "life",

  chronic: "life", critical: "life", accident: "life", disable: "life",
  divorce: "life", pillness: "life", abroad: "career", startup: "market",
  windfall: "world", fraud: "market",
  depression: "life", ill: "life", late: "career", pressure: "life",
  surprise: "life", kidpay: "life", kidhelp: "life", btowin: "life", btolose: "life", btoafl: "life", btokeys: "life", coe: "life",
  cpf55: "market", lodgerbad: "life", bnpl: "market"
};
const themeOf = id => CARD_THEME[id] || "life";

/* the number each die has to beat this year. Lower when that part of your
   life is actually in motion. */
function diceThreshold(id){
  const p = S.p, e = S.econ;
  if (id === "career"){
    if (!p.job && !p.studying) return 2;                      // out of work: something must give
    if (e.regime === "recession") return 4;
    if (p.job && S.age - p.jobSince >= 7) return 4;
    if (p.burnout > 3) return 4;
    return 5;
  }
  if (id === "market"){
    const move = Math.abs(lastReturn("etf") || 0);
    const rateJump = Math.abs(e.rate - e.prevRate);
    if (move > 0.15 || rateJump > 0.012) return 4;
    if (liquid() < 3000 && !S.loans.length) return 7;         // nothing to decide about
    return 5;
  }
  if (id === "life"){
    if (S.age >= 26 && S.age <= 45) return 4;
    if (dependents() || S.a.property) return 4;
    return 5;
  }
  return 6;                                                   // world: news only, rare
}

function doRoll(){
  if (diceInAir) return;                           /* a check in a tool is still rolling: let it land first */
  if (docking) screenBoard();
  if (busy || S.over) return;
  if (classHeld()){ classRollState(); return; }    /* the teacher has paused the class here (t_class.js) */
  busy = true;
  const rb = el("roll"); if (rb) rb.disabled = true;
  el("rollnote").textContent = "Rolling…";
  rollFourDice(el("dicebay"), vals => {
    const dice = DICE.map((d, i) => {
      const need = diceThreshold(d.id);
      return { ...d, v: vals[i], need, hit: vals[i] >= need };
    });
    S.lastDice = dice;
    S.rolls.push({ age: S.age, kind: "year", v: vals.join("-") });
    setTimeout(() => advanceYear(dice), 380);
  });
}

/* one roll = one year */
function advanceYear(dice){
  if (S.tile < TILES - 1){
    S.tile++;
    S.track[S.tile].visited = true;
  }
  const d = simulateYear();
  /* the year-end review is owed once this year's cards are done (q_review.js) */
  S.review = S.age < PLAY_END ? { age: S.age, raise: d.w.raise || 0 } : null;
  saveAuto();
  screenBoard();

  if (S.age >= PLAY_END){ showYear(d, dice, []); return; }

  /* what the year forces on you, whatever the dice say */
  const forced = [];
  if (d.fired) forced.push({ kind: "event", id: "retrench", theme: "career", forced: true });
  if (d.health) forced.push({ kind: "event", id: d.health, theme: themeOf(d.health), forced: true });
  if (d.fate) forced.push({ kind: "event", id: d.fate, theme: themeOf(d.fate), forced: true });
  for (const id of d.plans || []) forced.push({ kind: "event", id, theme: themeOf(id), forced: true });

  /* a guided step in the formative years takes the whole turn, then the forced cards */
  const step = dueChapterStep();
  if (step){
    S.queue = forced; saveAuto();
    markYear(forced.map(q => q.theme));
    showYear(d, dice, forced, step); return;
  }

  /* build this year's cards from whichever dice spoke */
  const queue = forced.slice();
  for (const die of dice){
    if (!die.hit) continue;
    if (die.id === "world"){ queue.push({ kind: "news", theme: "world" }); continue; }
    const card = drawForTheme(die.id, queue);
    if (card) queue.push(card);
  }
  S.queue = queue;
  saveAuto();                                     /* so a reload mid-year still owes these cards */
  markYear(queue.map(q => q.theme));
  screenBoard();
  showYear(d, dice, queue);
}

/* pick a card from one deck, avoiding anything already queued this year */
function drawForTheme(theme, queued){
  const taken = new Set(queued.map(q => q.id));
  const decs = DECISIONS.filter(c => themeOf(c.id) === theme && !taken.has(c.id) && safeWhen(c));
  const evs = EVENTS.map(e => [e, themeOf(e.id) === theme && !taken.has(e.id) ? Math.max(0, safeW(e)) : 0])
                    .filter(p => p[1] > 0);
  const useEvent = evs.length && (!decs.length || rnd() < 0.45);
  if (useEvent) return { kind: "event", id: pickW(evs).id, theme };
  if (decs.length) return { kind: "decision", id: pick(decs).id, theme };
  return null;
}
function safeWhen(c){ try { return !!c.when(); } catch (e){ return false; } }
function safeW(e){ try { return e.w(); } catch (err){ return 0; } }

/* ---------- what the year did ---------- */
function yearNotes(d){
  const notes = [];
  for (const n of d.notes) notes.push(esc(n));
  if (d.w.graduated) notes.push("You completed your " + esc(d.w.graduated.toLowerCase()) + ".");
  if (d.w.raise !== undefined && Math.abs(d.w.raise) > 0.001)
    notes.push("Pay review: " + pctS(d.w.raise) + " — now " + money(S.p.salary) + "/mo.");
  return notes;
}
/* is this year worth stopping the player for? */
function yearIsQuiet(d, dice, queue, step){
  if (step || queue.length || S.p.cash < 0 || S.age >= PLAY_END) return false;
  if (yearNotes(d).length) return false;
  if (Math.abs(d.m.eq) > 0.18 || d.e.infl > 0.055) return false;
  return true;
}

function showYear(d, dice, queue, step){
  /* quiet years skip the year card — you just see them in the log — and go straight to the review */
  if (yearIsQuiet(d, dice, queue, step)){
    lg("Age " + d.age + " — nothing much. Fund " + pctS(d.m.eq) + ", prices " + pctS(d.e.infl) + ".");
    screenBoard("A quiet year.");
    nextInQueue();
    return;
  }

  const notes = yearNotes(d);
  const mkt = ASSET_KEYS.map(k => ASSET_META[k].short + " " + pctS(d.m && k === "etf" ? d.m.eq : (S.mk.rets ? S.mk.rets[k] : 0)))
    .join(" · ");

  const dieRow = dice.map(x =>
    '<div class="dresult ' + x.cls + (x.hit ? " hit" : "") + '">' + dieHTML(x.v, true) +

      (x.hit ? "something happened" : "quiet — needed " + x.need) + "</span></div></div>").join("");

  openModal('<div class="gcard"><div class="gcard-h"><span class="ic">📅</span><div><div class="kind">The year you turned ' + d.age + '</div><h2>' +
      (step ? esc(step.title) : queue.length ? queue.length + (queue.length === 1 ? " thing to deal with" : " things to deal with") : "A year passes") + "</h2></div></div>" +

    '<div class="dresults mb">' + dieRow + "</div>" +
    (notes.length ? '<div class="rows mb">' + notes.map(n => '<div class="row"><div class="l">' + n + "</div><div></div></div>").join("") + "</div>" : "") +
    '<div class="hint mb num">' + esc(mkt) + " · prices " + pctS(d.e.infl) + "</div>" +
    '<div class="facts">' + fact("Cash", money(S.p.cash)) + fact("Net worth", kmoney(netWorth())) +
      fact("Cash flow", moneyS(netCashflow()) + "/mo") + fact("Buffer", (emergencyMonths() > 99 ? "99+" : emergencyMonths().toFixed(1)) + " mo") + "</div>" +
    '<div class="btn-row"><button class="btn primary big grow" id="cont">' +
      (S.age >= PLAY_END ? "Reach " + PLAY_END : step ? "Continue" : queue.length ? "Deal with it" : "Carry on") + "</button></div></div></div>");

  el("cont").onclick = () => { closeModal(); afterYear(step); };
}

function afterYear(step){
  if (S.age >= PLAY_END){ retire(); return; }
  if (S.p.cash < 0){ forcedShortfall(); return; }
  if (S.p.spendPrompt){ S.p.spendPrompt = false; promptSpending(); return; }
  if (step){ runChapterStep(step); return; }
  nextInQueue();
}

/* the bills becoming yours is worth its own beat */
function promptSpending(){
  openModal('<div class="gcard"><div class="gcard-h"><span class="ic">🧾</span><div><div class="kind">Age ' + S.age + '</div><h2>The bills are yours now</h2></div></div>' +
    '<div class="gcard-b"><p class="lede">You are earning, so your family has stopped covering your food, your travel and the roof over your head. From here you decide what each of those costs — and what is left over is what you get to keep.</p>' +
    '<div class="btn-row"><button class="btn primary big grow" id="spgo">Set what you spend</button></div></div></div>');
  el("spgo").onclick = () => { openSpending(() => nextInQueue()); };
}

/* work through this year's cards, one at a time */
function nextInQueue(){
  if (S.p.cash < 0){ forcedShortfall(); return; }
  if (!S.queue || !S.queue.length){ busyOff(); return; }
  const item = S.queue.shift();
  classCard(item.id);
  const left = S.queue.length;
  const label = left ? " · " + (left + 1) + " left" : "";
  if (item.kind === "news"){ openNews(() => nextInQueue()); return; }
  const card = (item.kind === "event" ? EVENTS : DECISIONS).find(c => c.id === item.id);
  /* an earlier card this year can make a later one moot (no promotion after a retrenchment) */
  /* a forced card can be overtaken too (the BTO given up, the wedding held): its still() says so */
  const stillValid = !card ? true : item.forced ? (card.still ? card.still() : true)
    : item.kind === "event" ? safeW(card) > 0 : card.still ? card.still() : safeWhen(card);
  if (!stillValid){ nextInQueue(); return; }
  presentCard(card, (item.kind === "event" ? "Event" : "Decision") + label, nextInQueue);
}
/* every path that hands the roll back comes through here, so the year-end review is never skipped */
function busyOff(){
  if (reviewDue() && S.p.cash >= 0){ openYearReview(busyOff); return; }
  busy = false; const r = el("roll"); if (r) r.disabled = false;
  classRollState(); classCrash();                  /* a paused class stays put; a crash the teacher sent lands now */
}

/* ---------- shortfall: never a game over ---------- */
function forcedShortfall(done, depth){
  const finish = done || busyOff;
  depth = depth || 0;
  if (!depth) S.stats.shortfalls = (S.stats.shortfalls || 0) + 1;
  const gap = -S.p.cash;
  const opts = [];
  opts.push({ t: "Cut the household back", d: "Every category down to its cheapest level.",
    can: () => spendLevel() > 0,
    go: () => { setAllSpend(0); if (insurancePremiums() && rnd() < 0.5){ dropAllInsurance(); tl(S.age, "Let your insurance lapse."); }
      return "Costs are now " + money(totalCosts()) + "/mo. The shortfall still has to be covered."; } });
  const ptc = S.p.partner && S.p.pt ? Math.floor(ptLiquid()) : 0;   /* cash, and investments they can sell */
  if (ptc > 500)
    opts.push({ t: "Ask your partner to cover it", d: "They have " + money(ptc) + ". They will do it. They will also remember it.",
      go: () => { const x = ptTake(Math.min(gap, ptc)); S.p.cash += x; S.p.tension = (S.p.tension || 0) + 1 + (x > 20000 * S.econ.cpi ? 1 : 0);
        tl(S.age, "Partner covered a " + kmoney(x) + " shortfall."); return "They paid " + money(x) + ". Nobody said anything at dinner, which said a lot."; } });
  if (invTotal() > 0)
    opts.push({ t: "Sell investments", d: "Whatever the market pays today.",
      go: () => { const got = sellDown(Math.min(gap, invTotal())); return "Raised " + money(got) + "."; } });
  if (S.a.property)
    opts.push({ t: "Sell the property", d: canSellNow() ? "Clears the loan and refunds your CPF; you go back to renting." : "Not allowed yet — the holding period has not ended.",
      can: canSellNow,
      go: () => { const v = S.a.property.value; const got = sellHome(v, "Forced to sell the property"); return "Sold for " + money(v) + "; " + money(got) + " came back in cash."; } });
  for (const x of (S.a.extra || []).slice(0, 2))
    opts.push({ t: "Sell " + x.n.toLowerCase(), d: "A quick sale, about 5% under value. Its loan is cleared." + (ssdFor("private", extraHeld(x), x.value) ? " Seller's Stamp Duty applies: it was bought under four years ago." : ""),
      go:() => { const v = Math.round(x.value * 0.95); const got = sellExtra(x, v, "Forced to sell an investment property"); return "Sold for " + money(v) + "; " + money(got) + " came back in cash."; } });
  if (S.p.car && !S.p.car.family)
    opts.push({ t: "Sell the car", d: "",
      go: () => { const v = Math.round(S.p.car.value * 0.85); S.p.cash += v; S.p.car = null; return "Sold for " + money(v) + "."; } });
  opts.push({ t: "Take extra work", d: "Whatever is available, on top of everything else.",
    go: () => { const inc = Math.round(rf(450, 1300) * S.econ.cpi); S.p.sideIncome += inc; S.p.burnout += 2; return money(inc) + "/mo more, and less of your week."; } });

  /* the family can dip into its own savings for a young adult — once, or a few
     times, and not for nothing: it is owed back, interest-free, once you earn */
  const famLeft = Math.max(0, (S.c.familyPot || 0) * S.econ.cpi - (S.c.familyLent || 0));
  if ((S.p.studying || S.age < 30) && famLeft >= Math.min(gap, 1000)){
    const amt = Math.min(Math.round(famLeft), Math.ceil(gap * 1.1 / 100) * 100);
    opts.push({ t: "Ask your family", d: "From their savings. Interest-free, but they will want it back once you are earning.", cost: money(amt),
      go: () => { S.c.familyLent = (S.c.familyLent || 0) + amt; S.p.cash += amt; addDeferred("family", amt, "Your family lent you " + money(amt) + ".");
        startDeferred(); tl(S.age, "Your family lent you " + money(amt) + ".");
        return "They lent you " + money(amt) + ". " + (S.p.job && !S.p.studying ? "Repayments to them start now." : "You will pay them back once you are earning."); } });
  }
  /* a student can borrow for living costs on the same terms as fees: nothing
     due until the course ends — the right debt for the purpose is cheaper debt */
  if (S.p.studying){
    opts.push({ t: "Take a study loan", d: "Added to your tuition loan. Nothing to repay until you finish.",
      go: () => { const amt = Math.ceil(gap * 1.2 / 100) * 100; addDeferred("edu", amt); S.p.cash += amt;
        return "Borrowed " + money(amt) + ". Repayments begin the year you finish."; } });
  }

  /* the card needs nobody's approval, which is exactly the problem */
  if (canCard())
    opts.push({ t: "Put it on the credit card", d: "Instant, no questions. 26.9% a year, and the minimum payment barely touches it.",
      go: () => { const amt = Math.ceil(gap / 100) * 100; const l = ccBorrow(amt); return "Charged " + money(amt) + ". Minimum payment " + money(l.monthly) + "/mo, most of it interest."; } });
  /* lenders stop lending to people who already cannot pay — this is what makes a
     debt spiral end in hard choices rather than in more debt */
  if (willLend()){
    opts.push({ t: "Borrow to cover it", d: "Personal loan at your current standing.",
      go: () => { const amt = Math.ceil(gap * 1.15 / 100) * 100; const q = takeLoan("pers", amt, 5); return "Borrowed " + money(amt) + " at " + pct(q.rate, 2) + " — " + money(q.monthly) + "/mo."; } });
  } else {
    opts.push({ t: "Apply for a loan", d: "Your file goes to three lenders.", can: () => false });
  }
  /* the terminal option: the money simply does not leave the account, and the
     problem moves from this month into every month that follows */
  opts.push({ t: S.loans.length ? "Miss the payments" : "Leave the bills unpaid", d: "Nothing leaves the account. Consequences follow.",
    go: () => {
      S.p.missed++; S.p.credit = clamp(S.p.credit - 85, 300, 850);
      const unpaid = -S.p.cash;
      for (const l of S.loans){ l.bal *= 1.06; }                 // arrears capitalised
      S.p.cash = 0;                                              // the bills went unpaid instead
      setAllSpend(0);                                            // you are living on what is left
      tl(S.age, S.loans.length ? "Missed payments." : "Could not cover the year's costs.");
      let extra = "";
      if (S.p.missed >= 3 && S.a.property){
        /* a mortgagee sale overrides any holding period, and sells cheap */
        sellHome(Math.round(S.a.property.value * 0.8), "Property repossessed and sold");
        S.p.housingMode = "rent"; S.p.rent = rentAsking();
        extra = " The lender forced a sale of the property.";
      }
      if (S.p.missed >= 2 && S.p.car){ S.p.car = null; extra += " The car was repossessed."; }
      return money(unpaid) + " went unpaid. Balances grew and your credit standing fell to " + S.p.credit + "." + extra;
    } });

  renderCard({
    icon: "⚠️", kind: "Shortfall · age " + S.age, title: depth ? "It is still not enough" : "You cannot cover this month",
    lede: depth
      ? "That helped, but it did not close the gap. Something else has to give."
      : "There is not enough money. The bills do not pause while you decide, and doing nothing is not one of the options.",
    facts: [["Shortfall", money(gap)], ["Monthly costs", money(totalCosts())], ["Debt repayments", money(loanMonthly()) + "/mo"],
            ["Income", money(grossIncome()) + "/mo"], ["Liquid assets", money(invTotal())], ["Credit standing", S.p.credit]],
    choices: opts
  }, () => {
    if (S.p.cash >= 0){ finish(); return; }
    if (depth >= 4){                              /* out of workable options this year */
      const unpaid = -S.p.cash;
      S.p.missed++; S.p.credit = clamp(S.p.credit - 85, 300, 850);
      for (const l of S.loans) l.bal *= 1.06;
      S.p.cash = 0; setAllSpend(0);
      lg(money(unpaid) + " went unpaid. Nothing left to sell, nobody left to ask.");
      tl(S.age, "Could not cover the year's costs.");
      finish(); return;
    }
    forcedShortfall(finish, depth + 1);           /* still short: choose again */
  });
}

/* ---------- drawing cards ---------- */
function drawDecisionById(id, done){
  const c = DECISIONS.find(x => x.id === id);
  if (!c){ (done || busyOff)(); return; }
  presentCard(c, "Decision", done);
}
function drawEventById(id, done){
  const c = EVENTS.find(x => x.id === id);
  if (!c){ (done || busyOff)(); return; }
  presentCard(c, "Event", done);
}
function presentCard(c, kindLabel, done){
  const finish = done || busyOff;
  if (!c){ finish(); return; }
  let data, previews = null;
  try { const r = recordBuild(c); data = r.data; previews = previewChoices(c, r.draws, (data.choices || []).length); } catch (e){ console.error(e); finish(); return; }
  renderCard({
    icon: c.icon, art: c.id, kind: kindLabel + " · age " + S.age, title: data.title || c.title,
    lede: data.lede, facts: data.facts, choices: data.choices, previews,
    jobList: data.jobList, openMarkets: data.openMarkets, openSpending: data.openSpending, badges: data.badges
  }, () => {
    if (S.p.cash < 0) forcedShortfall(finish); else finish();
  });
}

/* an event card names its own picture (r_art*.js); other cards are matched by title */
const artAttr = card => card.art && /^[a-z_0-9]+$/.test(card.art) ? ' data-art="' + card.art + '"' : "";

/* generic card renderer with dice checks and job applications */
let lastCardDone = null;              /* lets a choice open its own screens and still end the card */
function renderCard(card, onDone){
  lastCardDone = onDone;
  const facts = (card.facts || []).map(f => fact(f[0], f[1])).join("");
  let choiceHTML = (card.choices || []).map((ch, i) => {
    const ok = ch.can ? !!ch.can() : true;
    return '<button class="choice" data-c="' + i + '"' + (ch.esc ? " data-esc" : "") + (ok ? "" : " disabled") + ">" +
      '<div class="ct"><span>' + esc(ch.t) + "</span>" + (ch.cost ? '<span class="cost">' + esc(ch.cost) + "</span>" : "") + "</div>" +
      (ch.d ? '<div class="cd">' + esc(ch.d) + (ch.check ? " <b>Roll 2d6 vs " + ch.check.dc + "</b>" : "") + "</div>" : "") +
      (card.previews && ok ? deltaLine(card.previews[i]) : "") +
      "</button>";
  }).join("");

  let jobHTML = "";
  if (card.jobList && card.jobList.length){
    const canApply = appsLeft() > 0;
    jobHTML = (card.appBadgeShown ? "" : ruleBadges([careerBadges()[0]])) + '<div class="choices mb">' + card.jobList.map((x, i) => {
      const f = x.f;
      return '<button class="choice" data-j="' + i + '"' + (canApply ? "" : " disabled") + '><div class="ct"><span>' + x.j.t + '</span><span class="cost">' + money(x.pay || Math.round(x.j.pay * S.econ.cpi)) + "/mo</span></div>" +
        '<div class="cd">' +
          reqBadge("qualification", S.p.qual >= x.j.qual) + reqBadge("technical", S.p.skills.tech >= x.j.tech) +
          reqBadge("communication", S.p.skills.comms >= x.j.comms) + reqBadge(x.j.exp + "y experience", relExp(x.j) >= x.j.exp) +
          (x.j.lvl ? '<span class="tag">' + LEVEL_NAME[x.j.lvl] + "</span>" : "") +
        "</div>" +
        '<div class="cd" style="font-size:12px;margin-top:4px">' + esc(jobTraitText(x.j)) + "</div>" +
        '<div class="cd" style="font-family:var(--mono);font-size:11.5px;margin-top:5px">roll 2d6 ' +
          (f.mod >= 0 ? "+" : "") + f.mod + " vs " + f.dc + " · about " + Math.round(f.chance * 100) + "% </div>" +
        "</button>";
    }).join("") + "</div>";
  }
  const mkHTML = (card.openMarkets ? '<div class="btn-row mb"><button class="btn grow" id="cardmk">Open markets</button></div>' : "") +
                 (card.openSpending ? '<div class="btn-row mb"><button class="btn grow" id="cardsp">Set what you spend</button></div>' : "");

  openModal('<div class="gcard"' + artAttr(card) + '><div class="gcard-h"><span class="ic">' + card.icon + '</span><div><div class="kind">' + esc(card.kind) + '</div><h2>' + esc(card.title) + "</h2></div></div>" +
    '<div class="gcard-b" id="cardbody">' +
    '<p class="lede">' + esc(card.lede) + "</p>" + ruleBadges(card.badges) +
    (facts ? '<div class="facts">' + facts + "</div>" : "") +
    (card.html || "") + mkHTML + jobHTML +
    '<div class="choices">' + choiceHTML + "</div>" +
    "</div></div>");

  if (card.openMarkets) el("cardmk").onclick = () => { openMarkets(true, () => renderCard(card, onDone)); };
  if (card.openSpending) el("cardsp").onclick = () => { openSpending(() => renderCard(card, onDone)); };

  document.querySelectorAll("#cardbody .choice[data-j]").forEach(b => {
    b.onclick = () => {
      const x = card.jobList[+b.dataset.j];
      const f = jobFit(x.j);
      if (!appsLeft()) return;
      /* the try is spent when the dice roll, not before: backing out of the roll screen is free */
      diceCheck("Application — " + x.j.t, f.dc, f.mod, passed => {
        if (passed){ hireInto(x.j, x.pay); landedJob(); finish("You got it. " + x.j.t + " at " + money(S.p.salary) + "/mo."); }
        else finish("They went with someone else. " + appsText());
      }, () => useApp());
    };
  });
  document.querySelectorAll("#cardbody .choice[data-c]").forEach(b => {
    b.onclick = () => {
      const ch = card.choices[+b.dataset.c];
      const was = choiceSnap();                 // the record read back at 65 (d_story.js)
      const logged = out => { if (out !== null) logChoice(card.title, ch.t, was, choiceSnap()); };
      if (ch.check){
        const mod = ch.check.modFn ? ch.check.modFn() : 0;
        /* commits to the choice when the dice roll; closing the roll screen first costs nothing */
        diceCheck(ch.check.label, ch.check.dc, mod, passed => {
          const out = ch.go(passed);
          logged(out);
          if (out !== null) finish(out);
        }, ch.before);
      } else {
        if (ch.before) ch.before();
        const out = ch.go(true);
        logged(out);
        if (out !== null) finish(out);        // null = this choice opened its own screen
      }
    };
  });

  function finish(text){
    const em = emergencyMonths();
    openModal('<div class="gcard"' + artAttr(card) + '><div class="gcard-h"><span class="ic">' + card.icon + '</span><div><div class="kind">Outcome · age ' + S.age + '</div><h2>' + esc(card.title) + "</h2></div></div>" +
      '<div class="gcard-b"><p class="lede">' + esc(text || "") + "</p>" +
      '<div class="facts">' + fact("Cash", money(S.p.cash)) + fact("Net worth", kmoney(netWorth())) +
        fact("Cash flow", moneyS(netCashflow()) + "/mo") + fact("Buffer", (em > 24 ? "24+" : em.toFixed(1)) + " mo") + "</div>" +
      '<div class="btn-row"><button class="btn primary grow" id="fin">Continue</button></div></div></div>');
    lg(card.title + " — " + (text || ""));
    saveAuto();
    el("fin").onclick = () => { closeModal(); screenBoard(); onDone(); };
  }
}
function reqBadge(name, ok){

/* ---------- visible 2d6 check ---------- */
function diceCheck(label, dc, mod, cb, onRoll){
  openModal('<div class="gcard"><div class="gcard-h"><span class="ic">🎲</span><div><div class="kind">Check</div><h2>' + esc(label) + "</h2></div></div>" +
    '<div class="gcard-b center">' +
    '<div class="dice-bay" id="cbay">' + dieHTML(1) + dieHTML(1) + "</div>" +
    '<div class="check-line mt" id="cline">need <b>' + dc + "</b> or better · your modifier " + (mod >= 0 ? "+" : "") + mod + "</div>" +
    '<div class="btn-row mt" style="justify-content:center"><button class="btn primary big" id="croll">Roll 2d6</button></div>' +
    "</div></div>");
  el("croll").onclick = () => {
    el("croll").disabled = true;
    if (onRoll) onRoll();
    rollDice(el("cbay"), 2, vals => {
      const sum = vals[0] + vals[1];
      const tot = sum + mod;
      const passed = tot >= dc;
      S.rolls.push({ age: S.age, kind: label, v: sum, mod, dc, passed });
      el("cline").innerHTML = vals[0] + " + " + vals[1] + " = " + sum + (mod ? (mod >= 0 ? " + " : " − ") + Math.abs(mod) : "") +
        " = <b>" + tot.toFixed(1).replace(/\.0$/, "") + "</b> vs " + dc +
        ' &nbsp; <span class="tag ' + (passed ? "g" : "r") + '">' + (passed ? "pass" : "fail") + "</span>";
      setTimeout(() => cb(passed), 950);
    });
  };
}

/* ============================================================
   20. CHAPTER ONE — the formative years
   A fixed order of set-piece decisions between 18 and about 30.
   Years still pass and markets still move between them.
   ============================================================ */
const CHAPTERS = [
  { id: "live",    title: "How you will live",    at: () => true },
  { id: "work",    title: "Your first real job",  at: () => !S.p.studying && !S.p.job },
  { id: "housing", title: "Where you will live",  at: () => !!S.p.job && S.p.housingMode === "family" },
  { id: "partner", title: "Someone comes along",  at: () => S.age >= 26 },
  { id: "home",    title: "Your first home",      at: () => S.age >= 29 && !!S.p.job }
];

function inChapterOne(){ return S.chapter < CHAPTERS.length; }

function dueChapterStep(){
  if (!inChapterOne()) return null;
  /* the guided years cannot run forever — by the early thirties you are on your own */
  if (S.age >= 33){ S.chapter = CHAPTERS.length; lg("Your twenties are behind you."); return null; }
  /* already own a home: the first-home step has nothing to guide */
  if (CHAPTERS[S.chapter].id === "home" && S.a.property){ S.chapter++; if (!inChapterOne()) return null; }
  const step = CHAPTERS[S.chapter];
  let ok = false;
  try { ok = step.at(); } catch (e){ ok = false; }
  return ok ? step : null;
}

function runChapterStep(step){
  const done = () => {
    S.chapter++;
    saveAuto();
    if (!inChapterOne()){
      tl(S.age, "Settled into the life you built in your twenties.");
      lg("From here, every year is yours to roll.");
    }
    screenBoard();
    /* anything the year forced on you (a retrenchment, a diagnosis) still has to be met */
    nextInQueue();
  };
  if (step.id === "live")    return chapterLive(done);
  if (step.id === "work")    return chapterWork(done);
  if (step.id === "housing") return chapterHousing(done);
  if (step.id === "partner") return chapterPartner(done);
  if (step.id === "home")    return chapterHome(done);
  done();
}
