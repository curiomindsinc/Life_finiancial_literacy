<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIFE — Your Financial Journey</title>
<style>
/* ============================================================
   LIFE: Your Financial Journey
   Warm tabletop board-game skin. Everything inline, fully offline.
   ============================================================ */

:root{
  --linen:#f4ede0;
  --linen-2:#ece2d1;
  --board:#e8dcc6;
  --board-line:#cdbb9c;
  --ink:#2c2620;
  --ink-soft:#5f5548;
  --ink-faint:#8b7f6e;
  --card:#fbf7ef;
  --card-edge:#d9cbb2;
  --wood:#8a5a32;
  --wood-dark:#633f21;
  --green:#3f7d4e;
  --green-soft:#e2efe2;
  --red:#a8402f;
  --red-soft:#f6e3de;
  --blue:#3a6081;
  --blue-soft:#e0e9f1;
  --gold:#b08427;
  --gold-soft:#f6ecd2;
  --purple:#6a4b7a;
  --shadow:0 2px 0 rgba(0,0,0,.06), 0 10px 24px -12px rgba(60,42,20,.45);
  --shadow-lift:0 4px 0 rgba(0,0,0,.07), 0 22px 44px -18px rgba(60,42,20,.55);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:"Avenir Next","Segoe UI",Inter,system-ui,-apple-system,sans-serif;
  --mono:"SF Mono","Cascadia Mono",Consolas,"Courier New",monospace;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:var(--sans);
  color:var(--ink);
  background:var(--linen);
  background-image:
    radial-gradient(circle at 12% 18%, rgba(255,255,255,.55), transparent 42%),
    radial-gradient(circle at 88% 78%, rgba(190,168,132,.22), transparent 46%);
  -webkit-font-smoothing:antialiased;
}
/* paper grain */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:
    repeating-linear-gradient(0deg, rgba(120,100,70,.035) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(120,100,70,.025) 0 1px, transparent 1px 4px);
}

h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:.2px;margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#cdbb9c;border-radius:10px;border:3px solid var(--linen)}

/* ---------- shell ---------- */
#app{position:relative;z-index:1;min-height:100%}
.screen{display:none;animation:fade .35s ease both}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 60px}
.wrap.narrow{max-width:820px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
  background:linear-gradient(#fffdf8,#f0e7d6);
  border:1px solid var(--card-edge);border-bottom-width:3px;
  border-radius:11px;padding:11px 18px;cursor:pointer;
  font-weight:600;font-size:14.5px;letter-spacing:.2px;
  transition:transform .09s ease, box-shadow .16s ease, background .16s ease;
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset;
}
.btn:hover{background:linear-gradient(#fffefb,#f6efe1);transform:translateY(-1px)}
.btn:active{transform:translateY(1px);border-bottom-width:1px;margin-bottom:2px}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}
.btn.primary{background:linear-gradient(#a3703f,#8a5a32);color:#fff5e6;border-color:var(--wood-dark)}
.btn.primary:hover{background:linear-gradient(#b17c47,#96633a)}
.btn.big{padding:15px 30px;font-size:16.5px;border-radius:13px}
.btn.ghost{background:transparent;border-style:dashed;border-bottom-width:1px}
.btn.danger{color:var(--red)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}

.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;
  letter-spacing:.5px;text-transform:uppercase;background:var(--linen-2);color:var(--ink-soft);
  border:1px solid var(--card-edge)}
.tag.g{background:var(--green-soft);color:var(--green);border-color:#bcd8bf}
.tag.r{background:var(--red-soft);color:var(--red);border-color:#e2bfb6}
.tag.b{background:var(--blue-soft);color:var(--blue);border-color:#bed0e0}
.tag.y{background:var(--gold-soft);color:#8a6519;border-color:#e0cb96}

.pos{color:var(--green)} .neg{color:var(--red)}

/* ---------- title screen ---------- */
.title-stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 20px}
.title-card{
  max-width:640px;width:100%;background:var(--card);border:1px solid var(--card-edge);
  border-radius:20px;padding:54px 46px;text-align:center;box-shadow:var(--shadow-lift);
  position:relative;
}
.title-card::after{content:"";position:absolute;inset:9px;border:1px solid rgba(160,136,96,.35);border-radius:13px;pointer-events:none}
.title-card h1{font-size:60px;letter-spacing:10px;margin:0 0 2px;text-indent:10px}
.title-card .sub{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--ink-soft);margin-bottom:30px}
.creed{font-family:var(--serif);font-size:17.5px;line-height:2;color:var(--ink-soft);margin:0 0 32px}
.creed b{color:var(--ink);font-style:italic}
.seedline{margin-top:24px;font-size:12.5px;color:var(--ink-faint);display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
/* credit: title card and foot of the rail */
.credit{margin-top:26px;font-size:12px;line-height:1.5;color:var(--ink-faint)}
.credit b{color:var(--ink)}
.credit a{color:var(--wood);text-decoration:none}
.credit a:hover{text-decoration:underline}
.credit-links span{white-space:nowrap}
.rail .credit{margin-top:auto;padding:14px 12px 0;border-top:1px solid var(--rail-2);font-size:10.5px;text-align:center;color:var(--rail-faint)}
.rail .credit b{color:var(--rail-ink)}
.rail .credit a{color:#d9b77a}
.seedline input{font-family:var(--mono);font-size:12.5px;width:120px;padding:6px 9px;border:1px solid var(--card-edge);
  border-radius:8px;background:#fff;color:var(--ink)}

/* ---------- top bar (persistent dashboard) ---------- */
.topbar{
  position:sticky;top:0;z-index:40;background:rgba(244,237,224,.93);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--board-line);
}
.topbar-in{max-width:1240px;margin:0 auto;padding:9px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:17px;letter-spacing:4px;font-weight:600}
.stats{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.stat{padding:5px 11px;border-radius:9px;background:var(--card);border:1px solid var(--card-edge);min-width:78px}
.stat .k{font-size:9.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
.stat .v{font-family:var(--mono);font-size:14px;font-weight:600;line-height:1.25}
.stat.hero{background:linear-gradient(#fffdf6,#f4ead6);border-color:#d3c09a}
.cheap{display:inline-block;margin-top:3px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--linen-2);color:var(--ink-soft)}
.cheap.pos{background:#e3efd9;color:#2f6b2a}.cheap.neg{background:#f6e0da;color:#a8402f}
.mhold{font-size:12.5px;margin:6px 0 2px;padding:6px 10px;border-radius:8px;background:var(--linen-2)}
.stat .v .today{display:block;font-size:10.5px;font-weight:500;color:var(--ink-faint);font-family:inherit}

/* ---------- layout ---------- */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 352px;gap:20px;align-items:start}
/* ---------- the overview: sticky top bar, a tool rail on the left, three columns ----------
   The top bar and the rail stay put; only the columns scroll. On a phone the rail becomes a
   bottom tab bar whose groups open upwards. */
:root{--rail:#2c2620;--rail-2:#3a322a;--rail-ink:#efe6d6;--rail-faint:#a99b85;--railw:212px}
.shell{display:grid;grid-template-columns:var(--railw) minmax(0,1fr);align-items:start}
.rail{position:sticky;top:var(--tbh,120px);height:calc(100vh - var(--tbh,120px));overflow-y:auto;background:var(--rail);color:var(--rail-ink);
  padding:12px 0 18px;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin}
.rail .rollwrap{padding:4px 14px 12px;border-bottom:1px solid var(--rail-2);margin-bottom:6px}
.rail #roll{width:100%;padding:12px 10px;font-size:15px;letter-spacing:.6px}
.rail .rollage{font:600 11px var(--mono);color:var(--rail-faint);text-align:center;margin-top:7px}
.rail .grp{all:unset;box-sizing:border-box;display:block;width:100%;font-size:10px;letter-spacing:1.6px;font-weight:700;color:var(--rail-faint);padding:12px 18px 5px;text-transform:uppercase}
.rail .rsep{height:1px;background:var(--rail-2);margin:8px 0 2px}
.rail .nav{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:11px;width:100%;padding:8px 18px;cursor:pointer;color:var(--rail-ink);font-size:14px;position:relative}
.rail .nav:hover{background:var(--rail-2)}
.rail .nav:focus-visible{outline:2px solid #d9b77a;outline-offset:-2px}
.rail .nav .ic{width:20px;text-align:center;font-size:15px}
.rail .nav .tx{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.rail .nav .sub{font:500 11px var(--mono);color:var(--rail-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.rail .nav .sub.amber{color:#f0b35e;font-weight:700}.rail .nav .sub.red{color:#f08a73;font-weight:700}
.rail .nav .wdot{position:absolute;right:14px;top:50%;margin-top:-4px}
.ov-main{padding:14px 16px 20px;min-width:0;container-type:inline-size;container-name:ov}
.ov{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
@container ov (min-width:620px){ .ov{grid-template-columns:repeat(2,minmax(0,1fr))} .ov .ov-c3{grid-column:1/-1} }
@container ov (min-width:980px){ .ov{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr) minmax(0,1fr)} .ov .ov-c3{grid-column:auto} }
.ov .ov-c{display:flex;flex-direction:column;gap:12px;min-width:0}
.ov .panel{margin:0}
.ov .panel-h{padding:7px 13px}.ov .panel-h h3{font-size:12.5px;letter-spacing:1.4px}
.ov .panel-h .hint{font-size:11px}
.ov .panel-b{padding:10px 12px}
.ov .row{padding:4px 10px;font-size:12.5px}.ov .row .v{text-align:right}
.ov .t th,.ov .t td{padding-top:4px;padding-bottom:4px}
.ov .dice-bay{padding:0;gap:10px}
.ov .logbox{max-height:130px}
.ov .nexthints{margin-top:8px}
.ov-news .news{margin-bottom:6px}.ov-news .news .hd{font-size:13px;margin:0}
.strip{display:grid;grid-template-columns:repeat(48,minmax(0,1fr));gap:2px;margin:10px 0 3px}
.strip .c{height:22px;border-radius:3px;background:#efe6d4;border:1px solid #e2d5bd;display:flex;flex-direction:column;justify-content:flex-end;gap:1px;padding:1px;overflow:hidden}
.strip .c.done{background:#e6d8bc}
.strip .c.here{outline:2px solid #8a5a1e;outline-offset:1px;background:#fffaf0}
.strip .c i{display:block;height:3px;border-radius:1px}
.strip-ax{display:flex;justify-content:space-between;font:600 10px var(--mono);color:var(--ink-faint)}
.sumrow{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:4px 9px;border-radius:99px;background:var(--linen-2);border:1px solid var(--card-edge);white-space:nowrap}
.chip b{font-family:var(--mono);font-weight:600}
.mk7{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.mk7 .mspark{padding:4px 6px 3px}.mk7 .mspark-f{display:none}
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:45;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:4px;overflow:visible}
  .rail .rollwrap{border:0;margin:0;padding:0;flex:1.3}
  .rail #roll{height:100%;padding:8px 4px;font-size:13px}
  .rail .rollage,.rail .rsep{display:none}
  .rail .grpbox{flex:1;position:relative}
  .rail .grp{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;font-size:10.5px;letter-spacing:.8px;color:var(--rail-ink);border-radius:9px;padding:6px 2px;cursor:pointer}
  .rail .grp::before{content:attr(data-ic);font-size:18px;letter-spacing:0;margin-bottom:2px}
  .rail .grpbox.open .grp{background:var(--rail-2)}
  .rail .items{display:none;position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);min-width:220px;background:var(--rail);border-radius:12px;padding:6px 0;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .rail .grpbox:last-child .items{left:auto;right:0;transform:none}
  .rail .grpbox.open .items{display:block}
  .ov-main{padding:12px 12px 90px}
  .strip .c{height:16px}
}
/* ---------- rule badges: limits, locks and money at risk, loud on purpose ---------- */
.rbs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.rb{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:9px;font-size:12.5px;font-weight:700;line-height:1.3;border:1.5px solid}
.rb.amber{background:#fdf0dc;border-color:#e0a54f;color:#80460c}
.rb.red{background:#fbe3dd;border-color:#d4735c;color:#8e2c17}
.rb.info{background:#e9eff5;border-color:#9fb3c8;color:#2f4a66}
.choice[disabled] .cd{color:#8e2c17;font-weight:700}
/* ---------- money and life, at 65 ---------- */
.story-end{display:flex;gap:14px;align-items:flex-start;margin-bottom:10px}
.story-ic{font-size:40px;line-height:1}
.story-t{font-family:var(--serif);font-size:24px;font-weight:600;margin-bottom:2px}
.story .lede{margin:4px 0 0}
.story-lines{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px;font-size:14px;line-height:1.5}
/* ---------- the year-end review ---------- */
.rv{border:1px solid var(--card-edge);border-radius:12px;background:var(--card);padding:10px 12px;margin-bottom:10px}
.rv.hot{border-color:#e0a54f;box-shadow:0 0 0 3px rgba(224,165,79,.15)}
.rv-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.rv-h b{font-size:14px}.rv-h .num{font-size:13px;color:var(--ink-soft)}
.rv .hint{margin-top:4px}
.rv .btn-row{margin-top:8px}
.nstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:10px}
.nstats .ns{border:1px solid var(--board-line);border-radius:8px;padding:5px 9px}
.nstats .k{font-size:10.5px;letter-spacing:.4px;color:var(--ink-faint);text-transform:uppercase}
.nstats .v{font:600 13.5px var(--mono)}
.ov-chart{width:100%;height:auto;display:block;overflow:visible}
.ov-chart .ax,.mspark .ax{font:600 10.5px var(--mono);fill:var(--ink-faint)}
.hx line{opacity:0;transition:opacity .08s}.hx:hover line{opacity:1}
.hb:hover path{opacity:.8}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-bottom:6px;font-size:11.5px;color:var(--ink-soft)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend i.ln{height:2px;width:14px;border-radius:1px}
.mkgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mspark{border:1px solid var(--card-edge);border-radius:9px;padding:6px 8px 5px;background:#fdfaf3;min-width:0}
.mspark-h{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;font-weight:700;color:var(--ink-soft)}
.mspark-h .num{font-family:var(--mono);font-size:11px}
.mspark-svg{width:100%;height:auto;display:block;margin:3px 0 1px;overflow:visible}
.mspark-f{font:600 10px var(--mono);color:var(--ink-faint)}
.tip{position:fixed;z-index:80;display:none;pointer-events:none;background:var(--card);border:1px solid var(--card-edge);border-radius:10px;
  box-shadow:var(--shadow-lift);padding:8px 10px;font-size:12px;color:var(--ink);min-width:170px}
.tip .tr{display:flex;align-items:center;gap:7px;margin-top:3px;color:var(--ink-soft)}
.tip .tr span{margin-left:auto;font-family:var(--mono);font-weight:700;color:var(--ink)}
.tip .tr i{width:9px;height:9px;border-radius:2px;display:inline-block}
.tip .tr.tot{border-top:1px solid var(--card-edge);padding-top:4px;margin-top:5px;color:var(--ink);font-weight:700}
.tip .tq{margin-top:3px;font-size:11px;color:var(--ink-faint)}
.topbar-in{max-width:1880px}

/* ---------- tools: a centred pop-up over the dimmed overview, which stays live behind it ---------- */
.drawer{position:fixed;left:50%;top:50%;width:min(700px,94vw);max-height:90vh;z-index:60;background:var(--linen-2);
  border:1px solid var(--card-edge);border-radius:16px;box-shadow:0 30px 80px rgba(44,38,32,.32);
  transform:translate(-50%,-47%) scale(.98);opacity:0;pointer-events:none;
  transition:transform .2s ease,opacity .2s ease;display:flex;flex-direction:column}
.drawer-open .drawer{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
.shade{position:fixed;inset:0;z-index:55;background:rgba(44,38,32,.42);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .2s ease}
.drawer-open .shade{opacity:1;pointer-events:auto}
.drawer-b{overflow-y:auto;padding:14px;flex:1}
.drawer-b .gcard{animation:none;box-shadow:none}
.drawer-x{position:absolute;top:10px;right:12px;z-index:2;width:34px;height:34px;border-radius:50%;border:1px solid var(--card-edge);
  background:var(--card);cursor:pointer;font-size:15px;color:var(--ink-soft)}
.drawer-x:hover{color:var(--ink);border-color:var(--wood)}
.drawer-b .gcard-h{padding-right:54px}
@media (prefers-reduced-motion:reduce){.drawer,.shade{transition:none}}
/* ---------- top bar extras: passport stamps top right; the partner as a second row ---------- */
.tb-stamps{display:flex;flex-wrap:nowrap;gap:5px;justify-content:flex-end;align-items:center;margin-left:auto;max-width:520px}
.tb-pass{display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 8px;border-radius:9px;cursor:pointer;
  background:#1f3a5f;color:#f3e7c4;border:1px solid #14283f;box-shadow:inset 0 0 0 2px rgba(243,231,196,.18);font:700 12px var(--sans,inherit)}
.tb-pass:hover{background:#27496f}
.tb-pass .pp-book{font-size:15px}
.tb-pass .pp-n{font-size:11.5px;opacity:.9}
.pp-page{border:1px solid var(--card-edge);border-radius:12px;padding:12px;background:#fbf6e9;
  background-image:repeating-linear-gradient(0deg,transparent 0 23px,rgba(58,96,129,.06) 23px 24px)}
.pp-h{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:10px}
.stamp .pp-no{font:600 9px var(--mono);font-style:normal;opacity:.6}
.stamp.first{border-style:solid}
.stamp.todo{opacity:.35;border-style:dotted;filter:grayscale(1)}
.pt-row{padding-top:0}
.pt-brand{font-size:11px;letter-spacing:3px;color:var(--ink-soft);min-width:78px}
.pt-row .stat{padding:3px 10px}
.pt-row .stat .v{font-size:12.5px}
.pt-open{align-self:center}
@media (max-width:640px){.tb-pass .pp-t{display:none}}
/* ---------- guides: next steps, warning dots, the net-worth line, choice previews, phone top bar ---------- */
.nexthints{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.nh{font-size:11.5px;line-height:1.3;padding:4px 10px;border-radius:99px;border:1px solid var(--card-edge);background:var(--card);color:var(--ink-soft)}
.nh.warn{background:#fbeee0;border-color:#e3b98a;color:#8a4a17}
.wdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:7px;vertical-align:middle;cursor:help;background:#7a95b3}
.wdot.warn{background:#d98a2b;box-shadow:0 0 0 3px rgba(217,138,43,.18)}
.nwspark{vertical-align:-3px;margin-left:4px}
.cdelta{margin-top:5px;font-size:11.5px;color:var(--ink-soft);font-family:var(--mono)}
.cdelta b{font-weight:700}
.tb-more-btn{display:none;align-self:center}
@media (max-width:640px){
  .topbar:not(.open) .stat:not(.keep){display:none}
  .topbar:not(.open) .pt-row{display:none}
  .tb-more-btn{display:inline-flex}
  .stat{min-width:0}
}
/* ---------- compact dials (Lifestyle tab side panel) ---------- */
.mini-dial{padding:8px 0;border-bottom:1px dashed var(--card-edge)}
.mini-dial:last-child{border-bottom:0;padding-bottom:0}
.mini-dial:first-child{padding-top:0}
.mini-dial .dial-h{margin-bottom:6px}
.mini-opts{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:4px}
.mopt{font:inherit;font-size:10.5px;line-height:1.25;font-weight:600;text-align:left;cursor:pointer;background:var(--card);
  border:1px solid var(--card-edge);border-bottom-width:2px;border-radius:7px;padding:5px 6px;min-height:36px}
.mopt:hover:not(:disabled){border-color:var(--wood)}

@media (max-width:1040px){.cols{grid-template-columns:1fr}}

.panel{background:var(--card);border:1px solid var(--card-edge);border-radius:15px;box-shadow:var(--shadow);overflow:hidden}
.panel-h{padding:11px 16px;border-bottom:1px solid var(--card-edge);display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:linear-gradient(#fdfaf3,#f5eee0)}
.panel-h h3{font-size:14.5px;letter-spacing:1.6px;text-transform:uppercase}
.panel-b{padding:16px}

/* ---------- the board ---------- */
.board{
  background:
    linear-gradient(135deg, rgba(255,255,255,.4), transparent 60%),
    var(--board);
  border:1px solid var(--board-line);border-radius:16px;padding:16px;box-shadow:var(--shadow);
  position:relative;
}
.board::after{content:"";position:absolute;inset:7px;border:1.5px dashed rgba(140,116,78,.4);border-radius:10px;pointer-events:none}
.board-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;padding:0 4px}
.board-head .t{font-family:var(--serif);font-size:15px;letter-spacing:3px;text-transform:uppercase;color:var(--ink-soft)}
.board-head .r{font-size:11.5px;color:var(--ink-faint);font-family:var(--mono)}

.track{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}
@media (max-width:760px){.track{grid-template-columns:repeat(6,1fr)}}

.tile{
  position:relative;aspect-ratio:1/1;border-radius:10px;border:1px solid rgba(0,0,0,.09);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-size:11px;background:#f7f0e2;box-shadow:0 1px 0 rgba(255,255,255,.6) inset;
  transition:transform .18s ease, box-shadow .18s ease;
}
.tile .age{font-family:var(--mono);font-size:10px;color:rgba(0,0,0,.42);font-weight:600}
.tile .ic{font-size:16px;line-height:1}
.tile.t-pay{background:#f3ecdb}
.tile.t-dec{background:#e6eef5;border-color:#bccfdf}
.tile.t-evt{background:#f7e6e1;border-color:#e3c0b6}
.tile.t-mkt{background:#e6f0e7;border-color:#bfd6c3}
.tile.t-news{background:#f6eed6;border-color:#dfcc9c}
.tile.t-mile{background:linear-gradient(#f7e8c2,#efd9a4);border-color:#d2b578}
.tile.done{opacity:.52}
.tile.here{transform:scale(1.1);box-shadow:0 0 0 3px var(--wood), 0 10px 20px -8px rgba(0,0,0,.5);z-index:3}
.tile.hl{box-shadow:0 0 0 2px var(--gold)}
.token{
  position:absolute;width:19px;height:19px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%, #c78f57, var(--wood) 55%, var(--wood-dark));
  border:1.5px solid rgba(0,0,0,.28);bottom:-6px;box-shadow:0 4px 7px -2px rgba(0,0,0,.5);
  animation:hop .45s ease;
}
@keyframes hop{0%{transform:translateY(-22px) scale(.8)}60%{transform:translateY(3px) scale(1.06)}100%{transform:none}}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;padding:0 4px;font-size:11.5px;color:var(--ink-soft)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.14)}
.lgchk{display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none;padding:2px 0}
.lgchk input{margin:0;width:15px;height:15px;accent-color:var(--ink);cursor:pointer}
.lgchk input:not(:checked)~i{opacity:.3}
.tile-sw{background:#f7f0e2}
.tile-sw.t-pay{background:#f3ecdb}
.tile-sw.t-dec{background:#e6eef5;border-color:#bccfdf}
.tile-sw.t-evt{background:#f7e6e1;border-color:#e3c0b6}
.tile-sw.t-mkt{background:#e6f0e7;border-color:#bfd6c3}
.tile-sw.t-news{background:#f6eed6;border-color:#dfcc9c}
.tile-sw.t-mile{background:linear-gradient(#f7e8c2,#efd9a4);border-color:#d2b578}

/* ---------- dice ---------- */
.dice-bay{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center;padding:6px 0}
.die{
  width:56px;height:56px;border-radius:13px;background:linear-gradient(145deg,#fffdf6,#eee3cd);
  border:1px solid #d5c6a8;box-shadow:0 3px 0 #d8c8a8, 0 12px 20px -10px rgba(0,0,0,.5), inset 0 1px 0 #fff;
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  padding:8px;position:relative;
}
.die.sm{width:40px;height:40px;border-radius:10px;padding:6px}
.die b{width:9px;height:9px;border-radius:50%;background:#2c2620;align-self:center;justify-self:center;box-shadow:inset 0 -1px 1px rgba(255,255,255,.25)}
.die.sm b{width:6.5px;height:6.5px}
.die.rolling{animation:tumble .85s cubic-bezier(.3,.7,.3,1)}
@keyframes tumble{
  0%{transform:rotate(0) translateY(0) scale(1)}
  22%{transform:rotate(-155deg) translateY(-34px) scale(1.14)}
  48%{transform:rotate(190deg) translateY(-14px) scale(1.06)}
  72%{transform:rotate(-70deg) translateY(-22px) scale(1.08)}
  88%{transform:rotate(22deg) translateY(2px) scale(.97)}
  100%{transform:none}
}
/* pip slots */
.p1{grid-area:1/1}.p2{grid-area:1/3}.p3{grid-area:2/2}.p4{grid-area:3/1}.p5{grid-area:3/3}
.p6{grid-area:2/1}.p7{grid-area:2/3}.p8{grid-area:1/2}.p9{grid-area:3/2}

.roll-verdict{text-align:center;font-family:var(--serif);font-size:15px;color:var(--ink-soft)}
.roll-verdict .big{font-size:20px;color:var(--ink);font-weight:600}
.check-line{font-family:var(--mono);font-size:13px;text-align:center;letter-spacing:.3px}

/* ---------- cards ---------- */
.cardstack{position:relative}
.gcard{
  background:var(--card);border:1px solid var(--card-edge);border-radius:16px;
  box-shadow:var(--shadow-lift);padding:0;overflow:hidden;animation:deal .4s cubic-bezier(.2,.9,.3,1) both;
}
@keyframes deal{from{opacity:0;transform:translateY(26px) rotate(-1.6deg) scale(.96)}to{opacity:1;transform:none}}
.gcard-h{padding:13px 20px;border-bottom:1px dashed var(--card-edge);display:flex;align-items:center;gap:11px;
  background:linear-gradient(#fdfaf2,#f4ecdb)}
.gcard-h .ic{font-size:23px}
.gcard-h .kind{font-size:10.5px;letter-spacing:2.2px;text-transform:uppercase;color:var(--ink-faint);font-weight:800}
.gcard-h h2{font-size:22px;line-height:1.2}
.gcard-b{padding:20px}
.gcard-b p{margin:0 0 13px;line-height:1.62;font-size:15px;color:var(--ink-soft)}
.gcard-b p.lede{color:var(--ink);font-size:15.5px}

/* ---------- card art (scenes in r_art*.js) ---------- */
.artwrap{width:100%;aspect-ratio:600/220;max-height:215px;border-bottom:1px solid var(--card-edge);overflow:hidden;background:#efe3cc}
.artwrap svg{display:block;width:100%;height:100%}
svg.art{--a-paper:#fbf7ef;--a-sky:#f6e3c2;--a-sky2:#dde7ea;--a-wall:#efe3cc;--a-hdb:#f6eedd;--a-hdb2:#d9c4a1;--a-win:#8fabbf;
  --a-ground:#cbb189;--a-skin:#e2a97c;--a-hair:#2c2620;--a-shirt:#3a6081;--a-shirt2:#a8402f;--a-acc:#c0503a;--a-acc2:#dba43a;
  --a-grn:#4f8a5a;--a-ink:#2c2620;--a-wood:#8a5a32;--a-box:#c89a62;--a-cat:#d98c48;--shirt:var(--a-shirt)}
svg.art .c-paper{fill:var(--a-paper)}svg.art .c-sky{fill:var(--a-sky)}svg.art .c-sky2{fill:var(--a-sky2)}svg.art .c-wall{fill:var(--a-wall)}
svg.art .c-hdb{fill:var(--a-hdb)}svg.art .c-hdb2{fill:var(--a-hdb2)}svg.art .c-win{fill:var(--a-win)}svg.art .c-ground{fill:var(--a-ground)}
svg.art .c-skin{fill:var(--a-skin)}svg.art .c-hair{fill:var(--a-hair)}svg.art .c-shirt{fill:var(--shirt)}svg.art .c-shirt2{fill:var(--a-shirt2)}
svg.art .c-acc{fill:var(--a-acc)}svg.art .c-acc2{fill:var(--a-acc2)}svg.art .c-grn{fill:var(--a-grn)}svg.art .c-ink{fill:var(--a-ink)}
svg.art .c-wood{fill:var(--a-wood)}svg.art .c-box{fill:var(--a-box)}svg.art .c-cat{fill:var(--a-cat)}
svg.art .rim{stroke:var(--a-ink);stroke-width:2}
svg.art .ln{fill:none;stroke:var(--shirt);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
svg.art .lnk{fill:none;stroke:var(--a-ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.art .lnp{fill:none;stroke:var(--a-paper);stroke-width:5}
svg.art .lnh{fill:none;stroke:var(--a-hdb2);stroke-width:1}
svg.art .lnc{fill:none;stroke:var(--a-cat);stroke-width:9;stroke-linecap:round}
svg.art .lnd{fill:none;stroke:var(--a-acc2);stroke-width:2.5;stroke-dasharray:4 5;stroke-linecap:round}
svg.art .lnr{fill:none;stroke-width:9;opacity:.6}
svg.art .chart{fill:none;stroke:var(--a-acc);stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
svg.art .keyring{fill:none;stroke:var(--a-acc2);stroke-width:7}
svg.art text{font-family:var(--sans);fill:var(--a-ink)}
svg.art text.m{font-family:var(--mono)}
svg.art text.f{font-family:var(--serif)}

/* ---------- how to play: Uncle Huat's slides + the board tour (s_tutor.js) ---------- */
.tut{padding-top:26px;max-width:700px}
.tut .artwrap{max-height:none}
.tut.again .gcard{animation:fade .25s ease both}
.tut .gcard-h{position:relative}
.tut-skip{margin-left:auto;background:none;border:0;padding:6px 4px;font:700 12.5px var(--sans);color:var(--ink-faint);
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;white-space:nowrap}
.tut-skip:hover{color:var(--ink)}
.tut-body p{font-size:15px}
.tut-list{margin:-4px 0 13px;padding-left:20px;line-height:1.55;font-size:14px;color:var(--ink-soft)}
.tut-list li{margin-bottom:6px}
.tut-body b{color:var(--ink)}
.tut-dots{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:18px 0 16px}
.tut-dots button{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--wood);background:transparent;padding:0;cursor:pointer}
.tut-dots button.past{background:var(--board-line);border-color:var(--board-line)}
.tut-dots button.on{background:var(--wood);transform:scale(1.2)}
@media (max-width:560px){ .tut{padding:12px 12px 40px} .tut .gcard-h{flex-wrap:wrap} .tut .gcard-h h2{font-size:19px} .tut-body p{font-size:14.5px} .tut-dots{gap:5px} .tut-dots button{width:10px;height:10px} }
.tour{position:fixed;inset:0;z-index:90}
.tour-hole{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(30,22,14,.62);outline:3px solid #dba43a;outline-offset:2px;
  transition:left .25s ease,top .25s ease,width .25s ease,height .25s ease;pointer-events:none}
.tour-tip{position:fixed;width:min(330px,calc(100vw - 24px));background:var(--card);border:1px solid var(--card-edge);border-radius:14px;
  box-shadow:var(--shadow-lift);padding:14px 16px 12px;animation:fade .2s ease both}
.tour-k{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-faint);font-weight:800}
.tour-tip h4{margin:3px 0 6px;font-family:var(--serif);font-size:18px}
.tour-tip p{margin:0 0 10px;font-size:13.5px;line-height:1.55;color:var(--ink-soft)}
.tour-row{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.tour-row .tut-skip{margin-right:auto;margin-left:0}

.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:8px;margin:0 0 16px}
.fact{background:var(--linen-2);border:1px solid var(--card-edge);border-radius:10px;padding:8px 11px}
.fact .k{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
.fact .v{font-family:var(--mono);font-size:14.5px;font-weight:600}

.choices{display:grid;gap:9px}
.choice{
  text-align:left;background:var(--card);border:1px solid var(--card-edge);border-bottom-width:3px;
  border-radius:12px;padding:13px 15px;cursor:pointer;transition:.14s ease;width:100%;
}
.choice:hover{background:#fffdf6;border-color:var(--wood);transform:translateX(3px)}
.choice:active{transform:translateX(3px) translateY(1px);border-bottom-width:1px;margin-bottom:2px}
.choice:disabled{opacity:.4;cursor:not-allowed;transform:none}
.choice .ct{font-weight:700;font-size:14.5px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.choice .cd{font-size:12.8px;color:var(--ink-faint);margin-top:3px;line-height:1.5}
.choice .cost{font-family:var(--mono);font-size:12.5px;font-weight:600;white-space:nowrap}

/* ---------- the four year-dice ---------- */
.d-career{--dc:#3a6081} .d-market{--dc:#3f7d4e} .d-life{--dc:#a8402f} .d-world{--dc:#b08427}
.ydie{display:flex;flex-direction:column;align-items:center;gap:5px}
.ydie-l{font-size:15px;line-height:1;filter:grayscale(.15)}
.ydie .die{border-color:var(--dc);box-shadow:0 3px 0 color-mix(in srgb, var(--dc) 35%, #d8c8a8),
  0 12px 20px -10px rgba(0,0,0,.45), inset 0 1px 0 #fff}
.ydie.hit .die{box-shadow:0 0 0 3px var(--dc), 0 12px 20px -10px rgba(0,0,0,.45)}
.dice-bay{gap:20px}
#dicebay{display:flex;flex-direction:row;align-items:flex-end;justify-content:center;gap:20px;flex-wrap:nowrap}
@media (max-width:420px){#dicebay{gap:10px}}

.dresults{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (max-width:560px){.dresults{grid-template-columns:1fr}}
.dresult{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;
  border:1px solid var(--card-edge);background:var(--linen-2);opacity:.6}
.dresult.hit{opacity:1;background:var(--card);border-color:var(--dc);box-shadow:inset 3px 0 0 var(--dc)}
.dresult .dr-t{display:flex;flex-direction:column;line-height:1.35}
.dresult .dr-t b{font-size:13px}
.dresult .dr-t span{font-size:11.5px;color:var(--ink-faint)}

/* ---------- board year squares ---------- */
.tile.milestone{background:linear-gradient(#f7e8c2,#efd9a4);border-color:#d2b578}
.tile .marks{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;margin-top:2px;min-height:6px}
.mk{width:5px;height:5px;border-radius:50%;display:inline-block;background:var(--dc,#bbb)}
.legend .mk{width:8px;height:8px}

/* ---------- charts ---------- */
.chart{width:100%;height:46px;display:block;overflow:visible}
.chart.tall{height:130px}
.spark-cell .chart{height:20px;margin-top:3px;opacity:.85}

/* ---------- markets ---------- */
.mrow{border:1px solid var(--card-edge);border-radius:12px;padding:11px 13px;margin-bottom:10px;background:#fdfaf3}
.mrow-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:7px}
.mrow-h b{font-size:14px}
.mrow-n{text-align:right}
.mrow-n .big{font-size:15px;font-weight:600}
.mrow-b{display:grid;grid-template-columns:1fr 168px 96px;gap:12px;align-items:center}
@media (max-width:620px){.mrow-b{grid-template-columns:1fr;gap:8px}}
.mstats{display:grid;gap:2px}
.mstats div{display:flex;justify-content:space-between;gap:8px;font-size:11.5px}
.mstats .k{color:var(--ink-faint)}
.mstats .v{font-weight:600}
.mbtns{display:flex;flex-direction:column;gap:5px}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px;border-bottom-width:2px}

/* ---------- spending dials ---------- */
.dial{border:1px solid var(--card-edge);border-radius:12px;padding:11px 13px;margin-bottom:11px;background:#fdfaf3}
.dial.covered{opacity:.62;background:var(--linen-2)}
.dial-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.dial-n{font-weight:700;font-size:14px}
.dial-v{font-size:12.5px;color:var(--ink-soft);font-weight:600}
.dial-opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}

.opt{
  display:flex;flex-direction:column;gap:3px;text-align:left;cursor:pointer;
  background:var(--card);border:1px solid var(--card-edge);border-bottom-width:2px;border-radius:9px;
  padding:7px 9px;transition:.13s ease;min-height:54px;justify-content:space-between;
}
.opt:hover:not(:disabled){border-color:var(--wood);background:#fffdf6}
.opt.on{background:linear-gradient(#f6e9cd,#eeddb6);border-color:#c9ab72;box-shadow:inset 0 1px 0 #fff}
.opt:disabled{cursor:not-allowed;opacity:.55}
.opt-n{font-size:11.5px;line-height:1.3;font-weight:600}
.opt-c{font-size:10.5px;color:var(--ink-faint);font-weight:700}

/* ---------- lifestyle: holiday places and passport stamps ---------- */
.mb-s{margin-bottom:9px}
#lsbody h3{font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-soft)}
.places{display:flex;flex-wrap:wrap;gap:6px}
.place{font:inherit;font-size:12px;cursor:pointer;background:var(--card);border:1px solid var(--card-edge);
  border-bottom-width:2px;border-radius:999px;padding:5px 10px;display:inline-flex;gap:5px;align-items:center}
.place:hover{border-color:var(--wood)}
.place[disabled]{opacity:.45;cursor:not-allowed}
.place[disabled]:hover{border-color:var(--card-edge)}
.place.on{background:linear-gradient(#f6e9cd,#eeddb6);border-color:#c9ab72}
.place .num{color:var(--ink-faint);font-weight:700;font-size:11px}
.place .been{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--green)}
.stamps{display:flex;flex-wrap:wrap;gap:7px}

/* ---------- lists / tables ---------- */
.rows{display:grid;gap:1px;background:var(--card-edge);border:1px solid var(--card-edge);border-radius:11px;overflow:hidden}
.row{background:var(--card);padding:9px 13px;display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:13.5px}
.row .l{color:var(--ink-soft)}
.row .v{font-family:var(--mono);font-weight:600}
.row.tot{background:var(--linen-2);font-weight:700}

table.t{width:100%;border-collapse:collapse;font-size:13px}

table.t td.n{font-family:var(--mono);text-align:right}

/* ---------- news / log ---------- */
.news{border-left:3px solid var(--board-line);padding:2px 0 2px 13px;margin:0 0 12px}
.news .hd{font-family:var(--serif);font-size:15.5px;line-height:1.35;margin-bottom:3px}
.news .dk{font-size:11.5px;color:var(--ink-faint);letter-spacing:.4px}
.logbox{max-height:250px;overflow:auto;font-size:12.6px;line-height:1.65}

.logbox .li:last-child{border-bottom:none}

.spark{display:flex;align-items:flex-end;gap:2px;height:38px}
.spark i{flex:1;background:var(--blue);border-radius:2px 2px 0 0;opacity:.75;min-height:2px}
.spark.g i{background:var(--green)}

<div class="shade" id="shade"></div><aside class="drawer" id="drawer" aria-label="Tool"><button class="drawer-x" id="drawerx" aria-label="Close">✕</button><div class="drawer-b" id="drawerBody"></div></aside>
<script>
"use strict";
/* ============================================================
   0. SEEDED RANDOM + HELPERS
   ============================================================ */
let RNG = null;
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rnd = () => RNG();
const ri = (lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1));           // inclusive int
const rf = (lo, hi) => lo + rnd() * (hi - lo);
const pick = arr => arr[Math.floor(rnd() * arr.length)];
function pickW(pairs){                                                   // [[item,weight],...]
  let tot = 0; for (const p of pairs) tot += p[1];
  let r = rnd() * tot;
  for (const p of pairs){ r -= p[1]; if (r <= 0) return p[0]; }
  return pairs[pairs.length - 1][0];
}
function gauss(){                                                        // Box-Muller, clamped
  let u = 0, v = 0;
  while (u === 0) u = rnd();
  while (v === 0) v = rnd();
  const g = Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  return Math.max(-3, Math.min(3, g));
}
const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x));
const d6 = () => ri(1, 6);

/* money + text formatting */
function money(n){
  const neg = n < 0; n = Math.abs(Math.round(n));
  return (neg ? "-$" : "$") + n.toLocaleString("en-US");
}
function moneyS(n){ return (n >= 0 ? "+" : "") + money(n); }
function kmoney(n){
  const a = Math.abs(n);
  if (a >= 1e6) return (n < 0 ? "-$" : "$") + (a / 1e6).toFixed(a >= 1e7 ? 1 : 2) + "m";
  if (a >= 1e4) return (n < 0 ? "-$" : "$") + Math.round(a / 1e3) + "k";
  return money(n);
}
/* a future price in today's money (2025, the year you turned 18), so a $1m flat at 60
   can be seen for what it is: about the same flat at 2025 prices. Blank until prices
   have moved enough to matter. */
function todayMoney(n){
  const cpi = typeof S !== "undefined" && S && S.econ ? S.econ.cpi : 1;
  return cpi < 1.05 ? "" : "≈ " + kmoney(n / cpi) + " today";
}
function kmoneyT(n){ const t = todayMoney(n); return kmoney(n) + (t ? " (" + t + ")" : ""); }
function moneyT(n){ const t = todayMoney(n); return money(n) + (t ? " (" + t + ")" : ""); }
const pct = (x, d) => (x * 100).toFixed(d === undefined ? 1 : d) + "%";
const pctS = (x, d) => (x >= 0 ? "+" : "") + (x * 100).toFixed(d === undefined ? 1 : d) + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const el = id => document.getElementById(id);

/* ============================================================
   1. STATIC DATA
   ============================================================ */

/* --- 1a. economy regimes. Never named to the player.
   Calibrated to Singapore over the long run: CPI about 2.3%, short rates (SORA)
   about 2.5%, property a little over inflation, global equities about 6%. --- */
const REGIMES = {
  expansion:  { infl: [0.015, 0.031], rate: [0.020, 0.040], equity: [0.142, 0.160], hdb: 0.030, priv: 0.045, jobs: 1.25, wage: 0.035 },
  stable:     { infl: [0.009, 0.021], rate: [0.015, 0.030], equity: [0.112, 0.175], hdb: 0.006, priv: 0.006, jobs: 1.00, wage: 0.026 },

};
/* equity entries are [arithmetic mean, stdev] — the geometric result the
   player actually lives through is meaningfully lower, which is the point.
   hdb / priv: how far each property market leans above or below inflation in

/* --- 1b. education pathways. Fees are subsidised Singapore-citizen fees per year, 2025. --- */

/* ============================================================
   2b. INVESTMENTS — bought in units, at a price
   Every holding is units × today's price. Bonds are quoted per $100 of face value
   and pay a fixed coupon on that $100, so a bond bought cheap pays more on what
   you paid for it. Funds pay a dividend per unit; gold pays nothing. Prices are
   Singapore, 2025. Buying and selling costs a small spread (the broker, the bank).
   ============================================================ */
const INV_KEYS = ["tbill", "ssb", "sgs", "bond", "etf", "reit", "gold"];
const SGS_CPN = 0.03, CORP_CPN = 0.04;       /* coupons on the reference bonds, per $100 a year */
const SSB_CAP = 200000;                      /* the most one person may hold in Singapore Savings Bonds */
const INSTR = {
  tbill: { name: "6-month T-bills", short: "T-bills", unit: "per $100", min: 10, fee: 0, colour: "#3f7d4e",
           risk: "very low", liq: "rolls over every 6 months",
           about: "Government IOUs for six months, bought at a discount. The price never really moves; the interest follows today's rates, so it rises and falls every six months." },
  ssb:   { name: "Singapore Savings Bonds", short: "SSB", unit: "per $100", min: 5, fee: 0, colour: "#5e8f47",
           risk: "very low", liq: "cash back next month",
           about: "Always worth $100 — redeem any month and get it back in full. The rate is locked on the day you buy. Capped at $200,000 a person." },
  sgs:   { name: "10-year government bonds (SGS)", short: "SGS bonds", unit: "per $100", min: 10, fee: 0.003, colour: "#2f6b5a",
           risk: "low", liq: "sell any day",
           about: "Pays $3 a year on every $100 of face value. When rates rise, new bonds pay more, so this one's price falls — and whoever buys it then gets more for their money." },
  bond:  { name: "Corporate bonds (SG blue chips)", short: "Corp bonds", unit: "per $100", min: 10, fee: 0.005, colour: "#3a6081",
           risk: "moderate", liq: "sell any day",
           about: "Pays $4 a year on every $100, more than the government, because companies can fail. In a recession their prices fall harder, and now and then an issuer defaults." },
  etf:   { name: "STI ETF (Singapore's 30 biggest companies)", short: "STI ETF", unit: "per unit", min: 1, fee: 0.002, colour: "#a8402f",
           risk: "high", liq: "sell any day",
           about: "A slice of DBS, OCBC, UOB, Singtel and the rest. Pays out dividends. Prices swing hard; over decades it has beaten everything else here, but not every decade." },
  reit:  { name: "S-REIT ETF (malls, offices, warehouses)", short: "S-REITs", unit: "per unit", min: 1, fee: 0.002, colour: "#b0663a",
           risk: "high", liq: "sell any day",
           about: "Owns buildings and passes most of the rent to you. Pays more than the STI ETF, but falls when interest rates rise and when property does." },
  gold:  { name: "Gold (per gram, bank account)", short: "Gold", unit: "per gram", min: 1, fee: 0.015, colour: "#c09a2b",
           risk: "high", liq: "sell any day",
           about: "Pays nothing at all. Tends to rise when inflation bites or markets panic, and to sulk for years otherwise. The bank's buy and sell prices are 1.5% apart." }
};

/* ---- yields ---- */
const bondPrice = (c, y, n) => 100 * (c / y * (1 - Math.pow(1 + y, -n)) + Math.pow(1 + y, -n));
function sgsYield(){ return clamp(S.econ.rate * 0.55 + rateAvg(10) * 0.45 + 0.006, 0.008, 0.10); }
function corpYield(){ return sgsYield() - 0.002 + (S.mk.corpSpread || 0.011); }
/* a new SSB locks in about the ten-year government yield, a little under it */
function ssbNewRate(){ return Math.max(0.005, sgsYield() - 0.003); }

function initInvest(){
  const mk = S.mk;
  mk.corpSpread = 0.011;
  mk.px = { tbill: 100, ssb: 100, sgs: Math.round(bondPrice(SGS_CPN, sgsYield(), 10) * 100) / 100,
            bond: Math.round(bondPrice(CORP_CPN, corpYield(), 5) * 100) / 100, etf: 3.90, reit: 0.90, gold: 138 };
  mk.dpu = { etf: 0.156, reit: 0.052 };       /* dividends per unit a year: STI ~4%, S-REITs ~5.8% */
  mk.pxHist = {}; mk.yHist = {};
  for (const k of INV_KEYS){ mk.pxHist[k] = [mk.px[k]]; mk.yHist[k] = [curYield(k)]; }
  for (const k of ["ssb", "sgs", "reit", "gold"]) if (!mk.idx[k]){ mk.idx[k] = 100; mk.hist[k] = mk.hist.cpi.map(() => 100); }
}
/* what each pays a year on today's price — the number that says cheap or dear */
function curYield(k){
  const mk = S.mk;
  if (k === "tbill") return tbillYield();
  if (k === "ssb") return ssbNewRate();
  if (k === "sgs") return sgsYield();
  if (k === "bond") return corpYield();
  if (k === "etf" || k === "reit") return mk.dpu[k] / mk.px[k];
  return 0;
}

/* ---- holdings ---- */
function invState(){
  const a = S.a;
  if (!a.u){
    /* saves from before units: the old dollar holdings become units at today's prices */
    if (!S.mk.px) initInvest();
    a.u = {}; a.cost = {}; a.ssbY = 0;
    for (const k of INV_KEYS){ a.u[k] = 0; a.cost[k] = 0; }
    const old = { tbill: a.tbill || 0, bond: a.bond || 0, etf: a.etf || 0 };
    const oldB = { tbill: a.tbillBasis, bond: a.bondBasis, etf: a.etfBasis };
    for (const k of ["tbill", "bond", "etf"]) if (old[k] > 0){
      a.u[k] = old[k] / S.mk.px[k]; a.cost[k] = oldB[k] === undefined ? old[k] : oldB[k];
    }
    delete a.tbill; delete a.bond; delete a.etf; delete a.tbillBasis; delete a.bondBasis; delete a.etfBasis;
  }
  return a;
}
function units(k){ return invState().u[k] || 0; }
function price(k){ return S.mk.px[k]; }
function hv(k){ return units(k) * price(k); }
function invTotal(){ return INV_KEYS.reduce((s, k) => s + hv(k), 0); }
function invBasis(){ return INV_KEYS.reduce((s, k) => s + basisOf(k), 0); }
/* what a unit costs to buy, and fetches when sold, after the spread */
function buyPrice(k){ return price(k) * (1 + INSTR[k].fee); }
function sellPrice(k){ return price(k) * (1 - INSTR[k].fee); }
function ssbRoom(){ return Math.max(0, SSB_CAP - units("ssb") * 100); }

/* the player's trades: whole units, at the spread */
function buyUnits(k, n){
  n = Math.floor(n);
  if (k === "ssb") n = Math.min(n, Math.floor(ssbRoom() / 100));
  if (n <= 0) return 0;
  const cost = Math.round(n * buyPrice(k) * 100) / 100;
  S.p.cash -= cost;
  const a = invState();
  if (k === "ssb") a.ssbY = (a.ssbY * a.u.ssb + ssbNewRate() * n) / (a.u.ssb + n);
  a.u[k] += n; a.cost[k] += cost;
  return cost;
}
function sellUnits(k, n){
  const a = invState();
  n = Math.min(n, a.u[k]);
  if (n <= 0) return { got: 0, paid: 0 };
  const paid = a.cost[k] * n / a.u[k];
  const got = Math.round(n * sellPrice(k) * 100) / 100;
  a.cost[k] -= paid; a.u[k] -= n;
  if (a.u[k] < 1e-6){ a.u[k] = 0; a.cost[k] = 0; }
  S.p.cash += got;
  return { got, paid };
}
/* the game's own moves (cards, forced sales): by dollar value, at today's price, no spread */
function addHolding(k, amt){
  const a = invState();
  if (amt <= 0) return;
  const n = amt / price(k);
  if (k === "ssb") a.ssbY = (a.ssbY * a.u.ssb + ssbNewRate() * n) / (a.u.ssb + n);
  a.u[k] += n; a.cost[k] += amt;
}
function cutHolding(k, amt){
  const a = invState(), v = hv(k);
  if (v <= 0 || amt <= 0) return 0;
  const take = Math.min(v, amt);
  if (take >= v - 0.5){ a.u[k] = 0; a.cost[k] = 0; }
  else { const f = take / v; a.cost[k] *= 1 - f; a.u[k] *= 1 - f; }
  return take;
}

/* ---- cheap or dear: today's price against its own last ten years ----
   Bonds by their yield (a cheap bond pays more), funds by their dividend yield,
   gold by its price after inflation. +2 much cheaper … −2 much dearer. */
function cheapness(k){
  const mk = S.mk;
  if (k === "tbill" || k === "ssb") return null;
  const h = mk.yHist[k], ph = mk.pxHist[k];
  const n = Math.min(10, h.length);
  let score, why;
  if (k === "sgs" || k === "bond"){
    const avg = h.slice(-n).reduce((s, x) => s + x, 0) / n, now = curYield(k), d = now - avg;
    score = d > 0.01 ? 2 : d > 0.004 ? 1 : d < -0.01 ? -2 : d < -0.004 ? -1 : 0;
    why = "pays " + pct(now, 1) + " on today's price, against " + pct(avg, 1) + " on average over " + n + (n === 1 ? " year" : " years");
  } else if (k === "gold"){
    const cp = mk.hist.cpi, real = ph.slice(-n).map((p, i) => p / cp[cp.length - n + i]);
    const avg = real.reduce((s, x) => s + x, 0) / n, now = price(k) / cp[cp.length - 1], d = Math.log(avg / now);
    score = d > 0.25 ? 2 : d > 0.1 ? 1 : d < -0.25 ? -2 : d < -0.1 ? -1 : 0;
    why = "after inflation, " + (d >= 0 ? pct(1 - now / avg, 0) + " below" : pct(now / avg - 1, 0) + " above") + " its " + n + "-year average";
  } else {
    const avg = h.slice(-n).reduce((s, x) => s + x, 0) / n, now = curYield(k), d = Math.log(now / avg);
    score = d > 0.25 ? 2 : d > 0.1 ? 1 : d < -0.25 ? -2 : d < -0.1 ? -1 : 0;
    why = "dividends are " + pct(now, 1) + " of today's price, against " + pct(avg, 1) + " on average";
  }
  if (h.length < 3) return { score: 0, word: "Not enough history yet", why };
  return { score, why, word: ["Much dearer than usual", "Dearer than usual", "About usual", "Cheaper than usual", "Much cheaper than usual"][score + 2] };
}

/* what your investments pay you each month — interest, coupons, dividends. No tax on any of it
   for individuals in Singapore. Cash interest is shown too, but is credited once a year. */
function investIncome(){
  const a = invState(), mk = S.mk, m = x => Math.round(x / 12);
  const r = {
    tbill: m(a.u.tbill * 100 * tbillYield()),
    ssb:   m(a.u.ssb * 100 * (a.ssbY || 0)),
    sgs:   m(a.u.sgs * 100 * SGS_CPN),
    bond:  m(a.u.bond * 100 * CORP_CPN),
    etf:   m(a.u.etf * mk.dpu.etf),
    reit:  m(a.u.reit * mk.dpu.reit),
    gold:  0,
    cash:  m(Math.max(0, S.p.cash) * depositRate())
  };
  r.paid = INV_KEYS.reduce((s, k) => s + r[k], 0);
  return r;
}

/* ---- a year in the markets for everything bought in units ----
   eq: the stock market's total return; pr: private property's; shock: this year's big event */
function stepInvest(eq, pr, shock){
  const mk = S.mk, e = S.econ, infl = e.infl, reg = e.regime, a = invState();
  const old = Object.assign({}, mk.px), yrs = S.age - START_AGE;
  const dRate = e.rate - e.prevRate;

  /* bonds: priced off this year's yields; corporate spreads blow out in a recession */
  const sp = { expansion: 0.009, stable: 0.011, inflation: 0.014, recession: 0.028, recovery: 0.016 }[reg];
  mk.corpSpread = clamp(mk.corpSpread * 0.4 + sp * 0.6 + gauss() * 0.002, 0.005, 0.05);
  mk.px.sgs = bondPrice(SGS_CPN, sgsYield(), 10);
  mk.px.bond = bondPrice(CORP_CPN, corpYield(), 5);
  let dflt = 0;
  if (reg === "recession" && rnd() < 0.10){
    dflt = rf(0.02, 0.06);
    a.u.bond *= 1 - dflt;
    e.headlines.unshift(pick(SHOCK_NEWS.dflt) + " Corporate bond holders lose " + pct(dflt, 0) + ".");
  }

  /* the STI: price grows by what the market returned less what it paid out */
  const yE = mk.dpu.etf / old.etf;
  mk.px.etf = old.etf * (1 + eq - yE);
  mk.dpu.etf *= 1 + infl + 0.008 + (reg === "recession" ? -0.08 : reg === "recovery" ? 0.03 : 0) + gauss() * 0.02;

  /* S-REITs: half stock market, half buildings, and they hate rate rises */
  const yR = mk.dpu.reit / old.reit;
  const rr = clamp(eq * 0.5 + (pr + 0.005) * 0.5 + dRate * -2.5 + gauss() * 0.08 + 0.03 * Math.log(yR / 0.058), -0.45, 0.5);
  mk.px.reit = old.reit * (1 + rr - yR);
  /* payouts per unit barely grow: REITs keep issuing new units to buy more buildings */
  mk.dpu.reit *= 1 + infl * 0.15 + (reg === "recession" ? -0.05 : reg === "recovery" ? 0.04 : 0) + gauss() * 0.015;
  /* dividends never wander far from what the buildings and companies can pay */
  mk.dpu.etf = clamp(mk.dpu.etf, mk.px.etf * 0.02, mk.px.etf * 0.09);
  mk.dpu.reit = clamp(mk.dpu.reit, mk.px.reit * 0.035, mk.px.reit * 0.11);

  /* gold: loves inflation and panic, drifts back toward a fair price after inflation */
  const goldTilt = { expansion: -0.02, stable: 0, inflation: 0.06, recession: 0.04, recovery: -0.01 }[reg];
  const goldReal = old.gold / (138 * e.cpi * Math.pow(1.005, yrs));
  const g = clamp(infl + goldTilt + gauss() * 0.13 + (shock === "crash" ? 0.10 : 0) - 0.12 * Math.log(goldReal), -0.35, 0.5);
  mk.px.gold = old.gold * (1 + g);

  /* total returns: what a dollar left in each, with its payouts reinvested, became */
  const rets = {
    tbill: tbillYield(),
    ssb:   ssbNewRate(),
    sgs:   mk.px.sgs / old.sgs - 1 + SGS_CPN * 100 / old.sgs,
    bond:  (mk.px.bond / old.bond) * (1 - dflt) - 1 + CORP_CPN * 100 / old.bond,
    etf:   eq,
    reit:  rr,
    gold:  g
  };
  let gain = 0;
  for (const k of INV_KEYS){
    gain += a.u[k] * (mk.px[k] - old[k]);
    mk.pxHist[k].push(mk.px[k]);
    mk.yHist[k].push(curYield(k));
    if (mk.pxHist[k].length > 60){ mk.pxHist[k].shift(); mk.yHist[k].shift(); }
  }
  gain -= dflt ? a.u.bond / (1 - dflt) * dflt * old.bond : 0;
  S.stats.invGain += gain;
  return rets;
}

/* a sudden extra move in one market, from a card: price and its history move together */
function marketMove(k, r){
  const mk = S.mk;
  mk.px[k] *= 1 + r;
  mk.pxHist[k][mk.pxHist[k].length - 1] = mk.px[k];
  mk.idx[k] *= 1 + r;
  mk.hist[k][mk.hist[k].length - 1] = mk.idx[k];
  S.stats.invGain += units(k) * mk.px[k] * r / (1 + r);
}

/* ---- how prices and holdings read ---- */
function fmtPrice(k, p){
  p = p === undefined ? price(k) : p;
  const s = "$" + (p < 1 ? p.toFixed(3) : p.toFixed(2));
  return k === "gold" ? s + "/g" : s;
}
function unitWord(k){ return INSTR[k].unit === "per $100" ? "$100 piece" : k === "gold" ? "gram" : "unit"; }
function fmtUnits(k, n){
  const whole = Math.floor(n + 1e-6), w = whole.toLocaleString("en-US");
  if (INSTR[k].unit === "per $100") return "$" + Math.round(n * 100).toLocaleString("en-US") + " face";
  return k === "gold" ? w + " g" : w + (whole === 1 ? " unit" : " units");
}
function yieldText(k){
  if (k === "gold") return "pays nothing";
  if (k === "tbill") return "pays " + pct(tbillYield()) + " now, resets every 6 months";
  if (k === "ssb") return "new bonds lock in " + pct(ssbNewRate()) + (units("ssb") ? " · yours pay " + pct(invState().ssbY) : "");
  if (k === "sgs" || k === "bond") return "pays $" + (k === "sgs" ? 3 : 4) + " a year per $100 — " + pct(curYield(k)) + " on today's price";
  return "dividends " + pct(curYield(k)) + " of today's price";
}

/* ============================================================
   2. GAME STATE
   ============================================================ */
let S = null;

const START_AGE = 18, END_AGE = 65, TILES = END_AGE - START_AGE + 1;
/* where play stops: 65 in the full game; the demo build (build/demo) sets its own */
const PLAY_END = END_AGE;

/* tile types: pay, dec, evt, mkt, news, mile */
const TILE_META = {
  pay:  { ic: "💵", cls: "t-pay",  label: "Payday" },
  dec:  { ic: "◆",  cls: "t-dec",  label: "Decision" },
  evt:  { ic: "★",  cls: "t-evt",  label: "Event" },
  mkt:  { ic: "📈", cls: "t-mkt",  label: "Markets" },
  news: { ic: "📰", cls: "t-news", label: "News" },
  mile: { ic: "⌛", cls: "t-mile", label: "Milestone" }
};

function buildTrack(){
  const t = [];
  for (let i = 0; i < TILES; i++) t.push({ age: START_AGE + i, visited: false, marks: [] });
  return t;
}

/* --- 2a. randomly generated starting life --- */
function rollCircumstances(){
  /* three independent dials, never summarised into a label */
  const incomeTier  = pickW([[0, 22], [1, 34], [2, 28], [3, 16]]);         // household income
  const supportTier = pickW([[0, 26], [1, 30], [2, 28], [3, 16]]);         // education support
  const savingsTier = pickW([[0, 30], [1, 34], [2, 24], [3, 12]]);

  const hhIncome = [3500, 7500, 12000, 25000][incomeTier] + ri(-400, 700);   // SG household income from work, monthly
  const savings  = [ri(200, 1400), ri(1500, 6000), ri(6000, 22000), ri(22000, 90000) ][savingsTier];

  /* what the family will actually pay toward education, and what they expect back */
  const eduSupport = [0, 0.3, 0.75, 1][supportTier];
  const allowance  = [0, ri(60, 180), ri(220, 480), ri(500, 1100)][supportTier];

  const grades = clamp(Math.round(rf(40, 96) + (incomeTier - 1) * 3 + gauss() * 4), 32, 99);

  /* skills */
  const sk = { tech: 0, comms: 0, fin: 0 };
  const seeds = [];
  const nSeeds = ri(1, 2);
  const pool = SKILL_SEEDS.slice();
  for (let i = 0; i < nSeeds; i++){
    const s = pool.splice(Math.floor(rnd() * pool.length), 1)[0];
    sk[s.k] += s.v; seeds.push(s.n);
  }

  const guaranteedSpare = allowance > 0;
  /* families that stretch to pay fees often want some of it back once you earn;
     a comfortable family paying in full does not */
  const parentsExpect = supportTier === 0 || supportTier === 3 ? 0 : incomeTier <= 1 ? 1 : 0.5;
  /* what the family could lend you in a crisis, from their own savings */
  const familyPot = [5000, 20000, 50000, 150000][incomeTier];
  return {
    family: pick(FAMILY_SHAPE),
    housing: pick(HOUSING_START),
    hhIncome, savings, eduSupport, allowance, grades, sk, seeds,
    incomeTier, supportTier, guaranteedSpare, parentsExpect, familyPot, familyLent: 0,
    hasCar: incomeTier >= 2 && rnd() < 0.5,
    health: rnd() < 0.12 ? pick([
      "A parent has an ongoing medical condition.",
      "A younger sibling needs regular care.",
      "You have a minor condition that needs yearly treatment."
    ]) : null
  };
}

/* --- 2b. new game --- */
function newGame(seed){
  RNG = mulberry32(seed);
  const c = rollCircumstances();
  const regime = pickW([["stable", 40], ["expansion", 22], ["recovery", 14], ["inflation", 14], ["recession", 10]]);
  const rg = REGIMES[regime];

  S = {
    seed, runStart: Date.now(),
    age: START_AGE, tile: 0, track: buildTrack(),
    phase: "situation",
    c,
    p: {
      cash: c.savings,
      qual: 0, quals: [],
      skills: { tech: c.sk.tech, comms: c.sk.comms, fin: c.sk.fin },
      exp: 0,                              // years of full-time experience
      job: null, jobSince: 0, salary: 0,   // monthly gross
      studying: null,                      // {pathId, yearsLeft, partTime}
      sideIncome: 0,
      allowance: c.allowance,
      obligations: [],                     // {amt, until, why} — a child or an ageing parent, never forever
      spend: { food: 1, transport: 1, utilities: 1, lifestyle: 1 },   // each 0..3, the player's call
      wellbeing: 62,                       // 0..100, what living thinly costs you
      spendPrompt: false,                  // set the first time a wage replaces family support
      housingMode: "family",               // family | rent | own
      rent: 0,
      car: c.hasCar ? { value: 0, monthly: 150, family: true } : null,   // the family car: petrol share only
      insured: false,                      // Integrated Shield plan on top of MediShield Life
      ci: null, di: null,                  // critical illness {sum, prem}, disability income {rate}
      conditions: [],                      // chronic conditions: {id, n, cost, risk}
      disabled: null,                      // {until, pay} while you cannot work
      partner: false, partnerType: null, partnerInc: 0, kids: 0, kidsBorn: [],
      /* the working life on paper: every role held, the level reached in each field,
         the years spent in each field, and when each job started */
      resume: [], peak: {}, sectExp: {}, starts: [],
      stakes: [], abroad: null,
      standing: 60, tension: 0,            // how your manager sees you; grievances at home
      credit: 640,
      missed: 0,
      unemployedYears: 0,
      burnout: 0,
      retired: false
    },
    a: {                                   // assets
      u: { tbill: 0, ssb: 0, sgs: 0, bond: 0, etf: 0, reit: 0, gold: 0 },     /* units held (b_invest.js) */
      cost: { tbill: 0, ssb: 0, sgs: 0, bond: 0, etf: 0, reit: 0, gold: 0 },  /* what you paid, at average cost */
      ssbY: 0,                             /* the rate locked in on your Savings Bonds, averaged */
      property: null                       // {value, basis, rentOut, bought}
    },
    loans: [],
    /* CPF: Ordinary (housing, 2.5%), Special (retirement, 4%), MediSave (medical, 4%) */
    cpf: { oa: 0, sa: 0, ma: 0 },
    econ: {
      regime, prevRegime: regime,
      cpi: 1,
      infl: rf(rg.infl[0], rg.infl[1]),
      rate: rf(rg.rate[0], rg.rate[1]),
      prevRate: 0,
      unemp: regime === "recession" ? rf(0.062, 0.09) : rf(0.026, 0.05),
      headlines: []
    },
    /* Total-return indices, all based at 100 in the year you turned 18.
       These are what the market graphs and the rolling 10-year averages read from. */
    mk: {
      etf: 100, bondIdx: 100, prop: 100, hdb: 100, etfHist: [], propHist: [],
      hdbReal: 0, privReal: 0, cool: 0, coolAt: -99, realHist: [],   /* property momentum and cooling measures */
      idx:  { cash: 100, tbill: 100, bond: 100, etf: 100, prop: 100, hdb: 100, cpi: 100 },
      hist: { cash: [100], tbill: [100], bond: [100], etf: [100], prop: [100], hdb: [100], cpi: [100] },
      ages: [START_AGE]
    },
    chapter: 0,                            // guided formative years; CHAPTERS.length = free play
    lastDice: null,                        // the four themed dice from the most recent year
    queue: [],                             // cards still to answer this year
    stats: { startWealth: c.savings, income: 0, spend: 0, invGain: 0, interest: 0, tax: 0, yearsWorked: 0, peakNW: c.savings, lowNW: c.savings },
    timeline: [], log: [], rolls: [],
    pendingCard: null, lastRoll: null, over: false
  };
  S.econ.prevRate = S.econ.rate;
  /* ten years of rate history before you turned 18, from a separate stream so the
     life itself is unchanged — lets the game quote a 10-year average from day one */
  const r2 = mulberry32(seed ^ 0x5bd1e995);
  let pr = S.econ.rate;
  S.econ.rateHist = [];
  for (let i = 0; i < 10; i++){ pr = clamp(pr + (r2() - 0.5) * 0.012, 0.004, 0.07); S.econ.rateHist.unshift(pr); }
  S.econ.rateHist.push(S.econ.rate);
  S.mk.etfHist.push(100); S.mk.propHist.push(100);
  initInvest();
  ensurePlans();
  tl(START_AGE, "Started out on your own terms.");
  recordYear();
  return S;
}

/* ---- market history readers, used by the graphs and the averages ---- */
const ASSET_META = {
  cash:  { name: "Cash in the bank",      short: "Cash",     risk: "very low", liq: "instant", colour: "#8b7f6e" },
  prop:  { name: "Property",              short: "Property", risk: "moderate", liq: "months",  colour: "#b08427" }
};
for (const k of INV_KEYS) ASSET_META[k] = INSTR[k];
const ASSET_KEYS = ["cash"].concat(INV_KEYS, ["prop"]);

/* annualised return of an index over the last n years (nominal) */
function avgReturn(key, n){
  const h = S.mk.hist[key];
  if (!h || h.length < 2) return null;
  const span = Math.min(n, h.length - 1);
  const a = h[h.length - 1 - span], b = h[h.length - 1];
  if (!a || a <= 0) return null;
  return Math.pow(b / a, 1 / span) - 1;
}
/* the same, after inflation — the number that actually matters */
function realAvgReturn(key, n){
  const nom = avgReturn(key, n), cpi = avgReturn("cpi", n);
  if (nom === null || cpi === null) return null;
  return (1 + nom) / (1 + cpi) - 1;
}
function lastReturn(key){
  const h = S.mk.hist[key];
  if (!h || h.length < 2) return null;
  return h[h.length - 1] / h[h.length - 2] - 1;
}
function yearsOfHistory(){ return Math.max(0, S.mk.hist.etf.length - 1); }

function tl(age, text){ S.timeline.push({ age, text }); }
function lg(text){ S.log.unshift({ age: S.age, text }); if (S.log.length > 220) S.log.pop(); }

/* ============================================================
   3. DERIVED FINANCE
   ============================================================ */

/* baseline monthly living costs, indexed to CPI and to life choices */
/* Singapore, 2025, one adult: hawker-centred food, MRT and bus, an SP Group bill plus a phone plan */
const BASE_COST = { food: 450, transport: 150, insurance: 0, lifestyle: 300, utilities: 150 };

/* The four dials the player controls. Each level has a cost multiplier and a
   contribution to how well the life is actually going. */
const SPEND_TIERS = {
  food: {
    label: "Food", icon: "🍚",
    levels: [
      { n: "Cook everything at home", mul: 0.62, note: "Rice, vegetables, almost never eating out." },
      { n: "Mostly home, some meals out", mul: 1.00, note: "Groceries with a few meals out a week." },
      { n: "Eat out often", mul: 1.55, note: "Convenience most days, restaurants at weekends." },
      { n: "Restaurants and delivery", mul: 2.30, note: "You rarely think about what it costs." }
    ]
  },
  transport: {
    label: "Transport", icon: "🚌",
    levels: [
      { n: "Walk and public transport", mul: 0.55, note: "Slow at times. Almost free." },
      { n: "Public transport, taxis when needed", mul: 1.00, note: "The ordinary arrangement." },
      { n: "Taxis and ride-hailing daily", mul: 1.70, note: "You buy back time with money." },
      { n: "Whatever is quickest", mul: 2.40, note: "Comfort over cost, every trip." }
    ]
  },
  utilities: {
    label: "Utilities", icon: "💡",
    levels: [
      { n: "Watch every unit", mul: 0.68, note: "Fans not air-conditioning. Cold showers in summer." },
      { n: "Normal use", mul: 1.00, note: "You do not think about the meter." },
      { n: "Comfortable year-round", mul: 1.38, note: "Climate control whenever you want it." },
      { n: "Never restricted", mul: 1.85, note: "The bill is somebody else's problem." }
    ]
  },
  lifestyle: {
    label: "Going out", icon: "🎟️",
    levels: [
      { n: "Stay in", mul: 0.35, note: "No outings, no subscriptions, no new clothes." },
      { n: "Now and then", mul: 1.00, note: "Dinner with friends a few times a month, the odd movie." },
      { n: "Most weekends", mul: 1.80, note: "Brunch, bars, concerts, saying yes to things." },
      { n: "Every night is an occasion", mul: 2.80, note: "You live the way you would if money were solved." }
    ]
  }
};
const SPEND_KEYS = ["food", "transport", "utilities", "lifestyle"];
const tierMul = (k) => SPEND_TIERS[k].levels[S.p.spend[k]].mul;

/* Family keeps you fed and housed until you are actually earning. */
function familySupported(){
  return S.p.housingMode === "family" && !S.p.job && !S.p.retired;
}

/* what you are currently committed to sending elsewhere. Commitments expire —
   a parent does not need care forever, and instalments run out. */
function familyObligation(){
  if (!S.p.obligations || !S.p.obligations.length) return 0;
  return S.p.obligations.reduce((a, o) => a + (S.age < o.until ? o.amt : 0), 0);
}
function addObligation(amt, years, why){
  S.p.obligations = S.p.obligations || [];
  /* amt is in today's dollars; stored in age-18 dollars because livingCosts() indexes it to prices */
  S.p.obligations.push({ amt: Math.round(amt / S.econ.cpi), until: S.age + years, why: why || "family" });
}
function expireObligations(){
  if (!S.p.obligations) return null;
  const gone = S.p.obligations.filter(o => o.until === S.age);
  S.p.obligations = S.p.obligations.filter(o => o.until > S.age);
  return gone.length ? gone : null;
}

/* children you are still supporting — they cost until their early twenties, not forever */
function dependents(){
  if (!S.p.kidsBorn || !S.p.kidsBorn.length) return 0;
  return S.p.kidsBorn.filter(born => S.age - born < 23).length;
}

function livingCosts(){
  const p = S.p, cpi = S.econ.cpi;
  const people = 1 + (p.partner ? 0.65 : 0) + dependents() * 0.55;
  const supported = familySupported();

  /* --- housing --- */
  let housing = 0;
  if (p.housingMode === "rent") housing = p.rent;
  else if (p.housingMode === "own")
    /* no rent, but upkeep, tax and maintenance — about 1.1% of value a year */
    /* HDB: service & conservancy charges, property tax, upkeep. Private: condo maintenance fees on top */
    housing = S.a.property && S.a.property.type === "hdb"
      ? Math.round(120 * cpi + S.a.property.value * 0.002 / 12)
      : Math.round(380 * cpi + (S.a.property ? S.a.property.value * 0.003 / 12 : 0));
  else housing = supported ? 0 : Math.round(400 * cpi);   // at home: free until you earn, then an allowance to your parents

  /* --- the four dials. While your family is carrying you, only your own
         discretionary spending is yours to pay for. A card you tap for everything
         makes the food and fun lines a little fatter. --- */
  const food      = supported ? 0 : BASE_COST.food * cpi * people * tierMul("food") * cardSpendMul();
  /* a car of your own replaces most of the bus and taxi bill with its own running costs */
  const ownCar = p.car && !p.car.family;
  const transport = supported ? 0
    : (BASE_COST.transport * cpi * tierMul("transport") * (ownCar ? 0.4 : 1) + (p.car ? p.car.monthly * cpi : 0) + (ownCar && p.gig && p.gig.id === "phv" ? 200 * cpi : 0)) * (dependents() ? 1.15 : 1);
  const utilities = supported ? 0 : BASE_COST.utilities * cpi * (0.8 + people * 0.3) * tierMul("utilities");

  /* lifestyle is always yours, even at home: going out, plus the gym, pets, club and holiday (d_style) */
  let lifestyle = BASE_COST.lifestyle * cpi * tierMul("lifestyle") * (0.9 + people * 0.25);
  if (p.partner) lifestyle *= partnerTypeOf().lifeMul;             /* who you live with sets part of the bill */
  if (p.abroad) lifestyle *= 1.2;                                  /* an expat life costs more */
  /* a full-time student's modest pocket money comes from family or a bursary;
     only spending above that level is theirs to fund */
  const fullTimeStudent = p.studying ? !p.studying.partTime : p.gradAge === S.age && !p.gradPartTime;   /* the graduation year counts */
  if (supported && fullTimeStudent)
    lifestyle = Math.max(0, lifestyle - BASE_COST.lifestyle * cpi * (0.9 + people * 0.25));
  lifestyle = lifestyle * cardSpendMul() + lsExtras();

  const insurance = insurancePremiums();
  const kids      = kidsCost();                     // care, school, classes, fees: by each child's age (d_plans.js)
  const health    = healthCosts();                  // clinic visits and medicine, rising with age
  const family    = familyObligation() * cpi;   // only from a child or an ageing parent, and it ends

  return {
    housing: Math.round(housing), food: Math.round(food), transport: Math.round(transport),
    utilities: Math.round(utilities), insurance, lifestyle: Math.round(lifestyle),
    kids: Math.round(kids), parents: Math.round(parentsCost()), family: Math.round(family), health: Math.round(health), property: extraUpkeep()
  };
}

/* average spending level, 0..3 — drives wellbeing */
function spendLevel(){
  return SPEND_KEYS.reduce((a, k) => a + S.p.spend[k], 0) / SPEND_KEYS.length;
}
function setSpend(k, v){ S.p.spend[k] = clamp(v, 0, 3); }
function setAllSpend(v){ for (const k of SPEND_KEYS) S.p.spend[k] = clamp(v, 0, 3); if (v === 0) lsAusterity(); }
function wellbeingWord(){
  const w = S.p.wellbeing;
  return w >= 78 ? "thriving" : w >= 62 ? "steady" : w >= 45 ? "getting by" : w >= 30 ? "worn down" : "at the end of your rope";
}
function totalCosts(){ const c = livingCosts(); return Object.values(c).reduce((a, b) => a + b, 0); }

function loanMonthly(){ return S.loans.reduce((a, l) => a + (l.deferred ? 0 : l.monthly), 0); }
/* every home loan; isMortgage is the loan on the main property only (the one you live in,
   or your first); loans on further investment properties carry a propId */
const isHousingLoan = l => l.kind === "home" || l.kind === "hdb";
const isMortgage = l => isHousingLoan(l) && !l.propId;
function mortgageBal(){ return S.loans.filter(isMortgage).reduce((a, l) => a + l.bal, 0); }
function debtTotal(){ return S.loans.reduce((a, l) => a + l.bal, 0); }

/* yields the player can see quoted anywhere in the game (bonds: b_invest.js) */
const tbillYield = () => Math.max(0.005, S.econ.rate - 0.004);
const depositRate = () => Math.max(0.001, S.econ.rate - 0.021);
function grossIncome(){
  const p = S.p;
  let x = p.salary + p.sideIncome + p.allowance + (p.partnerInc || 0) + disabilityPayout() + (p.trainAllow && !p.job ? p.trainAllow.amt : 0);
  if (S.a.property && S.a.property.rentOut) x += S.a.property.rentIncome;
  x += extraRent();
  x += investIncome().paid;
  x += gigIncome() + lodgerRent() + kidsGiving() + cardCashback();
  return Math.round(x);
}
/* Singapore resident income tax (YA2024 rates) on your salary, after CPF relief and
   the earned income relief. A partner's income is shown after their own tax and CPF. */
const TAX_BANDS = [[20000, 0], [30000, 0.02], [40000, 0.035], [80000, 0.07], [120000, 0.115], [160000, 0.15],
                   [200000, 0.18], [240000, 0.19], [280000, 0.195], [320000, 0.20], [500000, 0.22], [1e6, 0.23], [1e12, 0.24]];
/* Reliefs (children, parents, CPF top-ups, SRS) and the Parenthood Tax Rebate are in d_plans.js. */
function taxMonthly(){
  const t = taxYear();
  return Math.round((t - rebateUse(t)) / 12);
}
/* your own month: your income, your share of the bills and of every loan (b_couple.js) */
function netCashflow(){ return grossIncome() - ptInc() - totalCosts() * billShare() - loanMonthlyCash() - taxMonthly() - cpfEmployee(); }

/* ---- CPF ---- */
const CPF_CEILING = 8000;                       // ordinary wage ceiling ($7,400 in 2025, $8,000 from 2026), indexed to prices here
function cpfRates(age){
  /* share of wages: employee, employer, and where the total goes */
  if (age <= 35) return { emp: 0.20,  er: 0.17,  oa: 0.23,  sa: 0.06,  ma: 0.08 };
  if (age <= 45) return { emp: 0.20,  er: 0.17,  oa: 0.21,  sa: 0.07,  ma: 0.09 };
  if (age <= 50) return { emp: 0.20,  er: 0.17,  oa: 0.19,  sa: 0.08,  ma: 0.10 };
  if (age <= 55) return { emp: 0.20,  er: 0.17,  oa: 0.15,  sa: 0.115, ma: 0.105 };
  if (age <= 60) return { emp: 0.17,  er: 0.155, oa: 0.12,  sa: 0.10,  ma: 0.105 };
  return               { emp: 0.115, er: 0.12,  oa: 0.035, sa: 0.09,  ma: 0.11 };
}
/* wages that attract CPF: an employee's salary, up to the ceiling. The self-employed opt out here. */
function cpfWage(){
  const p = S.p;
  if (!p.job || p.job === "own" || p.retired) return 0;
  return Math.min(p.salary, CPF_CEILING * S.econ.cpi);
}
function cpfEmployee(){ return Math.round(cpfWage() * cpfRates(S.age).emp); }
function cpfEmployer(){ return Math.round(cpfWage() * cpfRates(S.age).er); }
function cpfTotal(){ return S.cpf ? S.cpf.oa + S.cpf.sa + S.cpf.ma + (S.cpf.ra || 0) : 0; }
/* how much of this month's mortgage your Ordinary Account covers */
function cpfMortgageMonthly(){
  const pr = S.a.property;
  if (!pr || !pr.cpfMonthly || !S.cpf) return 0;
  const m = S.loans.filter(isMortgage).reduce((a, l) => a + l.monthly * (1 - loanPt(l)), 0);
  if (!m) return 0;
  const inflow = cpfWage() * cpfRates(S.age).oa;
  return S.cpf.oa >= m * 12 ? m : Math.round(Math.min(m, inflow + S.cpf.oa / 12));
}
function loanMonthlyCash(){ return loanMonthly() - ptLoanMonthly() - cpfMortgageMonthly(); }
/* the policy rate and its average over the last n years */
function rateAvg(n){
  const h = S.econ.rateHist || [S.econ.rate];
  const s = h.slice(-n);
  return s.reduce((a, b) => a + b, 0) / s.length;
}

/* ---- cost basis: what you paid for what you still hold, at average cost.
   Buying adds to it; selling removes the same share of it as of the holding.
   Market moves change the holding, never the basis — the gap is your profit or loss. ---- */
function basisOf(k){
  if (k === "prop") return (S.a.property ? S.a.property.basis : 0) + (S.a.extra || []).reduce((a, x) => a + x.basis, 0);
  return invState().cost[k] || 0;
}
/* profit or loss on what you hold now: {amt, pct}, or null when there is nothing to measure */
function holdingPL(k){
  const v = k === "prop" ? (S.a.property ? S.a.property.value : 0) + extraValue() : hv(k);
  const b = basisOf(k);
  if (!(v > 0) || !(b > 0)) return null;
  return { amt: v - b, pct: v / b - 1 };
}
function plText(k){
  const pl = holdingPL(k);
  return pl ? moneyS(Math.round(pl.amt)) + " (" + pctS(pl.pct) + ")" : "—";
}

function liquid(){ return S.p.cash + invTotal(); }
/* the household's: your partner's cash and CPF count too */
function assetsTotal(){ return S.p.cash + invTotal() + (S.a.property ? S.a.property.value : 0) + extraValue() + (S.p.car ? S.p.car.value : 0) + cpfTotal() + ptTotal() + srsBal(); }
const srsBal = () => S.p.srs ? S.p.srs.bal : 0;
function netWorth(){ return assetsTotal() - debtTotal(); }
function emergencyMonths(){
  const burn = totalCosts() + loanMonthlyCash();
  if (burn <= 0) return 99;
  return (S.p.cash + hv("tbill") + hv("ssb")) / burn;
}

/* Where your household stands against Singapore households whose head is your age.
   Net worth here is everything, as the game counts it: CPF, home equity, cash and
   investments, less debt. Medians in 2025 dollars, built from the DOS household balance
   sheet (mean ~S$2m a household, most of it homes and CPF), CPF balances by age and HDB
   resale values; the spread is lognormal (top 10% ~3x the median, bottom 25% ~half). */
const SG_NW_MEDIAN = [[18, 5000], [22, 15000], [25, 40000], [30, 130000], [35, 260000], [40, 420000],
                      [45, 560000], [50, 700000], [55, 850000], [60, 950000], [65, 1000000]];
function sgMedianNW(age){
  const t = SG_NW_MEDIAN;
  if (age <= t[0][0]) return t[0][1] * S.econ.cpi;
  for (let i = 1; i < t.length; i++) if (age <= t[i][0]){
    const [a0, v0] = t[i - 1], [a1, v1] = t[i];
    return (v0 + (v1 - v0) * (age - a0) / (a1 - a0)) * S.econ.cpi;
  }
  return t[t.length - 1][1] * S.econ.cpi;
}
/* share of Singapore households your age with less than you, 0..1 */
function sgWealthPct(){
  const nw = netWorth();
  if (nw <= 0) return 0.03;
  const z = Math.log(nw / sgMedianNW(S.age)) / (S.age < 30 ? 1.1 : 0.9);
  const t = 1 / (1 + 0.2316419 * Math.abs(z));      /* normal CDF, Abramowitz-Stegun */
  const d = 0.3989423 * Math.exp(-z * z / 2);
  const q = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
  return clamp(z >= 0 ? 1 - q : q, 0.01, 0.99);
}
function wealthWord(){
  const pc = sgWealthPct();
  if (pc >= 0.5) return pc >= 0.99 ? "top 1%" : "top " + Math.max(5, Math.round((1 - pc) * 20) * 5) + "%";
  return "bottom " + Math.max(5, Math.round(pc * 20) * 5) + "%";
}
function wealthLine(){
  const pc = sgWealthPct();
  return (pc >= 0.9 ? "Wealthy" : pc >= 0.65 ? "Comfortable" : pc >= 0.35 ? "About average" : pc >= 0.15 ? "Stretched" : "Struggling") +
    " — " + wealthWord() + " of Singapore households your age (median about " + kmoney(sgMedianNW(S.age)) + ")";
}

/* ============================================================
   4. LOANS
   ============================================================ */
const LOAN_KINDS = {
  edu:   { name: "Tuition fee loan", spread: 0.012, term: 10, secured: false },
  family:{ name: "Owed to your parents", spread: 0, term: 6, secured: false },
  hdb:   { name: "HDB loan",        spread: 0,     term: 25, secured: true },
